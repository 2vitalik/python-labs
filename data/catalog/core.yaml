# Основа каталогу (T319, T320): картки, які студент заявляє одразу. Решта активних карток — «за запитом»: їх видно,
# ними можна описати гру, але монетка зарахується, коли викладач відкриє картку (перенесе її сюди).
# Категорія → підкатегорія → картки в порядку каталогу; сімʼя в основі, коли в основі хоч одна її картка.
# import ставить `core` за цим файлом (картки, якої тут нема, — «за запитом»); без файла `core` не чіпає.
