field:
  size: "28×31"
  topology: square
  wrap: true
  view: top-down
  gravity: none
  time: realtime
  control: direct
  layers: [стіни, точки, персонажі]
entities:
  - title: Пакман
    role: player
    description: "Жовте коло; біжить сам, ввід лише змінює напрям, поворот спрацьовує, щойно стане можливим"
    stats: [{key: lives, value: "3"}, {key: speed, value: "80", unit: "%"}]
    claims: [move-auto]
  - title: Точка
    role: pickup
    description: "Дрібна їжа в коридорах; зʼїсти всі — пройти рівень"
    stats: [{key: count, value: "240"}, {key: value, value: "10"}]
  - title: Енерджайзер
    role: pickup
    description: "Велика точка в кутах; на час робить привидів наляканими"
    stats: [{key: count, value: "4"}, {key: value, value: "50"}, {key: duration, value: "60"}]
    claims: [{slug: temporary-modes, params: {duration: 60}}]
  - title: Привид
    role: enemy
    description: "Четверо з характерами: Blinky цілиться в Пакмана, Pinky — на 4 клітини перед ним, Inky — за вектором від Blinky, Clyde — женеться, доки до Пакмана понад 8 клітин, інакше йде у свій кут"
    stats: [{key: count, value: "4"}, {key: speed, value: "75", unit: "%"}, {key: value, value: "200–1600"}]
    states: [у будиночку, розсіювання, погоня, переляк, зʼїдений]
    claims: [chase-greedy, random-walk, touch-death]
  - title: Стіна
    role: static
    description: "Стіни лабіринту, непрохідні для всіх"
  - title: Будиночок привидів
    role: spawner
    description: "Дім у центрі: звідти виходять привиди, туди повертаються очі зʼїденого"
    stats: [{key: cooldown, label: "примусовий випуск", value: "40", unit: "тіків"}]
    claims: [spawn-points, respawn]
  - title: Тунель
    role: terrain
    description: "Бічний прохід: вихід праворуч — поява ліворуч; привиди в ньому повільніші"
    stats: [{key: speed, label: "швидкість привидів", value: "40", unit: "%"}]
    claims: [wrap-edges]
  - title: Фрукт
    role: pickup
    description: "Бонус під будиночком після 70-ї і 170-ї точки; від вишні 100 до ключа 5000 очок за рівнем"
    stats: [{key: value, value: "100"}, {key: duration, value: "95"}]
    claims: [{slug: timed-despawn, params: {lifetime: 95}}]
rules:
  - when: {kind: tick}
    cond: [{kind: free, cell: ahead}]
    then: [{kind: move, a: Пакман, dir: forward}]
    note: "тік ≈ 0,1 с: на 100 % швидкості — приблизно клітина за тік"
  - when: {kind: contact, a: Пакман, b: Точка}
    then: [{kind: disappear, a: "@b"}, {kind: score, n: 10}]
  - when: {kind: contact, a: Пакман, b: Енерджайзер}
    then:
      - {kind: disappear, a: "@b"}
      - {kind: score, n: 50}
      - {kind: set_state, a: Привид, s: переляк, dur: 60}
      - {kind: face, a: Привид, dir: back}
      - {kind: multiplier, k: 1}
    note: "6 с на 1-му рівні, далі коротше, з 19-го — лише розворот; коли переляк мине, привид продовжує свій режим без розвороту, за 2 с до кінця блимає"
  - when: {kind: contact, a: Пакман, b: Привид}
    cond: [{kind: state, a: "@b", s: переляк}]
    then: [{kind: set_state, a: "@b", s: зʼїдений}, {kind: score, n: 200}, {kind: multiplier, k: 2}]
    note: "за один енерджайзер 200 → 400 → 800 → 1600; зʼїдений привид — лише очі, що біжать додому"
  - when: {kind: contact, a: Пакман, b: Привид}
    cond: [{kind: state, a: "@b", s: переляк, not: true}, {kind: state, a: "@b", s: зʼїдений, not: true}]
    then:
      - {kind: lives, n: -1}
      - {kind: respawn, a: "@a", where: "стартова клітина"}
      - {kind: respawn, a: Привид, where: "будиночок"}
    note: "зʼїдені точки не повертаються"
  - when: {kind: enter, a: Привид, b: Будиночок привидів}
    cond: [{kind: state, a: "@a", s: зʼїдений}]
    then: [{kind: respawn, a: "@a"}, {kind: set_state, a: "@a", s: у будиночку}]
  - when: {kind: schedule, list: "0 · 27 · 54 · 79 с"}
    then: [{kind: set_state, a: Привид, s: розсіювання}, {kind: face, a: Привид, dir: back}]
    note: "рівень 1: розсіювання 7 / погоня 20 / 7 / 20 / 5 / 20 / 5 / далі погоня; поки триває переляк, розклад стоїть"
  - when: {kind: schedule, list: "7 · 34 · 59 · 84 с"}
    then: [{kind: set_state, a: Привид, s: погоня}, {kind: face, a: Привид, dir: back}]
  - when: {kind: tick}
    cond: [{kind: state, a: Привид, s: переляк, not: true}]
    then: [{kind: move, a: Привид, dir: toward}]
    note: "на перехресті — дозволений напрям (не назад, не в стіну), найближчий до цілі; ціль: погоня — за характером, розсіювання — свій кут, зʼїдений — двері будиночка"
  - when: {kind: tick}
    cond: [{kind: state, a: Привид, s: переляк}]
    then: [{kind: move, a: Привид, dir: random}]
    note: "випадковий дозволений напрям без розвороту, швидкість 50 %"
  - when: {kind: enter, a: Привид, b: Тунель}
    then: [{kind: speed, a: "@a", n: 40}]
    note: "40 % на 1-му рівні, 50 % з 5-го"
  - when: {kind: edge, a: "*"}
    then: [{kind: wrap, a: "@a"}]
    note: "вийти за край можна лише тунелем"
  - when: {kind: idle, n: 40}
    then: [{kind: clear_state, a: Привид, s: у будиночку}]
    note: "Пакман 4 с нічого не їв — виходить наступний привид; ще виходять за лічильником точок: Pinky одразу, Inky після 30, Clyde після 60"
  - when: {kind: counter, name: "зʼїдено точок", op: "==", n: 70}
    then: [{kind: spawn_at, entity: Фрукт, where: "під будиночком"}]
    note: "і вдруге після 170-ї точки"
  - when: {kind: contact, a: Пакман, b: Фрукт}
    then: [{kind: disappear, a: "@b"}, {kind: score, n: 100}]
    note: "вишні 100 на 1-му рівні, ключ 5000 з 13-го"
  - when: {kind: counter, name: "очки", op: ">=", n: 10000}
    then: [{kind: lives, n: 1}]
    note: "один раз за гру (?); поріг — налаштування автомата: 10 000 / 15 000 / 20 000 / нема"
  - when: {kind: all_gone, a: Точка}
    then: [{kind: next_level}]
    note: "енерджайзери теж мають бути зʼїдені; лабіринт блимає, новий — з усіма точками"
  - when: {kind: level_end}
    cond: [{kind: level, op: "==", n: 2}]
    then: [{kind: window, window: Інтермісія}]
    note: "ще після 5-го і 9-го рівнів (?)"
  - when: {kind: counter, name: "життя", op: "==", n: 0}
    then: [{kind: game_over}, {kind: window, window: Кінець гри}]
windows:
  - title: Атракт
    task: attract-demo
    description: "Привиди по одному з іменами, таблиця очок, потім гра грає сама"
    items:
      - {title: Монета, window: Головне меню}
  - title: Головне меню
    task: main-menu
    description: "PUSH START BUTTON — після монети"
    items:
      - {title: 1 гравець, window: Гра}
      - {title: 2 гравці, window: Гра, note: "по черзі, у кожного свій лабіринт"}
  - title: Гра
    task: game-screen
    description: "Лабіринт; згори 1UP і HIGH SCORE, знизу життя й фрукти останніх рівнів; READY! на старті"
    claims: [status-panel, mode-indicator]
  - title: Інтермісія
    task: custom-window
    description: "Короткий мультфільм з Пакманом і Blinky між рівнями"
  - title: Кінець гри
    task: end-screen
    description: "GAME OVER просто в лабіринті"
    items:
      - {title: Далі, window: Атракт}
claims: [collect-all, {slug: player-death, params: {lives: 3}}, event-points, progress-acceleration]
