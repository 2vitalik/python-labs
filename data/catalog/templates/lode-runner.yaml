# Lode Runner (1983, Apple II): один екран, 150 рівнів, очки оригіналу 250 / 75 / 75 / 1500 (?).
field:
  size: "28×16"
  topology: square
  view: side
  gravity: down
  time: realtime
  control: direct
entities:
  - title: Бігун
    role: player
    description: "Бігає, лазить драбинами, висить на перекладині, копає яму в цеглі зліва або справа знизу; стрибати й вилазити з ями не може"
    stats: [{key: lives, value: "5"}, {key: speed, value: "1", unit: "кл/тік"}]
    states: [біжить, на драбині, висить, падає]
    claims: [move-4dir, ladder-climb, gravity-fall]
  - title: Вартовий
    role: enemy
    description: "Переслідує бігуна простою евристикою; може підняти й нести 1 злиток (невидимо); падає в ями й застрягає"
    stats: [{key: capacity, value: "1", unit: "злиток"}]
    states: [переслідує, застряг]
    claims: [chase-player, touch-death, respawn]
  - title: Золото
    role: pickup
    description: "Злиток: збирає бігун; вартовий може підняти й кинути у ямі"
    stats: [{key: value, value: "250"}]
  - title: Цегла
    role: terrain
    description: "Підлога, яку можна прокопати збоку-знизу від бігуна; яма за кілька секунд заростає і вбиває того, хто в ній"
    states: [ціла, яма]
    claims: [environment-death]
  - title: Бетон
    role: static
    description: "Не копається, непрохідний"
    claims: [impassable-cells]
  - title: Драбина
    role: terrain
    description: "Рух угору й униз; опора"
  - title: Перекладина
    role: terrain
    description: "Рух уздовж «руками» ліворуч-праворуч; «вниз» — відпустити й падати"
  - title: Пастка
    role: terrain
    description: "Фальшцегла: виглядає як цегла, але не тримає — усі провалюються крізь неї"
  - title: Прихована драбина
    role: terrain
    description: "Невидима, доки не зібрано все золото; веде до верхнього краю — вихід з рівня"
    states: [прихована, видима]
rules:
  - when: {kind: input, action: "копати ліворуч / праворуч", a: Бігун}
    cond: [{kind: free, cell: ahead}]
    then: [{kind: set_state, a: Цегла, s: яма}]
    note: "цегла збоку-знизу від бігуна, збоку має бути вільно; під себе копати не можна; яма заростає за кілька секунд"
  - when: {kind: contact, a: Цегла, b: Бігун}
    cond: [{kind: state, a: "@a", s: ціла}]
    then: [{kind: lives, n: -1}, {kind: restart}]
    note: "яма заросла над бігуном"
  - when: {kind: contact, a: Цегла, b: Вартовий}
    cond: [{kind: state, a: "@a", s: ціла}]
    then: [{kind: score, n: 75}, {kind: respawn, a: "@b", where: "випадкова клітина верхнього ряду"}]
    note: "яма заросла над вартовим"
  - when: {kind: enter, a: Вартовий, b: Цегла}
    cond: [{kind: state, a: "@b", s: яма}]
    then: [{kind: set_state, a: "@a", s: застряг}, {kind: score, n: 75}]
    note: "по голові застряглого можна пройти"
  - when: {kind: enter, a: Вартовий, b: Цегла}
    cond: [{kind: state, a: "@b", s: яма}, {kind: has, a: "@a", item: Золото}]
    then: [{kind: take, a: "@a", item: Золото}, {kind: spawn_at, entity: Золото, where: "клітина над ямою"}]
  - when: {kind: state_off, a: Вартовий, s: застряг}
    then: [{kind: move, a: "@a", dir: up}]
    note: "вилазить, якщо яма ще не заросла"
  - when: {kind: tick}
    cond: [{kind: free, cell: under}]
    then: [{kind: fall, a: Бігун}, {kind: fall, a: Вартовий}]
    note: "опора — цегла, бетон, драбина, перекладина або голова вартового; падіння з будь-якої висоти безпечне"
  - when: {kind: enter, a: "*", b: Пастка}
    then: [{kind: fall, a: "@a"}]
  - when: {kind: enter, a: "*", b: Драбина}
    then: [{kind: set_state, a: "@a", s: на драбині}]
    note: "зійшов — стан знімається"
  - when: {kind: input, action: вгору, a: Бігун}
    cond: [{kind: state, a: "@a", s: на драбині, not: true}]
    then: [{kind: block}]
  - when: {kind: enter, a: "*", b: Перекладина}
    then: [{kind: set_state, a: "@a", s: висить}]
  - when: {kind: input, action: вниз, a: Бігун}
    cond: [{kind: state, a: "@a", s: висить}]
    then: [{kind: clear_state, a: "@a", s: висить}, {kind: fall, a: "@a"}]
  - when: {kind: contact, a: Бігун, b: Золото}
    then: [{kind: disappear, a: "@b"}, {kind: counter, name: золота лишилось, n: -1}, {kind: score, n: 250}]
  - when: {kind: contact, a: Вартовий, b: Золото}
    cond: [{kind: has, a: "@a", item: Золото, not: true}]
    then: [{kind: pickup, a: "@a", item: "@b"}]
    note: "злиток у вартового невидимий"
  - when: {kind: contact, a: Вартовий, b: Бігун}
    cond: [{kind: state, a: "@a", s: застряг, not: true}]
    then: [{kind: lives, n: -1}, {kind: restart}]
    note: "бігун на голові вартового — не дотик"
  - when: {kind: tick}
    then: [{kind: move, a: Вартовий, dir: toward}]
    note: "проста евристика, не найкоротший шлях"
  - when: {kind: counter, name: золота лишилось, op: "==", n: 0}
    then: [{kind: set_state, a: Прихована драбина, s: видима}]
  - when: {kind: reach, a: Бігун, where: "верхній край екрана"}
    cond: [{kind: counter, name: золота лишилось, op: "==", n: 0}]
    then: [{kind: score, n: 1500}, {kind: lives, n: 1}, {kind: win}, {kind: next_level}]
  - when: {kind: input, action: "Ctrl-A — здатися", a: Бігун}
    then: [{kind: lives, n: -1}, {kind: restart}]
    note: "вихід з безвиході"
  - when: {kind: counter, name: життя, op: "==", n: 0}
    then: [{kind: game_over}, {kind: window, window: Рекорди}]
windows:
  - title: Головне меню
    task: main-menu
    description: "Титул: Play, Edit (Game Generator), вибір стартового рівня"
    items:
      - {title: Грати, window: Рівень}
      - {title: Редактор, window: Редактор рівнів}
      - {title: Стартовий рівень, task: level-select}
      - {title: Рекорди, window: Рекорди}
  - title: Демо
    task: attract-demo
    description: "Гра грає сама, показуючи рівні; будь-яка клавіша — до меню"
    items:
      - {title: До меню, window: Головне меню}
  - title: Рівень
    task: game-screen
    description: "Один екран без скролу; рядок унизу — SCORE, MEN, LEVEL; Esc — пауза, Ctrl-A — здатися"
    claims: [status-panel]
  - title: Редактор рівнів
    task: editor-window
    description: "Game Generator: та сама сітка з курсором, палітра типів клітин, збереження рівня на диск"
    claims: [editor-palette, editor-playtest]
    items:
      - {title: Тест-гра, window: Рівень}
      - {title: Зберегти на диск}
  - title: Рекорди
    task: leaderboard
    description: "Таблиця рекордів після game over, імʼя до 8 символів"
    items:
      - {title: До меню, window: Головне меню}
claims:
  - collect-all
  - reach-exit
  - {slug: player-death, params: {lives: 5}}
  - sequential-levels
