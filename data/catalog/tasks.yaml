  - field-scaling: 🥉 Масштабування поля — Клітини підлаштовуються під розмір вікна, зум; мапа, більша за екран, — player-camera.
  - player-camera: 🥉 Камера за гравцем — Вʼюпорт менший за мапу.
  - minimap-radar: 🥉 Мінімапа/радар @element — Огляд великої мапи або невидимих ворогів.
  - fog-of-war: '🥉 Туман війни ✍️ — Advance Wars, Wesnoth, роглайки: видно лише в радіусі своїх сутностей; запамʼятована мапа.'
