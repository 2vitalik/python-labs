  spawn:
  - spawn-random-cell: 🌱 Спавн у випадковій клітині @rule(level_start>spawn) — Сутність зʼявляється у випадковій вільній клітині — на старті рівня, після кожного ходу (нова плитка в 2048) чи коли попередню
      зʼїли (їжа в Snake); гра перевіряє, що клітина порожня й не на старті гравця. Уся розкладка рівня щоразу інша (цегла в Bomberman) — картка рівня «Випадкова розстановка на готовій мапі».
  - spawn-schedule:
      title: Спавн за розкладом
      description: Нові вороги чи предмети зʼявляються кожні N тіків, доки на полі менше ліміту (ворожі танки в Battle City, кажани з гнізда). Поява за подією (знищив — прийшов новий) — «Підкріплення»;
        хвилями з паузами й фінальною хвилею — «Хвилі ворогів».
      kind: rule
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: every
        label: Кожні
        type: int
        unit: тіків
        required: true
      - key: max_alive
        label: Макс. на полі
        type: int
      rule:
        when:
          kind: timer
        then:
        - kind: spawn_at
      status: active
  - spawn-points: 🌱 Точки спавну @rule(level_start>spawn_at) — Вороги чи предмети зʼявляються в кількох заданих на мапі точках — по черзі чи у випадковій з них (три точки вгорі в Battle City, дім привидів
      у Pac-Man). Старт гравця — частина рівня, а не ця картка; сама точка як сутність, що породжує інших, — тип «Спавнер / генератор».
  - spawner-entity: '🥉 Сутність-генератор 🗄️ — Gauntlet, Chip''s Challenge (клон-машина), Rogue: породжує ворогів, доки її не знищено/не натиснуто.'
  - scatter-chase-schedule: '📎 Розклад режимів ворогів [pac-man] @rule(schedule>set_state+face) — Вороги живуть за розкладом режимів: кілька секунд розбігаються по кутах, потім женуться, і так по колу;
      на кожній зміні режиму всі розвертаються (привиди Pac-Man).'
  - ghost-house-release: 📎 Вихід ворогів із дому за лічильником [pac-man] @rule(counter>clear_state) — Вороги чекають у своєму домі й виходять по одному — коли гравець зʼїв достатньо точок або довго нічого
      не їв (привиди Pac-Man).
  - weighted-spawn: '🌱 Спавн зі зваженою ймовірністю [2048] @rule(spawned?prob>set_value) — Нова сутність буває різних видів з різною ймовірністю: у 2048 двійка — 90 %, четвірка — 10 %; на довгій грі видно,
      що четвірки рідші.'
  - drop-on-death: 🌱 Знищений ворог лишає предмет @rule(died>spawn) — Знищений ворог лишає по собі предмет — завжди чи з шансом (бонус з «червоного» танка в Battle City, лут у роглайках); що лишає зруйнований
      блок — слот «Руйнованих блоків».
  - bonus-appears: 📎 Бонус зʼявляється на час [pac-man, snake] @rule(counter>spawn_at) — Після N зібраного (точок у Pac-Man, їжі в Snake II) на полі на кілька секунд зʼявляється бонус з великою ціною; не
      встиг — зникає. Скільки живе — параметр «тривалість».
