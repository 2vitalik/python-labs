  - all-on-targets: 🌱 Усі обʼєкти на цілях [sokoban] ✍️
  - satisfy-constraints: 📎 Задовольнити всі обмеження [paper-puzzles] ✍️ — Пазл розвʼязано.
  - checkmate: 🥇 Мат [chess] ⭐ ✍️ — Король суперника без порятунку.
levels:
