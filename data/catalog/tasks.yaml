  - temporary-modes: 🥉 Тимчасові режими [pac-man] @rule(contact>set_state) — Сила після енерджайзера, щит, переляк ворогів.
  - speed-per-type: 📎 Швидкість за типом 🗄️ — Різний темп сутностей (тіки через раз).
  - multi-cell-size: 🥇 Розмір понад клітину ⭐ — Обʼєкт 1×2/2×2, рух уздовж осі (Rush Hour).
  - orientation-state: 🥇 Орієнтація як стан ⭐ — Обʼєкт перекочується, боки різні (Sausage Roll).
  - tile-rotate: '🌱 Поворот плитки 🗄️ — Infinity Loop, Net, Dorfromantik: плитка має орієнтацію, поворот — хід або підготовка ходу.'
  - pipe-connectors: 📎 Плитка-зʼєднувач з портами — У плитки є виходи на 1–4 боки; дві сусідні плитки зʼєднані, коли їхні виходи дивляться один на одного — так складаються труби й дроти (Pipe Mania, Net).
      Чи все зʼєднано в одну мережу — «Перевірка звʼязності».
  - coverage-area:
      title: Зона покриття навколо сутності
      description: 'Сутність діє на клітини довкола заданої форми: вежа, спринклер, опудало; відстань — параметр «дальність».'
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: shape
        label: Форма
        type: choice
        options:
        - line
        - cross
        - square
        - radius
        - custom
        required: true
      status: active
  - status-effects: '🥉 Статуси зі стеками й тіком — Отрута, горіння, заморозка: стан зі стеками, що щотіку діє (шкода, сповільнення) і спадає (Slay the Spire, роглайки); число стеків видно біля сутності.
      Простий стан на час — «Тимчасові режими».'
  - item-identification: '📎 Невідомі предмети до використання — Предмети одного виду спершу невідомі («синє зілля», «дивний сувій»): що вони роблять, гравець дізнається, лише використавши, — далі всі такі
      показуються під справжньою назвою (Rogue, NetHack).'
  - hunger-clock: 📎 Голод як таймер @rule(counter>damage) — Ситість щохід падає сама собою, їжа її поповнює; на нулі гравець щохід отримує шкоду (Rogue, NetHack). Видно лічильник ситості й шкоду від голоду.
  - unit-xp-skills: '🥉 Юніт набирає досвід і навички ✍️ — Fire Emblem, Into the Breach (пілоти), Wesnoth: XP → рівень → нові вміння.'
  - blob-growth: 🥉 Аміба росте [boulder-dash] @rule(rng>grow) — Амеба щотіку з деякою ймовірністю розростається на сусідню вільну клітину; завелика — стає камінням, замкнена так, що рости нікуди, — алмазами
      (Boulder Dash).
  - magic-wall-timer: 📎 Чарівна стіна з таймером [boulder-dash] @rule(contact>set_state) — Чарівна стіна спить, доки крізь неї не впаде перший камінь; тоді N тіків вона перетворює камінь, що падає крізь
      неї, на алмаз, а потім вичерпується назавжди (Boulder Dash).
game-logic:
  constraints:
  - markup-validity: 🥉 Валідність розмітки [paper-puzzles] @rule(input?unique>paint+message) — Після кожного ходу гра перевіряє рядок, стовпець і регіон і знаходить порушення правил пазла — свідомо хибну
      цифру викладача ловить одразу. Як конфлікт видно на полі — елемент «Конфлікти розмітки».
  - completion-detection: 📎 Виявлення завершення [paper-puzzles] 🗄️ — Всі обмеження виконані.
  - check-stalemate: 🥇 Шах / пат [chess] @rule(no_moves?in_check>draw) ⭐ — Виявлення загрози і безвиході.
  - deadlock-detection:
      title: Виявлення deadlock
      description: Гра помічає ящик, який уже не дійде до цілі (кут, стіна без цілі, «замерзла» пара), і каже про це під час гри; слот — які види глухого кута ловить.
      kind: rule
      tags:
      - algo
      games:
      - sokoban
      coin: gold
      amount: 1.0
      max_count: 1
      slots:
      - key: kinds
        label: Які глухі кути ловить
        type: text
        required: true
      rule:
        when:
          kind: constraint_broken
        then:
        - kind: message
      status: active
  - connectivity-check: 🥉 Перевірка звʼязності @rule(input?connected>win) — Гра перевіряє, що всі острови, труби чи фігури складають одну звʼязну мережу (обхід BFS чи заливка), і без цього не зараховує
      розвʼязок (Hashi, Net, Nurikabe).
  - single-loop-check: 🥉 Перевірка однієї петлі [paper-puzzles] @rule(input?single_loop>win) — Гра перевіряє, що проведені лінії складають рівно одну замкнену петлю без розгалужень і перетинів (Slitherlink,
      Masyu).
  - neighbor-count-clue: '🌱 Число = кількість сусідів виду [minesweeper, paper-puzzles] @rule(input?adjacent_count>mark) — Число в клітині показує, скільки сусідніх клітин певного виду — з 4 чи 8 сусідів:
      мін у сапері, ламп у Light Up.'
  - line-sum-clue: 📎 Підказка на лінії [paper-puzzles] @rule(input?sum>set_state) — Підказка збоку ряду чи стовпця задає суму або кількість у ньому, і гра перевіряє її після ходу (Kakuro, Skyscrapers, Hexcells).
  - word-validation: '🥉 Перевірка слова словником @rule(input?legal>score) — Гра завантажує словник і перевіряє, що складене слово в ньому є: неіснуюче слово не зараховується (Scrabble, Wordle, Boggle).'
  - run-length-clues: 📎 Підказки довжин блоків [paper-puzzles] @rule(input?run_lengths>set_state) — Числа біля рядка й стовпця — довжини зафарбованих блоків по порядку; гра перевіряє рядок за ними (японський
      кросворд).
  difficulty:
  - difficulty-levels: 📎 Рівні складності [minesweeper] @level — Перед грою обираєш складність — Beginner / Intermediate / Expert у сапері, швидкість 1–9 у Snake — і вона справді міняє розмір поля, кількість
      мін чи ворогів, швидкість. У «Рівнях» кожен набір — рівень зі своїми параметрами; вибір — вікно «Вибір режиму чи складності» або елемент «Розмір поля».
  - cheat-codes: 📎 Чіт-коди — Безсмертя, відкриття рівнів (для демонстрації і налагодження).
  - game-pause: '🌱 Пауза — Клавіша (P, Esc) зупиняє гру: вороги, таймери й анімації стоять, ввід ігнорується, доки не продовжиш; на екрані видно, що гра на паузі. Меню паузи з пунктами — тип вікна «Пауза-меню».'
  - skip-level:
      title: Пропуск рівня з лімітом
      description: Застряглий рівень можна пропустити, але пропусків на гру обмежена кількість, і лічильник видно (Supaplex, Helltaker).
      kind: rule
      coin: wood
      amount: 1.0
      max_count: 1
      slots:
      - key: skips
        label: Пропусків на гру
        type: int
        required: true
      rule:
        when:
          kind: input
        cond:
        - kind: counter
        then:
        - kind: next_level
        - kind: counter
      status: active
  - rule-variants: 🥉 Конструктор варіантів правил — У налаштуваннях — щонайменше два перемикачі, що вмикають інше правило, а не інше число (варіанти шахів, правила B/S у Life, параметри головоломок Tatham).
      Складність числами — «Рівні складності».
  economy:
  - round-currency: 🥉 Валюта в раунді [pvz-lite] @rule(input>currency) — Під час раунду гравець заробляє валюту (сонця падають з неба й від соняшників, монети за ворогів) і тут-таки витрачає на нових юнітів;
      запас видно на екрані, і без нього посадити не можна.
  - shop-between-levels: 🥉 Магазин між рівнями — Між рівнями гравець витрачає зароблене на постійні покращення — швидкість, броню, нову зброю — і вони діють на наступних рівнях. Вітрина — тип вікна «Вікно
      магазину»; бонус лише до кінця раунду — «Апгрейди в раунді».
    children:
    - shop-catalog: 🌱 Вітрина товарів 🗄️ — Список із цінами й описами.
  - shop-preview: 📎 Превʼю товару @element — Що дасть покупка, до покупки.
  - in-round-upgrades: 📎 Апгрейди в раунді [bomberman] @rule(contact>counter) — Підібраний бонус до кінця раунду збільшує параметр гравця — радіус вибуху, кількість бомб, швидкість (Bomberman); щонайменше
      два види. Постійні покупки між рівнями — «Магазин між рівнями».
  - shop-sales: 📎 Знижки й розпродажі — Тимчасові ціни, акції.
  - run-relics: '🥉 Реліквії забігу ✍️ — Роглайти: пасивні предмети, що міняють правила до кінця забігу.'
  - shop-buyback: 📎 Продаж назад — Повернути куплене за частину ціни.
  history:
  - undo-redo: '📎 Undo/redo ходів гри — Сімʼя: один крок / без ліміту / «Повернути скасоване» / «Безперервне перемотування часу» / рестарт; 41 гра корпусу просить.'
    children:
    - undo-step: 📎 Один крок назад — Клавіша (Z, Backspace) скасовує останній хід — поле, рахунок і лічильник ходів повертаються на крок назад; ще раз — уже ні.
    - undo-unlimited: '🥉 Без ліміту (стек станів) — Скасувати можна скільки завгодно ходів, аж до старту рівня: гра зберігає стан після кожного ходу (стек) і відкочує по одному.'
    - redo: 🌱 Повернути скасоване — Скасований хід можна повернути (Y, Ctrl+Shift+Z), доки не зроблено новий.
    - rewind: 🥈 Безперервне перемотування часу — Утримуєш клавішу — гра безперервно перемотується назад, як відео, і з будь-якої миті можна грати далі (Braid, Catrap).
  - move-notation: 🥉 Запис ходів у нотації [chess] — Ходи записуються в стандартній нотації (PGN, LURD) і копіюються чи експортуються у файл; перегляд записаного — картка «Replay».
  - state-string: 📎 Стан гри як рядок-код — Поточну позицію можна скопіювати рядком (Sokoban RLE, 36 символів Rush Hour) і вставити назад — гра відновлюється; паролі рівнів — вікно «Вхід на рівень за паролем».
  - restart-level: '🌱 Рестарт рівня з початку @rule(>restart) — Клавіша чи пункт меню повертає поточний рівень у початковий стан, без перезапуску всієї гри: гравець, обʼєкти й вороги стоять там, де на старті
      (R у Sokoban).'
  lose:
  - player-death:
      title: Смерть гравця — поразка
      description: 'Життя скінчились (лічильник «життя» = 0) — кінець гри й вікно підсумку. У грі з одним життям це те саме правило, що й сама смерть («Голова × Стіна → поразка»): тоді на ньому і «Смерть
        від дотику», і ця.'
      coin: wood
      amount: 1.0
      max_count: 1
      rule:
        when:
          kind: counter
        then:
        - kind: game_over
      status: active
  - time-out:
      title: Вичерпано час
      description: 'Час рівня вийшов (лічильник «час» дійшов до 0) — мінус життя (Frogger, Boulder Dash), поразка чи кара: налітають сильні вороги (Bomberman). Скільки секунд — параметр заявки; час на один
        хід у партії — «Таймер ходу».'
      games:
      - bomberman
      coin: wood
      amount: 1.0
      max_count: 1
      slots:
      - key: limit
        label: Ліміт
        type: int
        unit: секунд
        required: true
      rule:
        when:
          kind: counter
        then:
        - kind: lives
      status: active
  - enemy-reached-base: 🌱 Ворог дійшов до краю/бази [pvz-lite, battle-city] @(reach>lose) — Гра закінчується поразкою, щойно ворог дістався краю поля чи бази, яку треба захищати (зомбі дійшов до будинку
      в PvZ, ворожий танк — до орла в Battle City).
  - no-moves-left:
      title: Нема ходів — поразка
      description: 'Гра сама помічає, що жоден хід нічого не змінить (2048: поле повне, рівних сусідів нема), і закінчує партію.'
      games:
      - '2048'
      coin: tin
      amount: 1.0
      max_count: 1
      rule:
        when:
          kind: no_moves
        then:
        - kind: lose
      status: active
  - wrong-mark-lose:
      title: Помилкова розмітка
      description: 'Гра рахує хибні цифри чи позначки — ті, що не збігаються з розвʼязком: дійшов до ліміту — поразка; лічильник видно на екрані («Помилки: 2 / 3»). Скільки можна — параметр заявки.'
      games:
      - paper-puzzles
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: mistakes
        label: Помилок до поразки
        type: int
      rule:
        when:
          kind: counter
        then:
        - kind: lose
      status: active
  - permadeath: '🌱 Смерть стирає збереження @game — Загинув — забіг закінчено назавжди: сейв видаляється, переграти з нього не можна (роглайки, hardcore); юніт Fire Emblem не повертається в наступних боях.'
  - timeout-punisher: 🌱 Карателі замість програшу по часу [bomberman] @(counter>spawn_at) — Вичерпаний час рівня не закінчує гру, а випускає сильних ворогів-карателів, від яких треба встигнути до виходу
      (Pontan у Bomberman).
  - move-limit:
      title: Ліміт ходів на рівень
      description: На рівень дано N ходів, лічильник іде вниз; скінчились — рівень провалено (XOR, Helltaker). Обмеження за часом — «Вичерпано час».
      coin: wood
      amount: 1.0
      max_count: 1
      slots:
      - key: limit
        label: Ходів на рівень
        type: int
        required: true
      rule:
        when:
          kind: counter
        then:
        - kind: lose
      status: active
  opponent:
  - hot-seat: '📎 Hot-seat на двох [chess] — Двоє грають по черзі за одним компʼютером: після ходу керування переходить до суперника, на екрані видно, чий хід. Завіса між ходами, щоб не підглядати, — вікно
      «Передай пристрій».'
  - turn-enforcement: '🌱 Заборона позачергового ходу [chess] @rule(input?turn_of>block) — Ходити може лише та сторона, чия черга: спроба взяти чужу фігуру чи сходити двічі поспіль блокується з поясненням.'
  - move-timer:
      title: Таймер ходу / шаховий годинник
      description: Кожна сторона має свій час на хід (або на всю партію); годинник іде лише в того, хто ходить; скінчився — поразка цієї сторони.
      kind: rule
      games:
      - chess
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: per_move
        label: На хід
        type: int
        unit: секунд
        required: true
      rule:
        when:
          kind: turn_start
        then:
        - kind: timer
      status: active
  - ai-opponent: '📎 AI-суперник [chess] — Компʼютер грає за цілу сторону в покроковій грі — шахи, шашки, хрестики-нулики, реверсі: щоходу обирає один хід серед усіх дозволених ходів своїх фігур. Сімʼя за
      силою: випадковий → жадібний → minimax. Вороги, що самі ходять полем (привиди Pac-Man, танки Battle City), — не сюди: це рух сутності — «Випадкове блукання», «Погоня за гравцем», «AI в реальному часі»
      в «Сутностях».'
    children:
    - ai-random: '📎 Випадковий [chess] — Суперник-компʼютер ходить випадковим дозволеним ходом — найпростіший, але чесний ШІ: правил він не порушує. Ворог на полі, що щотіку йде навмання, — «Випадкове блукання».'
    - ai-greedy: 🥉 Жадібний [chess] — Суперник-компʼютер перебирає свої ходи й обирає той, що дає найбільше одразу (взяти найдорожчу фігуру), не думаючи на хід уперед. Ворог на полі, що щотіку робить крок
        до гравця, — «Жадібна (крок у бік цілі)» в «Погоні за гравцем».
    - ai-minimax:
        title: Minimax
        description: Суперник-компʼютер дивиться на кілька ходів уперед за себе й за тебе (minimax, краще з альфа-бета) і обирає найкращий; глибина — параметр заявки.
        games:
        - chess
        coin: gold
        amount: 1.0
        max_count: 1
        slots:
        - key: depth
          label: Глибина
          type: int
          unit: ходів
          required: true
        status: active
  - pass-turn: 🌱 Пас, коли нема ходів @rule(no_moves>pass_turn) — Сторона, якій нема куди ходити, пропускає хід — і хід переходить до суперника, гра не зависає (Reversi, Ataxx, го).
  - repetition-draw: 📎 Нічия повторенням позиції [chess] @rule(turn_end>draw) — Партія закінчується нічиєю, коли позиція повторилась утретє або 50 ходів ніхто нікого не брав; гра памʼятає історію позицій
      (шахи, ко в го).
  - garbage-attack: '🥈 Сміття супернику у versus @rule(pattern>spawn_at) ✍️ — Tetris, Puyo, Dr. Mario: ланцюг у гравця → рядки/краплі у суперника; offset.'
  - simultaneous-versus: 🥈 Два поля одночасно — Двоє грають одночасно, кожен на своєму полі на одному екрані з однаковими умовами (той самий seed); перемагає, хто швидше впорався чи довше протримався (Puyo
      Puyo, Tetris versus).
  - async-multiplayer: '🥈 Хід поштою ✍️ — Letterpress, Words With Friends: партія триває днями, нотифікації про хід.'
  - online-multiplayer: '🥇 Онлайн-партія — Двоє грають одну партію з різних компʼютерів: ходи йдуть через сервер чи сокет, стан у обох однаковий. Лобі — вікно «Лобі мультиплеєра», рейтинг — окрема картка.'
  - local-two-players: '📎 Двоє гравців одночасно [battle-city] — Двоє грають разом на одному полі й одній клавіатурі — WASD і стрілки: кооператив у Battle City, дуель у Tron; у кожного свої життя й очки
      на екрані.'
  program:
  - command-program: '🥉 Програма команд для сутності 🗄️ — Karel, Lightbot: список команд виконується після запуску.'
  - user-procedures: 🥈 Власні процедури/функції — Гравець оголошує власну процедуру з команд і викликає її з головної програми (P1/P2 у Lightbot, F1–F5 у RoboZZle); рекурсія — коли процедура викликає сама
      себе.
  - sensor-predicates: '🥉 Сенсори-умови — У програмі гравця є умови-сенсори — «попереду стіна», «на клітині фішка», колір під ногами — і розгалуження за ними: та сама програма проходить різні поля (Karel,
      RoboZZle).'
  - step-execution: 📎 Покрокове виконання з підсвіткою команди @element — Програму можна виконувати по кроку, ставити на паузу й міняти швидкість; поточна команда підсвічена (Lightbot, Karel).
  - fsm-program: '🥇 Програма як скінченний автомат ✍️ — Kara: стан × сенсори → дії + наступний стан.'
  save:
  - save-game: '🥈 Збереження гри — Вийшов посеред рівня — потім продовжуєш з того самого місця. Варіанти: один слот, кілька слотів на вибір, автосейв; рекорди й пройдені рівні — «Збереження рекордів і прогресу».'
    children:
    - save-single-slot: 🥈 Один слот
    - save-multi-slot: 🥈 Кілька слотів
    - save-autosave: 🥈 Автосейв
  - save-progress: 🥉 Збереження рекордів і прогресу — Рекорди, відкриті й пройдені рівні лишаються після перезапуску гри (файл); викладач закриває гру і відкриває знову.
  score:
  - event-points: '🌱 Очки за події @rule(contact>score) — Гра рахує очки: кожна подія має свою ціну, і її видно в правилі («ТО очки +10») — зʼїв точку, збив танк, дійшов до домівки; рахунок видно на екрані.'
  - combo-multiplier: '📎 Комбо-серії [pac-man] @rule(contact>score+multiplier) — Серія без перерви множить очки: Mr. Do! (вишні поспіль), Pac-Man (200 → 400 → 800 → 1600 за один енерджайзер).'
  - time-bonus: 🌱 Бонус за час @rule(level_end?timer>score) — Наприкінці рівня залишок часу перетворюється на очки — що швидше пройшов, то більше; бонус видно в підсумку рівня.
  - score-records: '📎 Рекорд #lab2 — Гра памʼятає найкращий результат (очки, час, ходи), показує його поруч із поточним і каже, коли побито. Щоб рекорд пережив перезапуск гри — «Збереження рекордів і прогресу»;
      таблиця з іменами — вікно «Таблиця рекордів».'
  - chain-reaction:
      title: Каскад і ланцюг
      description: Після того як поле осіло, нові збіги зникають самі, без ходу гравця, і так доки є що прибрати; кожен крок каскаду множить очки (Puyo Puyo, match-3); слот — множник.
      kind: rule
      coin: bronze
      amount: 1.0
      max_count: 1
      slots:
      - key: multiplier
        label: Множник за крок
        type: text
      rule:
        when:
          kind: settled
        cond:
        - kind: chain
        then:
        - kind: clear
        - kind: multiplier
      status: active
  - extra-life-threshold:
      title: Життя за пороги очок
      description: Кожні N очок гравець отримує додаткове життя, і лічильник життів помітно зростає (Pac-Man, Frogger); слот — поріг.
      kind: rule
      coin: wood
      amount: 1.0
      max_count: 1
      slots:
      - key: every
        label: Кожні N очок
        type: int
        required: true
      rule:
        when:
          kind: counter
        then:
        - kind: lives
      status: active
  - leftover-penalty: 🌱 Штраф за залишок @rule(level_end>score) — Наприкінці партії гравець втрачає очки за все, що не встиг викласти чи заповнити (Blokus, Scrabble, Azul).
  - escalating-kill-points: 🌱 Очки подвоюються в серії [pac-man] 🗄️ — 200 → 400 → 800 → 1600 за одну серію.
  waves:
  - enemy-waves:
      title: Хвилі ворогів
      description: Розклад появи, фінальна хвиля.
      kind: rule
      games:
      - pvz-lite
      coin: bronze
      amount: 1.0
      max_count: 1
      slots:
      - key: waves
        label: Хвиль
        type: int
        required: true
      - key: final_wave
        label: Фінальна хвиля
        type: bool
      rule:
        when:
          kind: wave_start
        then:
        - kind: spawn_at
      status: active
  - reinforcements: 🌱 Підкріплення [battle-city] @rule(destroyed>spawn_at) — Знищив ворога — з точки появи виходить наступний, доки не скінчиться запас (лічильник «ворогів лишилось» видно на екрані). Поява
      за годинником — «Спавн за розкладом».
  - progress-acceleration: 🌱 Прискорення прогресу [snake, pac-man] @rule(counter>speed) — Темп росте з рівнем/довжиною.
  win:
  - collect-all: 🌱 Зібрати все [pac-man, lode-runner] @(all_gone>) — Зібрано все, що лежало на рівні — точки в Pac-Man, золото в Lode Runner, призи, — і далі перемога, наступний рівень або відчиняється
      вихід (тоді сам вихід — «Дійти до фінішу»). Зібрати лише N — «Зібрати квоту».
  - collect-quota:
      title: Зібрати квоту
      description: N алмазів відкривають вихід.
      games:
      - boulder-dash
      coin: wood
      amount: 1.0
      max_count: 1
      slots:
      - key: quota
        label: Квота
        type: int
        required: true
      rule:
        when:
          kind: counter
        then:
        - kind: set_state
      status: active
  - reach-exit: 🌱 Дійти до фінішу [maze] @(enter>win) — Гравець дійшов до клітини виходу — перемога чи наступний рівень. Якщо вихід спершу зачинений, у правилі умова «Вихід у стані «відчинений»», а відчиняє
      його інше правило («Зібрати все», «Знищити всіх ворогів», «Зібрати квоту»).
  - destroy-all-enemies: 🌱 Знищити всіх ворогів [battle-city] @(all_gone>) — Рівень пройдено, коли не лишилось жодного ворога — ні на полі, ні серед тих, що мали ще зʼявитись (усі 20 танків етапу в Battle
      City).
  - all-on-targets: 🌱 Усі обʼєкти на цілях [sokoban] @(all_on>) — Рівень пройдено, щойно кожен ящик стоїть на цільовій клітині (Sokoban); гра помічає це сама одразу після ходу.
  - satisfy-constraints: 📎 Пазл розвʼязано [paper-puzzles, minesweeper] @(all_constraints_met>win) — Гра сама помічає, що всі обмеження виконано (чи всі безпечні клітини відкрито), і оголошує перемогу —
      без кнопки «Перевірити».
  - checkmate: 🥇 Мат [chess] @(no_moves?in_check>win) ⭐ — Король під шахом, і жодного ходу, що рятує, нема — гра сама оголошує мат і переможця. Пат (шаху нема, ходів нема) — «Пат — нічия».
  - home-slots: '📎 Заповнити N домівок по разу [frogger] @(enter?state>set_state) — На фініші кілька домівок, і кожну треба зайняти по разу: заповнив усі — рівень пройдено, стрибок у вже зайняту — смерть
      (Frogger).'
  - keep-playing-after-win: 🌱 Грати далі після перемоги [2048] @(spawned?first_time>window) — Після першої перемоги гра показує вікно з вибором — завершити чи грати далі на тому ж полі (2048 після плитки
      2048).
  - survive-waves: '🌱 Протриматись усі хвилі [pvz-lite] @(wave_cleared>win) — Відбив останню хвилю — перемога рівня (PvZ, tower defense): гра знає, скільки хвиль, і показує, яка зараз. Протриматись N секунд
      — той самий задум, але за лічильником часу.'
  - score-target: 🌱 Набрати N очок @(counter>win) ✍️ — Рахунок дійшов до цілі — перемога чи наступний рівень; ціль видно на екрані поруч із рахунком.
levels:
  bank:
  - level-bank: 🥉 Банк рівнів із прогресом [paper-puzzles] — Десятки рівнів (свої чи імпортовані колекції), у кожного статус «розвʼязано / ні» і найкращий результат; статус оновлюється одразу після розвʼязання.
  - daily-puzzle: 📎 Щоденний пазл [paper-puzzles] — Щодня — новий пазл, однаковий для всіх, бо генерується з дати як seed; розвʼязаний день позначається. Календар днів — тип вікна «Календар пазлів дня».
  - level-rating: 📎 Рейтинг рівнів — Рівні банку мають оцінку складності (зірки, «легкий / важкий») і сортуються та фільтруються за нею; обчислити оцінку — картка «Оцінка складності згенерованого».
  - level-par: 📎 Еталон рівня і зірки — У рівня є ціль — ходів чи часу; результат дає 1–3 зірки, найкращий памʼятається.
  editor:
  - editor-palette: 🌱 Палітра елементів — Вибір елемента для розстановки.
  - in-game-editor: 🥈 Редактор у грі — Розстановка елементів курсором, збереження у файл.
  - editor-draw-tools: 🥉 Інструменти малювання — Прямокутник, лінія, заливка — не лише по клітині.
  - editor-map-check: 🥉 Перевірка мапи редактором — Не дає зберегти непрохідне.
  - editor-erase: 🌱 Гумка — Видалення елементів з мапи.
  - level-exchange: 📎 Обмін рівнями — Експорт/імпорт файла іншому студенту.
  - editor-undo: '🥉 Undo/redo — Скасування й повернення дій у редакторі рівнів: поставив не те — Ctrl+Z. Скасування ходів у самій грі — «Undo/redo ходів гри».'
  - editor-playtest: 🥉 Плейтест — Запуск рівня одразу з редактора.
  format:
  - level-from-txt: '🥉 Рівні з файлів #lab2 — Рівні лежать окремими файлами (символьна мапа txt, JSON), гра читає їх парсером; новий рівень — новий файл, без зміни коду.'
  - import-open-formats: 🥉 Імпорт відкритих форматів [sokoban, paper-puzzles] — .xsb, судоку-стрічки, формати Tatham.
  - map-validation: 📎 Валідація мапи — Зрозуміла помилка на битому файлі.
  - level-metadata: 🌱 Метадані рівня — Назва, автор, складність у заголовку файла.
  - level-objects-format: 🥉 Рівень з обʼєктами й параметрами — У файлі не лише мапа символів, а й сутності з параметрами — маршрут патруля, таймер, вміст скрині (JSON чи YAML).
  - level-format-doc: 🌱 Формат рівня описано — У README є таблиця символів і полів формату рівня — інша людина робить новий рівень, не відкриваючи код.
  generation:
  - maze-generation:
      title: Генерація лабіринту
      description: Прохідний лабіринт (DFS/Прима).
      tags:
      - algo
      games:
      - maze
      coin: gold
      amount: 1.0
      max_count: 1
      slots:
      - key: algo
        label: Алгоритм
        type: choice
        options:
        - dfs
        - prim
      status: active
  - mines-after-first-click: 📎 Розкидання мін після першого кліку [minesweeper] @rule(input?first_time>spawn_at) — Перший клік завжди безпечний.
  - dungeon-generation:
      title: Генерація підземель
      description: Кімнати + коридори (роглайк).
      tags:
      - algo
      coin: gold
      amount: 1.0
      max_count: 1
      slots:
      - key: algo
        label: Алгоритм
        type: choice
        options:
        - rooms
        - bsp
        - cellular
        - drunkard
        required: true
      status: active
  - seed-share: 📎 Показати/ввести seed рівня — Згенерований рівень має seed, який видно й можна ввести, — той самий рівень зʼявиться в друга (Hexcells Infinite, роглайки).
  - unique-puzzle-generation: 👑 Генерація пазла з унікальним розвʼязком [paper-puzzles] ⭐ — Головне золото пазл-гілки.
  - infinite-field: 🥇 Нескінченне поле вперед [frogger] ⭐ — Генерація на льоту (Crossy Road).
  - difficulty-rating: 🥇 Оцінка складності згенерованого [paper-puzzles] ⭐ — Рейтинг за технікою розвʼязання.
  - no-guess-generation: '🥇 Генерація без вгадування [minesweeper] ⭐ — Розкладка мін, яку можна розвʼязати лише логікою (Hexcells, Kaboom, Tatham Mines): генератор перевіряє розкладку розвʼязувачем.'
  - random-placement: '📎 Випадкова розстановка на готовій мапі — Рівень щоразу інший: на готовій мапі гра розкидає цеглу, предмети й ворогів по вільних клітинах — не на старті гравця й не замурованими (цегла
      в Bomberman). Одна сутність, що зʼявляється у випадковій клітині за правилом (їжа в Snake, плитка в 2048), — «Спавн у випадковій клітині».'
  - chunk-generation: 🥈 Рівень зі шматків — Генератор складає рівень із заготовлених вручну кімнат чи смуг (Spelunky, Crossy Road); стики прохідні.
  progression:
  - sequential-levels: 📎 Кілька рівнів по черзі — Щонайменше два різні рівні, зроблені вручну, ідуть один за одним; перехід — правило «ТО наступний рівень».
  - level-unlock: 📎 Розблокування — Наступний відкривається після попереднього.
  - checkpoint: 🥉 Checkpoint @rule(enter>set_state) — Дійшов до прапорця — після смерті продовжує з нього, а не з початку рівня.
  - world-map: '🥉 Мапа світу з вузлами-рівнями — Рівні складаються в граф (світи, гілки): пройдений відкриває сусідні, порядок можна обирати; показують його у вікні вибору рівня чи карти.'
  - stairs-levels: '📎 Поверхи через сходи — Рівні — поверхи: сходи ведуть униз і вгору, і на відвіданий поверх можна повернутись у тому стані, як лишив (або гра генерує його знову) — роглайки, Magic Tower.'
  - difficulty-curve: 📎 Крива складності — Щонайменше 5 рівнів, зроблених вручну, де кожен вводить один новий елемент чи ускладнює знайомий; у заявці — список «рівень → що нового», а перший рівень вчить
      без тексту.
  - secret-level: 🌱 Секретний рівень — Відкривається особливою дією — прихований прохід, усі зірки, код.
  - level-param-ramp:
      title: Той самий лабіринт — інші числа
      description: 'Рівні відрізняються не мапою, а параметрами: на кожному наступному швидші вороги, коротший бонус, більше ворогів (Pac-Man, Frogger), після останнього — по колу, але важче. У «Рівнях»
        видно таблицю параметрів за рівнями; темп, що росте всередині рівня, — «Прискорення прогресу».'
      games:
      - pac-man
      - frogger
      - battle-city
      coin: tin
      amount: 1.0
      max_count: 1
      status: active
  - bonus-stage: '🌱 Бонусний рівень [bomberman, boulder-dash] — Регулярно між звичайними рівнями — особливий: без ворогів чи з невразливістю, лише набрати очок за обмежений час (бонус-етап Bomberman після
      кожного 5-го, інтермісії Boulder Dash). Видно, що це бонус, і програш нічого не забирає.'
  solvability:
  - reachability-check: 🥇 Перевірка досяжності ⭐ — Чи існує шлях до всіх цілей (flood fill / BFS).
  - level-solver:
      title: Розвʼязувач
      description: Авторозвʼязання рівня (Sokoban, судоку).
      tags:
      - algo
      games:
      - sokoban
      - paper-puzzles
      coin: gold
      amount: 1.0
      max_count: 1
      slots:
      - key: algo
        label: Алгоритм
        type: choice
        options:
        - bfs
        - astar
        - backtracking
        - propagation
        required: true
      status: active
  - unsolvable-states: 🥇 Виявлення нерозвʼязних станів [sokoban] ⭐ 🗄️ — Deadlock під час гри.
interface:
  graphics:
  - movement-animation: 🥉 Анімація руху [2048] — Плавний зсув між клітинами (GUI).
  - event-effects: '📎 Ефекти подій — Короткий кадровий ефект на подію: спалах, вибух, відкриття дверей; смерть і поява сутності — свої картки, система часток — «Частинки».'
  - idle-animation: 📎 Анімація очікування — «Дихання» спрайтів на місці.
  - particles: 🥉 Частинки — Прості системи часток на подіях.
  - spawn-animation: 📎 Поява з анімацією — Сутність «проявляється» кілька тіків.
  - death-animation: 📎 Анімація смерті — Ефект перед зникненням.
  hud:
  - status-panel: 📎 Панель стану — Життя, рахунок, час, запас бомб/щитів.
  - goal-counter: '🌱 Лічильник цілей — Скільки лишилось зібрати, знищити чи знайти: точок, ворогів, мін (міни − прапорці).'
  - mode-indicator: '🌱 Індикатор режиму [pac-man, chess] — Помітний на екрані знак поточного режиму: чий зараз хід (шахи), діє енерджайзер — привиди сині (Pac-Man), увімкнено олівець чи ручку (судоку).'
  - highlights: '📎 Підсвітки на полі — Сімʼя підсвіток на полі: виділена клітина, легальні ходи, конфлікти, останній хід, досяжні клітини, зона ураження, намір ворога, шлях. Кожна підсвітка — окрема заявка.'
    children:
    - selection-highlight: 🌱 Виділена клітина/фігура — Обрана фігура чи клітина виділена рамкою або кольором, доки не зробиш хід чи не скасуєш вибір.
    - conflict-highlight: 📎 Конфлікти розмітки [paper-puzzles] — Клітини, що порушують правило пазла (дві однакові цифри в рядку), одразу підсвічуються червоним; саму перевірку рахує «Валідність розмітки».
    - last-move-highlight: 🌱 Останній хід суперника [chess] — Звідки й куди щойно сходив суперник — обидві клітини підсвічені, щоб його хід було видно.
    - legal-move-highlight: 📎 Підсвітка легальних ходів [chess] — Показати дозволені клітини обраної фігури.
    - reachable-highlight: 📎 Досяжні клітини за хід — Після вибору юніта підсвічуються всі клітини, куди він дійде за цей хід з урахуванням перешкод (тактики, Into the Breach).
    - threat-range: 📎 Зона ураження ворога — Клітини, які бʼє ворог (куди дістане постріл чи удар), позначені на полі — видно, куди ставати небезпечно.
    - telegraph-marker: 📎 Куди вдарить ворог наступного ходу — Into the Breach
    - path-preview: 📎 Превʼю шляху до цілі — Перед рухом на полі намальовано шлях, яким сутність піде до обраної клітини (клік у Lines, підказка в лабіринті); змінив ціль — шлях перемалювався.
  - move-counter: 🌱 Лічильник ходів [sokoban] — Ходи (за потреби окремо поштовхи) на ігровому екрані; рахуються лише ходи, що відбулись.
  - remaining-counter: '🌱 Лишилось: мін/точок/ворогів [minesweeper, pac-man] 🗄️'
  - next-queue: 🌱 Черга наступних фігур/плиток — Поруч з полем видно одну чи кілька наступних фігур або кольорів, що зʼявляться (next у Tetris, превʼю кульок у Lines).
  - pocket: '📎 Рука/взяті фігури [chess] 🗄️ — Сьоґі, Crazyhouse, Hive: панель фігур поза полем.'
  - message-log: '📎 Журнал подій — Рядок чи список під полем, куди гра пише, що сталось за хід: «Ви зʼїли яблуко», «Щур кусає» (роглайки); самі повідомлення пишуть правила ефектом «повідомлення».'
  - objective-text: 🌱 Поточна ціль словами — Рядок на ігровому екрані каже, що зараз треба зробити («Збери 12 алмазів», «Дійди до виходу»), і змінюється, коли змінилась ціль.
  - popup-text: 🌱 Спливний текст над клітиною @rule(contact>score+message) — Над клітиною події на мить спливає текст — «+100», «Combo ×3», шкода — і зникає.
  - push-counter: 🌱 Лічильник поштовхів [sokoban] 🗄️ — Окремо від лічильника ходів.
  - face-button: 🌱 Смайлик стану з рестартом [minesweeper] — Кнопка-смайлик над полем показує стан гри — граю, виграв, програв — і по кліку починає заново (Minesweeper).
  - wave-progress: 🌱 Смужка прогресу хвиль [pvz-lite] — Смужка на ігровому екрані показує, скільки рівня пройдено й коли наступна хвиля, з прапорцями на великих хвилях (PvZ); заповнилась — рівень відбито.
  - health-bars: '🌱 Смужка здоровʼя ✍️ — Над сутністю чи вгорі екрана (бос) видно смужку, що коротшає з кожним ударом: скільки HP лишилось — без цифр.'
  input:
  - keyboard-controls: 🥉 Керування клавіатурою 🗄️ — Рух, дії, перепризначення клавіш.
  - cell-click: 🌱 Клік по клітині [minesweeper, pvz-lite] 🗄️ — Базова курсорна дія.
  - hover-highlight: 📎 Підсвітка клітини під курсором — Клітина під мишкою чи курсором клавіатури підсвічується ще до дії.
  - drag-drop-piece: 🥉 Drag-n-drop фігури [chess] 🗄️ — Перетягнути на легальну клітину.
  - pencil-marks: '🥉 Олівцеві нотатки [paper-puzzles] @rule(input?mode>mark) — Поруч із ручкою є олівець: у режимі олівця цифра лягає в клітину дрібним кандидатом (кілька в одній клітині), у режимі ручки
      — відповіддю; перемикач режиму видно на екрані.'
  - chord-click: 📎 Акорд-клік [minesweeper] @rule(input?adjacent_count>reveal) — Комбінована дія на числі.
  - swipe-gestures: '🥉 Жести мишею чи пальцем [2048] — Хід жестом: тягнеш у бік — гра визначає напрям за порогом; клавіші не потрібні.'
  - path-drawing: '📎 Малювання шляху drag-ом 🗄️ — Flow Free, Cosmic Express, LYNE, Puzzle & Dragons: шлях по сусідніх клітинах.'
  - path-cut: '📎 Відкат шляху до клітини — Намальований шлях можна вкоротити: повернення по ньому стирає хвіст, а перетин чужої лінії обриває її (Flow Free).'
  - multi-select: 📎 Виділення кількох клітин [paper-puzzles] — Кілька клітин можна виділити разом — протягуванням чи з Ctrl — і одним натисканням ввести цифру чи зафарбувати всі (SudokuPad).
  - edge-marking: 📎 Розмітка ребер [paper-puzzles] — Клік ставить чи прибирає лінію на ребрі між клітинами, а ще один — хрестик «тут лінії нема» (Slitherlink, Masyu).
  - dot-mark: '🌱 Позначки-нагадування на клітині [minesweeper, paper-puzzles] @rule(input>mark) — Прапорець, «?», крапка: ставляться й перебираються по колу однією кнопкою; перевірка розвʼязку їх не враховує.'
  - flag-cycle: 🌱 Правий клік по колу [minesweeper] 🗄️ — Прапорець → знак питання → порожньо.
  - flood-reveal:
      title: Каскадне відкриття нулів
      description: Клік по клітині без сусідніх мін відкриває всіх сусідів, а від кожного нового нуля — далі, доки не впреться в числа (Minesweeper). Слот — 4 чи 8 сусідів.
      kind: rule
      games:
      - minesweeper
      coin: bronze
      amount: 1.0
      max_count: 1
      slots:
      - key: neighborhood
        label: Сусідство
        type: choice
        options:
        - '4'
        - '8'
        required: true
      rule:
        when:
          kind: input
        cond:
        - kind: adjacent_count
        then:
        - kind: fill
      status: active
  menus:
  - main-menu: '📎 Головне меню #window — Нова гра, продовжити, вихід.'
  - pause-menu: '📎 Пауза-меню #window — З продовженням і рестартом.'
  - confirm-dialog: '🌱 Діалог підтвердження #window — Вихід без збереження.'
  - level-select: '📎 Вибір рівня #window — Меню зі списком і статусом.'
  - end-screen: '📎 Екран перемоги/поразки #window — З підсумком і переходом далі.'
  - game-screen: '🌱 Ігровий екран #window — Головне вікно з полем гри; рендер, камера, туман — картки поля, HUD і кнопки — елементи цього вікна.'
  - splash-screen: '📎 Заставка/лого #window — Екран із назвою і логотипом при запуску.'
  - settings-window: '📎 Вікно налаштувань #window — Окреме вікно під елементи налаштувань.'
  - shop-window: '📎 Вікно магазину #window — Вітрина крамниці; сама механіка покупок — у «Економіці».'
  - help-window: '📎 Вікно довідки #window — Правила гри і керування зсередини гри.'
  - about-window: '🌱 Вікно «Про гру» #window — Автор, версія, подяки.'
  - custom-window: 'Нестандартне вікно #window 🔁 — Вікно поза типами; ціну і зарахування уточнює викладач.'
  - editor-window: '🥈 Вікно редактора рівнів #window — Окремий екран редактора: поле рівня, курсор, кнопки «зберегти» й «грати». Що вміє сам редактор — палітра, інструменти, гумка, плейтест — картки підзони
      «Редактор» у «Рівнях».'
  - stats-window: '🌱 Статистика гравця #window — Екран з лічильниками за всі партії: зіграно, виграно, серії, середній час. Самі дані — картка «Статистика профілю», топ результатів з іменами — «Таблиця
      рекордів».'
  - mode-select: '🌱 Вибір режиму чи складності #window — Список варіантів перед грою: класика / на час / нескінченний / versus, легко–важко.'
  - map-window: '📎 Повна карта рівня #window — Уся мапа рівня чи підземелля (досліджене) на весь екран; мінімапа — «Мінімапа/радар», мапа вибору рівнів — «Мапа світу з вузлами-рівнями».'
  - difficulty-select: '🌱 Вибір складності #window 🗄️'
  - puzzle-select: '📎 Сітка пазлів зі статусами [paper-puzzles] #window 🗄️ — Банк рівнів: розвʼязано / ні / зірки.'
  - lobby-window: '📎 Лобі мультиплеєра #window — Вікно перед мережевою грою: список гравців чи кімнат, хто готовий, кнопка «Почати» — партія стартує, коли всі зібрались. Сама мережева гра — «Онлайн-партія».'
  - tutorial-window: '📎 Навчання #window — Покрокове пояснення правил у перших рівнях.'
  - replay-window: '📎 Перегляд повтору / історії ходів #window — Вікно, де записану партію чи проходження переглядають: кроки вперед і назад, пауза, перехід до потрібного ходу. Сам запис — картка «Replay».'
  - codex-window: '📎 Бестіарій / енциклопедія елементів #window — Картки сутностей гри з правилами — паспорт гри всередині гри.'
  - achievements-window: '🌱 Досягнення #window — Вікно зі списком досягнень гри («Пройди рівень без втрат», «Збери 100 монет»): отримані позначені, в решти видно умову.'
  - character-select: '🌱 Вибір персонажа / загону #window — Вікно перед грою, де обирають героя чи склад загону, і вибір змінює гру: у героїв різні параметри чи вміння. Інший вигляд без впливу на гру —
      «Вибір аватару».'
  - game-over-continue: '🌱 «Продовжити?» з лічильником #window — Аркадний екран після смерті.'
  - level-password: '🌱 Вхід на рівень за паролем #window — Chip''s Challenge, Bomberman, Lolo.'
  - match-setup: '📎 Налаштування партії [chess] #window — Сторони, AI/людина, час, арена, кількість раундів.'
  - attract-demo: '📎 Demo-режим «гра грає сама» #window — Аркадний attract mode: показ правил без вводу.'
  - placement-screen: '📎 Розстановка перед партією #window — Battleship, Stratego, Khet: сховати своє поле від суперника.'
  - pass-device: '🌱 «Передай пристрій» для hot-seat #window — Екран-завіса між ходами з прихованою інформацією.'
  - code-editor-window: '🥈 Редактор програми #window — Karel, Lightbot, 7 Billion Humans: список команд, запуск, крок.'
  - level-intro: '🌱 Заставка рівня #window — Екран перед рівнем — «STAGE 3», назва печери, скільки життів; зникає сам або з клавіші.'
  - name-entry: '🌱 Введення імені для рекорду #window — Після рекорду гравець вводить імʼя — воно потрапляє в таблицю рекордів.'
  - cutscene: '📎 Інтермісія / сценка #window — Коротка сценка між рівнями без керування — як перерви в Pac-Man; пропускається клавішею.'
  - inventory-window: '📎 Вікно інвентаря #window — Окремий екран з предметами й кількістю — обрати й застосувати; сама логіка — картка «Інвентар» на сутності.'
  - save-load-window: '📎 Збереження і завантаження #window — Слоти збережень з датою й прогресом — зберегти, завантажити, стерти; сама логіка — картки «Збереження гри».'
  - dialogue-window: '🌱 Діалог / сюжетний текст #window — Репліка персонажа чи табличка поверх поля; наступна — з клавіші.'
  - calendar-window: '📎 Календар пазлів дня [paper-puzzles] #window — Місяць клітинками: на кожен день — свій пазл, розвʼязані дні зафарбовані, серію без пропусків видно; клік по дню відкриває його пазл.'
  render:
  - console-render: 🥉 Консольний рендер — Поле символами/емодзі, перемальовка кадру.
  - gui-render: 🥈 GUI-рендер — Поле спрайтами чи фігурами у вікні (pygame, tkinter, arcade), перемальовка кадру.
  - field-scaling: 🥉 Масштабування поля — Клітини підлаштовуються під розмір вікна, зум; мапа, більша за екран, — «Камера за гравцем».
  - player-camera: 🥉 Камера за гравцем — Вʼюпорт менший за мапу.
  - minimap-radar: 🥉 Мінімапа/радар @element — Огляд великої мапи або невидимих ворогів.
  - fog-of-war: 🥉 Туман війни — Гравець бачить лише клітини в радіусі огляду своїх сутностей; решта темна, а вже побачене лишається на мапі блідим, без ворогів (Advance Wars, роглайки). Радіус — параметр
      «Огляд».
  results:
  - leaderboard: '📎 Таблиця рекордів #window — Топ-N з іменами.'
  - profile-stats: '📎 Статистика профілю #lab5 — Гра рахує партії за весь час — зіграно, виграно, відсоток, найдовша серія, середній час — і зберігає їх між запусками; показує вікно «Статистика гравця».
      Найкращий результат — картка «Рекорд».'
  - replay: 🥈 Replay — Перегляд запису проходження.
  - share-result: 📎 Поділитись результатом — Після гри результат копіюється в буфер обміну текстом чи сіткою емодзі, щоб вставити в чат (Wordle).
  - streak-stats: 🌱 Серії й статистика щоденних 🗄️ — Streak, розподіл спроб.
  - rating-system:
      title: Рейтинг гравців
      description: Elo/Glicko для партій проти людей або AI.
