    - lab3-init-str: '🌱 __init__ і __str__ / __repr__ #lab3 — Обовʼязкове в лабі 3. Обʼєкти налаштовуються в __init__, клітинка й поле друкуються через __str__ (для гравця) чи __repr__ (для налагодження).
        Показати: методи і print(field).'
    - lab3-underscores: '📎 Підкреслення: _x, __x і _ #lab3 — Додаткове в лабі 3. Внутрішні атрибути позначені _ (напр. _cells), приватний __ із name mangling, _ для непотрібного значення (for _ in range(n)).
        Показати: рядок для кожного.'
    - lab3-eq-hash: '📎 Порівняння: __eq__, __hash__, __lt__ #lab3 — Додаткове в лабі 3. Координата чи предмет порівнюються через __eq__ і мають __hash__ (тож їх можна класти в set і брати ключем словника),
        порядок — через __lt__ (сортування рекордів). Показати: методи і де вони працюють.'
    - lab3-container-methods:
        title: 'Поле як контейнер: len, [ ], in, for'
        description: 'Додаткове в лабі 3. Клас поля чи інвентаря має __len__, __getitem__, __iter__ і __contains__: працюють len(field), field[pos], pos in field, for cell in field; зрізи field[a:b] (лаба
          4) — теж сюди. Показати: методи і їх використання.'
        tags:
        - lab3
        coin: tin
        amount: 1.0
        max_count: 1
        status: active
    - lab3-property: '📎 @property і setter з перевіркою #lab3 — Додаткове в лабі 3. Обчислювана властивість (player.is_alive, level.is_solved) і setter, що не пускає погане значення (hp не нижче 0). Показати:
        декоратори і звернення без дужок.'
    - lab3-mixins: '🥉 Міксини і super() #lab3 ✍️ — Додаткове в лабі 3. Множинне спадкування зі змістом: міксини Movable, Collectable, Dangerous додають поведінку, а super().__init__() проходить увесь ланцюжок.
