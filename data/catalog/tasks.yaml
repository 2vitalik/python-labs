field:
  control:
  - control-direct:
      title: Клавіші = рух аватара
      description: 'Натиснув стрілку — аватар зробив крок саме туди: Pac-Man, Sokoban, Snake, Battle City. Якщо ти лише вказуєш ціль, а дорогу шукає гра, — це «вказую ціль».'
      icon: ⌨️
      opt: control:direct
      coin: wood
      amount: 1.0
      max_count: 1
      status: active
  - control-indirect:
      title: Вказую ціль, іде сама
      description: 'Ти кажеш куди, а сутність сама шукає шлях і йде туди кілька тіків: кулька в Lines, юніти в стратегіях. Якщо після кліку все стається одразу на тій клітині — це «клік по клітині».'
      icon: 📍
      opt: control:indirect
      coin: tin
      amount: 1.0
      max_count: 1
      status: active
  - control-click-cell:
      title: Клік по клітині
      description: 'Клік і є дія над клітиною, результат одразу: відкрити клітину в сапері, посадити рослину в PvZ, обрати фігуру й клітину ходу в шахах. Ніхто не йде шляхом — на відміну від «вказую ціль».'
      icon: 🖱️
      opt: control:click-cell
      coin: wood
      amount: 1.0
      max_count: 1
      status: active
  - control-drag-piece:
      title: Перетягую фігуру
      description: 'Береш фігуру мишкою, ведеш і відпускаєш на клітину: Blokus, пазли з фігурами, шахи на lichess. Якщо ведеш лінію через клітини і важливий сам шлях — це «малюю шлях».'
      icon: ✋
      opt: control:drag-piece
      coin: tin
      amount: 1.0
      max_count: 1
      status: active
  - control-swipe-all:
      title: Хід рухає все поле
      description: 'Одна дія зсуває все, що може рухатись, в один бік — обирати, що рухати, не треба: 2048, Threes, нахил лабіринту з кульками. Свайп пальцем — лише спосіб натиснути; суть у тому, що їде
        все поле.'
      icon: 🔀
      opt: control:swipe-all
      coin: tin
      amount: 1.0
      max_count: 1
      status: active
  - control-drag-path:
      title: Малюю шлях
      description: 'Ведеш мишкою чи пальцем через сусідні клітини, і сама лінія — це хід: Flow Free, Two Dots, маршрути літаків у Flight Control.'
      icon: 〰️
      opt: control:drag-path
      coin: tin
      amount: 1.0
      max_count: 1
      status: active
  - control-mark:
      title: Розмічаю клітини
      description: Ставиш у клітини цифри, хрестики, зафарбовуєш — світ від цього не рухається, правила лише перевіряють розмітку. Судоку, японський кросворд, прапорці в сапері.
      icon: 📝
      opt: control:mark
      coin: wood
      amount: 1.0
      max_count: 1
      status: active
  - control-programmed:
      title: Пишу програму команд
      description: 'Спершу складаєш список команд — вперед, поворот, повтори, — потім запускаєш, і сутність виконує їх сама, клавішами вже не втрутишся: Karel, Lightbot, Human Resource Machine. Екран, де
        складаєш програму, — вікно «Редактор програми»; власні процедури й умови — картки «Програми гравця».'
      icon: 📜
      opt: control:programmed
      coin: bronze
      amount: 1.0
      max_count: 1
      status: active
  - control-typed:
      title: Набираю хід текстом
      description: 'Хід набираєш рядком і тиснеш Enter — «e2 e4», «B7», «3 5 9», — а гра розбирає його на координати й дію: шахи, сапер, судоку в консолі. Окрема клавіша на кожен крок — «Клавіші = рух аватара»,
        рамка, яку водиш стрілками, — «Воджу курсор клавішами».'
      opt: control:typed
      coin: wood
      amount: 1.0
      max_count: 1
      status: active
  - control-cursor:
      title: Воджу курсор клавішами
      description: 'Стрілками водиш рамку по клітинах, а Enter чи пробіл діє на клітину під нею: відкрити в сапері, поставити цифру в судоку, обрати фігуру й клітину ходу в шахах. Те саме мишею — «Клік
        по клітині»; якщо стрілки рухають героя у світі, — «Клавіші = рух аватара».'
      opt: control:cursor
      coin: wood
      amount: 1.0
      max_count: 1
      status: active
  grid:
  - grid-square:
      title: Квадратна
      description: 'Звичайна сітка з квадратів: 4 сусіди через сторону і ще 4 через кут. Майже всі базові ігри: Pac-Man, Sokoban, шахи, сапер.'
      icon: 🔲
      opt: topology:square
      coin: wood
      amount: 1.0
      max_count: 1
      status: active
  - grid-hex:
      title: Гексагональна
      description: 'Клітини-шестикутники: у кожної 6 сусідів на однаковій відстані, діагоналей нема. Wesnoth, Civilization, Catan, Hextris; координати хитріші — ряди зсунуті через один.'
      icon: ⬢
      opt: topology:hex
      coin: bronze
      amount: 1.0
      max_count: 1
      status: active
  - grid-graph:
      title: Граф (точки й лінії)
      description: 'Поле — точки, зʼєднані лініями, і сусіди задані списком, а не сіткою: «Млин», Risk, карта метро. Квадратний лабіринт зі стінами між клітинами — ще квадратна сітка, не граф.'
      icon: 🕸️
      opt: topology:graph
      coin: bronze
      amount: 1.0
      max_count: 1
      status: active
  - grid-iso:
      title: Ізометрична
      description: 'Та сама квадратна сітка, намальована ромбами під кутом, щоб було видно висоту: Q*bert, Into the Breach, Final Fantasy Tactics. Логіка лишається квадратною — змінюються малювання й перерахунок
        координат кліку.'
      icon: 💠
      opt: topology:iso
      coin: bronze
      amount: 1.0
      max_count: 1
      status: active
  - grid-layers:
      title: Кілька шарів / висот
      description: 'Клітина має висоту чи поверх, і правила її враховують: плитку маджонгу можна взяти, лише коли згори нічого нема, а на пагорб ступаєш лише на одну висоту вгору. Поверхи-рівні, між якими
        ходиш сходами, — «Поверхи через сходи»; підлога й ящик в одній клітині — «шари клітини» в описі поля, не ця картка.'
      icon: 🏢
      opt: topology:layers
      coin: bronze
      amount: 1.0
      max_count: 1
      status: active
  - grid-1d:
      title: Лінія
      description: 'Поле — один ряд клітин чи доріжка по колу, і сусідів лише двоє: попередня й наступна. «Змії й драбини», нарди, Монополія, манкала.'
      icon: 📏
      opt: topology:1d
      coin: wood
      amount: 1.0
      max_count: 1
      status: active
  - grid-3d:
      title: Обʼємна (3D)
      description: 'Кубики в трьох вимірах, у клітини 6 сусідів через грані: 3D хрестики-нулики, кубик Рубіка, 3D-тетрис, Minecraft. Найважче — показати таке поле на пласкому екрані.'
      icon: 🧊
      opt: topology:3d
      coin: silver
      amount: 1.0
      max_count: 1
      status: active
  - grid-nested:
      title: Поле в полі
      description: 'Клітина сама містить ціле поле: великі хрестики-нулики з 9 малих, Patrick''s Parabox, Recursed. Хід у малому полі щось змінює у великому.'
      icon: 🪆
      opt: topology:nested
      coin: silver
      amount: 1.0
      max_count: 1
      status: active
  physics:
  - gravity-down:
      title: Вниз
      description: 'Що не має опори, падає на клітину вниз щотіку: камені й алмази Boulder Dash, бігун у Lode Runner, фішки «4 в ряд», цукерки в match-3. Якщо падають лише деякі типи, а решта висить, —
        це все одно «вниз».'
      icon: ⬇️
      opt: gravity:down
      coin: bronze
      amount: 1.0
      max_count: 1
      status: active
  - gravity-up:
      title: Вгору
      description: 'Усе, що «падає», летить до стелі: бульбашки, повітряні кульки, перевернутий світ VVVVVV. Логіка та сама, що й униз, лише дзеркальна.'
      icon: ⬆️
      opt: gravity:up
      coin: bronze
      amount: 1.0
      max_count: 1
      status: active
  - gravity-per-type:
      title: Залежить від типу
      description: 'Різні типи падають у різні боки: залізні кулі вниз, повітряні кульки вгору (Dosun-Fuwari), вода стікає, а дим піднімається. Якщо всі падають в один бік — обери «вниз».'
      icon: ↕️
      opt: gravity:per-type
      coin: silver
      amount: 1.0
      max_count: 1
      status: active
  - gravity-toward-center:
      title: До центру
      description: 'Падають не вниз, а до середини поля, як до планети: Hextris, Tetrisphere. Зазвичай на круглому чи шестикутному полі.'
      icon: 🪐
      opt: gravity:toward-center
      coin: silver
      amount: 1.0
      max_count: 1
      status: active
  - wrap-edges:
      title: Замкнене поле
      description: 'Вийшов за край — зʼявився з протилежного боку: тунель у Pac-Man, змійка, що пролазить крізь край екрана, Asteroids, Game of Life на торі.'
      icon: 🍩
      opt: wrap:on
      coin: wood
      amount: 1.0
      max_count: 1
      status: active
  time:
  - time-turn:
      title: Покроковий (хід = тік)
      description: 'Світ стоїть, доки ти не зробиш хід; твій хід — один тік, за ним роблять свій крок усі інші. Sokoban, шахи, 2048, роглайки: не натискаєш — нічого не відбувається.'
      icon: 👣
      opt: time:turn
      coin: wood
      amount: 1.0
      max_count: 1
      status: active
  - time-realtime:
      title: Реальний час
      description: 'Тіки йдуть за годинником, хоч натискаєш, хоч ні: привиди женуться, змійка повзе сама. Pac-Man, Snake, Battle City, Tetris — потрібен ігровий цикл із таймером.'
      icon: ⏰
      opt: time:realtime
      coin: tin
      amount: 1.0
      max_count: 1
      status: active
  - time-static:
      title: Статичний (пазл)
      description: 'Часу в грі нема: поле саме не змінюється, є лише твої позначки й перевірка. Судоку, японський кросворд, сапер; секундомір «за скільки розвʼязав» — це рахунок, а не час гри.'
      icon: ⏸️
      opt: time:static
      coin: wood
      amount: 1.0
      max_count: 1
      status: active
  - time-programmed:
      title: Програмований
      description: 'Час іде лише після «Пуск»: поки складаєш програму, світ стоїть, потім тіки біжать за нею. Майже завжди разом із керуванням «Пишу програму команд», яке й оплачує роботу; виконання по
        кроку з паузою — «Покрокове виконання з підсвіткою команди».'
      icon: ▶️
      opt: time:programmed
      coin: wood
      amount: 1.0
      max_count: 1
      status: active
  - time-wego:
      title: Одночасні ходи
      description: Кожна сторона потай обирає хід, потім усі ходи виконуються разом, і гра розвʼязує зіткнення. RoboRally, Frozen Synapse, Diplomacy; на відміну від покрокового, ніхто не ходить першим.
      icon: 📋
      opt: time:wego
      coin: bronze
      amount: 1.0
      max_count: 1
      status: active
  - time-rhythm:
      title: У такт музики
      description: 'Тік — це удар музики: хід зараховується, лише якщо натиснув у такт, і вороги ходять під ритм. Crypt of the NecroDancer, Cadence of Hyrule.'
      icon: 🎵
      opt: time:rhythm
      coin: bronze
      amount: 1.0
      max_count: 1
      status: active
  view:
  - view-top-down:
      title: Згори
      description: 'Дивишся на поле згори, як на карту: «вгору» означає «на північ», падати нікуди. Pac-Man, Sokoban, шахи, Battle City.'
      icon: 🦅
      opt: view:top-down
      coin: wood
      amount: 1.0
      max_count: 1
      status: active
  - view-side:
      title: Збоку
      description: 'Поле — розріз збоку: є низ, речі падають, по драбинах лізуть угору. Lode Runner, Boulder Dash, Tetris, платформери; тест — якщо «вгору» означає «стрибнути чи вилізти», це вид збоку.'
      icon: 🧗
      opt: view:side
      coin: wood
      amount: 1.0
      max_count: 1
      status: active
  - view-first-person:
      title: Від першої особи
      description: 'Бачиш коридор попереду очима героя, а сітка лишається під капотом: крок вперед, поворот на 90°. Wolfenstein 3D, Eye of the Beholder, Dungeon Master, 3D-лабіринт.'
      icon: 👀
      opt: view:first-person
      coin: silver
      amount: 1.0
      max_count: 1
      status: active
entities:
  combat:
  - projectile-shot: 🥉 Постріл @rule(input>spawn) — Стрілець породжує снаряд перед собою в бік погляду, і снаряд щотіку летить по прямій, доки не влучить у перешкоду чи ціль (танк у Battle City, лучник
      у роглайці). Пауза між пострілами — параметр «Перезарядка», скільки знімає влучання — «Шкода»; коли стрілець сам помічає ціль і стріляє — ще й «Атака по лінії бачення».
  - shoot-modes: '📎 Режими стрільби @rule(input>spawn) — Сімʼя: черга / дріб. Простий постріл вперед — «Постріл», перезарядка — параметр «перезарядка».'
    children:
    - shoot-forward: 📎 Вперед 🗄️
    - shoot-burst:
        title: Стрільба чергою
        description: Один постріл випускає кілька снарядів поспіль, по одному за тік, а потім стрілець перезаряджається (кулемет, бос, що стріляє чергами); скільки снарядів у черзі — параметр заявки. Одиночний
          постріл — «Постріл».
        kind: rule
        coin: tin
        amount: 1.0
        max_count: 1
        slots:
        - key: shots
          label: Снарядів у черзі
          type: int
          required: true
        rule:
          when:
            kind: input
          then:
          - kind: spawn
        status: active
    - shoot-spread:
        title: Постріл віялом
        description: Один постріл випускає снаряди в кілька боків одразу — прямо й навскіс віялом або хрестом на всі чотири (дробовик, бос роглайки); скільки напрямків — параметр заявки. Видно, як снаряди
          розлітаються від стрільця.
        kind: rule
        coin: tin
        amount: 1.0
        max_count: 1
        slots:
        - key: rays
          label: Напрямків
          type: int
          required: true
        rule:
          when:
            kind: input
          then:
          - kind: spawn
        status: active
    - shoot-cooldown:
        title: Cooldown
        coin: tin
        amount: 1.0
        max_count: 1
        slots:
        - key: cooldown
          label: Cooldown
          type: int
          unit: тіків
          required: true
        status: archived
  - projectile-collision: '📎 Зіткнення снарядів @rule(contact>disappear) — Два снаряди зустрілись: обидва зникають (кулі Battle City гасять одна одну) або пролітають один крізь одного — що саме, видно в
      правилі.'
  - blast-wave:
      title: Вибух заданої форми
      description: Вибух накриває клітини хрестом, квадратом чи радіусом, гасне на непробивному й лишає продукт (вогонь, алмази, порожнечу); радіус — параметр «дальність».
      kind: rule
      coin: bronze
      amount: 1.0
      max_count: 1
      slots:
      - key: shape
        label: Форма
        type: choice
        options:
        - cross
        - square
        - radius
        required: true
      - key: into
        label: Що лишається
        type: text
      rule:
        when:
          kind: state_off
        then:
        - kind: explode
      status: active
  - telegraphed-intents: 🥉 Ворог оголошує хід наперед — Ворог обирає дію на хід раніше й виконує саме її (Into the Breach); позначка на полі — «Куди вдарить ворог наступного ходу».
  - chain-detonation:
      title: Ланцюгова детонація
      description: Вогонь вибуху, що дістав іншу бомбу чи міну, підриває її одразу, не чекаючи запалу, — і вибухи біжать ланцюгом (Bomberman, міни в танчиках). Сам вибух — «Вибух заданої форми», запал —
        «Бомба із запалом».
      kind: rule
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: delay
        label: Затримка
        type: int
        unit: тіків
      rule:
        when:
          kind: contact
        then:
        - kind: explode
      status: active
  - piece-capture: 📎 Взяття фігури [chess] @rule(contact>disappear) — Фігура, що ходить на клітину з фігурою суперника, знімає її з поля, а на клітину зі своєю фігурою ходити не можна (шахи). Куди саме
      фігура може бити — «Патерни ходів фігур».
  - melee-vs-ranged: '📎 Атака впритул @rule(adjacent>damage) — Сутність бʼє ціль на сусідній клітині й знімає їй HP, а не вбиває з першого дотику: ворог — гравця, зомбі — рослину перед собою (PvZ), гравець
      — ворога, в якого вперся (роглайки). Удар здалеку — «Атака по лінії бачення», загибель від першого дотику — «Смерть від дотику».'
  - explode-area:
      title: Вибух площею
      description: 'Сімʼя з blast-wave (хрест): тут — квадрат 3×3 / радіус; слот — форма; продукт вибуху — окремий слот.'
      coin: bronze
      amount: 1.0
      max_count: 1
      slots:
      - key: shape
        label: Форма
        type: choice
        options:
        - cross
        - square3
        - radius
        required: true
      - key: into
        label: Що лишається
        type: text
      status: archived
  - beam-tracing: 🥉 Трасування променя по сітці — Випромінювач пускає промінь по прямій до першої перешкоди; дзеркала й призми на шляху повертають його, і промінь перемальовується щоразу, коли щось на ньому
      зрушило (Deflektor, LaserTank, Khet). Відбиття від одного дзеркала — картка «Дзеркало відбиває промінь/снаряд».
  - line-of-sight-attack: 🥉 Атака по лінії бачення @rule(line_of_sight>spawn) — Ворог стріляє чи бʼє, щойно ціль опинилась з ним на одному ряду чи стовпці і між ними нема перешкод (лучник у Hoplite, Медуза
      в Lolo, горохострел у PvZ); стіна між ними рятує. Удар лише по сусідній клітині — «Атака впритул».
  - tower-placement: 🥉 Розстановка веж на сітці [pvz-lite] 🗄️ — Вежа займає клітини, має вартість, часом формує лабіринт (Fieldrunners).
