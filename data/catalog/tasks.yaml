      status: active
  - mirror-reflect: 📎 Дзеркало відбиває промінь/снаряд @rule(enter>rotate) — Снаряд, мʼяч чи промінь, що влетів у клітину з дзеркалом, повертає на 90° залежно від нахилу дзеркала й летить далі (щити в New
      Ball Game, LaserTank).
  - thief: 📎 Злодій забирає предмети @rule(contact>take) — Ворог-злодій при контакті забирає в гравця предмет з інвентаря — ключ, черевики, золото (Chip's Challenge, Gauntlet); видно, що предмета більше
      нема.
  - freeze-into-block: '🥉 Ворог → блок @rule(contact>transform) 🗄️ — Kickle Cubicle, Toki Tori: заморожений ворог стає обʼєктом, який можна штовхати/ставати.'
  - crush-by-slide: 📎 Розчавити рухомим обʼєктом @rule(contact?moving>disappear) — Обʼєкт, що рухається, — ковзає чи падає, — знищує ворога, на якого наїхав (Pengo, Kickle Cubicle; камінь на світлячка в
      Boulder Dash); нерухомий обʼєкт ворогові не шкодить. Гравець, якого накрив камінь, — «Смерть від середовища».
  - swap-on-contact: 📎 Обмін місцями при вході @rule(contact>swap) — Сутність, що заходить на клітину іншої, не впирається, а міняється з нею місцями (SWAP у Baba Is You, скарабей у Khet).
  - line-match-clear: 🥉 Лінія з N однакових зникає @rule(pattern>clear) — Після кожного ходу гра шукає ряди з N однакових — по горизонталі, вертикалі, за потреби й діагоналі — і прибирає їх (Lines — 5 кульок,
      Dr. Mario — 4, match-3 — 3). Що далі відбувається з полем — «Каскад і ланцюг».
  - dig-hole: '📎 Копання ями збоку-знизу [lode-runner] @rule(input?free>set_state) — Ввід риє яму в цеглі збоку-знизу від аватара: клітина на час стає порожньою, і ворог у неї провалюється (Lode Runner).
      Як яма заростає — «Яма заростає і ловить».'
  - hole-refill: 📎 Яма заростає і ловить [lode-runner] @rule(contact?state>lives) — Викопана яма за N тіків заростає назад цеглою; хто в цю мить у ній — гине (Lode Runner).
  - hidden-under-block: 🌱 Схований під блоком вихід або бонус [bomberman] 🗄️ — Видно лише після руйнування блоку зверху.
  - periodic-sink: '📎 Платформа періодично зникає [frogger] @rule(timer>set_state) — Платформа кожні N тіків на M тіків іде під воду: хто на ній стояв — падає у воду (черепахи у Frogger).'
  - stop-cell: '🌱 Клітина-гальмо [inertia] @rule(enter>block) — Клітина, на якій ковзання зупиняється, з якого боку на неї не заїхав: аватар стоїть на ній, хоча далі вільно (Inertia).'
  - shovel: '🌱 Лопата: прибрати свою рослину [pvz-lite] @rule(input>disappear) — Ввід прибирає власну сутність з обраної клітини, щоб звільнити місце під іншу (лопата в PvZ викопує рослину).'
  - last-line-defense: '📎 Остання лінія оборони [pvz-lite] @rule(contact>set_state+slide) — У кінці кожної смуги стоїть разовий захисник: перший ворог, що до нього дійшов, запускає його — він проїжджає
      смугою, знищує всіх на шляху й зникає (газонокосарка в PvZ).'
  - placement-cooldown: 🌱 Пауза між посадками одного типу [pvz-lite] 🗄️ — Кулдаун картки рослини.
  - grow-on-eat: '🌱 Ріст від їжі [snake] @rule(contact>grow) — Зʼїв — став довшим: змійка додає сегмент у хвіст, і на полі це видно одразу; довжина часто йде в рахунок.'
  legality:
  - impassable-cells: 🌱 Непрохідні клітини @rule(contact>block) — Стіна не пускає на свою клітину — хід просто не відбувається; одна стіна не пускає нікого, інша — лише деяких (крізь цеглу Bomberman проходять
      деякі вороги, воду в Battle City танк не перетне, а куля пролітає). Сама стіна як тип — «Стіна / статика».
  - piece-move-patterns: '🥉 Патерни ходів фігур [chess] @rule(input?legal>move) — Кожна фігура ходить за своїм візерунком: кінь буквою Г через фігури, тура й слон по лінії до першої перешкоди, пішак уперед;
      хід поза візерунком гра не приймає (шахи, сьоґі). Підсвітити, куди можна піти, — «Підсвітка легальних ходів».'
  - no-move-into-check: 🥇 Заборона ходу під шах [chess] @rule(input?in_check>block) ⭐ — Хід, що підставляє короля, недопустимий.
  - tile-merge: '🥉 Злиття однакових [2048] @rule(contact?same>merge) — Дві однакові плитки, що зʼїхались, стають однією з подвоєним значенням (2 + 2 = 4 у 2048), різні — стоять поруч; плитка, що вже злилась
      цього ходу, вдруге не зливається: ряд 2 2 4 дає 4 4, а не 8. Зсув усього поля одним ходом — властивість поля «Хід рухає все поле».'
  - push-object: 🥉 Штовхання [sokoban, boulder-dash] @rule(contact?free>push) — Гравець, що йде в обʼєкт, зсуває його на клітину далі, якщо там вільно; інакше не рухається ніхто, а два ящики підряд не зрушити
      (Sokoban, камінь убік у Boulder Dash). Тягнути обʼєкт за собою — «Тягнення обʼєкта».
  - pull-object: 📎 Тягнення обʼєкта [sokoban] @rule(input>pull) — Гравець, відходячи від обʼєкта, тягне його за собою на клітину, яку щойно звільнив (PULL у Baba Is You, Pushmo). Пара до «Штовхання».
  - one-way-cell: 🌱 Одностороння клітина @rule(contact?moving>block) — Клітину-стрілку можна пройти лише в одному напрямку, з інших боків вона — стіна (порти Supaplex, стрілки в Lolo).
  - height-levels: '🥈 Клітини з висотою 🗄️ — Final Fantasy Tactics, Lightbot, Sausage Roll: стрибок лише на ±1 рівень, падіння з висоти.'
  - polyomino-placement: 🥉 Викладання поліоміно на сітку @rule(input?fits>place) — Гравець ставить на сітку фігуру з кількох клітин; гра перевіряє, що вона не накладається на зайняте й торкається сусідів
      так, як вимагають правила (Blokus, Patchwork, Tiny Towns).
  - piece-rotate-flip: '📎 Поворот фігури чи плитки @rule(input>rotate) — Ввід повертає, а за потреби й віддзеркалює фігуру чи плитку: разом з нею повертаються її клітини чи виходи; поворот — окремий хід
      або підготовка перед тим, як поставити.'
  - pawn-promotion: 📎 Перетворення фігури на останньому ряду [chess] @rule(reach>transform) — Пішак, що дійшов до останнього ряду, перетворюється на сильнішу фігуру — у шахах гравець обирає яку (дамка в
      шашках, зона перетворення в сьоґі).
  - piece-drop: 🥉 Дроп узятої фігури на поле [chess] @rule(input?has>place) — Взята фігура переходить до того, хто взяв, і замість ходу її можна поставити з запасу на вільну клітину (Crazyhouse, сьоґі).
      Запас біля поля — тип сутності «Запас поза полем».
  - castling: 📎 Рокіровка [chess] @rule(input?state>move) — Король іде на дві клітини до тури, а тура перестрибує через нього — одним ходом; можна, лише якщо обидва ще не ходили, між ними пусто, а король
      не під шахом і не проходить через бите поле.
  - en-passant: 📎 Взяття на проході [chess] @rule(input?state>move+disappear) — Пішак, що щойно пройшов на дві клітини повз ворожого пішака, той може взяти так, ніби він пройшов лише одну, — але тільки
      наступним ходом.
  - cursor-place: 📎 Поставити обʼєкт курсором на вільну клітину [new-ball-game, pvz-lite] @rule(input?free>place) — Гравець обирає клітину — і туди ставиться обʼєкт, якщо клітина вільна й дозволена; на
      зайняту чи заборонену не ставиться (рослини в PvZ, щити в New Ball Game). Плата за постановку — «Валюта в раунді», заборона перекрити ворогам шлях — «Перевірка досяжності».
  - swipe-all-shift: 📎 Один хід зсуває всі плитки [2048] 🗄️ — Увесь ряд/стовпець до упору за один ввід.
  - merge-once-per-move: 🌱 Плитка зливається раз за хід [2048] @rule(contact?state>merge) 🗄️ — Щойно злита не зливається вдруге в тому ж ході.
  - dice-move: 📎 Хід на кидок кубика @rule — Гравець кидає кубик — і фішка проходить рівно стільки клітин своєю доріжкою; видно, що випало і де фішка зупинилась (Змії й драбини, лудо, Монополія). Змія чи
      драбина, що переносить фішку, — «Односторонній портал».
  move:
  - move-by-input: '📎 Рух за вводом @rule(input>move) — Ввід рухає твою сутність по клітинах: у 4 чи 8 напрямках або вона йде сама, а ввід лише повертає, — обери дитину, а свій спосіб заявляй цією карткою.
      Клікаєш ціль, а дорогу шукає гра, — «Пошук шляху BFS / A*».'
    children:
    - move-4dir: 📎 Рух у 4 напрямках @rule(input>move) — Стрілки чи WASD зсувають сутність на одну клітину вгору, вниз, ліворуч чи праворуч, якщо там вільно (Sokoban, Maze, Bomberman). Рух сам, коли ввід
        лише повертає, — «Автоматичний рух…»; ковзання до упору — «Ковзання до упору».
    - move-8dir: 📎 Рух у 8 напрямках @rule(input>move) — Як рух у 4 напрямках, плюс 4 діагоналі — цифровий блок чи пари клавіш (роглайки на кшталт NetHack); видно крок навскіс. Прохід навскіс між двома
        стінами, що торкаються кутами, — «Діагональний прохід між кутами стін».
    - move-auto: 📎 Автоматичний рух, ввід змінює напрям @rule(tick>move) — Сутність щотіку сама йде вперед, а ввід лише змінює напрям (змійка, Pac-Man); без вводу вона не зупиняється. Тіки за годинником
        — властивість поля «Реальний час», заборона розвернутись назад — «Заборона розвороту на 180°».
  - inertia-slide: 📎 Ковзання до упору @rule(input>slide) — Після кроку сутність не зупиняється, а ковзає в той самий бік, доки не впреться в стіну, край чи іншу сутність (кулька в Inertia, лід у Chip's
      Challenge, танк на льоду). Клітина, що обриває ковзання, — «Клітина-гальмо»; кілька видів підлоги з різними ефектами — «Типи підлоги».
  - gravity-fall: 🥉 Гравітація [lode-runner, boulder-dash] 🗄️ — Падіння без опори.
  - enemy-patrol: 📎 Патрулювання @rule(tick>move) — Ворог ходить заданим маршрутом між точками на мапі й, дійшовши до кінця, повертає назад або йде на початок (вартовий уздовж коридору, Розкидач мін у Mined-Out).
      Розворот лише тоді, коли вперся, — «Поворот при упорі»; цикл кроків, не привʼязаний до мапи, — «Рух за шаблоном кроків».
  - random-walk: 📎 Випадкове блукання @rule(tick>move) — Ворог щотіку йде у випадковий дозволений бік, але не розвертається назад на місці (привиди Pac-Man у переляку). Компʼютер, що випадково обирає хід
      за цілу сторону (шахи), — «Випадковий» в «AI-суперник».
  - chase-player: 🥉 Погоня за гравцем @rule(tick>move) — Сутність щотіку наближається до цілі — ворог до гравця, пес до господаря. Крок у бік цілі без пошуку шляху — «Жадібна», найкоротший шлях в обхід
      стін — «Пошук шляху BFS / A*»; свою евристику (вартові Lode Runner) заявляй цією карткою.
    children:
    - chase-greedy: 🥉 Жадібна (крок у бік цілі) @rule(tick>move) — Ворог щотіку робить крок у той дозволений бік, звідки до цілі найближче, — без пошуку шляху, тож за стіною може застрягти (привиди Pac-Man
        на перехресті). Компʼютер, що обирає за сторону найвигідніший хід (шахи), — «Жадібний» в «AI-суперник».
    - chase-bfs:
        title: Пошук шляху BFS / A*
        description: 'Сутність іде до цілі найкоротшим шляхом в обхід стін — пошуком у ширину (BFS), A* чи Дейкстрою: ворог женеться за гравцем, аватар іде до клікнутої клітини; видно, що за стіною вона
          не застрягає. Сама схема «клікнув ціль — іде» — властивість поля «Вказую ціль, іде сама».'
        kind: rule
        coin: gold
        amount: 1.0
        max_count: 1
        slots:
        - key: algo
          label: Алгоритм
          type: choice
          options:
          - bfs
          - astar
          - dijkstra
          required: true
        rule:
          when:
            kind: tick
          then:
          - kind: move
        status: active
    - chase-double-move: 🥉 Два ходи ворога на один хід гравця (Theseus) 🗄️
  - realtime-ai: '🥇 AI в реальному часі [snake] ⭐ — Сутність-суперник у реальному часі сама обирає, куди повернути, щоб вижити довше за гравця: оцінює вільний простір попереду (flood fill) — змійка-бот
      у Snake, мотоцикл у Tron. Компʼютер, що обирає хід за цілу сторону в покроковій грі (шахи), — «AI-суперник».'
  - pattern-automaton:
      title: Рух за шаблоном кроків
      description: Сутність повторює жорсткий цикл кроків зі слота — «→→↓↓←←↑↑» чи «крок, стоїть» — не дивлячись на гравця (слайм ходить квадратом, скелет — через такт, вантажівка в демо Tanks). Маршрут
        між точками на мапі — «Патрулювання».
      kind: rule
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: pattern
        label: Цикл ходів
        type: text
        required: true
      rule:
        when:
          kind: tick
        then:
        - kind: move
      status: active
  - row-conveyor: 📎 Конвеєрний рух ряду @rule(tick>shift) — Ціла смуга поля щотіку зсувається на клітину в свій бік разом з усім, що на ній, а те, що виїхало за край, заїжджає з протилежного (машини й колоди
      у Frogger, стрічка конвеєра). Хто стоїть на рухомій смузі й їде з нею — «Платформа везе того, хто стоїть».
  - body-queue: '🥉 Тіло-черга — Хвіст повторює шлях голови: кожен сегмент переходить туди, де щойно був попередній (черга, deque). Тип сегмента — «Хвіст / сегмент», ріст від їжі — окрема картка-правило.'
  - wall-follower:
      title: Ворог тримається стіни
      description: Ворог іде вздовж стіни, тримаючись її лівим чи правим боком, і так обходить лабіринт (світлячки Boulder Dash, жуки Chip's Challenge); слот — який бік.
      kind: rule
      coin: bronze
      amount: 1.0
      max_count: 1
      slots:
      - key: side
        label: Бік
        type: choice
        options:
        - left
        - right
        required: true
      rule:
        when:
          kind: tick
        then:
        - kind: move
      status: active
  - turn-when-blocked:
      title: Поворот при упорі
      description: 'Що робить сутність, упершись у перешкоду: повертає ліворуч чи праворуч, розвертається назад, обирає випадковий вільний бік або зупиняється; слот — який варіант. Їде прямо до упору й
        лише там обирає новий бік (ворожі танки Battle City) — ця картка; новий випадковий бік на кожному кроці — «Випадкове блукання».'
      kind: rule
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: turn
        label: Поворот
        type: choice
        options:
        - left
        - right
        - reverse
        - random
        - stop
        required: true
      rule:
        when:
          kind: blocked
        then:
        - kind: face
      status: active
  - carrier-platform: 📎 Платформа везе того, хто стоїть [frogger] @rule(enter>attach) — Хто стоїть на рухомій платформі, щотіку зсувається разом з нею (колоди й черепахи у Frogger, плоти в A Monster's Expedition).
  - ladder-climb: 📎 Драбини і перекладини [lode-runner] @rule(input?state>move) — Вгору й униз можна рухатись лише по драбині, а по перекладині — переходити руками над порожнечею, не падаючи (Lode Runner).
  - party-switch: '🥉 Кілька аватарів з перемиканням @rule(input>set_state) — Гравець керує кількома героями по черзі: клавіша перемикає активного, решта стоять на місці (XOR, The Lost Vikings, Kwirk).'
  - descend-and-reverse: '📎 Строй: спуск і розворот біля краю @rule(reach>move+face) — Група ворогів іде строєм убік; щойно хтось з них торкнувся краю, уся група спускається на ряд нижче й рушає назад (Space
      Invaders, Centipede).'
  - roll-off-rounded: 📎 Камінь скочується з округлого [boulder-dash] @rule(blocked?occupied+free>move) — Камінь чи алмаз, що лежить на іншому круглому обʼєкті, скочується вбік і падає, якщо збоку й знизу-збоку
      вільно (Boulder Dash).
  - self-collision: 🌱 Зіткнення з власним тілом [snake] @rule(contact>lose) — Голова вʼїжджає у власне тіло — змійка гине, або хвіст обрізається, або зіткнення ігнорується, як заведено в грі. Удар об стіну
      чи ворога — «Смерть від дотику».
  - no-reverse-turn: '🌱 Заборона розвороту на 180° [snake, pac-man] @rule(input?moving>face) — Сутність не може розвернутись на 180° за один тік: поворот назад ігнорується, а другий поворот, натиснутий
      у тому ж тіку, чекає в буфері — змійка не вʼїжджає сама в себе.'
  - diagonal-gap-pass: 🌱 Діагональний прохід між кутами стін [inertia] @rule(input?free>slide) — Ковзання по діагоналі проходить між двома стінами, що торкаються лише кутами, і не зупиняється (Inertia).
  - visited-trail: 🌱 Слід пройдених клітин [mined-out] @rule(leave>mark) — Клітини, які гравець пройшов, лишаються позначеними слідом — видно, де він уже був (Mined-Out); на пізніх рівнях слід може зникати.
  - facing-icon: '📎 Іконка за напрямом руху — Сутність виглядає по-різному залежно від того, куди дивиться: танк, повернутий ліворуч, і танк, повернутий угору, — різні спрайти чи символи (Battle City).'
  - notice-and-chase: 📎 Ворог помічає гравця @rule — Ворог спить, блукає чи патрулює, доки гравець далі за N клітин чи за стіною; щойно помітив — переходить у погоню, загубив — вертається до свого (вовк
      у демо Rogue, Маус у демо Tanks). Як далеко бачить — параметр «Огляд», як женеться — «Погоня за гравцем».
