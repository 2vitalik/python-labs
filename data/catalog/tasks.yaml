  - level-solver: 🥇 Розвʼязувач [sokoban, paper-puzzles] ⭐ ✍️ — Авторозвʼязання рівня (Sokoban, судоку).
  - unsolvable-states: 🥇 Виявлення нерозвʼязних станів [sokoban] ⭐ ✍️ — Deadlock під час гри.
