    - shop-preview: 📎 Превʼю товару ✍️ — Що дасть покупка, до покупки.
    - shop-sales: 📎 Знижки й розпродажі ✍️ — Тимчасові ціни, акції.
    - shop-buyback: 📎 Продаж назад ✍️ — Повернути куплене за частину ціни.
  - in-round-upgrades: 📎 Апгрейди в раунді [bomberman] ✍️ — Радіус вибуху, кількість бомб.
  lose:
  - player-death: 🌱 Смерть гравця — З варіантом кількох життів.
  - time-out: 🌱 Вичерпано час [bomberman] — Таймер рівня.
  - enemy-reached-base: 🌱 Ворог дійшов до краю/бази [pvz-lite, battle-city] ✍️
  - no-moves-left: 📎 Нема ходів [2048, sokoban] — Глухий кут.
  - wrong-mark-lose: 📎 Помилкова розмітка [paper-puzzles] ✍️ — Поразка при невірно заповненій клітині (режим «like paper»).
  opponent:
  - hot-seat: 📎 Hot-seat на двох [chess] ✍️ — Черга ходів за однією клавіатурою.
  - turn-enforcement: 🌱 Заборона позачергового ходу [chess] ✍️ — Контроль сторони.
  - move-timer: 📎 Таймер ходу / шаховий годинник [chess] ✍️
  - ai-opponent: '📎 AI-суперник [chess] ✍️ — Сімʼя за силою: випадковий → жадібний → minimax.'
    children:
    - ai-random: 📎 Випадковий [chess] ✍️
    - ai-greedy: 🥉 Жадібний [chess] ✍️
    - ai-minimax: 🥇 Minimax [chess] ✍️
  - realtime-ai: 🥇 AI в реальному часі [snake] ⭐ ✍️ — Виживання проти Tron-змійки.
  save:
  - save-game: 🥈 Збереження гри — Продовжити пізніше.
    children:
    - save-single-slot: 🥈 Один слот
    - save-multi-slot: 🥈 Кілька слотів
    - save-autosave: 🥈 Автосейв
  - save-progress: 🥉 Збереження рекордів і прогресу — Між сесіями.
  score:
  - event-points: 🌱 Очки за події — Таблиця вартостей дій.
  - combo-multiplier: 📎 Комбо-серії ✍️ — Множник за неперервність (Mr. Do!).
  - time-bonus: 🌱 Бонус за час — Швидше = більше.
  - score-records: 📎 Рекорди — Локальна таблиця найкращих.
