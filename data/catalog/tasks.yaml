  - inventory-items: '🥉 Застосування предмета @rule(input?has>use) — Ввід застосовує предмет з інвентаря: ефект і витрата (ключ, зілля, бомба).'
  - inventory: '🥉 Інвентар — Сутність носить підібрані предмети: вони зберігаються, видно, скільки чого є (панель чи вікно інвентаря), і витрачаються. Ліміт — параметр «місткість»; застосування предмета
      клавішею — окрема картка-правило.'
    children:
