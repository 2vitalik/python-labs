entities:
  combat:
  - projectile-shot: 🥉 Постріл [battle-city] @rule(input>spawn) — Ввід чи подія породжує снаряд перед стрільцем у бік погляду; снаряд летить по прямій і зникає на перешкоді.
  - shoot-modes: '📎 Режими стрільби @rule(input>spawn) — Сімʼя: черга / дріб. Простий постріл вперед — «Постріл», перезарядка — параметр «перезарядка».'
    children:
    - shoot-forward: 📎 Вперед 🗄️
    - shoot-burst:
        title: Черга
        kind: rule
        coin: tin
        amount: 1.0
        max_count: 1
        slots:
        - key: shots
          label: Снарядів у черзі
          type: int
          required: true
        rule:
          when:
            kind: input
          then:
          - kind: spawn
        status: active
    - shoot-spread:
        title: Дріб
        kind: rule
        coin: tin
        amount: 1.0
        max_count: 1
        slots:
        - key: rays
          label: Напрямків
          type: int
          required: true
        rule:
          when:
            kind: input
          then:
          - kind: spawn
        status: active
    - shoot-cooldown:
        title: Cooldown
        coin: tin
        amount: 1.0
        max_count: 1
        slots:
        - key: cooldown
          label: Cooldown
          type: int
          unit: тіків
          required: true
        status: archived
  - projectile-collision: 📎 Зіткнення снарядів @rule(contact>disappear) — Анігіляція чи проліт.
  - blast-wave:
      title: Вибух заданої форми
      description: Вибух накриває клітини хрестом, квадратом чи радіусом, гасне на непробивному й лишає продукт (вогонь, алмази, порожнечу); радіус — параметр «дальність».
      kind: rule
      games:
      - bomberman
      coin: bronze
      amount: 1.0
      max_count: 1
      slots:
      - key: shape
        label: Форма
        type: choice
        options:
        - cross
        - square
        - radius
        required: true
      - key: into
        label: Що лишається
        type: text
      rule:
        when:
          kind: state_off
        then:
        - kind: explode
      status: active
  - telegraphed-intents: 🥉 Ворог оголошує хід наперед — Ворог обирає дію на хід раніше й виконує саме її (Into the Breach); позначка на полі — telegraph-marker.
  - chain-detonation:
      title: Ланцюгова детонація
      description: Вибух підриває сусідні бомби.
      kind: rule
      games:
      - bomberman
      coin: bronze
      amount: 1.0
      max_count: 1
      slots:
      - key: delay
        label: Затримка
        type: int
        unit: тіків
      rule:
        when:
          kind: contact
        then:
        - kind: explode
      status: active
  - piece-capture: 📎 Взяття фігури [chess] @rule(contact>disappear) — Зняття з поля при ході на зайняту клітину.
  - melee-vs-ranged: '📎 Атака впритул @rule(adjacent>damage) — Ворог бʼє, коли ціль на сусідній клітині: шкода замість смерті від дотику. Дистанційна атака — «Атака по лінії бачення».'
  - explode-area:
      title: Вибух площею
      description: 'Сімʼя з blast-wave (хрест): тут — квадрат 3×3 / радіус; слот — форма; продукт вибуху — окремий слот.'
      coin: bronze
      amount: 1.0
      max_count: 1
      slots:
      - key: shape
        label: Форма
        type: choice
        options:
        - cross
        - square3
        - radius
        required: true
      - key: into
        label: Що лишається
        type: text
      status: archived
  - beam-tracing: '🥉 Трасування променя по сітці ✍️ — Deflektor, Khet, LaserTank, Light Up: промінь іде до перешкоди, дзеркала/поляризатори міняють шлях.'
  - line-of-sight-attack: '🥉 Атака по лінії бачення @rule(line_of_sight>spawn) ✍️ — Lolo (Медуза), DROD, Hoplite (лучник): ворог бʼє, коли гравець на одній лінії без перешкод.'
  - tower-placement: 🥉 Розстановка веж на сітці [pvz-lite] 🗄️ — Вежа займає клітини, має вартість, часом формує лабіринт (Fieldrunners).
  - tower-range:
      title: Радіус/форма дії вежі
      games:
      - pvz-lite
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: shape
        label: Форма зони
        type: choice
        options:
        - line
        - radius
        - square
        - custom
        required: true
      status: archived
  - bomb-fuse: 🥉 Бомба із запалом [bomberman] @rule(input?counter>place+set_state) ✍️ — Кладеться на свою клітину, вибухає за N тіків; ліміт активних бомб.
  death:
  - touch-death: 🌱 Смерть від дотику @rule(contact>lives) — Ворог/пастка вбиває.
  - environment-death: 📎 Смерть від середовища @rule(enter>lives) — Вода без колоди, вибух, камінь згори.
  - respawn:
      title: Респавн
      description: Після смерті сутність повертається у свою точку (старт, дім привидів), можна із затримкою; з середини рівня — «Checkpoint».
      kind: rule
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: delay
        label: Затримка
        type: int
        unit: тіків
      rule:
        when:
          kind: died
        then:
        - kind: respawn
      status: active
  - timed-despawn:
      title: Зникнення за часом
      description: Тимчасові предмети і платформи.
      games:
      - frogger
      coin: wood
      amount: 1.0
      max_count: 1
      slots:
      - key: lifetime
        label: Живе
        type: int
        unit: тіків
        required: true
      status: archived
  interact:
  - item-pickup: 📎 Збирання @rule(contact>disappear) — Предмет зникає, ефект гравцеві.
  - key-and-door: '🥉 Ключ і двері [maze] @rule(contact?has>disappear) — Двері пропускають лише з ключем: умова «у А є ключ»; ключ витрачається або лишається.'
  - teleport: '🥉 Телепорт @rule(enter>teleport) — Сімʼя: парні / односторонні / випадковий вихід.'
    children:
    - teleport-pair: 🥉 Парні портали @rule(enter>teleport)
    - teleport-one-way: 📎 Односторонні @rule(enter>teleport)
    - teleport-cooldown: 📎 З cooldown 🗄️
    - teleport-random-exit: 📎 Випадковий вихід @rule(enter>teleport)
  - floor-types: 🥈 Типи підлоги @field — Лід (ковзання), вода (потрібні ласти), вогонь (Chip's Challenge).
  - stick-together: 🥈 Злипання @rule(contact>attach) — Сутності зчіплюються при контакті і рухаються разом (Sokobond).
  - cell-transform: 📎 Трансформація @rule(enter>transform) — Клітина-перетворювач змінює тип обʼєкта (Emerald Mine).
  - destructible-blocks:
      title: Руйновані блоки
      description: 'Блок руйнується від вибуху чи пострілу; слот — що лишається: нічого, предмет, вихід (схований під блоком), підлога.'
      kind: rule
      games:
      - bomberman
      coin: wood
      amount: 1.0
      max_count: 1
      slots:
      - key: drops
        label: Що лишає
        type: choice
        options:
        - none
        - item
        - exit
        - floor
      rule:
        when:
          kind: contact
        then:
        - kind: disappear
      status: draft
  - dig-terrain: '📎 Копання: земля → порожня клітина [boulder-dash] @rule(enter>disappear) ✍️ — Boulder Dash, Dig Dug, Mr. Do!: аватар робить тунель; земля не падає.'
  - fill-hole: '📎 Блок засипає дірку @rule(enter>disappear+set_cell) ✍️ — Kwirk, Pokémon Strength, A Monster''s Expedition: обʼєкт у дірці стає підлогою.'
  - button-toggle:
      title: Кнопка/важіль перемикає стан цілей
      description: Зелена кнопка Chip's Challenge, плити Zelda, важелі Railbound; слот — цілі.
      kind: rule
      coin: bronze
      amount: 1.0
      max_count: 1
      slots:
      - key: targets
        label: Що перемикає
        type: text
        required: true
      rule:
        when:
          kind: enter
        then:
        - kind: set_state
      status: draft
  - mirror-reflect: '📎 Дзеркало відбиває промінь/снаряд @rule(enter>rotate) ✍️ — Deflektor, LaserTank, Khet: кут дзеркала визначає новий напрямок.'
  - thief: '📎 Злодій забирає предмети @rule(contact>take) ✍️ — Chip''s Challenge (черевики), Gauntlet, NetHack: контакт = втрата інвентаря.'
  - freeze-into-block: '🥉 Ворог → блок @rule(contact>transform) ✍️ — Kickle Cubicle, Toki Tori: заморожений ворог стає обʼєктом, який можна штовхати/ставати.'
  - crush-by-slide: '📎 Розчавити ковзним обʼєктом @rule(contact?moving>disappear) ✍️ — Pengo, Kickle: блок, що ковзає, вбиває ворога на шляху.'
  - swap-on-contact: '📎 Обмін місцями при вході @rule(contact>swap) ✍️ — Baba (SWAP), Khet (скарабей): сутності міняються клітинами замість блокування.'
  - line-match-clear: '📎 Лінія з N однакових зникає @rule(pattern>clear) ✍️ — Lines 98, Dr. Mario, match-3: перевірка ліній після кожного ходу.'
  - dig-hole: 📎 Копання ями збоку-знизу [lode-runner] @rule(input?free>set_state) ✍️ — Аватар риє клітину по діагоналі вниз.
  - hole-refill: 📎 Яма заростає і ловить [lode-runner] @rule(contact?state>lives) ✍️ — Викопана клітина відновлюється за N тіків; хто всередині — гине.
  - hidden-under-block: 🌱 Схований під блоком вихід або бонус [bomberman] 🗄️ — Видно лише після руйнування блоку зверху.
  - periodic-sink: 📎 Платформа періодично зникає [frogger] @rule(timer>set_state) ✍️ — Черепахи пірнають кожні N тіків на M.
  - stop-cell: 🌱 Клітина-гальмо [inertia] @rule(enter>block) ✍️ — Зупиняє ковзання з будь-якого напрямку.
  - shovel: '🌱 Лопата: прибрати свою рослину [pvz-lite] @rule(input>disappear) ✍️ — Ввід прибирає свою сутність з клітини, щоб звільнити місце під іншу.'
  - last-line-defense: '📎 Остання лінія оборони [pvz-lite] @rule(contact>set_state+slide) ✍️ — Газонокосарка: разове очищення смуги.'
  - placement-cooldown: 🌱 Пауза між посадками одного типу [pvz-lite] 🗄️ — Кулдаун картки рослини.
  legality:
  - impassable-cells: 🌱 Непрохідні клітини @rule(contact>block) — Стіни для всіх або для типу сутності.
  - piece-move-patterns: 🥉 Патерни ходів фігур [chess] @rule(input?legal>move) — Кінь/тура/слон як правила на сітці.
  - no-move-into-check: 🥇 Заборона ходу під шах [chess] @rule(input?in_check>block) ⭐ — Хід, що підставляє короля, недопустимий.
  - tile-merge: 🥉 Злиття однакових [2048] @rule(contact?same>merge) — Плитки обʼєднуються за правилом.
  - push-object: 🥉 Штовхання [sokoban, boulder-dash] @rule(contact?free>push) — Обʼєкт зсувається, якщо за ним вільно.
  - pull-object: 📎 Тягнення обʼєкта [sokoban] @rule(input>pull) ✍️ — Протилежність штовханню; Pushmo, Baba (PULL), Sokoban-варіант.
  - one-way-cell: '🌱 Одностороння клітина @rule(contact?moving>block) ✍️ — Порти Supaplex, поляризатори Deflektor, стрілки Lolo: прохід лише в одному напрямку.'
  - height-levels: '🥈 Клітини з висотою 🗄️ — Final Fantasy Tactics, Lightbot, Sausage Roll: стрибок лише на ±1 рівень, падіння з висоти.'
  - polyomino-placement: '🥉 Викладання поліоміно на сітку @rule(input?fits>place) ✍️ — Blokus, Patchwork, Rampart, Tiny Towns: фігура з кількох клітин, перевірка накладання й сусідства.'
  - piece-rotate-flip: '📎 Поворот фігури чи плитки @rule(input>rotate) ✍️ — Ввід повертає (і віддзеркалює) фігуру чи плитку: разом повертаються її клітини чи порти; поворот — хід або підготовка ходу.'
  - pawn-promotion: 📎 Перетворення фігури на останньому ряду [chess] @rule(reach>transform) ✍️ — Шахи, шашки (дамка), сьоґі (зона перетворення).
  - piece-drop: 🥈 Дроп узятої фігури на поле [chess] @rule(input?has>place) ✍️ — Взята фігура переходить до того, хто взяв, і замість ходу ставиться з руки на поле (Crazyhouse, сьоґі); панель руки — «Рука/взяті
      фігури».
  - castling: 📎 Рокіровка [chess] @rule(input?state>move) ✍️ — Король і тура одним ходом за умовами.
  - en-passant: 📎 Взяття на проході [chess] @rule(input?state>move+disappear) ✍️ — Пішак бере пішака, що щойно пройшов повз.
  - cursor-place: '🥉 Поставити обʼєкт курсором на вільну клітину [new-ball-game, pvz-lite] @rule(input?free>place) ✍️ — Ввід ставить обʼєкт на обрану клітину: перевірка, що вільно й дозволено, плата з запасу;
      заборона перекрити шлях — умова «існує шлях».'
  - swipe-all-shift: 📎 Один хід зсуває всі плитки [2048] 🗄️ — Увесь ряд/стовпець до упору за один ввід.
  - merge-once-per-move: 🌱 Плитка зливається раз за хід [2048] @rule(contact?state>merge) ✍️ — Щойно злита не зливається вдруге в тому ж ході.
  move:
  - move-by-input: '🥉 Рух за вводом @rule(input>move) — Сімʼя: 4 напрямки / 8 напрямків / рух сам, ввід лише повертає.'
    children:
    - move-4dir: 🥉 4 напрямки @rule(input>move)
    - move-8dir: 🥉 8 напрямків (діагоналі) @rule(input>move)
    - move-auto: 🥉 Автоматичний рух, ввід змінює напрям @rule(tick>move)
  - inertia-slide: 🥉 Інерція [inertia] @rule(input>slide) — Ковзання до упору.
  - gravity-fall: 🥉 Гравітація [lode-runner, boulder-dash] 🗄️ — Падіння без опори.
  - enemy-patrol: 🥉 Патрулювання @rule(tick>move) — Ворог туди-сюди / по маршруту.
  - random-walk: 📎 Випадкове блукання @rule(tick>move) — З забороною розвороту на місці.
  - chase-player: '🥉 Погоня за гравцем @rule(tick>move) — Сімʼя за якістю: жадібна (крок у бік цілі) / пошук шляху BFS-A*.'
    children:
    - chase-greedy: 🥉 Жадібна (крок у бік цілі) @rule(tick>move)
    - chase-bfs:
        title: Пошук шляху BFS / A*
        description: 'Рух «до цілі» найкоротшим шляхом в обхід перешкод: ворог женеться, аватар іде до клікнутої клітини.'
        kind: rule
        coin: gold
        amount: 1.0
        max_count: 1
        slots:
        - key: algo
          label: Алгоритм
          type: choice
          options:
          - bfs
          - astar
          - dijkstra
          required: true
        rule:
          when:
            kind: tick
          then:
          - kind: move
        status: active
    - chase-double-move: 🥉 Два ходи ворога на один хід гравця (Theseus) 🗄️
  - pattern-automaton:
      title: Патерн-автомат
      description: Жорсткий цикл ходів (слайм квадратом, скелет через такт).
      kind: rule
      coin: bronze
      amount: 1.0
      max_count: 1
      slots:
      - key: pattern
        label: Цикл ходів
        type: text
        required: true
      rule:
        when:
          kind: tick
        then:
        - kind: move
      status: active
  - row-conveyor: 🥉 Конвеєрний рух ряду [frogger, pvz-lite] @rule(tick>shift) — Вся смуга зсувається разом.
  - body-queue: 🥉 Тіло-черга [snake] — Хвіст повторює шлях голови.
  - wall-follower:
      title: Ворог тримається стіни
      description: Жук/парамеція Chip's Challenge, світлячки Boulder Dash; слот — якого боку.
      kind: rule
      coin: bronze
      amount: 1.0
      max_count: 1
      slots:
      - key: side
        label: Бік
        type: choice
        options:
        - left
        - right
        required: true
      rule:
        when:
          kind: tick
        then:
        - kind: move
      status: draft
  - turn-when-blocked:
      title: Поворот при упорі
      description: Що робить ворог, впершись у перешкоду — сімʼя з 7 поведінок однією карткою.
      kind: rule
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: turn
        label: Поворот
        type: choice
        options:
        - left
        - right
        - reverse
        - random
        - stop
        required: true
      rule:
        when:
          kind: blocked
        then:
        - kind: face
      status: draft
  - carrier-platform: 📎 Платформа везе того, хто стоїть [frogger] @rule(enter>attach) ✍️ — Колоди Frogger, плоти A Monster's Expedition, конвеєри.
  - ladder-climb: 📎 Драбини і перекладини [lode-runner] @rule(input?state>move) ✍️ — Вертикальний рух лише по драбині; перекладини — рух руками.
  - party-switch: '🥉 Кілька аватарів з перемиканням @rule(input>set_state) ✍️ — XOR, Catrap, Kwirk: активний персонаж змінюється клавішею, решта стоять.'
  - descend-and-reverse: '📎 Строй: біля краю @rule(reach>move+face) — вниз і розворот ✍️ — Space Invaders, Centipede: група рухається як одне ціле.'
  - roll-off-rounded: 📎 Камінь скочується з округлого [boulder-dash] @rule(blocked?occupied+free>move) ✍️ — Падаючий обʼєкт зсувається вбік, якщо під ним округлий обʼєкт і поруч вільно.
  - self-collision: '🌱 Зіткнення з власним тілом [snake] @rule(contact>lose) ✍️ — Голова вʼїжджає у хвіст: смерть / обрізати хвіст / ігнорувати.'
  - no-reverse-turn: 🌱 Заборона розвороту на 180° [snake, pac-man] @rule(input?moving>face) ✍️ — Поворот назад ігнорується; буфер вводу наступного повороту.
  - diagonal-gap-pass: 📎 Діагональний прохід між кутами стін [inertia] @rule(input?free>slide) ✍️ — Ковзання по діагоналі між двома стінами, що торкаються кутами.
  - visited-trail: 🌱 Слід пройдених клітин [mined-out] @rule(leave>mark) ✍️ — Відвідані клітини позначаються; зникає з рівня N.
  - facing-icon: 🥉 Іконка за напрямом руху [battle-city] ✍️ — Спрайт або символ сутності залежить від того, куди вона дивиться.
  params:
  - stat-hp:
      title: HP (здоровʼя)
      description: 'Скільки шкоди сутність витримує, перш ніж загинути: кожен удар знімає HP, на нулі — смерть. Ворожий танк з HP 4 падає від четвертої кулі; хто гине від першого дотику, тому HP не потрібен.'
      icon: ❤️
      opt: hp
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: value
        label: Значення
        type: text
        required: true
      status: active
  - stat-lives:
      title: Життя
      description: 'Скільки разів можна загинути й почати знову, перш ніж гра скінчиться: у Pac-Man і Frogger — по 3. HP — запас на одне життя, життя — скільки таких спроб.'
      icon: 💗
      opt: lives
      coin: wood
      amount: 1.0
      max_count: 1
      slots:
      - key: value
        label: Значення
        type: text
        required: true
      status: active
  - stat-speed:
      title: Швидкість
      description: 'Скільки клітин сутність проходить за тік: 1 — клітина щотіку, 0.5 — раз на два тіки, 2 — дві клітини за тік. Привид у тунелі Pac-Man повільніший за Пакмана — це різна швидкість.'
      icon: ⚡
      opt: speed
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: value
        label: Значення
        type: text
        unit: кл/тік
        required: true
      status: active
  - stat-damage:
      title: Шкода
      description: 'Скільки HP знімає один удар чи снаряд цієї сутності: горошина в PvZ — 1, а в зомбі 10 HP, тобто десять влучань. Пишеться на того, хто бʼє, а не на того, кого бʼють.'
      icon: ⚔️
      opt: damage
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: value
        label: Значення
        type: text
        required: true
        unit: HP
      status: active
  - stat-armor:
      title: Броня
      description: 'На скільки HP слабшає кожен удар, що влучив: броня 1 проти шкоди 3 — мінус 2 HP. Якщо сутність просто витримує більше влучань — це HP, а не броня.'
      icon: 🛡️
      opt: armor
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: value
        label: Значення
        type: text
        required: true
        unit: HP
      status: active
  - stat-range:
      title: Дальність дії
      description: 'На скільки клітин дістає дія сутності: постріл, удар, вибух, вежа. Вогонь бомби з дальністю 2 — хрест по 2 клітини в кожен бік; як далеко сутність бачить — це інше.'
      icon: 🎯
      opt: range
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: value
        label: Значення
        type: text
        unit: кл
        required: true
      status: active
  - stat-capacity:
      title: Місткість
      description: 'Скільки речей сутність може нести чи вмістити одночасно: інвентар на 5 слотів, бігун Lode Runner несе 1 злиток, скриня на 3 предмети. Скільки пострілів у запасі — це патрони.'
      icon: 🎒
      opt: capacity
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: value
        label: Значення
        type: text
        unit: предм.
        required: true
      status: active
  - stat-cooldown:
      title: Перезарядка
      description: 'Скільки тіків чекати між двома однаковими діями: між пострілами, посадками рослини, появами ворогів — горохострел у PvZ стріляє раз на 14 тіків. Перезарядка — пауза перед наступним разом,
        тривалість — скільки діє один раз.'
      icon: ⏱️
      opt: cooldown
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: value
        label: Значення
        type: text
        unit: тіків
        required: true
      status: active
  - stat-value:
      title: Очки / цінність
      description: 'Скільки очок дає сутність, коли її зібрали чи знищили: точка в Pac-Man — 10, привид — 200–1600. Сюди ж цінність фігури в шахах і число на плитці 2048 — але не ціна, яку ти платиш.'
      icon: ⭐
      opt: value
      coin: wood
      amount: 1.0
      max_count: 1
      slots:
      - key: value
        label: Значення
        type: text
        required: true
      status: active
  - stat-count:
      title: Кількість на полі
      description: 'Скільки таких сутностей на полі чи на рівні: 4 привиди, 240 точок, 10 мін у сапері. Змінюється від рівня — пиши діапазон («10 / 40 / 99») або «за рівнем».'
      icon: '#️⃣'
      opt: count
      coin: wood
      amount: 1.0
      max_count: 1
      slots:
      - key: value
        label: Значення
        type: text
        required: true
        unit: шт.
      status: active
  - stat-duration:
      title: Тривалість
      description: 'Скільки тіків щось живе чи діє один раз: запал бомби, дія бонусу, фрукт у Pac-Man зникає за 95 тіків. Для «раз на скільки тіків» є перезарядка.'
      icon: ⏳
      opt: duration
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: value
        label: Значення
        type: text
        unit: тіків
        required: true
      status: active
  - stat-size:
      title: Розмір
      description: 'Скільки клітин займає сутність: 1 — звичайна, 2×2 — великий бос, 2 чи 3 — машина в Rush Hour. Тут лише число; рух сутності, більшої за клітину, — окрема механіка.'
      icon: 📐
      opt: size
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: value
        label: Значення
        type: text
        unit: кл
        required: true
      status: active
  - stat-ammo:
      title: Патрони
      description: 'Скільки пострілів чи бомб є в запасі, доки не поповниш: скінчились — стріляти нема чим. Патрони — запас, перезарядка — пауза між пострілами.'
      icon: 🔫
      opt: ammo
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: value
        label: Значення
        type: text
        required: true
        unit: шт.
      status: active
  - stat-cost:
      title: Ціна
      description: 'Скільки ресурсу коштує поставити чи купити сутність: соняшник у PvZ — 50 сонць, вежа в tower defense — 100 золота. Очки ти отримуєш, ціну платиш.'
      icon: 🏷️
      opt: cost
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: value
        label: Значення
        type: text
        required: true
      status: active
  - stat-vision:
      title: Огляд
      description: 'На скільки клітин сутність бачить: у тумані війни гравець бачить радіус 3, вартовий помічає тебе за 5 клітин. Дальність — куди дістає дія, огляд — що видно.'
      icon: 👁️
      opt: vision
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: value
        label: Значення
        type: text
        required: true
        unit: кл
      status: active
  - stat-side:
      title: Сторона / колір
      description: 'Чия це сутність: білі чи чорні, гравець 1 чи 2, колір у Blokus. Потрібна, коли однакові фігури належать різним сторонам і правило питає «своя чи чужа».'
      icon: 🏳️
      opt: side
      coin: wood
      amount: 1.0
      max_count: 1
      slots:
      - key: value
        label: Значення
        type: text
        required: true
      status: active
  - stat-energy:
      title: Енергія / паливо
      description: 'Запас, що витрачається на дії й поповнюється з часом чи бонусом: паливо, мана, витривалість. Патрони рахують лише постріли, енергія — будь-які дії: крок, удар, вміння.'
      icon: 🔋
      opt: energy
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: value
        label: Значення
        type: text
        required: true
      status: active
  - stat-rank:
      title: Рівень прокачки
      description: 'На якому щаблі прокачки сутність: вежу покращили з 1 до 3, юніт набрав досвіду й став сильнішим. Не плутай з рівнями гри — ті в секції «Рівні».'
      icon: 🎖️
      opt: rank
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: value
        label: Значення
        type: text
        required: true
      status: active
  roles:
  - roles-live:
      title: Живі
      description: 'Ті, хто діє: ким ти керуєш і хто ходить сам — гравець, вороги, союзники, бос, тварини.'
      icon: 👥
      amount: 1.0
      max_count: 1
      status: active
    children:
    - role-player:
        title: Гравець
        description: 'Той, ким ти керуєш на полі: Пакман, комірник у Sokoban, танк у Battle City, голова змійки. У курсорних іграх це курсор, якщо він ходить клітинами; у шахах гравця-сутності нема — там
          фігури.'
        icon: 🧍
        opt: player
        coin: wood
        amount: 1.0
        max_count: 1
        status: active
    - role-ally:
        title: Союзник
        description: 'На твоєму боці, але діє сам або за наказом: рослини в PvZ, вежі в tower defense, напарник, що йде за тобою. Якщо ним керують клавішами напряму — це другий гравець.'
        icon: 🤝
        opt: ally
        coin: tin
        amount: 1.0
        max_count: 1
        status: active
    - role-enemy:
        title: Ворог
        description: 'Сам рухається чи атакує і заважає тобі: привиди Pac-Man, ворожі танки, зомбі в PvZ. Якщо шкодить, але своєї поведінки не має (лава, шипи) — це пастка; якщо ходить, але не шкодить —
          нейтральний персонаж.'
        icon: 👾
        opt: enemy
        coin: tin
        amount: 1.0
        max_count: 1
        status: active
    - role-boss:
        title: Бос
        description: 'Особливий ворог, зазвичай один на рівень: багато HP, фази чи стани, своя поведінка. Звичайний ворог, у якого просто більше HP, — ще не бос.'
        icon: 👹
        opt: boss
        coin: bronze
        amount: 1.0
        max_count: 1
        status: active
    - role-neutral:
        title: Нейтральний персонаж
        description: 'Має свою поведінку, але сам не шкодить і не допомагає: тварини, що блукають, торговець, жителі села. Зачепиш — може стати ворогом, але це вже правило зі станом.'
        icon: 🐾
        opt: neutral
        coin: tin
        amount: 1.0
        max_count: 1
        status: active
    - role-segment:
        title: Хвіст / сегмент
        description: 'Частина іншої сутності, що тягнеться за нею чи лишається слідом: тіло змійки, слід мотоцикла в Tron, сегменти багатоніжки в Centipede. Сам не вирішує, куди йти, — повторює шлях голови
          або стоїть там, де вона пройшла.'
        icon: 🐍
        opt: segment
        coin: tin
        amount: 1.0
        max_count: 1
        status: active
  - roles-things:
      title: Речі
      description: 'Речі без своєї волі: їх штовхають, підбирають, відкривають, витрачають, а снаряди летять самі після пострілу.'
      icon: 🧰
      amount: 1.0
      max_count: 1
      status: active
    children:
    - role-object:
        title: Обʼєкт / ящик
        description: 'Річ без своєї волі: її штовхають, вона падає, котиться чи відбивається за законами гри, але сама не обирає, куди йти — ящик у Sokoban, камінь Boulder Dash, мʼячик New Ball Game, бомба
          Bomberman. Якщо її підбирають — це предмет; якщо народилась від пострілу й зникає при влучанні — снаряд.'
        icon: 📦
        opt: object
        coin: tin
        amount: 1.0
        max_count: 1
        status: active
    - role-pickup:
        title: Предмет / бонус
        description: 'Лежить на полі, зникає, коли ти його взяв, і дає ефект одразу чи йде в інвентар: точки в Pac-Man, ключ у Maze, зірка в Battle City. Якщо зібране потім витрачаєш як валюту — це ресурс.'
        icon: 💎
        opt: pickup
        coin: wood
        amount: 1.0
        max_count: 1
        status: active
    - role-projectile:
        title: Снаряд
        description: 'Зʼявляється від пострілу, сам летить по прямій і зникає при влучанні: куля в Battle City, горошина в PvZ, стріла. Бомба, що лежить і чекає вибуху, — обʼєкт, а її вогонь — пастка.'
        icon: 🔸
        opt: projectile
        coin: tin
        amount: 1.0
        max_count: 1
        status: active
    - role-container:
        title: Контейнер / скриня
        description: 'Тримає всередині інші сутності й віддає їх, коли його відкрили чи зламали: скриня з лутом, цегла в Bomberman, під якою бонус, яйце, з якого вилуплюється ворог. Якщо всередині нічого
          і її просто штовхають — це обʼєкт.'
        icon: 🎁
        opt: container
        coin: tin
        amount: 1.0
        max_count: 1
        status: active
    - role-resource:
        title: Ресурс
        description: 'Те, що збирають, щоб потім витратити: сонце в PvZ, золото, дерево, кристали. Тест: якщо зібране лягає в лічильник і йде на покупки — ресурс; якщо діє одразу чи лежить в інвентарі як
          річ — предмет.'
        icon: 🪙
        opt: resource
        coin: tin
        amount: 1.0
        max_count: 1
        status: active
    - role-supply:
        title: Запас поза полем
        description: 'Звідки беруться фігури, поки вони не на полі: лоток фігур у Blokus, картки рослин у PvZ, фішки в руці у Scrabble, взяті фігури в шогі. Самі фігури — окремі сутності; запас лише тримає
          їх і показує, що лишилось.'
        icon: 🗃️
        opt: supply
        coin: tin
        amount: 1.0
        max_count: 1
        status: active
  - roles-cells:
      title: Клітини поля
      description: 'З чого складене саме поле: стіни, підлога, пастки, двері, кнопки, зони — стоять на місці й діють на того, хто поруч чи зверху.'
      icon: 🗺️
      amount: 1.0
      max_count: 1
      status: active
    children:
    - role-static:
        title: Стіна / статика
        description: 'Стоїть на місці, і стати на неї не можна: стіни лабіринту, бетон у Battle City, колони в Bomberman. Тест: не можеш стати — стіна; можеш, але щось стається — підлога з властивістю;
          можна відчинити — двері.'
        icon: 🧱
        opt: static
        coin: wood
        amount: 1.0
        max_count: 1
        status: active
    - role-terrain:
        title: Підлога з властивістю
        description: 'Клітина, на яку стаєш, і від цього щось змінюється: лід, по якому ковзаєш, пісок, що сповільнює, драбина в Lode Runner, колода у Frogger, що везе тебе. Шкодить чи вбиває — це пастка;
          стати не можна — стіна; звичайна порожня підлога, якщо її описуєш, — теж сюди.'
        icon: 🟫
        opt: terrain
        coin: wood
        amount: 1.0
        max_count: 1
        status: active
    - role-hazard:
        title: Пастка / стихія
        description: 'Стоїть чи розтікається сама, без цілі, і шкодить тому, хто на неї потрапив: шипи, лава, вода у Frogger, вогонь від бомби, міни в сапері. Ганяється за тобою — це ворог; лише сповільнює
          чи штовхає — підлога з властивістю.'
        icon: 🔥
        opt: hazard
        coin: tin
        amount: 1.0
        max_count: 1
        status: active
    - role-gate:
        title: Двері / барʼєр
        description: 'Як стіна, але може відчинитись: двері під ключ у Maze, вихід Boulder Dash, що відкривається після N алмазів, ґрати від кнопки. Головне — стан «зачинено / відчинено» і умова, що його
          міняє; фініш, який завжди відкритий, — це зона.'
        icon: 🚪
        opt: gate
        coin: tin
        amount: 1.0
        max_count: 1
        status: active
    - role-switch:
        title: Кнопка / важіль
        description: 'Сама нічого не робить, а перемикає інших: натиснув чи став на плиту — відчинились двері, вимкнулись шипи, повернувся міст. Клітина, що змінює того, хто на ній стоїть, — підлога з властивістю;
          кнопка діє на щось інше.'
        icon: 🔘
        opt: switch
        coin: tin
        amount: 1.0
        max_count: 1
        status: active
    - role-spawner:
        title: Спавнер / генератор
        description: 'Місце, звідки зʼявляються нові сутності: будиночок привидів у Pac-Man, точки появи ворожих танків, гнізда монстрів. Сам може бути незнищенним чи мати HP — головне, що він створює інших.'
        icon: 🌀
        opt: spawner
        coin: bronze
        amount: 1.0
        max_count: 1
        status: active
    - role-zone:
        title: Зона / область
        description: 'Набір клітин, які правила перевіряють разом: цілі в Sokoban, блок 3×3 у судоку, фініш, база. Зона — це «де», а не «що»: рух вона не змінює (то підлога з властивістю), і задає її гра,
          а не гравець (то розмітка).'
        icon: 🟦
        opt: zone
        coin: wood
        amount: 1.0
        max_count: 1
        status: active
  - roles-pieces:
      title: Фігури й розмітка
      description: 'Для настільних, курсорних і паперових ігор, де героя на полі нема: фігури, плитки, позначки.'
      icon: 🧩
      amount: 1.0
      max_count: 1
      status: active
    children:
    - role-piece:
        title: Фігура
        description: 'Сутність настільної гри: належить стороні й ходить за своїм патерном, коли її обрав гравець — шахові фігури, шашки, фішки. Обʼєкт рухається, лише коли його штовхнули; фігура ходить
          сама, але за твоїм вибором.'
        icon: ♟️
        opt: piece
        coin: wood
        amount: 1.0
        max_count: 1
        status: active
    - role-tile:
        title: Плитка
        description: 'Одна з багатьох однакових плиток, що заповнюють поле й мають значення чи колір: зливаються (2048), зникають рядами (match-3, Tetris), падають. Тест: таких десятки, рухаються гуртом,
          і важить лише їхнє значення — плитка.'
