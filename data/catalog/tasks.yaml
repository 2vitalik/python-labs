  - hole-refill: 📎 Яма заростає і ловить [lode-runner] @rule(contact?state>lives) — Викопана яма за N тіків заростає назад цеглою; хто в цю мить у ній — гине (Lode Runner).
  - hidden-under-block: 🌱 Схований під блоком вихід або бонус [bomberman] 🗄️ — Видно лише після руйнування блоку зверху.
  - periodic-sink: '📎 Платформа періодично зникає [frogger] @rule(timer>set_state) — Платформа кожні N тіків на M тіків іде під воду: хто на ній стояв — падає у воду (черепахи у Frogger).'
  - stop-cell: '🌱 Клітина-гальмо [inertia] @rule(enter>block) — Клітина, на якій ковзання зупиняється, з якого боку на неї не заїхав: аватар стоїть на ній, хоча далі вільно (Inertia).'
  - shovel: '🌱 Лопата: прибрати свою рослину [pvz-lite] @rule(input>disappear) — Ввід прибирає власну сутність з обраної клітини, щоб звільнити місце під іншу (лопата в PvZ викопує рослину).'
  - last-line-defense: '📎 Остання лінія оборони [pvz-lite] @rule(contact>set_state+slide) — У кінці кожної смуги стоїть разовий захисник: перший ворог, що до нього дійшов, запускає його — він проїжджає
