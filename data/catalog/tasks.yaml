    - lab3-classmethods: '📎 Класові й статичні методи #lab3 — Додаткове в лабі 3. @classmethod як другий конструктор (Level.from_file), @staticmethod для допоміжного, атрибут класу — лічильник обʼєктів
        чи реєстр типів клітинок за символом. Показати: рядок для кожного.'
  - lab4: '🌱 Лаба 4: просунуті можливості #lab4 — Картки зі [сторінки лаби](/labs/4): спершу обовʼязкове, далі додаткове. Картки цієї лаби з інших категорій — [пошук «lab4»](/tasks?q=lab4).'
