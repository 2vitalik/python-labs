  - bomb-fuse: '🥉 Бомба із запалом [bomberman] @rule(input?counter>place+set_state) — Ввід кладе бомбу на клітину під гравцем, і за N тіків вона вибухає (сам вибух — «Вибух заданої форми»). Одночасно на
      полі не більше бомб, ніж дозволяє ліміт: запал — параметр «Тривалість» бомби, ліміт — «Патрони» гравця.'
  - jump-capture: 🥉 Взяття стрибком @rule — Фігура перестрибує через сусідню фігуру на вільну клітину за нею, і перескочена знімається з поля; стрибки можна продовжувати ланцюгом, а в шашках, якщо взяти
      можна, брати обовʼязково (шашки, сольтер). Взяття ходом на клітину суперника — «Взяття фігури».
  - sandwich-capture: 🥉 Захоплення оточенням @rule — Фішки суперника, затиснуті в лінію між щойно поставленою і вже наявною твоєю, стають твоїми (Reversi) чи знімаються з поля (хнефатафл); у Reversi хід,
      що нікого не затискає, не дозволено. Видно, як перефарбовуються цілі ряди.
  death:
  - touch-death: '🌱 Смерть від дотику @rule(contact>lives) — Гравець зіткнувся з тим, що вбиває від дотику, — ворогом, а в Snake і стіною: мінус життя, а в грі без життів — одразу поразка; поки діє щит
      чи енерджайзер — ні (умова «не у стані»). Клітина, що вбиває, коли на неї став чи вона тебе накрила (вода, лава, міна, вогонь), — «Смерть від середовища»; повернення на старт — «Респавн».'
  - environment-death: '🌱 Смерть від середовища @rule(enter>lives) — Клітина вбиває того, хто на неї став або кого накрила: вода без колоди (Frogger), лава, міна (Mined-Out), вогонь вибуху, камінь згори
      (Boulder Dash). Ворог, що наздогнав, — «Смерть від дотику».'
  - respawn:
      title: Респавн
      description: Після смерті сутність знову зʼявляється у своїй точці — гравець на старті, привид у будиночку, вартовий угорі екрана; можна із затримкою. Продовжити з середини рівня — «Checkpoint».
      kind: rule
