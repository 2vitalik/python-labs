  - no-guess-generation: '🥇 Генерація без вгадування [minesweeper] ⭐ ✍️ — Розкладка мін, яку можна розвʼязати лише логікою (Hexcells, Kaboom, Tatham Mines): генератор перевіряє розкладку розвʼязувачем.'
  - random-placement: 📎 Випадкова розстановка на готовій мапі ✍️ — Предмети й вороги щоразу лягають інакше — з перевіркою, що не на старті й не замуровані.
  - chunk-generation: 🥈 Рівень зі шматків ✍️ — Генератор складає рівень із заготовлених вручну кімнат чи смуг (Spelunky, Crossy Road); стики прохідні.
  progression:
  - sequential-levels: 📎 Кілька рівнів по черзі — Щонайменше два різні рівні, зроблені вручну, ідуть один за одним; перехід — правило «ТО наступний рівень».
  - level-unlock: 📎 Розблокування — Наступний відкривається після попереднього.
  - checkpoint: 🥉 Checkpoint @rule(enter>set_state) — Дійшов до прапорця — після смерті продовжує з нього, а не з початку рівня.
  - world-map: '🥉 Мапа світу з вузлами-рівнями ✍️ — Рівні складаються в граф (світи, гілки): пройдений відкриває сусідні, порядок можна обирати; показують його у вікні вибору рівня чи карти.'
  - stairs-levels: '🌱 Поверхи через сходи ✍️ — Роглайки, Magic Tower: вниз/вгору, рівень лишається або генерується знову.'
  - difficulty-curve: 📎 Крива складності ✍️ — Щонайменше 5 рівнів вручну — кожен додає новий елемент або ускладнює відомий; перший вчить без тексту.
  - secret-level: 🌱 Секретний рівень ✍️ — Відкривається особливою дією — прихований прохід, усі зірки, код.
  solvability:
  - reachability-check: 🥇 Перевірка досяжності ⭐ — Чи існує шлях до всіх цілей (flood fill / BFS).
  - level-solver:
      title: Розвʼязувач
      description: Авторозвʼязання рівня (Sokoban, судоку).
      tags:
      - algo
      games:
      - sokoban
      - paper-puzzles
      coin: gold
      amount: 1.0
      max_count: 1
      slots:
      - key: algo
        label: Алгоритм
        type: choice
        options:
        - bfs
        - astar
        - backtracking
        - propagation
        required: true
      status: active
