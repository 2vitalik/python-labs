      показуються під справжньою назвою (Rogue, NetHack).'
  - hunger-clock: 📎 Голод як таймер @rule(counter>damage) — Ситість щохід падає сама собою, їжа її поповнює; на нулі гравець щохід отримує шкоду (Rogue, NetHack). Видно лічильник ситості й шкоду від голоду.
  - unit-xp-skills: 🥉 Юніт набирає досвід і навички — Сутність отримує досвід за дії — перемоги, зібране, пройдене — і на порогах досвіду переходить на новий рівень з новим умінням, а не лише з більшими
      числами; видно шкалу досвіду й нове вміння (Fire Emblem, Wesnoth, Rogue). Саме число рівня — параметр «Рівень прокачки».
  - blob-growth: 🥉 Аміба росте [boulder-dash] @rule(rng>grow) — Амеба щотіку з деякою ймовірністю розростається на сусідню вільну клітину; завелика — стає камінням, замкнена так, що рости нікуди, — алмазами
      (Boulder Dash).
  - magic-wall-timer: 📎 Чарівна стіна з таймером [boulder-dash] @rule(contact>set_state) — Чарівна стіна спить, доки крізь неї не впаде перший камінь; тоді N тіків вона перетворює камінь, що падає крізь
      неї, на алмаз, а потім вичерпується назавжди (Boulder Dash).
game-logic:
  constraints:
  - markup-validity: 📎 Валідність розмітки [paper-puzzles] @rule(input?unique>paint+message) — Після кожного ходу гра перевіряє рядок, стовпець і регіон і знаходить порушення правил пазла — свідомо хибну
      цифру викладача ловить одразу. Як конфлікт видно на полі — елемент «Конфлікти розмітки».
  - completion-detection: 📎 Виявлення завершення [paper-puzzles] 🗄️ — Всі обмеження виконані.
  - check-stalemate: 🥇 Шах / пат [chess] @rule(no_moves?in_check>draw) ⭐ — Виявлення загрози і безвиході.
  - deadlock-detection:
      title: Виявлення deadlock
      description: Гра під час гри помічає ящик, який уже не дійде до жодної цілі, і одразу каже про це. Мінімум — мертві клітини (кути й стіни без цілей, пораховані заздалегідь обходом від цілей) і «замерзла»
        пара ящиків; слот — які ще види ловить.
      kind: rule
      tags:
      - algo
      games:
      - sokoban
      coin: gold
      amount: 1.0
      max_count: 1
      slots:
      - key: kinds
        label: Які глухі кути ловить
        type: text
        required: true
      rule:
        when:
          kind: constraint_broken
        then:
        - kind: message
      status: active
  - connectivity-check: 🥉 Перевірка звʼязності @rule(input?connected>win) — Гра перевіряє, що всі острови, труби чи фігури складають одну звʼязну мережу (обхід BFS чи заливка), і без цього не зараховує
      розвʼязок (Hashi, Net, Nurikabe).
  - single-loop-check: 🥉 Перевірка однієї петлі [paper-puzzles] @rule(input?single_loop>win) — Гра перевіряє, що проведені лінії складають рівно одну замкнену петлю без розгалужень і перетинів (Slitherlink,
      Masyu).
  - neighbor-count-clue: '🌱 Число = кількість сусідів виду [minesweeper, paper-puzzles] @rule(input?adjacent_count>mark) — Число в клітині показує, скільки сусідніх клітин певного виду — з 4 чи 8 сусідів:
      мін у сапері, ламп у Light Up.'
  - line-sum-clue: 📎 Підказка на лінії [paper-puzzles] @rule(input?sum>set_state) — Підказка збоку ряду чи стовпця задає суму або кількість у ньому, і гра перевіряє її після ходу (Kakuro, Skyscrapers, Hexcells).
  - word-validation: '📎 Перевірка слова словником @rule(input?legal>score) — Гра завантажує словник і перевіряє, що складене слово в ньому є: неіснуюче слово не зараховується (Scrabble, Wordle, Boggle).'
  - run-length-clues: 📎 Підказки довжин блоків [paper-puzzles] @rule(input?run_lengths>set_state) — Числа біля рядка й стовпця — довжини зафарбованих блоків по порядку; гра перевіряє рядок за ними (японський
      кросворд).
  difficulty:
  - difficulty-levels: 📎 Рівні складності @level — Перед грою обираєш складність — Beginner / Intermediate / Expert у сапері, швидкість 1–9 у Snake — і вона справді міняє розмір поля, кількість мін чи ворогів,
      швидкість. У «Рівнях» кожен набір — рівень зі своїми параметрами; вибір — вікно «Вибір режиму чи складності» або елемент «Розмір поля».
  - cheat-codes: 📎 Чіт-коди — Секретна клавіша чи набраний код вмикає й вимикає чит — безсмертя, усі рівні відкриті, +життя; поки чит діє, це видно на екрані. Викладачеві так легше дійти до фіналу на перевірці.
  - game-pause: '🌱 Пауза — Клавіша (P, Esc) зупиняє гру: вороги, таймери й анімації стоять, ввід ігнорується, доки не продовжиш; на екрані видно, що гра на паузі. Меню паузи з пунктами — тип вікна «Пауза-меню».'
  - skip-level:
      title: Пропуск рівня з лімітом
      description: Застряглий рівень можна пропустити, але пропусків на гру обмежена кількість, і лічильник видно (Supaplex, Helltaker).
      kind: rule
      coin: wood
      amount: 1.0
      max_count: 1
      slots:
      - key: skips
        label: Пропусків на гру
        type: int
        required: true
      rule:
        when:
          kind: input
        cond:
        - kind: counter
        then:
        - kind: next_level
        - kind: counter
      status: active
  - rule-variants: 🥉 Конструктор варіантів правил — У налаштуваннях — щонайменше два перемикачі, що вмикають інше правило, а не інше число (варіанти шахів, правила B/S у Life, параметри головоломок Tatham).
      Складність числами — «Рівні складності».
  - hint-limited: 🌱 Підказка з лімітом @rule — Клавіша чи кнопка показує один правильний наступний крок — відкриває цифру з розвʼязку, безпечну клітину, шлях до виходу; підказок на рівень обмежено, і лічильник
      видно. Знайти крок, коли готового розвʼязку нема, — «Розвʼязувач»; намальований шлях — «Превʼю шляху до цілі».
  economy:
  - round-currency: 🥉 Валюта в раунді [pvz-lite] @rule(input>currency) — Під час раунду гравець заробляє валюту (сонця падають з неба й від соняшників, монети за ворогів) і тут-таки витрачає на нових юнітів;
      запас видно на екрані, і без нього посадити не можна.
  - shop-between-levels: 🥉 Магазин між рівнями — Між рівнями гравець витрачає зароблене на постійні покращення — швидкість, броню, нову зброю — і вони діють на наступних рівнях. Вітрина — тип вікна «Вікно
      магазину»; бонус лише до кінця раунду — «Апгрейди в раунді».
    children:
    - shop-catalog: 🌱 Вітрина товарів 🗄️ — Список із цінами й описами.
  - shop-preview: '📎 Превʼю товару @element — Біля товару в магазині видно, що саме дасть покупка, ще до неї: «Броня 2 → 3», «Швидкість +10 %», порівняння з тим, що вже маєш. Сам магазин — «Магазин між
      рівнями».'
  - in-round-upgrades: '📎 Апгрейди в раунді @rule(contact>counter) — Підібраний бонус до кінця раунду чи забігу посилює гравця — радіус вибуху, ще одна бомба, швидкість — або вмикає нове правило: прохід
      крізь цеглу, детонатор (Bomberman), реліквія в роглайку; щонайменше два види. Бонус на кілька секунд — «Тимчасові режими», покупки між рівнями — «Магазин між рівнями».'
  - shop-sales: '📎 Знижки й розпродажі — Ціни в магазині не сталі: щоразу випадковий товар зі знижкою чи акція на час, і стару ціну видно закресленою поруч із новою.'
  - run-relics: '🥉 Реліквії забігу 🗄️ — Роглайти: пасивні предмети, що міняють правила до кінця забігу.'
  - shop-buyback: '📎 Продаж назад — Куплене можна продати назад за частину ціни (скажімо, половину): предмет зникає, його дія знімається, валюта повертається.'
  history:
  - undo-redo: '📎 Undo/redo ходів гри — Скасування ходів: «Один крок назад» або «Скасування ходів без ліміту», поверх них — «Повернути скасоване» чи «Безперервне перемотування часу». Почати рівень наново
      — «Рестарт рівня з початку».'
    children:
    - undo-step: 📎 Один крок назад — Клавіша (Z, Backspace) скасовує останній хід — поле, рахунок і лічильник ходів повертаються на крок назад; ще раз — уже ні.
    - undo-unlimited: '🥉 Скасування ходів без ліміту — Скасувати можна скільки завгодно ходів, аж до старту рівня: гра зберігає стан після кожного ходу (стек) і відкочує по одному. Це вже містить «Один
        крок назад» — заявляється одна з двох.'
    - redo: 🌱 Повернути скасоване — Скасований хід можна повернути (Y, Ctrl+Shift+Z), доки не зроблено новий.
    - rewind: 🥈 Безперервне перемотування часу — Утримуєш клавішу — гра безперервно перемотується назад, як відео, і з будь-якої миті можна грати далі (Braid, Catrap).
  - move-notation: 🥉 Запис ходів у нотації [chess] — Ходи записуються в стандартній нотації (PGN, LURD) і копіюються чи експортуються у файл; програти записане знову — «Запис партії й повтор».
  - state-string: 📎 Стан гри як рядок-код — Поточну позицію можна скопіювати рядком (Sokoban RLE, 36 символів Rush Hour) і вставити назад — гра відновлюється; паролі рівнів — вікно «Вхід на рівень за паролем».
  - restart-level: '🌱 Рестарт рівня з початку @rule(>restart) — Клавіша чи пункт меню повертає поточний рівень у початковий стан, без перезапуску всієї гри: гравець, обʼєкти й вороги стоять там, де на старті
      (R у Sokoban).'
  lose:
  - player-death: '🌱 Поразка: скінчились життя @(counter>game_over) — Життя скінчились (лічильник «життя» = 0) — кінець гри й вікно підсумку. У грі з одним життям це те саме правило, що й сама смерть («Голова
      × Стіна → поразка»): тоді на ньому і «Смерть від дотику», і ця.'
  - time-out:
      title: Вичерпано час
      description: Час рівня вийшов (лічильник «час» дійшов до 0) — мінус життя чи поразка (Frogger, Boulder Dash); відлік видно на екрані. Скільки секунд — параметр заявки; кара замість поразки — ще й
        «Карателі замість програшу по часу», час на один хід у партії — «Таймер ходу».
      coin: wood
      amount: 1.0
      max_count: 1
      slots:
      - key: limit
        label: Ліміт
        type: int
        unit: секунд
        required: true
      rule:
        when:
          kind: counter
        then:
        - kind: lives
      status: active
  - enemy-reached-base: 🌱 Ворог дійшов до краю/бази [pvz-lite, battle-city] @(reach>lose) — Гра закінчується поразкою, щойно ворог дістався краю поля чи бази, яку треба захищати (зомбі дійшов до будинку
      в PvZ, ворожий танк — до орла в Battle City).
  - no-moves-left: '📎 Поразка: нема ходів [2048] @(no_moves>lose) — Гра сама помічає, що жоден хід нічого не змінить (2048: поле повне, рівних сусідів нема), і закінчує партію.'
  - wrong-mark-lose:
      title: Помилкова розмітка
      description: 'Гра рахує хибні цифри чи позначки — ті, що не збігаються з розвʼязком: дійшов до ліміту — поразка; лічильник видно на екрані («Помилки: 2 / 3»). Скільки можна — параметр заявки.'
      games:
      - paper-puzzles
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: mistakes
        label: Помилок до поразки
        type: int
      rule:
        when:
          kind: counter
        then:
        - kind: lose
      status: active
  - permadeath: '🌱 Смерть стирає збереження @game — Загинув — забіг закінчено назавжди: сейв видаляється, і переграти з нього не можна (роглайки, hardcore-режим). Саме збереження — «Збереження в один слот».'
  - timeout-punisher: 🌱 Карателі замість програшу по часу [bomberman] @(counter>spawn_at) — Вичерпаний час рівня не закінчує гру, а випускає сильних ворогів-карателів, від яких треба встигнути до виходу
      (Pontan у Bomberman). Сам відлік часу — «Вичерпано час».
  - move-limit:
      title: Ліміт ходів на рівень
      description: На рівень дано N ходів, лічильник іде вниз; скінчились — рівень провалено (XOR, Helltaker). Обмеження за часом — «Вичерпано час».
      coin: wood
      amount: 1.0
      max_count: 1
      slots:
      - key: limit
        label: Ходів на рівень
        type: int
        required: true
      rule:
        when:
          kind: counter
        then:
        - kind: lose
      status: active
  opponent:
  - hot-seat: '📎 Hot-seat на двох — Двоє грають по черзі за одним компʼютером: після ходу чи втраченого життя керування переходить до суперника, у кожного свої фігури чи життя й очки. Знак «чий хід» — елемент
      «Індикатор режиму»; завіса між ходами, щоб не підглядати, — вікно «Передай пристрій».'
  - turn-enforcement: '🌱 Заборона позачергового ходу [chess] @rule(input?turn_of>block) — Ходити може лише та сторона, чия черга: спроба взяти чужу фігуру чи сходити двічі поспіль блокується з поясненням.'
  - move-timer:
      title: Таймер ходу / шаховий годинник
      description: Кожна сторона має свій час на хід (або на всю партію); годинник іде лише в того, хто ходить; скінчився — поразка цієї сторони.
      kind: rule
      games:
      - chess
      coin: tin
      amount: 1.0
      max_count: 1
      slots:
      - key: per_move
        label: На хід
        type: int
        unit: секунд
        required: true
      rule:
        when:
          kind: turn_start
        then:
        - kind: timer
      status: active
  - ai-opponent: '📎 AI-суперник [chess] — Компʼютер грає за цілу сторону в покроковій грі — шахи, шашки, хрестики-нулики, реверсі: щоходу обирає один хід серед усіх дозволених ходів своїх фігур. Сімʼя за
      силою: випадковий → жадібний → minimax. Вороги, що самі ходять полем (привиди Pac-Man, танки Battle City), — не сюди: це рух сутності — «Випадкове блукання», «Погоня за гравцем», «AI в реальному часі»
      в «Сутностях».'
    children:
    - ai-random: '📎 Випадковий AI-суперник [chess] — Суперник-компʼютер ходить випадковим дозволеним ходом — найпростіший, але чесний ШІ: правил він не порушує. Ворог на полі, що щотіку йде навмання, —
        «Випадкове блукання».'
    - ai-greedy: 🥉 Жадібний AI-суперник [chess] — Суперник-компʼютер перебирає свої ходи й обирає той, що дає найбільше одразу (взяти найдорожчу фігуру), не думаючи на хід уперед. Ворог на полі, що щотіку
        робить крок до гравця, — «Жадібна (крок у бік цілі)» в «Погоні за гравцем».
    - ai-minimax:
        title: AI-суперник з minimax
        description: Суперник-компʼютер дивиться на кілька ходів уперед за себе й за тебе (minimax, краще з альфа-бета) і обирає найкращий; глибина — параметр заявки.
        games:
        - chess
        coin: gold
        amount: 1.0
        max_count: 1
        slots:
        - key: depth
          label: Глибина
          type: int
          unit: ходів
          required: true
        status: active
  - pass-turn: 🌱 Пас, коли нема ходів @rule(no_moves>pass_turn) — Сторона, якій нема куди ходити, пропускає хід — і хід переходить до суперника, гра не зависає (Reversi, Ataxx, го).
  - repetition-draw: 📎 Нічия повторенням позиції [chess] @rule(turn_end>draw) — Партія закінчується нічиєю, коли позиція повторилась утретє або 50 ходів ніхто нікого не брав; гра памʼятає історію позицій
      (шахи, ко в го).
  - garbage-attack: '🥉 Сміття на поле суперника @rule(pattern>spawn_at) — У грі на двох полях успіх одного шкодить другому: прибрав кілька рядів чи ланцюг — у суперника знизу виростають рядки сміття з дірою
      (Tetris, Puyo Puyo); власним успіхом можна погасити сміття, що летить до тебе. Самі два поля — «Два поля одночасно».'
  - simultaneous-versus: 🥈 Два поля одночасно — Двоє грають одночасно, кожен на своєму полі на одному екрані з однаковими умовами (той самий seed); перемагає, хто швидше впорався чи довше протримався (Puyo
      Puyo, Tetris versus).
  - async-multiplayer: '🥈 Хід поштою 🗄️ — Letterpress, Words With Friends: партія триває днями, нотифікації про хід.'
  - online-multiplayer: '🥇 Онлайн-партія — Двоє грають одну партію з різних компʼютерів: ходи йдуть через сервер чи сокет, стан в обох однаковий — живо або заочно, коли партія лежить на сервері й суперник
      ходить, щойно зайде. Лобі — вікно «Лобі мультиплеєра»; переслати позицію рядком без сервера — «Стан гри як рядок-код».'
  - local-two-players: '📎 Двоє гравців одночасно [battle-city] — Двоє грають разом на одному полі й одній клавіатурі — WASD і стрілки: кооператив у Battle City, дуель у Tron; у кожного свої життя й очки
      на екрані.'
  program:
  - command-program: '🥉 Програма команд для сутності 🗄️ — Karel, Lightbot: список команд виконується після запуску.'
  - user-procedures: 🥈 Власні процедури/функції — Гравець оголошує власну процедуру з команд і викликає її з головної програми (P1/P2 у Lightbot, F1–F5 у RoboZZle); рекурсія — коли процедура викликає сама
      себе.
  - sensor-predicates: '🥉 Сенсори-умови — У програмі гравця є умови-сенсори — «попереду стіна», «на клітині фішка», колір під ногами — і розгалуження за ними: та сама програма проходить різні поля (Karel,
      RoboZZle).'
  - step-execution: 📎 Покрокове виконання з підсвіткою команди @element — Програму можна виконувати по кроку, ставити на паузу й міняти швидкість; поточна команда підсвічена (Lightbot, Karel).
  - fsm-program: '🥉 Програма як скінченний автомат — Програма гравця — не список команд, а таблиця станів: «у стані A, якщо попереду стіна, — поворот і стан B» (Kara); робот виконує таблицю, доки не дійде
      до стану «стоп», і поточний стан видно. Сенсори — «Сенсори-умови», список команд — «Пишу програму команд».'
  save:
  - save-game: 🥈 Збереження гри — Вийшов посеред рівня — потім продовжуєш з того самого місця. Основа — «Збереження в один слот»; поверх неї — «Кілька слотів збереження» й «Автосейв»; рекорди й пройдені
      рівні — «Збереження рекордів і прогресу».
    children:
    - save-single-slot: 🥈 Збереження в один слот — Стан гри — поле, сутності, рахунок, життя, рівень — пишеться у файл, і після перезапуску гра продовжується з того самого місця; новий сейв перезаписує
        старий. Викладач зберігає, закриває гру, відкриває знову й грає далі.
    - save-multi-slot: '📎 Кілька слотів збереження — Поверх «Збереження в один слот»: сейвів кілька, у кожного дата й рівень, гравець обирає, який завантажити чи перезаписати. Список слотів на екрані —
        вікно «Збереження і завантаження».'
    - save-autosave: '📎 Автосейв — Поверх «Збереження в один слот»: гра зберігається сама, без кнопки, — при виході, після рівня чи кожні N ходів — і на старті пропонує продовжити; закрив вікно хрестиком
        — нічого не втратив.'
  - save-progress: '📎 Збереження рекордів і прогресу — Рекорди, відкриті й пройдені рівні лишаються після перезапуску гри (файл): викладач закриває гру, відкриває знову — і все на місці. Продовжити перервану
      партію — «Збереження в один слот».'
  score:
  - event-points: '🌱 Очки за події @rule(contact>score) — Гра рахує очки: кожна подія має свою ціну, і її видно в правилі («ТО очки +10») — зʼїв точку, збив танк, дійшов до домівки; рахунок видно на екрані.'
  - combo-multiplier: '📎 Комбо-серії [pac-man] @rule(contact>score+multiplier) — Серія подій без перерви множить очки: кожен наступний привид за один енерджайзер дає вдвічі більше (200 → 400 → 800 → 1600
      у Pac-Man), вишні поспіль у Mr. Do!; серія обірвалась — множник скинувся. Збіги, що самі тривають після ходу, — «Каскад і ланцюг».'
  - time-bonus: 🌱 Бонус за час @rule(level_end?timer>score) — Наприкінці рівня залишок часу перетворюється на очки — що швидше пройшов, то більше; бонус видно в підсумку рівня.
  - score-records: '📎 Рекорд #lab2 — Гра памʼятає найкращий результат (очки, час, ходи), показує його поруч із поточним і каже, коли побито. Щоб рекорд пережив перезапуск гри — «Збереження рекордів і прогресу»;
      таблиця з іменами — вікно «Таблиця рекордів».'
  - chain-reaction:
      title: Каскад і ланцюг
      description: Після того як поле осіло, нові збіги зникають самі, без ходу гравця, і так доки є що прибрати; кожен крок каскаду множить очки (Puyo Puyo, match-3); слот — множник.
      kind: rule
      coin: bronze
      amount: 1.0
      max_count: 1
      slots:
      - key: multiplier
        label: Множник за крок
        type: text
      rule:
        when:
          kind: settled
        cond:
        - kind: chain
        then:
        - kind: clear
        - kind: multiplier
      status: active
  - extra-life-threshold:
      title: Життя за пороги очок
      description: Кожні N очок гравець отримує додаткове життя, і лічильник життів помітно зростає (Pac-Man, Frogger); слот — поріг.
      kind: rule
      coin: wood
      amount: 1.0
      max_count: 1
      slots:
      - key: every
        label: Кожні N очок
        type: int
        required: true
      rule:
        when:
          kind: counter
        then:
        - kind: lives
      status: active
  - leftover-penalty: 🌱 Штраф за залишок @rule(level_end>score) — Наприкінці партії гравець втрачає очки за все, що не встиг викласти чи заповнити (Blokus, Scrabble, Azul).
  - escalating-kill-points: 🌱 Очки подвоюються в серії [pac-man] 🗄️ — 200 → 400 → 800 → 1600 за одну серію.
  - elapsed-timer: '🌱 Секундомір партії — Гра міряє час від першого ходу до перемоги чи поразки: секундомір видно на екрані, на паузі він стоїть, на фініші зупиняється, а результат іде в підсумок і рекорд.
      Відлік до нуля — «Вичерпано час», залишок часу в очки — «Бонус за час».'
  waves:
  - enemy-waves:
      title: Хвилі ворогів
      description: 'Вороги йдуть хвилями за розкладом рівня: у кожної хвилі свій склад і пауза перед нею, остання — велика фінальна; номер хвилі видно на екрані. Перемога після останньої — «Протриматись
        усі хвилі», смужка — «Смужка прогресу хвиль», поява поодинці за годинником — «Спавн за розкладом».'
      kind: rule
      games:
      - pvz-lite
      coin: bronze
      amount: 1.0
      max_count: 1
      slots:
      - key: waves
        label: Хвиль
        type: int
        required: true
      - key: final_wave
        label: Фінальна хвиля
        type: bool
      rule:
        when:
          kind: wave_start
        then:
        - kind: spawn_at
      status: active
  - reinforcements: 🌱 Підкріплення [battle-city] @rule(destroyed>spawn_at) — Знищив ворога — з точки появи виходить наступний, доки не скінчиться запас (лічильник «ворогів лишилось» видно на екрані). Поява
      за годинником — «Спавн за розкладом».
  - progress-acceleration: '🌱 Гра пришвидшується @rule(counter>speed) — Темп сам росте по ходу гри, щойно лічильник дійшов до порога: змійка швидшає з довжиною, Blinky в Pac-Man — коли точок лишилось мало;
      у правилі — «лічильник ТО швидкість». Рівні, що відрізняються лише числами (на кожному наступному швидше), — «Та сама мапа, інші числа».'
  win:
  - collect-all: 🌱 Зібрати все @(all_gone>) — Зібрано все, що лежало на рівні — точки в Pac-Man, золото в Lode Runner, призи, — і далі перемога, наступний рівень або відчиняється вихід (тоді сам вихід —
      «Дійти до фінішу»). Зібрати лише N — «Зібрати квоту».
  - collect-quota:
      title: Зібрати квоту
      description: Зібрав потрібну кількість предметів (12 алмазів у Boulder Dash) — відчиняється вихід чи рівень пройдено; скільки ще лишилось, видно на екрані. Скільки — параметр заявки; зібрати все,
        що лежить на рівні, — «Зібрати все», набрати очки — «Набрати N очок».
      games:
      - boulder-dash
      coin: wood
      amount: 1.0
      max_count: 1
      slots:
      - key: quota
        label: Квота
        type: int
        required: true
      rule:
        when:
          kind: counter
        then:
        - kind: set_state
      status: active
  - reach-exit: 🌱 Дійти до фінішу @(enter>win) — Гравець дійшов до клітини виходу — перемога чи наступний рівень. Якщо вихід спершу зачинений, у правилі умова «Вихід у стані «відчинений»», а відчиняє його
      інше правило («Зібрати все», «Знищити всіх ворогів», «Зібрати квоту»).
  - destroy-all-enemies: 🌱 Знищити всіх ворогів @(all_gone>) — Рівень пройдено, коли не лишилось жодного ворога — ні на полі, ні серед тих, що мали ще зʼявитись (усі 20 танків етапу в Battle City).
  - all-on-targets: 🌱 Усі обʼєкти на цілях [sokoban] @(all_on>) — Рівень пройдено, щойно кожен ящик стоїть на цільовій клітині (Sokoban); гра помічає це сама одразу після ходу.
  - satisfy-constraints: 📎 Пазл розвʼязано [paper-puzzles, minesweeper] @(all_constraints_met>win) — Гра сама помічає, що всі обмеження виконано (чи всі безпечні клітини відкрито), і оголошує перемогу —
      без кнопки «Перевірити».
  - checkmate: 🥇 Мат [chess] @(no_moves?in_check>win) ⭐ — Король під шахом, і жодного ходу, що рятує, нема — гра сама оголошує мат і переможця. Пат (шаху нема, ходів нема) — «Пат — нічия».
  - home-slots: '📎 Заповнити N домівок по разу [frogger] @(enter?state>set_state) — На фініші кілька домівок, і кожну треба зайняти по разу: заповнив усі — рівень пройдено, стрибок у вже зайняту — смерть
      (Frogger).'
  - keep-playing-after-win: 🌱 Грати далі після перемоги [2048] @(spawned?first_time>window) — Після першої перемоги гра показує вікно з вибором — завершити чи грати далі на тому ж полі (2048 після плитки
      2048).
  - survive-waves: '🌱 Протриматись усі хвилі [pvz-lite] @(wave_cleared>win) — Відбив останню хвилю — перемога рівня (PvZ, tower defense): гра знає, скільки хвиль, і показує, яка зараз. Протриматись N секунд
      — той самий задум, але за лічильником часу.'
  - score-target: 🌱 Набрати N очок @(counter>win) — Рахунок дійшов до цілі — перемога чи наступний рівень; ціль видно на екрані поруч із рахунком. Зібрати N предметів — «Зібрати квоту».
  - n-in-a-row-win: 📎 Перемога лінією з N — Після кожного ходу гра перевіряє, чи склалась лінія з N своїх фішок поспіль — по горизонталі, вертикалі чи діагоналі — і оголошує переможця, підсвітивши лінію
      (хрестики-нулики — 3, «4 в ряд» — 4, гомоку — 5). Лінія, що зникає й дає очки, — «Лінія з N однакових зникає».
levels:
  bank:
  - level-bank: 🥉 Банк рівнів із прогресом — Десятки рівнів (свої чи імпортовані колекції) зібрано в набори; для кожного гра веде статус «розвʼязано / ні» і найкращий результат і оновлює їх одразу після
      розвʼязання. Список на екрані — вікно «Вибір рівня»; щоб прогрес пережив перезапуск, — «Збереження рекордів і прогресу».
  - daily-puzzle: 📎 Щоденний пазл — Щодня — новий пазл, однаковий для всіх, бо генерується з дати як seed; розвʼязаний день позначається. Календар днів — тип вікна «Календар пазлів дня».
  - level-rating: 📎 Рівні за складністю — Кожен рівень банку має позначку складності («легкий / середній / важкий» чи 1–5), і список рівнів сортується й фільтрується за нею. Позначку можна поставити вручну
      в заголовку файла («Метадані рівня»), обчислити програмою — «Оцінка складності пазла».
  - level-par: 📎 Зірки за рівень — У рівня є ціль — скільки ходів чи секунд досить; після перемоги гра дає 1–3 зірки залежно від того, наскільки близько до цілі, і найкращі зірки видно в списку рівнів.
      Рекорд усієї гри — «Рекорд».
  editor:
  - editor-palette: '🌱 Палітра елементів — Поруч із полем редактора — панель з усіма елементами рівня (стіна, ящик, ворог…): клік чи цифра обирає, що ставити, а обраний підсвічено.'
  - in-game-editor: '🥈 Редактор у грі — Рівень можна зібрати в самій грі: курсором чи мишею ставиш елементи на клітини, відкриваєш наявний рівень для правки й зберігаєш у файл, який гра потім грає як звичайний.
      Екран редактора — вікно «Вікно редактора рівнів»; панель елементів, гумка, інструменти, undo, плейтест — сусідні картки «Редактора».'
  - editor-draw-tools: '🥉 Інструменти малювання — Крім клітини за клітиною — прямокутник, лінія й заливка: вказав два кути чи протягнув мишею — заповнилась уся смуга чи область, а заливка міняє цілу звʼязну
      ділянку одного типу.'
  - editor-map-check: '📎 Перевірка мапи редактором — Редактор не зберігає рівень із помилкою й каже, що не так: нема гравця, ящиків більше, ніж цілей, вихід недосяжний — проблемні клітини підсвічено. Сам
      обхід «чи дійде» — «Перевірка досяжності»; повідомлення на битому файлі — «Валідація мапи».'
  - editor-erase: 🌱 Гумка — Правий клік чи гумка з панелі прибирає елемент із клітини — лишається порожня підлога.
  - level-exchange: 📎 Обмін рівнями — Рівень, зібраний у редакторі, вивантажується одним файлом, а чужий файл завантажується через меню гри (вибір файла) і зʼявляється у списку рівнів. Обмін через сервер
      — картка лаби 5.
  - editor-undo: '🥉 Undo/redo — Скасування й повернення дій у редакторі рівнів: поставив не те — Ctrl+Z. Скасування ходів у самій грі — «Undo/redo ходів гри».'
  - editor-playtest: 📎 Плейтест — Кнопка «Грати» в редакторі запускає рівень, який зараз на полі, без збереження у файл; вийшов із гри — повернувся в редактор із тим самим рівнем.
  format:
  - level-from-txt: '📎 Рівні з файлів #lab2 — Рівні лежать окремими файлами (символьна мапа txt, JSON), гра читає їх парсером; новий рівень — новий файл, без зміни коду.'
  - import-open-formats: 🥉 Імпорт відкритих форматів — Гра відкриває рівні в чужому відкритому форматі, як вони лежать в інтернеті, — колекції Sokoban у .xsb, судоку рядком із 81 цифри, шахові позиції у
      FEN — і грає їх без ручної переробки. Свій формат — «Рівні з файлів».
  - map-validation: '📎 Валідація мапи — Битий файл рівня не валить гру: замість трасування Python — зрозуміле повідомлення, що не так і де («рядок 3: невідомий символ Q», «ящиків 4, цілей 3»), і гра повертається
      в меню. Те саме в редакторі перед збереженням — «Перевірка мапи редактором».'
  - level-metadata: 🌱 Метадані рівня — У файлі рівня, крім мапи, є заголовок — назва, автор, складність, — і гра показує їх у списку рівнів чи перед рівнем.
  - level-objects-format: 🥉 Рівень з обʼєктами й параметрами — У файлі не лише мапа символів, а й сутності з параметрами — маршрут патруля, таймер, вміст скрині (JSON чи YAML).
  - level-format-doc: 🌱 Формат рівня описано — У README є таблиця символів і полів формату рівня — інша людина робить новий рівень, не відкриваючи код.
  generation:
  - maze-generation:
      title: Генерація лабіринту
      description: Гра сама будує лабіринт, де з кожної клітини можна дійти до будь-якої іншої, — щоразу інший; алгоритм (DFS із поверненням, Прима) — у параметрі заявки. Кімнати з коридорами — «Генерація
        підземель», лабіринт зі зібраних вручну шматків — «Рівень зі шматків».
      tags:
      - algo
      coin: gold
      amount: 1.0
      max_count: 1
      slots:
      - key: algo
        label: Алгоритм
        type: choice
        options:
        - dfs
        - prim
      status: active
  - mines-after-first-click: 📎 Розкидання мін після першого кліку [minesweeper] @rule(input?first_time>spawn_at) — Міни розкладаються не на старті, а після першого кліку — повз клітину кліку (часто й повз
      її сусідів, щоб одразу відкрилась область), тож перший клік ніколи не програє. Розкладка, яку можна розвʼязати без вгадування, — «Генерація без вгадування».
  - dungeon-generation:
      title: Генерація підземель
      description: Гра сама будує підземелля — кімнати й коридори між ними чи печери, — і з будь-якої кімнати можна дійти до сходів чи виходу; алгоритм (кімнати, BSP, клітинний автомат, «пʼяний шукач»)
        — у параметрі заявки.
      tags:
      - algo
      coin: gold
      amount: 1.0
      max_count: 1
      slots:
      - key: algo
        label: Алгоритм
        type: choice
        options:
        - rooms
        - bsp
        - cellular
        - drunkard
        required: true
      status: active
  - seed-share: 📎 Показати/ввести seed рівня — Згенерований рівень має seed, який видно й можна ввести, — той самий рівень зʼявиться в друга (Hexcells Infinite, роглайки).
  - unique-puzzle-generation: 👑 Генерація пазла з унікальним розвʼязком [paper-puzzles] ⭐ — Головне золото пазл-гілки.
  - infinite-field: 🥇 Нескінченне поле вперед [frogger] ⭐ — Генерація на льоту (Crossy Road).
  - difficulty-rating: '🥇 Оцінка складності пазла [paper-puzzles] ⭐ — Програма оцінює, наскільки пазл важкий: розвʼязує його людськими прийомами від простих до складних (єдиний кандидат, приховане одиночне,
      пари) і ставить складність за найважчим потрібним; оцінку видно біля пазла. Показати її в списку й сортувати — «Рівні за складністю».'
  - no-guess-generation: '🥇 Генерація без вгадування [minesweeper] ⭐ — Розкладка мін, яку можна розвʼязати лише логікою (Hexcells, Kaboom, Tatham Mines): генератор перевіряє розкладку розвʼязувачем.'
  - random-placement: '📎 Випадкова розстановка на готовій мапі — Рівень щоразу інший: на готовій мапі гра розкидає цеглу, предмети й ворогів по вільних клітинах — не на старті гравця й не замурованими (цегла
      в Bomberman). Одна сутність, що зʼявляється у випадковій клітині за правилом (їжа в Snake, плитка в 2048), — «Спавн у випадковій клітині».'
  - chunk-generation: 🥈 Рівень зі шматків — Генератор складає рівень із заготовлених вручну кімнат чи смуг (Spelunky, Crossy Road) так, що стики прохідні й до виходу можна дійти. Якщо шматки дописуються
      без кінця на ходу — це ще й «Нескінченне поле вперед».
  progression:
  - sequential-levels: 📎 Кілька рівнів по черзі — Щонайменше два різні рівні, зроблені вручну, ідуть один за одним; перехід — правило «ТО наступний рівень».
  - level-unlock: 📎 Розблокування — У списку рівнів непройдені закриті замком; пройшов рівень — відкрився наступний, а в будь-який відкритий можна зайти знову. Щоб відкриті рівні пережили перезапуск, —
      «Збереження рекордів і прогресу».
  - checkpoint: 📎 Checkpoint @rule(enter>set_state) — Дійшов до прапорця — він стає активним, і після смерті гравець зʼявляється на ньому, а не на старті рівня. Саме відродження — «Респавн»; збереження
      у файл — «Збереження гри».
  - world-map: '🥉 Мапа світу з вузлами-рівнями — Рівні складаються в граф (світи, гілки): пройдений відкриває сусідні, порядок можна обирати; показують його у вікні вибору рівня чи карти.'
  - stairs-levels: '📎 Поверхи через сходи — Рівні — поверхи: сходи ведуть униз і вгору, і на відвіданий поверх можна повернутись у тому стані, як лишив (або гра генерує його знову) — роглайки, Magic Tower.'
  - difficulty-curve: 📎 Крива складності — Щонайменше 5 рівнів, зроблених вручну, де кожен вводить один новий елемент чи ускладнює знайомий; у заявці — список «рівень → що нового», а перший рівень вчить
      без тексту.
  - secret-level: '🌱 Секретний рівень — Рівень поза звичайною чергою: відкривається особливою дією — прихований прохід, усі зірки, код. Регулярний бонус-етап між рівнями — «Бонусний рівень».'
  - level-param-ramp: '📎 Та сама мапа, інші числа — Рівні відрізняються не мапою, а параметрами: на кожному наступному швидші вороги, коротший бонус, більше ворогів (Pac-Man, Frogger), після останнього
      — по колу, але важче. У «Рівнях» видно таблицю параметрів за рівнями; темп, що росте всередині рівня, — «Прискорення прогресу».'
  - bonus-stage: '🌱 Бонусний рівень — Регулярно між звичайними рівнями — особливий: без ворогів чи з невразливістю, лише набрати очок за обмежений час (бонус-етап Bomberman після кожного 5-го, інтермісії
      Boulder Dash). Видно, що це бонус, і програш нічого не забирає.'
  - extra-level: '🌱 Ще один рівень 🔁5 — Кожен новий рівень, зроблений вручну, понад перші два (їх оплачує «Кілька рівнів по черзі»): своя мапа й задум, а не копія з переставленою стіною. Заявка — на кожен
      рівень окремо.'
  solvability:
  - reachability-check: 🥇 Перевірка досяжності ⭐ — Чи існує шлях до всіх цілей (flood fill / BFS).
  - level-solver:
      title: Розвʼязувач
      description: Гра сама знаходить розвʼязок рівня — ходи від старту до перемоги — і показує його чи підказує наступний хід; шукає перебором станів поля (BFS, A*, бектрекінг, поширення обмежень — у параметрі
        заявки). Шлях до клітини на незмінному полі — «Пошук шляху BFS / A*».
      tags:
      - algo
      coin: gold
      amount: 1.0
      max_count: 1
      slots:
      - key: algo
        label: Алгоритм
        type: choice
        options:
        - bfs
        - astar
        - backtracking
        - propagation
        required: true
      status: active
  - unsolvable-states: 🥇 Виявлення нерозвʼязних станів [sokoban] ⭐ 🗄️ — Deadlock під час гри.
interface:
  graphics:
  - movement-animation: 🥉 Анімація руху — Сутності не перескакують з клітини в клітину, а плавно їдуть за кілька кадрів (плитки 2048, ящик у Sokoban, танк); логіка гри лишається покроковою по клітинах.
  - event-effects: '📎 Ефекти подій — Короткий кадровий ефект на подію: спалах, вибух, відкриття дверей; смерть і поява сутності — свої картки, система часток — «Частинки».'
  - idle-animation: '📎 Анімація очікування — Сутності, що стоять на місці, «живуть»: спрайт по таймеру перемикає 2–4 кадри чи злегка пульсує — моргання, покачування, дихання (рослини PvZ).'
  - particles: '🥉 Частинки — На подію вилітає купка дрібних часток — іскри, дим, конфеті: кожна летить своїм напрямом, сповільнюється й гасне, і гра при цьому не гальмує. Одноразовий спалах чи вибух кадрами
      — «Ефекти подій».'
  - spawn-animation: '📎 Поява з анімацією — Нова сутність не виникає миттєво: кілька кадрів мерехтить чи проступає (зірочка появи танка в Battle City), і лише потім рушає. Де й коли вона зʼявляється — картки
      «Поява» в «Сутностях».'
  - death-animation: '📎 Анімація смерті — Загиблий не зникає миттєво: кілька кадрів вибуху, падіння чи згасання (Pac-Man згортається), і лише потім прибирається з поля. Сама загибель — картки «Зникнення
      і смерть» у «Сутностях».'
  - window-transition: '📎 Анімація переходу між вікнами — Вікна не перемикаються миттєво: старе згасає чи відʼїжджає, нове проявляється за кілька кадрів, і на цей час ввід не діє — у всіх переходах гри.
      Ефект на ігрову подію — «Ефекти подій».'
  hud:
  - status-panel: 📎 Панель стану — Смуга чи бічна панель на ігровому екрані показує кілька показників гри разом — життя, очки, час, рівень, запас бомб — і оновлюється щоходу. Лічильник цілей і лічильник
      ходів — окремі картки.
  - goal-counter: '🌱 Лічильник цілей — Скільки лишилось зібрати, знищити чи знайти: точок, ворогів, мін (міни − прапорці).'
  - mode-indicator: '🌱 Індикатор режиму — Помітний на екрані знак режиму, що діє зараз: чий хід (шахи, гра вдвох), енерджайзер — привиди сині (Pac-Man), бонус-щит над танком. Перемикач ручки й олівця в
      судоку — частина «Олівцевих нотаток».'
  - highlights: '📎 Підсвітки на полі — Сімʼя підсвіток на полі: виділена клітина, легальні ходи, конфлікти, останній хід, досяжні клітини, зона ураження, намір ворога, шлях. Кожна підсвітка — окрема заявка.'
    children:
    - selection-highlight: 🌱 Виділена клітина/фігура — Обрана фігура чи клітина виділена рамкою або кольором, доки не зробиш хід чи не скасуєш вибір.
    - conflict-highlight: 🌱 Конфлікти розмітки [paper-puzzles] — Клітини, що порушують правило пазла (дві однакові цифри в рядку), одразу підсвічуються червоним; саму перевірку рахує «Валідність розмітки».
    - last-move-highlight: 🌱 Останній хід суперника — Звідки й куди щойно сходив суперник — обидві клітини підсвічені, щоб його хід було видно (шахи, шашки, реверсі).
    - legal-move-highlight: 📎 Підсвітка легальних ходів — Обрав фігуру — підсвічуються всі клітини, куди вона може піти за правилами (шахи, шашки; у реверсі — куди можна поставити фішку). Чи хід дозволений,
        вирішують правила ходу; тут — перебрати клітини й показати їх.
    - reachable-highlight: 🥉 Досяжні клітини за хід — Після вибору юніта підсвічуються всі клітини, куди він дійде за цей хід з урахуванням перешкод (тактики, Into the Breach).
    - threat-range: 📎 Зона ураження ворога — Клітини, які бʼє ворог (куди дістане постріл чи удар), позначені на полі — видно, куди ставати небезпечно.
    - telegraph-marker: 🌱 Куди вдарить ворог наступного ходу — Перед ходом ворога на полі позначено, куди він вдарить чи піде наступного ходу, — гравець встигає відійти (Into the Breach). Що ворог обирає
        дію наперед — «Ворог оголошує хід наперед»; усі клітини, які ворог може бити взагалі, — «Зона ураження ворога».
    - path-preview: 📎 Превʼю шляху до цілі — Перед рухом на полі намальовано шлях, яким сутність піде до обраної клітини (клік у Lines, підказка в лабіринті); змінив ціль — шлях перемалювався.
  - move-counter: 🌱 Лічильник ходів — Ходи (за потреби окремо поштовхи) на ігровому екрані; рахуються лише ходи, що відбулись.
  - remaining-counter: '🌱 Лишилось: мін/точок/ворогів [minesweeper, pac-man] 🗄️'
  - next-queue: 🌱 Черга наступних фігур/плиток — Поруч з полем видно одну чи кілька наступних фігур або кольорів, що зʼявляться (next у Tetris, превʼю кульок у Lines).
  - pocket: '📎 Рука/взяті фігури [chess] 🗄️ — Сьоґі, Crazyhouse, Hive: панель фігур поза полем.'
  - message-log: '📎 Журнал подій — Рядок чи список під полем, куди гра пише, що сталось за хід: «Ви зʼїли яблуко», «Щур кусає» (роглайки); самі повідомлення пишуть правила ефектом «повідомлення».'
  - objective-text: 🌱 Поточна ціль словами — Рядок на ігровому екрані каже, що зараз треба зробити («Збери 12 алмазів», «Дійди до виходу»), і змінюється, коли змінилась ціль.
  - popup-text: 🌱 Спливний текст над клітиною @rule(contact>score+message) — Над клітиною події на мить спливає текст — «+100», «Combo ×3», шкода — і зникає.
  - push-counter: 🌱 Лічильник поштовхів [sokoban] 🗄️ — Окремо від лічильника ходів.
  - face-button: 🌱 Смайлик стану з рестартом [minesweeper] — Кнопка-смайлик над полем показує стан гри — граю, виграв, програв — і по кліку починає заново (Minesweeper); сам рестарт рахує «Рестарт рівня
      з початку».
  - wave-progress: 🌱 Смужка прогресу хвиль [pvz-lite] — Смужка на ігровому екрані показує, скільки рівня пройдено й коли наступна хвиля, з прапорцями на великих хвилях (PvZ); заповнилась — рівень відбито.
  - health-bars: '🌱 Смужка здоровʼя — Над сутністю (у боса — вгорі екрана) смужка, що коротшає з кожним ударом: видно, скільки HP лишилось. Саме здоровʼя — параметр «HP»; життя гравця числом — «Панель стану».'
  input:
  - keyboard-controls: 🥉 Керування клавіатурою 🗄️ — Рух, дії, перепризначення клавіш.
  - cell-click: 🌱 Клік по клітині [minesweeper, pvz-lite] 🗄️ — Базова курсорна дія.
  - hover-highlight: 🌱 Підсвітка клітини під курсором — Клітина під мишкою чи курсором клавіатури підсвічується ще до дії.
  - drag-drop-piece: 🥉 Drag-n-drop фігури [chess] 🗄️ — Перетягнути на легальну клітину.
  - pencil-marks: '🥉 Олівцеві нотатки [paper-puzzles] @rule(input?mode>mark) — Поруч із ручкою є олівець: у режимі олівця цифра лягає в клітину дрібним кандидатом (кілька в одній клітині), у режимі ручки
      — відповіддю; перемикач режиму видно на екрані.'
  - chord-click: 📎 Акорд-клік [minesweeper] @rule(input?adjacent_count>reveal) — Клік (обома кнопками чи середньою) по відкритому числу, біля якого вже стоїть стільки ж прапорців, відкриває решту його сусідів;
      прапорців менше — нічого не стається (Minesweeper).
  - swipe-gestures: '📎 Жести мишею чи пальцем — Хід жестом: тягнеш у бік — гра визначає напрям за порогом; клавіші не потрібні.'
  - path-drawing: '📎 Малювання шляху drag-ом 🗄️ — Flow Free, Cosmic Express, LYNE, Puzzle & Dragons: шлях по сусідніх клітинах.'
  - path-cut: '📎 Відкат шляху до клітини — Намальований шлях можна вкоротити: повернення по ньому стирає хвіст, а перетин чужої лінії обриває її (Flow Free).'
  - multi-select: 📎 Виділення кількох клітин [paper-puzzles] — Кілька клітин можна виділити разом — протягуванням чи з Ctrl — і одним натисканням ввести цифру чи зафарбувати всі (SudokuPad).
  - edge-marking: 📎 Розмітка ребер [paper-puzzles] — Клік ставить чи прибирає лінію на ребрі між клітинами, а ще один — хрестик «тут лінії нема» (Slitherlink, Masyu).
  - dot-mark: '🌱 Позначки-нагадування на клітині [minesweeper, paper-puzzles] @rule(input>mark) — Прапорець, «?», крапка: ставляться й перебираються по колу однією кнопкою; перевірка розвʼязку їх не враховує.'
  - flag-cycle: 🌱 Правий клік по колу [minesweeper] 🗄️ — Прапорець → знак питання → порожньо.
  - flood-reveal:
      title: Каскадне відкриття нулів
      description: Клік по клітині без сусідніх мін відкриває всіх сусідів, а від кожного нового нуля — далі, доки не впреться в числа (Minesweeper). Слот — 4 чи 8 сусідів.
      kind: rule
      games:
      - minesweeper
      coin: bronze
      amount: 1.0
      max_count: 1
      slots:
      - key: neighborhood
        label: Сусідство
        type: choice
        options:
        - '4'
        - '8'
        required: true
      rule:
        when:
          kind: input
        cond:
        - kind: adjacent_count
        then:
        - kind: fill
      status: active
  menus:
  - main-menu: '📎 Головне меню #window — Перший екран гри з пунктами — грати, інші вікна (рівні, налаштування, рекорди), вихід; кожен пункт веде туди, куди написано. У консолі досить вибору номером.'
  - pause-menu: '📎 Пауза-меню #window — Поверх зупиненої гри — пункти «Продовжити», «Почати рівень заново», «Головне меню»; продовжив — усе рушає з того самого місця. Саму зупинку гри рахує «Пауза».'
  - confirm-dialog: '🌱 Діалог підтвердження #window — Перед незворотною дією — вийти без збереження, почати заново, стерти збереження — питання «Ви впевнені?» з «Так» і «Ні»; «Ні» повертає все як було.'
  - level-select: '📎 Вибір рівня #window — Список чи сітка рівнів, біля кожного — статус: пройдено, закрито, зірки чи найкращий результат; обраний рівень запускається. Сам облік статусів — «Розблокування»
      чи «Банк рівнів із прогресом».'
  - end-screen: '📎 Екран перемоги/поразки #window — Після перемоги чи поразки — що сталось, підсумок партії (очки, час, ходи) і куди далі: «Ще раз», «Наступний рівень», «Меню». Перемога й поразка можуть
      бути двома вікнами цього типу; аркадне «Продовжити?» з відліком — свій тип.'
  - game-screen: '🌱 Ігровий екран #window — Головне вікно з полем гри; рендер, камера, туман — картки поля, HUD і кнопки — елементи цього вікна.'
  - splash-screen: '🌱 Заставка/лого #window — При запуску — екран з назвою гри й логотипом (картинка чи ASCII-арт), що зникає сам за кілька секунд чи з клавіші. Екран перед кожним рівнем — «Заставка рівня».'
  - settings-window: '📎 Вікно налаштувань #window — Вікно, де зібрані налаштування гри, з поверненням туди, звідки його відкрили; кожен перемикач у ньому — окрема картка сімʼї «Елементи налаштувань».'
  - shop-window: '📎 Вікно магазину #window — Вітрина: товари з ціною й описом, на що не вистачає — сіре, після покупки видно новий баланс. Що купівля дає і звідки гроші — «Магазин між рівнями», «Валюта
      в раунді».'
  - help-window: '📎 Вікно довідки #window — Правила й керування всередині гри: мета, які клавіші що роблять, що означають значки на полі; відкривається з меню чи клавішею (F1) і повертає туди, звідки прийшов.
      Документ поза грою — «Інструкція гравця», картки всіх сутностей з параметрами — «Бестіарій».'
  - about-window: '🌱 Вікно «Про гру» #window — Автор, версія, подяки.'
  - custom-window: 'Нестандартне вікно #window 🔁 — Вікно поза типами; ціну і зарахування уточнює викладач.'
  - editor-window: '🥈 Вікно редактора рівнів #window — Окремий екран редактора: поле рівня, курсор, кнопки «зберегти» й «грати». Що вміє сам редактор — палітра, інструменти, гумка, плейтест — картки підзони
      «Редактор» у «Рівнях».'
  - stats-window: '🌱 Статистика гравця #window — Екран з лічильниками за всі партії: зіграно, виграно, серії, середній час. Самі дані — картка «Статистика профілю», топ результатів з іменами — «Таблиця
      рекордів».'
  - mode-select: '🌱 Вибір режиму чи складності #window — Список варіантів перед грою: класика / на час / нескінченний / versus, легко–важко.'
  - map-window: '📎 Повна карта рівня #window — Уся мапа рівня чи підземелля (досліджене) на весь екран; мінімапа — «Мінімапа/радар», мапа вибору рівнів — «Мапа світу з вузлами-рівнями».'
  - difficulty-select: '🌱 Вибір складності #window 🗄️'
  - puzzle-select: '📎 Сітка пазлів зі статусами [paper-puzzles] #window 🗄️ — Банк рівнів: розвʼязано / ні / зірки.'
  - lobby-window: '📎 Лобі мультиплеєра #window — Вікно перед мережевою грою: список гравців чи кімнат, хто готовий, кнопка «Почати» — партія стартує, коли всі зібрались. Сама мережева гра — «Онлайн-партія».'
  - tutorial-window: '📎 Покрокове навчання #window — Новачка ведуть по кроках: по одному правилу чи прийому на екран або підказки в першому рівні, де наступна зʼявляється, коли гравець зробив сказане; можна
      пропустити. Довідка, яку відкривають будь-коли, — «Вікно довідки».'
  - replay-window: '📎 Перегляд повтору / історії ходів #window — Вікно, де записану партію чи проходження переглядають: кроки вперед і назад, пауза, перехід до потрібного ходу. Сам запис — картка «Replay».'
  - codex-window: '📎 Бестіарій / енциклопедія елементів #window — Довідник сутностей гри всередині гри: на кожну — іконка, назва, що робить, параметри (HP, швидкість); ще не зустрінуті можна показувати
      силуетом (альманах PvZ, бестіарій роглайків). Правила й клавіші коротко — «Вікно довідки».'
  - achievements-window: '🌱 Вікно досягнень #window — Вікно зі списком досягнень гри («Пройди рівень без втрат», «Збери 100 монет»): отримані позначені, в решти видно умову.'
  - character-select: '🌱 Вибір персонажа / загону #window — Вікно перед грою, де обирають героя чи склад загону, і вибір змінює гру: у героїв різні параметри чи вміння. Інший вигляд без впливу на гру —
      «Вибір аватару».'
  - game-over-continue: '🌱 «Продовжити?» з лічильником #window — Після втрати останнього життя — «Продовжити?» з відліком 10…0: встиг натиснути — граєш далі з того ж рівня й рахунку (за кредит чи очки),
      ні — екран кінця гри (аркади).'
  - level-password: '🌱 Вхід на рівень за паролем #window — Вікно, де вводиш код рівня, — і гра починається з цього рівня; хибний код — повідомлення, а код наступного рівня видно після проходження (Bomberman,
      Chip''s Challenge).'
  - match-setup: '📎 Налаштування партії #window — Перед партією на одному екрані кілька налаштувань разом — хто грає за кожну сторону (людина чи AI), колір і хто починає, час, кількість раундів — і вони
      справді діють у грі. Вибір одного варіанта зі списку — «Вибір режиму чи складності».'
  - attract-demo: '📎 Демо-режим: гра грає сама #window — Поки ніхто не натискає, гра грає сама — записані ходи чи простий бот — і показує, як у неї грати; будь-яка клавіша повертає в меню (аркади Pac-Man,
      Lode Runner).'
  - placement-screen: '📎 Розстановка перед партією #window — Перед партією кожен розставляє свої кораблі чи фігури на своїй половині за правилами (не впритул, усі на місці), а суперник їх не бачить; «Готово»
      — і партія стартує (Морський бій, Stratego).'
  - pass-device: '🌱 «Передай пристрій» для hot-seat #window — Між ходами двох гравців за одним компʼютером екран закривається завісою «Хід гравця 2 — натисни клавішу», щоб суперник не побачив твоє поле
      чи руку (Морський бій, карткові). Сама гра вдвох — «Hot-seat на двох».'
  - code-editor-window: '🥉 Редактор програми #window — Екран програми: палітра команд (вперед, поворот, повтор), список-програма, куди їх додаєш, вставляєш і прибираєш, кнопки «Пуск» і «Скинути» (Lightbot,
      Karel). Як сутність виконує програму — властивість поля «Пишу програму команд», виконання по кроку — «Покрокове виконання з підсвіткою команди».'
  - level-intro: '🌱 Заставка рівня #window — Екран перед рівнем — «STAGE 3», назва печери, скільки життів; зникає сам або з клавіші.'
  - name-entry: '🌱 Введення імені для рекорду #window — Після рекорду гравець вводить імʼя — воно потрапляє в таблицю рекордів.'
  - cutscene: '📎 Інтермісія / сценка #window — Коротка сценка між рівнями без керування — як перерви в Pac-Man; пропускається клавішею.'
  - inventory-window: '📎 Вікно інвентаря #window — Окремий екран з предметами й кількістю — обрати й застосувати; сама логіка — картка «Інвентар» на сутності.'
  - save-load-window: '📎 Збереження і завантаження #window — Слоти збережень з датою й прогресом — зберегти, завантажити, стерти; сама логіка — картки «Збереження гри».'
  - dialogue-window: '🌱 Діалог / сюжетний текст #window — Репліка персонажа чи табличка поверх поля; наступна — з клавіші.'
  - calendar-window: '📎 Календар пазлів дня [paper-puzzles] #window — Місяць клітинками: на кожен день — свій пазл, розвʼязані дні зафарбовані, серію без пропусків видно; клік по дню відкриває його пазл.'
  - menu-keyboard: '🌱 Меню клавішами — Пункти меню обираються стрілками: поточний підсвічений, Enter відкриває, Esc повертає назад — однаково в усіх меню гри. Меню, де вводиш номер пункту, — це лише сам
      тип вікна.'
  - menu-mouse: '🌱 Меню мишкою — Пункти меню — кнопки: під мишкою підсвічуються, клік відкриває, «Назад» теж кнопкою; так в усіх меню гри. Клітина поля під курсором — «Підсвітка клітини під курсором».'
  render:
  - console-render: '🥉 Консольний рендер — Гра в терміналі виглядає як гра: поле перемальовується на тому самому місці без прокрутки й мерехтіння, клітини — кольорами чи емодзі рівно в сітці, поруч рядок
      стану. Просто print поля після кожного ходу — «Поле на екрані» з лаби 1.'
  - gui-render: 🥈 GUI-рендер — Поле спрайтами чи фігурами у вікні (pygame, tkinter, arcade), перемальовка кадру.
  - field-scaling: 🥉 Масштабування поля — Клітини підлаштовуються під розмір вікна, зум; мапа, більша за екран, — «Камера за гравцем».
  - player-camera: '🥉 Камера за гравцем — Мапа більша за екран: видно шматок навколо гравця, і він зсувається, коли гравець іде, не виїжджаючи за краї мапи. Зум і розмір вікна — «Масштабування поля».'
  - minimap-radar: '📎 Мінімапа/радар @element — У кутку ігрового екрана — уся мапа дрібно: стіни, гравець, рамка того, що зараз на екрані, чи вороги точками; оновлюється щокадру. Та сама мапа на весь екран
      — вікно «Повна карта рівня».'
  - fog-of-war: 🥉 Туман війни — Гравець бачить лише клітини в радіусі огляду своїх сутностей; решта темна, а вже побачене лишається на мапі блідим, без ворогів (Advance Wars, роглайки). Радіус — параметр
      «Огляд».
  results:
  - leaderboard: '📎 Таблиця рекордів #window — Вікно з таблицею кращих результатів — місце, імʼя, очки чи час: новий результат стає на своє місце, лишаються N кращих. Імʼя вводять у «Введення імені для
      рекорду», таблиця між запусками — «Збереження рекордів і прогресу».'
  - profile-stats: '📎 Статистика профілю #lab5 — Гра рахує партії за весь час — зіграно, виграно, відсоток, найдовша серія, середній час — і зберігає їх між запусками; показує вікно «Статистика гравця».
      Найкращий результат — картка «Рекорд».'
  - replay: '🥈 Запис партії й повтор — Гра записує партію — ходи чи ввід по тіках — і може програти її знову, навіть після перезапуску: сутності повторюють усе, як було. Вікно з кнопками перегляду — «Перегляд
      повтору / історії ходів», ходи текстом у нотації — «Запис ходів у нотації».'
  - share-result: 📎 Поділитись результатом — Після гри результат копіюється в буфер обміну текстом чи сіткою емодзі, щоб вставити в чат (Wordle).
  - streak-stats: 🌱 Серії й статистика щоденних 🗄️ — Streak, розподіл спроб.
  - rating-system:
      title: Рейтинг гравців
      description: 'У кожного гравця (і в кожного рівня AI) є рейтинг Elo чи Glicko: після партії переможець забирає очки в переможеного — більше, якщо суперник сильніший; рейтинги видно таблицею. Потрібні
        кілька профілів на одному компʼютері, AI-суперник з рівнями чи «Онлайн-партія».'
      coin: bronze
      amount: 1.0
      max_count: 1
      slots:
      - key: algo
        label: Алгоритм
        type: choice
        options:
        - elo
        - glicko
      status: active
  - achievements: '📎 Досягнення — У гри є список цілей поза перемогою («пройти рівень без втрат», «100 ворогів»): гра сама помічає виконання, сповіщає й памʼятає відкрите між запусками; список — вікно «Досягнення».'
  settings:
  - game-settings: 🥉 Налаштування гри @game — Складність, розмір поля, звук; збереження між сесіями.
  - theme-select: 📎 Вибір теми — У налаштуваннях перемикаєш оформлення — інший набір спрайтів, символів чи кольорів (світла й темна тема), і все поле одразу малюється по-новому; наборів щонайменше два.
      Лише інший вигляд гравця — «Вибір аватару».
  - settings-elements: '📎 Елементи налаштувань — Сімʼя елементів вікна налаштувань: гучність, музика, розмір поля, мова, аватар, клавіші. Кожен елемент — окрема заявка, і кожен справді змінює гру.'
    children:
    - volume-control: 📎 Гучність — Повзунок чи кнопки «тихіше / голосніше» в налаштуваннях, і гучність справді змінюється — ефекти й музика (за бажанням окремо). Вимкнути лише музику — «Перемикач музики».
    - music-toggle: 🌱 Перемикач музики — Увімк/вимк фонової музики.
    - avatar-picker: 🌱 Вибір аватару — Скін чи вигляд гравця без впливу на гру; герой з різними параметрами — вікно «Вибір персонажа / загону».
    - field-size-picker: 📎 Розмір поля — Ширина й висота поля (де треба — кількість мін) перед грою; поле справді будується під обране.
    - language-picker: '📎 Вибір мови — Перемикач мови в налаштуваннях: усі написи гри — меню, HUD, повідомлення — змінюються на іншу мову (щонайменше дві); тексти лежать словником чи файлом, а не розкидані
        по коду.'
    - controls-remap: 🥉 Перепризначення клавіш — У налаштуваннях обираєш дію й натискаєш нову клавішу — гра далі слухає її; дві дії на одну клавішу не стають. Рух стрілками за замовчуванням — властивість
        поля «Клавіші = рух аватара».
  sound:
  - sound-effects: 📎 Звукові ефекти подій @rule(>sound) — Короткий звук на ігрову подію — постріл, зібрав, вибух, відчинився вихід; у правилі це ефект «звук». Попередження (час добігає, шах) — «Звукові
      попередження», фонова музика — окрема картка.
  - background-music: 🌱 Фонова музика — Музика грає фоном у циклі; вимикач у налаштуваннях — «Перемикач музики».
  - sound-volume: 🌱 Застосування гучності 🗄️ — Рівень звуку реально впливає на ефекти й музику.
  - sound-warnings: '🌱 Звукові попередження @rule(counter>sound) — Звук попереджає про загрозу, що наближається: годинник тікає, коли час добігає, сигнал при шаху, сирена перед великою хвилею. Звук на звичайну
      подію — «Звукові ефекти подій».'
code:
  architecture:
  - logic-render-split: '🥉 Двіжок окремо від виводу #lab3 — Обовʼязкове в лабі 3. Клас гри нічого не друкує й не читає клавіш: print, input, pygame — лише в модулі виводу, а двіжок віддає стан і приймає
      команди. Показати: модуль двіжка без print та input і де вивід бере з нього стан; два виводи на одному двіжку — «Два фронтенди».'
  - dual-frontends: '🥈 Два фронтенди на одному двіжку — Гра запускається і в консолі, і у вікні (ключ запуску чи пункт меню), а обидва виводи працюють з тим самим класом гри без його копії чи правок під
      кожен. Показати: перемикання і два модулі виводу над одним двіжком; сам вивід — «Консольний рендер» і «GUI-рендер», відокремлення двіжка — «Двіжок окремо від виводу».'
  - interaction-table: '🥉 Таблиця взаємодій — Що стається, коли одна сутність наступає на іншу, записано даними — словник пар (гравець, стіна) → дія, — а рух лише шукає пару в ньому замість ланцюжка if.
      Показати: таблицю і місце, де рух її питає; символ клітинки → її властивості — «Словник клітинок» (лаба 2).'
  - state-as-data: '🥉 Стан гри як дані — Увесь стан партії — один обʼєкт, що перетворюється на словник чи JSON і назад (to_dict / from_dict) без втрат; ним користуються збереження, повтор чи тести. Показати:
      обидва методи і хто їх викликає; збереження для гравця — «Збереження гри», стан рядком-кодом — «Стан гри як рядок-код».'
  - game-loop: '📎 Цикл: ввід → оновлення → вивід — Ігровий цикл розкладено на три кроки — прочитати ввід, оновити стан, намалювати, — кожен своєю функцією чи методом (handle_input, update, render), і вороги
      з таймерами живуть у тому ж тіку. Показати: цикл і три функції; простий while «клавіша → рух» — «Ігровий цикл до виграшу чи програшу» (лаба 1).'
  git:
  - commit-history: '🌱 Історія комітів — Коміти робляться з компʼютера (git commit і push) по ходу роботи: щонайменше 5 у кілька різних днів, кожен із повідомленням, що змінилось («вороги ходять», а не
      «update»). Показати: git log чи сторінку комітів на GitHub.'
  - project-readme: 🌱 README проєкту — Як встановити й запустити, вимоги, короткий опис зі скриншотом; правила гри — «Інструкція гравця».
  - version-tags: '🌱 Теги версій — Коміт, з яким здаєш лабу, позначено тегом lab1, lab2… (git tag lab1 і git push --tags). Показати: список тегів на GitHub.'
  - gitignore-clean: '🌱 .gitignore без сміття в репо — У корені є .gitignore, а в репозиторії нема __pycache__, .venv, .idea, .DS_Store та інших згенерованих файлів. Показати: .gitignore і дерево репозиторію
      на GitHub.'
  - feature-branch: '📎 Фіча в окремій гілці — Одна фіча зроблена в окремій гілці й злита в main (merge чи Pull Request), а здаєш із main. Показати: гілку в git log --graph чи PR на GitHub.'
  labs:
  - lab1: '🌱 Лаба 1: основи Python #lab1 — Картки зі [сторінки лаби](/labs/1): спершу обовʼязкове, далі додаткове; усі вимоги лаби 1 — у цій сімʼї.'
    children:
    - lab1-field-output: '🌱 Поле на екрані #lab1 — Обовʼязкове в лабі 1. Гра показує поле й оновлює його після кожного ходу — print у консолі чи вікно. Показати: функцію виводу і рядок у циклі, де вона
        викликається; перемальовка кадру й емодзі — «Консольний рендер».'
    - lab1-read-key: '🌱 Клавіша з клавіатури #lab1 — Обовʼязкове в лабі 1. Гра читає клавішу гравця будь-яким способом: input(), msvcrt, keyboard, curses чи подія вікна pygame / tkinter. Показати: рядок,
        де читається клавіша, і як вона стає командою.'
    - lab1-move-player: '🌱 Рух гравця клавішами #lab1 — Обовʼязкове в лабі 1. Клавіша змінює координати гравця — вгору, вниз, вліво, вправо, — і гравець зʼявляється на новій клітинці. Показати: функцію
        руху і як вона отримує напрямок від клавіші.'
    - lab1-cell-check: '🌱 Перевірка клітинки перед кроком #lab1 — Обовʼязкове в лабі 1. Перед кожним кроком гра дивиться, що в цільовій клітинці: стіна й край поля не пускають, приз дає бали, ворог чи вихід
        закінчують гру. Показати: перевірку і місце в русі, де вона викликається (перевірка лише при побудові поля не рахується).'
    - lab1-game-loop: '🌱 Ігровий цикл до виграшу чи програшу #lab1 — Обовʼязкове в лабі 1. Цикл «клавіша → рух → перевірка → вивід» крутиться, доки гравець не виграв або не програв, і в грі є обидва фінали.
        Показати: while і умови виходу з нього; цикл з окремими кроками — «Цикл: ввід → оновлення → вивід».'
    - lab1-own-functions: '🌱 Кілька власних функцій #lab1 — Обовʼязкове в лабі 1. Логіку розкладено на власні функції — щонайменше три, напр. main, read_key, move_player, — і кожна справді викликається.
        Показати: def-и і місця викликів.'
    - lab1-data-types: '🌱 Типи: str, int, float, bool, None #lab1 — Додаткове в лабі 1. У коді гри є str, int, float, bool і None, кожен на своєму місці: float — час чи швидкість, bool — «гра триває», None
        — «ще нема». Показати: рядок для кожного типу.'
    - lab1-conditions: '🌱 Умови: elif, and/or/not, a < b < c #lab1 — Додаткове в лабі 1. У коді є elif і else, логічні and, or, not і подвійне порівняння на кшталт 0 <= x < width для меж поля. Показати:
        рядок для кожного.'
    - lab1-loops: '📎 Цикли: for, while, break, for-else #lab1 — Додаткове в лабі 1. Є for із range, while, continue, break і else у циклу (напр. for … else: «ворога поруч нема»). Показати: рядок для кожного.'
    - lab1-function-params: '📎 Функції: параметри, *, /, lambda #lab1 — Додаткове в лабі 1. Параметри за замовчуванням і виклик за іменем, * і / у списку параметрів, lambda (напр. key= у max чи sorted),
        вкладена функція і кілька вбудованих понад print та input (min, max, abs, sum…). Показати: рядок для кожного.'
    - lab1-scope: '📎 global і nonlocal #lab1 — Додаткове в лабі 1. global для спільного стану (рахунок, рекорд) і nonlocal у вкладеній функції, що змінює змінну зовнішньої (лічильник кроків). Показати:
        обидва місця і навіщо там саме так.'
  - lab2: '🌱 Лаба 2: структури даних і файли #lab2 — Картки зі [сторінки лаби](/labs/2): спершу обовʼязкове, далі додаткове. Кілька рівнів окремими файлами — «Рівні з файлів» у категорії «Рівні»; усі картки
      лаби — [пошук «lab2»](/tasks?q=lab2).'
    children:
    - lab2-grid-matrix: '🌱 Поле як список списків #lab2 — Обовʼязкове в лабі 2. Поле зберігається списком списків, клітинка — field[y][x], а не символ у рядку. Показати: де поле будується і де гра читає
        й змінює клітинку за координатами.'
    - lab2-cell-dict: '🌱 Словник клітинок: символ → властивості #lab2 — Обовʼязкове в лабі 2. Символ клітинки → її властивості (прохідна, бали, назва) у словнику, і гра питає словник замість ланцюжка if.
        Показати: словник і рядок, де з нього читається; що стається при зустрічі двох сутностей, записане даними, — «Таблиця взаємодій».'
    - lab2-direction-tuples: '🌱 Напрямки кортежами (dx, dy) #lab2 — Обовʼязкове в лабі 2. Координати — кортежі (x, y), напрямки — (dx, dy), клавіша → напрямок через словник {''w'': (0, -1), …}. Показати:
        словник і рядок, де гравець зсувається на (dx, dy).'
    - lab2-save-text: '🌱 Результат партії у текстовий файл #lab2 — Обовʼязкове в лабі 2. Після партії результат (кроки, бали, зібране) чи стан гри записується в текстовий файл. Показати: open(…) у режимі
        ''a'' чи ''w'' і сам файл після двох партій; рекорд, який гра читає назад і показує, — «Рекорд».'
    - lab2-string-methods: '🌱 Рядкові методи і f-рядки #lab2 — Обовʼязкове в лабі 2. split, strip і join розбирають рядки файлу рівня чи ввід гравця, f-рядки форматують вивід (рахунок, повідомлення). Показати:
        рядок для кожного.'
    - lab2-slices-comprehensions: '📎 Зрізи, включення, enumerate, zip #lab2 — Додаткове в лабі 2. Спискове включення будує поле чи збирає всіх ворогів, зріз бере частину рядка чи поля, enumerate дає координати
        при обході, zip складає пари. Показати: рядок для кожного.'
    - lab2-unpacking: '📎 Розпакування, *args і **kwargs #lab2 — Додаткове в лабі 2. x, y = pos, first, *rest = … і функція з *args чи **kwargs (напр. створення сутності з довільними параметрами). Показати:
        рядок для кожного.'
    - lab2-sets: '📎 Множини: відвідане і зібране #lab2 — Додаткове в лабі 2. Множина відвіданих клітинок чи зібраних призів: додавання, перевірка in, операції |, & чи -. Показати: де множина оновлюється
        і де перевіряється.'
    - lab2-dict-tricks: '📎 Словники: включення, get, вкладені #lab2 — Додаткове в лабі 2. Словникове включення, get зі значенням за замовчуванням і словник словників (напр. параметри кожного типу клітинки).
        Показати: рядок для кожного.'
    - lab2-binary-save: '📎 Двійковий файл: pickle або struct #lab2 — Додаткове в лабі 2. Стан гри чи рекорди записуються у двійковий файл через pickle (або struct) і читаються назад при запуску. Показати:
        dump і load та сам файл; продовжити перервану партію — «Збереження гри».'
  - lab3: '🌱 Лаба 3: ООП #lab3 — Картки зі [сторінки лаби](/labs/3): спершу обовʼязкове, далі додаткове. Обовʼязкове «Двіжок окремо від виводу» живе в «Архітектурі»; усі картки лаби — [пошук «lab3»](/tasks?q=lab3).'
    children:
    - lab3-classes: '🌱 Класи гри, поля і гравця #lab3 — Обовʼязкове в лабі 3. Головні сутності — класи (Game, Field, Player): стан в атрибутах, поведінка в методах. Показати: класи і де створюються обʼєкти.'
    - lab3-base-class: '🌱 Базовий клас клітинки і нащадки #lab3 — Обовʼязкове в лабі 3. Стіна, приз, ворог успадковують спільний клас і перевизначають його метод (напр. on_enter), а гра не питає «який це
        тип». Показати: базовий клас, два нащадки і виклик методу без isinstance.'
    - lab3-init-str: '🌱 __init__ і __str__ / __repr__ #lab3 — Обовʼязкове в лабі 3. Обʼєкти налаштовуються в __init__, клітинка й поле друкуються через __str__ (для гравця) чи __repr__ (для налагодження).
        Показати: методи і print(field).'
    - lab3-underscores: '📎 Підкреслення: _x, __x і _ #lab3 — Додаткове в лабі 3. Внутрішні атрибути позначені _ (напр. _cells), приватний __ із name mangling, _ для непотрібного значення (for _ in range(n)).
        Показати: рядок для кожного.'
    - lab3-eq-hash: '📎 Порівняння: __eq__, __hash__, __lt__ #lab3 — Додаткове в лабі 3. Координата чи предмет порівнюються через __eq__ і мають __hash__ (тож їх можна класти в set і брати ключем словника),
        порядок — через __lt__ (сортування рекордів). Показати: методи і де вони працюють.'
    - lab3-container-methods: '📎 Поле як контейнер: len, індекс, in, for #lab3 — Додаткове в лабі 3. Клас поля чи інвентаря має __len__, __getitem__, __iter__ і __contains__: працюють len(field), field[pos],
        pos in field, for cell in field. Показати: методи і їх використання; зрізи field[a:b] — «Зрізи у власному класі поля» (лаба 4).'
    - lab3-property: '📎 @property і setter з перевіркою #lab3 — Додаткове в лабі 3. Обчислювана властивість (player.is_alive, level.is_solved) і setter, що не пускає погане значення (hp не нижче 0). Показати:
        декоратори і звернення без дужок.'
    - lab3-mixins: '📎 Міксини і super() #lab3 — Додаткове в лабі 3. Множинне спадкування зі змістом: міксини Movable, Collectable, Dangerous додають поведінку, а super().__init__() проходить увесь ланцюжок.
        Показати: клас із двома батьками і його __mro__.'
    - lab3-classmethods: '📎 Класові й статичні методи #lab3 — Додаткове в лабі 3. @classmethod як другий конструктор (Level.from_file), @staticmethod для допоміжного, атрибут класу — лічильник обʼєктів
        чи реєстр типів клітинок за символом. Показати: рядок для кожного.'
  - lab4: '🌱 Лаба 4: просунуті можливості #lab4 — Картки зі [сторінки лаби](/labs/4): спершу обовʼязкове, далі додаткове. Обовʼязкові «Власні винятки», «Юніт-тести логіки» і «Запуск однією командою» та
      додаткове «Генератори та ітератори» живуть в інших підкатегоріях «Коду»; картки з тегом лаби — [пошук «lab4»](/tasks?q=lab4).'
    children:
    - lab4-package: '🌱 Гра як пакет модулів #lab4 — Обовʼязкове в лабі 4. Код розкладено по файлах за відповідальністю (двіжок, вивід, рівні) у теці з __init__.py, і модулі імпортують одне одного. Показати:
        дерево файлів та імпорти; запуск однією командою — окрема картка.'
    - lab4-type-hints: '🌱 Анотації типів у сигнатурах #lab4 — Обовʼязкове в лабі 4. Публічні функції й методи мають анотації параметрів і результату (def move(self, d: Direction) -> bool), і PyCharm не
        підкреслює типи. Показати: кілька сигнатур; mypy по всьому коду — «Типи перевіряє mypy».'
    - lab4-closures: '📎 Замикання: фабрика функцій #lab4 — Додаткове в лабі 4. Функція створює й повертає іншу, що памʼятає її змінні: make_handler(direction), make_patrol(route). Показати: фабрику і де
        викликається створена функція.'
    - lab4-decorator: '📎 Свій декоратор #lab4 — Додаткове в лабі 4. Свій декоратор із wrapper над функціями гри: лог ходу, вимір часу, перевірка «гра ще триває» перед дією. Показати: декоратор і щонайменше
        два місця з @.'
    - lab4-with-files: '🌱 Файли лише через with #lab4 — Додаткове в лабі 4. Усі файли гри (рівні, рекорди, збереження) відкриваються через with open(…), без open, який треба закривати руками. Показати:
        ці місця.'
    - lab4-parametrize: '📎 Тести з parametrize і фікстурою #lab4 — Додаткове в лабі 4. Один тест перевіряє кілька випадків правила через @pytest.mark.parametrize (стіна, приз, вихід), а маленьке поле дає
        фікстура. Показати: тест і зелений вивід pytest.'
    - lab4-sequence-slices: '🌱 Зрізи у власному класі поля — Додаткове в лабі 4. Клас поля чи рівня — послідовність: __getitem__ розуміє не лише індекс, а й зріз, тож field[2:5] чи path[:3] віддає частину.
        Показати: __getitem__ зі slice і рядок, де зріз потрібен грі; len, in і for по полю — «Поле як контейнер» (лаба 3).'
  - lab5: '🌱 Лаба 5*: web-розробка #lab5 — Картки зі [сторінки лаби](/labs/5): спершу обовʼязкове, далі додаткове. Картки цієї лаби з інших категорій — [пошук «lab5»](/tasks?q=lab5).'
    children:
    - lab5-score-server: '📎 Сервер рекордів на FastAPI #lab5 — Обовʼязкове в лабі 5. POST /scores приймає результат, GET /scores віддає таблицю лідерів, а гра після партії сама надсилає результат. Показати:
        кінцеві точки, рядок із запитом у грі і сторінку /docs.'
    - lab5-database: '📎 Рекорди в SQLite через SQLAlchemy #lab5 — Обовʼязкове в лабі 5. Результати живуть у базі SQLite через модель SQLAlchemy (на старті можна JSON-файл), і перезапуск сервера їх не губить.
        Показати: модель, запис у базу і файл .db.'
    - lab5-jinja-page: '📎 Сторінка лідерів на Jinja2 #lab5 — Обовʼязкове в лабі 5. Сервер віддає HTML-сторінку таблиці лідерів із шаблону Jinja2 ({% for %} по результатах). Показати: шаблон і скриншот сторінки
        в браузері.'
    - lab5-level-api: '🥉 Обмін рівнями через сервер #lab5 — Додаткове в лабі 5. Гравець вивантажує свій рівень на сервер і скачує чужий (POST і GET /levels), гра відкриває скачаний, а список рівнів — галерея.
        Показати: кінцеві точки і гру на скачаному рівні; обмін файлом без сервера — «Обмін рівнями».'
    - lab5-routers-tests: '📎 Роутери і тести API #lab5 — Додаткове в лабі 5. Кінцеві точки розкладено по модулях через APIRouter, і на POST та GET є тести з TestClient. Показати: модулі роутерів і зелений
        вивід pytest.'
    - lab5-deploy: '🥉 Сервер на публічній адресі #lab5 — Додаткове в лабі 5. Сервер рекордів розгорнуто в інтернеті (Render, Railway, VPS…), і гра ходить на публічну адресу, а не на localhost. Показати:
        адресу з /docs і де гра бере адресу сервера.'
    - lab5-player-profile: '📎 Профіль гравця на сервері — Додаткове в лабі 5. Сервер рахує по імені гравця його партії — зіграно, виграно, найкращий результат — і віддає їх через GET /players/{name} та
        сторінку профілю. Показати: кінцеву точку, сторінку і запит із гри; та сама статистика лише в грі, без сервера, — «Статистика профілю».'
  packaging:
  - requirements-pyproject: '🌱 Список залежностей — Усі сторонні бібліотеки (pygame, keyboard…) записані в requirements.txt чи pyproject.toml, і з чистого середовища після pip install -r requirements.txt
      гра запускається. Показати: файл і команду встановлення в README.'
  - single-command-run: '🌱 Запуск однією командою — Гра запускається однією командою з кореня репозиторію — python main.py чи python -m game — без правки шляхів і копіювання файлів, і ця команда є в README;
      у лабі 4 це частина обовʼязкового пункту про пакет. Показати: команду і README.'
  - exe-build: '📎 Збірка в exe — Гра зібрана в один виконуваний файл (PyInstaller, Nuitka чи cx_Freeze), що запускається на компʼютері без Python; збірка лежить у Releases на GitHub, а не в коді репозиторію.
      Показати: команду збірки, реліз і запис запуску; публікація для інших — «Itch.io-публікація».'
  - main-guard: '🌱 if __name__ == ''__main__'' — Модуль із точкою входу запускає гру лише під if __name__ == ''__main__'', тож import цього модуля (у тестах чи іншому файлі) гру не стартує. Показати: цей
      рядок.'
  - cross-platform-run: '📎 Запуск на Windows, macOS і Linux — Консольна гра працює на Windows, macOS і Linux: клавіші читаються не лише через msvcrt — є запасний шлях (termios / tty) чи кросплатформна бібліотека
      (readchar, blessed). Показати: де гра обирає спосіб читання клавіш; викладач запускає на macOS. Гра на pygame чи tkinter кросплатформна сама — для неї картки нема; шляхи до файлів — «Шляхи до файлів
      через pathlib».'
  python:
  - typing-mypy: '🥉 Типи перевіряє mypy #lab4 — Анотовано весь код, включно з атрибутами класів, і mypy (чи pyright) проходить без помилок. Показати: вивід mypy; анотації лише в сигнатурах — «Анотації типів
      у сигнатурах» (лаба 4).'
  - dataclass-entities: '📎 Dataclass для сутностей — Сутності чи координати описано через @dataclass (Pos(x, y), Item(name, points)) замість словників і голих кортежів; frozen=True чи order=True — де доречно.
      Показати: клас і створення обʼєктів.'
  - generators-iterators: '📎 Генератори та ітератори #lab4 — Додаткове в лабі 4. Функція з yield віддає по одній клітинки поля, сусідів клітинки (neighbors(x, y)) чи хвилі ворогів, а цикл чи any / sum їх
      споживає; генераторний вираз — теж сюди. Показати: yield і де генератор використовується.'
  - custom-exceptions: '📎 Власні винятки #lab4 — Обовʼязкове в лабі 4. Свій клас помилки (LevelError(Exception)) кидається на битий файл рівня чи недопустимий хід і ловиться try / except з повідомленням
      гравцю замість тексту помилки Python; finally і raise … from … — плюсом. Показати: class, raise і except; що саме перевіряється у файлі рівня — «Валідація мапи».'
  - std-collections: '🌱 Стандартні колекції — Модуль collections чи itertools зі змістом: deque для черги BFS чи тіла змійки, Counter для підрахунку, defaultdict, namedtuple, heapq, itertools.product для
      обходу поля. Показати: імпорт і рядок використання.'
  - enum-states: '📎 Enum для напрямків і станів — Напрямки, стани гри (меню, гра, пауза, кінець) чи типи клітинок — Enum замість рядків і чисел. Показати: клас Enum і порівняння на кшталт state is State.PAUSED.'
  - match-case-commands: '🌱 match-case для команд — Клавіша чи команда розбирається через match / case замість ланцюжка elif: кілька клавіш через |, case _ — для решти. Показати: блок match.'
  - pathlib-paths: '🌱 Шляхи до файлів через pathlib — Файли рівнів шукаються від теки коду — Path(__file__).parent / ''levels'', а не від теки, звідки запустили. Показати: рядок і запуск гри з іншої теки.'
  - json-files: '🌱 JSON для рекордів чи налаштувань — Рекорди, налаштування чи стан читаються й пишуться через json.load і json.dump, а відсутній файл не валить гру. Показати: код і сам .json; що саме зберігається
      — «Збереження рекордів і прогресу», «Налаштування гри»; двійковий файл — «Двійковий файл: pickle або struct» (лаба 2).'
  - argparse-cli: '📎 Аргументи запуску гри — Параметри запуску на кшталт python main.py --level 3 --seed 42 задають рівень, розмір чи режим через argparse (чи sys.argv), а --help друкує довідку. Показати:
      парсер і вивід --help.'
  - logging-debug: '📎 Журнал налагодження: logging — Налагоджувальні повідомлення йдуть через logging у файл (game.log) з рівнями DEBUG та INFO, а не print, що лишився в коді. Показати: налаштування logging
      і шматок game.log; журнал подій для гравця — «Журнал подій».'
  - docstrings: '🌱 Докстрінги класів і функцій — Класи й публічні функції двіжка мають докстрінги по суті: що робить, що приймає, що повертає, а не номери пунктів лаби. Показати: кілька докстрінгів і help(…)
      у консолі.'
  - named-constants: '🌱 Константи замість магічних чисел — Розмір поля, символи клітинок, клавіші, швидкість — іменовані константи ВЕЛИКИМИ_ЛІТЕРАМИ на початку модуля чи в config.py, а не числа й символи
      посеред логіки. Показати: константи і де вони використовуються.'
  - abc-protocol: '🌱 Абстрактний клас або Protocol — Базова сутність — ABC з @abstractmethod (сама не створюється, нащадок без методу — помилка) або typing.Protocol («усе, що вміє draw»). Показати: базовий
      клас і нащадка, що реалізує метод; звичайний базовий клас із перевизначенням — «Базовий клас клітинки і нащадки» (лаба 3).'
  - random-seed: '📎 Випадковість через seed — Уся випадковість гри йде через один random.Random(seed), який передається двіжку: той самий seed — той самий рівень і ходи ворогів, тож тест чи пошук помилки
      повторюються. Показати: створення генератора, де він передається, і тест чи запуск із фіксованим seed; seed, який бачить і вводить гравець, — «Показати/ввести seed рівня».'
  - input-robust: '🌱 Ввід, що не валить гру — Невідома клавіша, текст замість числа чи Ctrl+C не обривають гру текстом помилки Python: гра перепитує або чемно виходить (try / except ValueError, KeyboardInterrupt).
      Показати: обробку і спробу «зламати» ввід.'
  - ruff-clean: '🌱 Код без зауважень ruff — ruff check і ruff format --check (чи black) проходять без зауважень, налаштування — у pyproject.toml. Показати: вивід обох команд.'
  tests:
  - unit-tests: '🥉 Юніт-тести логіки #lab4 — Обовʼязкове в лабі 4. pytest-тести двіжка без консолі й графіки: щонайменше по тесту на рух, зіткнення (стіна, приз) і виграш чи програш, усі зелені. Показати:
      теку tests/ і вивід pytest; один тест — «Перший тест на правило гри».'
  - fixture-level-tests: '🥉 Тест на рівнях-фікстурах #lab4 — Тест бере маленький рівень із файлу (tests/levels/), програє послідовність ходів і звіряє результат: виграш, позиція гравця, рахунок. Показати:
      файл рівня, тест і вивід pytest.'
  - property-tests: 🥇 Property-тести [paper-puzzles] ⭐ — Генератор завжди видає розвʼязне.
  - first-test: '🌱 Перший тест на правило гри #lab4 — Хоча б один pytest-тест перевіряє правило двіжка без консолі (гравець не проходить крізь стіну), і pytest зелений. Показати: тест і вивід pytest; обовʼязкове
      в лабі 4 — тести на рух, зіткнення й виграш, «Юніт-тести логіки».'
support:
  docs:
  - player-guide: 🌱 Інструкція гравця — Правила й керування для гравця окремим документом чи розділом README; довідка всередині гри — «Вікно довідки».
  - architecture-doc: '📎 Опис архітектури — Схема модулів чи класів — Mermaid у README, draw.io чи фото від руки: що де лежить, хто кого викликає, де двіжок і де вивід. Показати: схему в репозиторії.'
  - dev-log: '📎 Журнал розробки — Файл DEVLOG.md чи сторінка, куди щотижня дописується короткий запис: дата, що зроблено, що не вийшло, що далі, — щонайменше чотири записи в різні тижні. Показати: посилання
      на файл; історія змін у git — «Історія комітів».'
  sites:
  - game-page: '📎 Сторінка гри — Сторінка гри поза репозиторієм і цим сайтом (GitHub Pages, Google Sites, свій сайт): назва, опис, скриншоти чи гіфка, як отримати й запустити гру. Показати: посилання; сторінка
      на itch.io — «Itch.io-публікація».'
  - video-channel: '📎 Канал/плейліст — Плейліст чи канал (YouTube, TikTok) з відео гри впродовж семестру — щонайменше по демці на кожну здану лабу, видно, як гра росла. Показати: посилання на плейліст;
      одна демка гри — «Відео-демка гри».'
  - itchio-publish: '🥉 Itch.io-публікація — Гра викладена на itch.io (чи Game Jolt) так, що чужа людина запускає її без Python — у браузері чи завантаженою збіркою; на сторінці опис, скриншоти й керування.
      Показати: посилання на сторінку; сама збірка exe — «Збірка в exe», сторінка гри деінде — «Сторінка гри».'
  video:
  - feature-demo:
      title: Демка фічі
      description: Короткий запис однієї можливості до захисту.
      coin: tin
      amount: 1.0
      max_count: 0
      slots:
      - key: feature
        label: Що показує
        type: text
        required: true
      status: active
  - game-trailer: '🥉 Трейлер гри — Ролик на 30–90 секунд, змонтований із найкращих моментів гри: нарізка, музика, назва гри на початку й у кінці. Показати: посилання; запис гри без монтажу — «Відео-демка
      гри».'
  - demo-effects: '📎 Ефекти демки — У відео-демці є монтаж: титри до моментів, прискорення довгих ділянок, зум чи сповільнення на головному. Показати: посилання з таймкодами цих місць; монтаж трейлера входить
      у «Трейлер гри».'
  - game-demo-video: '🌱 Відео-демка гри — Потрібна на 69 балів і вище. Відео на 1–3 хвилини: запуск, як грається, виграш і програш. Показати: посилання (YouTube без пошуку, Loom чи Drive) у заявці.'
