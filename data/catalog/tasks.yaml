  - architecture-doc: '📎 Опис архітектури — Схема модулів чи класів — Mermaid у README, draw.io чи фото від руки: що де лежить, хто кого викликає, де двіжок і де вивід. Показати: схему в репозиторії.'
  - dev-log: 📎 Журнал розробки — Короткий devlog по тижнях.
