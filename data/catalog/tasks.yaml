  interact:
  - item-pickup: '📎 Збирання @rule(enter>disappear) — Гравець стає на предмет — предмет зникає з поля, а гравець одразу щось отримує: очки, життя, ключ у кишеню. Бонус, що діє на час, — «Тимчасові режими»;
      предмет у запас — «Інвентар».'
  - key-and-door: '🥉 Ключ і двері @rule(contact?has>disappear) — Зачинені двері пропускають лише того, хто має ключ: з ключем вони відчиняються, без нього — стіна; ключ при цьому витрачається або лишається,
      кольоровий — лише до своїх дверей (Maze, Chip''s Challenge, роглайки). Так само працює будь-який предмет-перепустка: ласти пускають у воду, черевики — на вогонь.'
  - teleport: '🥉 Телепорт @rule(enter>teleport) — Сімʼя: парні / односторонні / випадковий вихід.'
    children:
    - teleport-pair: '🥉 Парні портали @rule(enter>teleport) — Два портали повʼязані між собою: хто зайшов в один, виходить з другого, і навпаки, а одразу назад його не кидає (портали в лабіринтах і роглайках).
        Видно, як сутність зникає в одному порталі й зʼявляється з другого.'
    - teleport-one-way: 📎 Односторонній портал @rule(enter>teleport) — Портал переносить лише в один бік — із входу на вихід, а з виходу назад не веде (змії й драбини в «Змії й драбини», люк на нижній ярус).
        Перехід на інший поверх чи рівень — «Поверхи через сходи».
    - teleport-cooldown: 📎 З cooldown 🗄️
    - teleport-random-exit: 📎 Портал з випадковим виходом @rule(enter>teleport) — Портал викидає щоразу в інше місце — в один із кількох виходів чи в будь-яку вільну клітину навмання (телепорт-пастка в
        роглайках); видно, що з того самого входу виходиш у різних місцях.
  - floor-types: 🥈 Типи підлоги @field — Лід (ковзання), вода (потрібні ласти), вогонь (Chip's Challenge).
  - stick-together: '🥈 Злипання @rule(contact>attach) — Сутності, що торкнулися, зчіплюються й далі рухаються однією групою: штовхнув одну — їде вся, а якщо хоч одній із групи нікуди — не їде жодна (Sokobond).
      Видно, як група росте й рухається цілою.'
  - cell-transform: '📎 Перетворення на інший тип @rule(enter>transform) — Подія міняє тип сутності: камінь, що впав крізь чарівну стіну, стає алмазом (Boulder Dash), заморожений ворог — крижаним блоком,
      який можна штовхати (Kickle Cubicle). Кнопка, що відчиняє двері деінде, — «Кнопка/важіль перемикає стан цілей»; пішак на останньому ряду — «Перетворення фігури на останньому ряду».'
  - destructible-blocks:
      title: Руйновані блоки
      description: 'Блок зникає від вибуху чи пострілу, а на його місці лишається те, що задано слотом: нічого, предмет, вихід (схований під блоком) чи підлога (цегла в Bomberman і Battle City).'
      kind: rule
