      status: active
  - dig-terrain: '🌱 Копання: земля → порожня клітина [boulder-dash] @rule(enter>disappear) — Аватар заходить на клітину землі — земля зникає, лишається порожній тунель, яким можуть ходити й падати інші
      (Boulder Dash, Dig Dug). Сама земля не падає й не штовхається.'
  - fill-hole: 📎 Блок засипає дірку @rule(enter>disappear+set_cell) — Обʼєкт, заштовхнутий у яму, зникає разом з нею — клітина стає звичайною підлогою, по якій можна пройти (Kwirk, A Monster's Expedition).
  - button-toggle:
      title: Кнопка/важіль перемикає стан цілей
      description: 'Гравець чи обʼєкт стає на кнопку або тягне важіль — і цілі зі слота міняють стан: двері відчиняються, шипи ховаються (Chip''s Challenge, Zelda). Сама кнопка — тип сутності «Кнопка /
        важіль».'
      kind: rule
