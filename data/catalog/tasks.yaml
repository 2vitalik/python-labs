  - sound-effects: 📎 Звукові ефекти подій — Кроки, постріл, збирання.
  - background-music: 📎 Фонова музика — З вимикачем у налаштуваннях.
  - sound-volume: 🌱 Застосування гучності ✍️ — Рівень звуку реально впливає на ефекти й музику.
  - sound-warnings: 🌱 Звукові попередження [chess] ✍️ — Таймер добігає, шах.
code:
  architecture:
  - logic-render-split: 🥉 Розділення логіки і рендера — Двіжок не знає, консоль це чи GUI (вимога спільного двіжка).
  - dual-frontends: 🥈 Два фронтенди на одному двіжку — Консоль + GUI перемикаються.
  - state-as-data: 🥉 Стан гри як дані — Серіалізований стан (основа збережень і replay).
  - game-loop: 📎 Цикл tick/update/render — Явний ігровий цикл.
  git:
  - commit-history: 🌱 Історія комітів — Осмислені повідомлення, без сміття в репо.
  - project-readme: 🌱 README проєкту — Як запустити, керування, скриншоти.
  - version-tags: 🌱 Теги версій — Зріз на кожну лабораторну.
  packaging:
  - requirements-pyproject: 🌱 Requirements/pyproject — Відтворюване середовище.
  - single-command-run: 🌱 Запуск однією командою — python -m game без танців.
  - exe-build: 📎 Збірка в exe — pyinstaller для демонстрації без Python.
  python:
  - typing-mypy: 🥉 Типізація — Анотації + перевірка mypy.
  - dataclass-entities: 📎 Dataclass-сутності — Моделі елементів поля.
  - generators-iterators: 📎 Генератори та ітератори — Обхід поля, хвилі.
  - custom-exceptions: 📎 Виключення — Власні класи помилок, охайна обробка.
  - std-collections: 📎 Стандартні колекції [snake] — deque для тіла змійки, heapq для A*.
  tests:
  - unit-tests: 🥉 Юніт-тести логіки — Рух, взаємодії, перемога без рендера.
  - fixture-level-tests: 🥉 Тест на рівнях-фікстурах — Мапа з очікуваним результатом.
  - property-tests: 🥇 Property-тести [paper-puzzles] ⭐ — Генератор завжди видає розвʼязне.
support:
  docs:
  - player-guide: 🌱 Інструкція гравця — Правила і керування.
  - architecture-doc: 📎 Опис архітектури — Схема модулів для захисту.
  - dev-log: 📎 Журнал розробки — Короткий devlog по тижнях.
  sites:
  - game-page: 📎 Сторінка гри — Опис, скриншоти, посилання на репозиторій.
  - video-channel: 📎 Канал/плейліст — Зібрані демки по лабораторних.
  - itchio-publish: 🥉 Itch.io-публікація — Гра, доступна для запуску іншим.
  video:
  - feature-demo: 📎 Демка фічі 🔁 — Короткий запис однієї можливості до захисту.
  - game-trailer: 🥉 Трейлер гри — Зведене відео з монтажем.
  - demo-effects: 📎 Ефекти демки — Титри, прискорення, зум на момент.
