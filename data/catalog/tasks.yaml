  - dig-hole: '📎 Копання ями збоку-знизу [lode-runner] @rule(input?free>set_state) — Ввід риє яму в цеглі збоку-знизу від аватара: клітина на час стає порожньою, і ворог у неї провалюється (Lode Runner).
