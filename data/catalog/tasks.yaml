  - mines-after-first-click: 📎 Розкидання мін після першого кліку [minesweeper] ✍️ — Перший клік завжди безпечний.
  - dungeon-generation: 🥇 Генерація підземель ⭐ ✍️ — Кімнати + коридори (роглайк).
  - unique-puzzle-generation: 👑 Генерація пазла з унікальним розвʼязком [paper-puzzles] ⭐ ✍️ — Головне золото пазл-гілки.
  - infinite-field: 🥇 Нескінченне поле вперед [frogger] ⭐ ✍️ — Генерація на льоту (Crossy Road).
  - difficulty-rating: 🥇 Оцінка складності згенерованого [paper-puzzles] ⭐ ✍️ — Рейтинг за технікою розвʼязання.
