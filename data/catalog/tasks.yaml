  constraints:
  - markup-validity: 🥉 Валідність розмітки [paper-puzzles] @rule(input?unique>paint+message) — Після кожного ходу гра шукає порушення в рядку, стовпці, регіоні й одразу позначає клітини-конфлікти; викладач
      ставить свідомо хибну цифру.
  - completion-detection: 📎 Виявлення завершення [paper-puzzles] 🗄️ — Всі обмеження виконані.
  - check-stalemate: 🥇 Шах / пат [chess] @rule(no_moves?in_check>draw) ⭐ — Виявлення загрози і безвиході.
  - deadlock-detection:
      title: Виявлення deadlock
      description: Гра помічає ящик, який уже не дійде до цілі (кут, стіна без цілі, «замерзла» пара), і каже про це під час гри; слот — які види глухого кута ловить.
      kind: rule
      tags:
      - algo
      games:
      - sokoban
