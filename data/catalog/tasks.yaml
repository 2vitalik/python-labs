    - editor-palette: 🌱 Палітра елементів ✍️ — Вибір елемента для розстановки.
    - editor-draw-tools: 🥉 Інструменти малювання ✍️ — Прямокутник, лінія, заливка — не лише по клітині.
    - editor-erase: 🌱 Гумка ✍️ — Видалення елементів з мапи.
    - editor-undo: 🥉 Undo/redo ✍️ — Скасування і повернення дій.
    - editor-playtest: 🥉 Плейтест ✍️ — Запуск рівня одразу з редактора.
  - editor-map-check: 🥉 Перевірка мапи редактором ✍️ — Не дає зберегти непрохідне.
