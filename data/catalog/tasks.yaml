entities:
  combat:
  - projectile-shot: 🥉 Постріл [battle-city] ✍️ — Снаряд як сутність, летить по прямій.
  - shoot-modes: '📎 Режими стрільби ✍️ — Сімʼя: вперед / черга / дріб / cooldown.'
    children:
    - shoot-forward: 📎 Вперед ✍️
    - shoot-burst: 📎 Черга ✍️
    - shoot-spread: 📎 Дріб ✍️
    - shoot-cooldown: 📎 Cooldown ✍️
  - projectile-collision: 📎 Зіткнення снарядів ✍️ — Анігіляція чи проліт.
  - blast-wave: 🥉 Вибухова хвиля [bomberman] ✍️ — Хрест на N клітин.
  - chain-detonation: 🥉 Ланцюгова детонація [bomberman] ✍️ — Вибух підриває сусідні бомби.
  - piece-capture: 📎 Взяття фігури [chess] ✍️ — Зняття з поля при ході на зайняту клітину.
  - melee-vs-ranged: 🥉 Атака впритул проти дистанційної ✍️ — Правила по типу ворога.
  death:
  - touch-death: 🌱 Смерть від дотику ✍️ — Ворог/пастка вбиває.
  - environment-death: 📎 Смерть від середовища ✍️ — Вода без колоди, вибух, камінь згори.
  - respawn: 📎 Респавн ✍️ — Повернення після смерті (дім привидів, checkpoint).
  - timed-despawn: 🌱 Зникнення за часом [frogger] ✍️ — Тимчасові предмети і платформи.
  - death-animation: 📎 Анімація смерті ✍️ — Ефект перед зникненням.
  interact:
  - item-pickup: 📎 Збирання ✍️ — Предмет зникає, ефект гравцеві.
  - interaction-table: 🥈 Таблиця взаємодій ✍️ — «Що стається, коли X наступає на Y» як дані.
  - key-and-door: 🥉 Ключ і двері [maze] ✍️ — Сімʼя способів відкриття.
  - teleport: 🥉 Телепорт ✍️ — Парні портали.
    children:
    - teleport-pair: 🥉 Парні портали ✍️
    - teleport-one-way: 📎 Односторонні ✍️
    - teleport-cooldown: 📎 З cooldown ✍️
    - teleport-random-exit: 📎 Випадковий вихід ✍️
  - floor-types: 🥈 Типи підлоги ✍️ — Лід (ковзання), вода (потрібні ласти), вогонь (Chip's Challenge).
  - stick-together: 🥈 Злипання ✍️ — Сутності зчіплюються при контакті і рухаються разом (Sokobond).
  - cell-transform: 📎 Трансформація ✍️ — Клітина-перетворювач змінює тип обʼєкта (Emerald Mine).
  legality:
  - impassable-cells: 🌱 Непрохідні клітини ✍️ — Стіни для всіх або для типу сутності.
  - piece-move-patterns: 🥉 Патерни ходів фігур [chess] ✍️ — Кінь/тура/слон як правила на сітці.
  - legal-move-highlight: 📎 Підсвітка легальних ходів [chess] ✍️ — Показати дозволені клітини обраної фігури.
  - no-move-into-check: 🥇 Заборона ходу під шах [chess] ⭐ ✍️ — Хід, що підставляє короля, недопустимий.
  - tile-merge: 🥉 Злиття однакових [2048] ✍️ — Плитки обʼєднуються за правилом.
  - push-object: 🥉 Штовхання [sokoban, boulder-dash] ✍️ — Обʼєкт зсувається, якщо за ним вільно.
  move:
  - move-by-input: 🥉 Рух за вводом — 4 напрямки; ввід керує переміщенням аватара.
    children:
    - move-4dir: 🥉 4 напрямки
    - move-8dir: 🥉 8 напрямків (діагоналі)
    - move-auto: 🥉 Автоматичний рух, ввід змінює напрям
  - inertia-slide: 🥉 Інерція [inertia] ✍️ — Ковзання до упору.
  - gravity-fall: 🥉 Гравітація [lode-runner, boulder-dash] — Падіння без опори.
  - enemy-patrol: 🥉 Патрулювання — Ворог туди-сюди / по маршруту.
  - random-walk: 📎 Випадкове блукання — З забороною розвороту на місці.
  - chase-player: 🥉 Погоня за гравцем — Жадібна (крок у бік цілі).
    children:
    - chase-greedy: 🥉 Жадібна (крок у бік цілі)
    - chase-bfs: 🥇 Пошук шляху BFS/A*
    - chase-double-move: 🥉 Два ходи ворога на один хід гравця (Theseus)
  - pattern-automaton: 🥉 Патерн-автомат ✍️ — Жорсткий цикл ходів (слайм квадратом, скелет через такт).
  - row-conveyor: 🥉 Конвеєрний рух ряду [frogger, pvz-lite] ✍️ — Вся смуга зсувається разом.
  - body-queue: 🥉 Тіло-черга [snake] — Хвіст повторює шлях голови.
  spawn:
  - spawn-random-cell: 🌱 Спавн у випадковій клітині — З перевіркою, що клітина вільна.
  - spawn-schedule: 📎 Спавн за розкладом — Кожні N тіків / за подією.
  - spawn-points: 🌱 Точки спавну [pac-man] — Фіксовані місця рівня (дім привидів).
  - spawn-animation: 📎 Поява з анімацією ✍️ — Сутність «проявляється» кілька тіків.
  state:
  - hp-damage: 📎 HP і шкода ✍️ — Замість миттєвої смерті.
  - inventory: 🥉 Інвентар ✍️ — Предмети з застосуванням.
    children:
    - inventory-items: 🥉 Предмети з застосуванням ✍️
    - inventory-limit: 🥈 Ліміт місткості ✍️
    - inventory-duration: 🥉 Час дії ✍️
  - temporary-modes: 🥉 Тимчасові режими [pac-man] ✍️ — Сила після енерджайзера, щит, переляк ворогів.
  - speed-per-type: 📎 Швидкість за типом ✍️ — Різний темп сутностей (тіки через раз).
  - multi-cell-size: 🥇 Розмір понад клітину ⭐ ✍️ — Обʼєкт 1×2/2×2, рух уздовж осі (Rush Hour).
  - orientation-state: 🥇 Орієнтація як стан ⭐ ✍️ — Обʼєкт перекочується, боки різні (Sausage Roll).
game-logic:
  constraints:
  - markup-validity: 🥉 Валідність розмітки [paper-puzzles] ✍️ — Конфлікти рядка/стовпця/регіону.
  - completion-detection: 📎 Виявлення завершення [paper-puzzles] ✍️ — Всі обмеження виконані.
  - check-stalemate: 🥇 Шах / пат [chess] ⭐ ✍️ — Виявлення загрози і безвиході.
  - deadlock-detection: 🥇 Виявлення deadlock [sokoban] ⭐ ✍️ — Ящик у глухому куті.
  difficulty:
  - difficulty-levels: 📎 Рівні складності [minesweeper] ✍️ — Розмір поля, кількість мін/ворогів.
  - cheat-codes: 📎 Чіт-коди ✍️ — Безсмертя, відкриття рівнів (для демонстрації і налагодження).
  - game-pause: 🌱 Пауза ✍️ — Заморозка тіків.
  economy:
  - round-currency: '🥉 Валюта в раунді [pvz-lite] ✍️ — Сонця/монети: генерація і витрати.'
