  - replay: 🥈 Replay ✍️ — Перегляд запису проходження.
  settings:
  - game-settings: 🥉 Налаштування гри ✍️ — Складність, розмір поля, звук; збереження між сесіями.
  - theme-select: 📎 Вибір теми — Набори символів/спрайтів.
  - settings-elements: 📎 Елементи налаштувань ✍️ — Сімʼя інтерфейсних контролів; кожен елемент у вікні — окрема заявка.
    children:
    - volume-control: 📎 Гучність ✍️ — Слайдер або кнопки рівня звуку.
    - music-toggle: 🌱 Перемикач музики ✍️ — Увімк/вимк фонової музики.
    - avatar-picker: 📎 Вибір аватару ✍️ — Персонаж/скін гравця.
    - field-size-picker: 📎 Розмір поля ✍️ — Розмір або масштаб поля.
    - language-picker: 📎 Вибір мови ✍️ — Перемикання мови інтерфейсу.
    - controls-remap: 🥉 Перепризначення клавіш ✍️ — Зміна розкладки керування.
