  - stat-value:
      title: Очки / цінність
      description: 'Скільки очок дає сутність, коли її зібрали чи знищили: точка в Pac-Man — 10, привид — 200–1600. Сюди ж цінність фігури в шахах і число на плитці 2048 — але не ціна, яку ти платиш.'
      icon: ⭐
