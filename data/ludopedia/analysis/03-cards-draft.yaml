      - {key: shape, label: Форма, type: choice, options: [cross, square3, radius], required: true}
      - {key: into, label: Що лишається, type: text}
      status: draft
  - beam-tracing: '🥉 Трасування променя по сітці ✍️ — Deflektor, Khet, LaserTank, Light Up: промінь іде до перешкоди, дзеркала/поляризатори міняють шлях.'
  - line-of-sight-attack: '🥉 Атака по лінії бачення ✍️ — Lolo (Медуза), DROD, Hoplite (лучник): ворог бʼє, коли гравець на одній лінії без перешкод.'
  - tower-placement: '🥉 Розстановка веж на сітці [pvz-lite] ✍️ — Вежа займає клітини, має вартість, часом формує лабіринт (Fieldrunners).'
  - tower-range:
      title: Радіус/форма дії вежі
      coin: tin
      games: [pvz-lite]
      slots:
      - {key: shape, label: Форма зони, type: choice, options: [line, radius, square, custom], required: true}
      status: draft
  state:
  - tile-rotate: '🌱 Поворот плитки ✍️ — Infinity Loop, Net, Dorfromantik: плитка має орієнтацію, поворот — хід або підготовка ходу.'
  - pipe-connectors: '🌱 Плитка-зʼєднувач з портами ✍️ — Pipe Mania, Net, Zenji: у плитки 1–4 виходи; звʼязок = порти збігаються.'
  - coverage-area:
      title: Зона покриття навколо сутності
      description: Спринклери Stardew, стовпи Factorio, опудала; слот — форма.
      coin: tin
      slots:
      - {key: shape, label: Форма, type: choice, options: [cross, square, radius], required: true}
      - {key: size, label: Розмір, type: int}
      status: draft
  - status-effects: '🥉 Статуси зі стеками й тіком ✍️ — Отрута, заморозка, щит на N ходів; Wildfrost, Backpack Hero, роглайки.'
  - item-identification: '📎 Невідомі предмети до використання ✍️ — Rogue, NetHack, DCSS, Cinco Paus: назва розкривається дією.'
  - hunger-clock: '📎 Голод як таймер ✍️ — Роглайки: лічильник падає щохід, їжа відновлює, 0 = шкода.'
  - unit-xp-skills: '🥉 Юніт набирає досвід і навички ✍️ — Fire Emblem, Into the Breach (пілоти), Wesnoth: XP → рівень → нові вміння.'
  spawn:
  - spawner-entity: '🥉 Сутність-генератор ✍️ — Gauntlet, Chip''s Challenge (клон-машина), Rogue: породжує ворогів, доки її не знищено/не натиснуто.'
game-logic:
  score:
  - chain-reaction:
      title: Каскад і ланцюг
      description: Збіги після осідання, детонації сусідніх, ланцюг Puyo; слот — множник.
      coin: bronze
      slots:
      - {key: multiplier, label: Множник за крок, type: text}
      status: draft
  - extra-life-threshold:
      title: Життя за пороги очок
      coin: wood
      slots:
      - {key: every, label: Кожні N очок, type: int, required: true}
      status: draft
  - leftover-penalty: '🌱 Штраф за залишок ✍️ — Blokus, Azul, Scrabble: наприкінці мінус за невикладені фігури / порожні клітини.'
  opponent:
  - pass-turn: '🌱 Пас, коли нема ходів ✍️ — Reversi, Ataxx, Onitama, го: хід переходить без дії.'
  - repetition-draw: '📎 Нічия повторенням позиції [chess] ✍️ — Триразове повторення, ко в го, правило 50 ходів.'
  - garbage-attack: '🥈 Сміття супернику у versus ✍️ — Tetris, Puyo, Dr. Mario: ланцюг у гравця → рядки/краплі у суперника; offset.'
  - simultaneous-versus: '🥈 Два поля одночасно ✍️ — Puyo, Tetris 99, Take It Easy: однакові умови, перемога за швидкістю/виживанням.'
  - async-multiplayer: '🥈 Хід поштою ✍️ — Letterpress, Words With Friends: партія триває днями, нотифікації про хід.'
  - online-multiplayer: '🥇 Онлайн-партія ✍️ — Синхронізація стану через сервер/сокет; лобі, рейтинг — окремі картки.'
  constraints:
  - connectivity-check: '🥉 Перевірка звʼязності ✍️ — Hashi, Net, Nurikabe, Hive: усі острови/труби/камені — одна компонента (BFS).'
  - single-loop-check: '🥉 Перевірка однієї петлі [paper-puzzles] ✍️ — Slitherlink, Masyu, Yajilin: ребра утворюють рівно один цикл.'
  - neighbor-count-clue: '🌱 Число = кількість сусідів виду [minesweeper, paper-puzzles] ✍️ — Сапер, Light Up, Life: підказка рахує 4/8 сусідів.'
  - line-sum-clue: '📎 Підказка на лінії [paper-puzzles] ✍️ — Kakuro, Hexcells, Voltorb Flip, Skyscrapers: сума/кількість у рядку чи діагоналі.'
  - word-validation: '🥉 Перевірка слова словником ✍️ — Scrabble, Wordle, Boggle: слово є в словнику; завантаження словника, пошук.'
  - rule-variants: '🥉 Конструктор варіантів правил ✍️ — Lichess-варіанти, Tatham-параметри, Life B/S: набір перемикачів правил у налаштуваннях.'
