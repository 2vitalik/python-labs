# Чернетки карток каталогу з корпусу лудопедії (T253, 2026-11-02, 205 ігор).
# Формат — як data/catalog/tasks.yaml (рядок taskline: 'монетка Назва [games] #tags 🔁 ✍️ — опис'); усі ✍️ чернетки, ціни орієнтовні.
# Злиття: скопіювати потрібні рядки в tasks.yaml під ту саму зону/підзону → `uv run python catalog_io.py import` (upsert по slug).
# Нові підзони, яких у zones.py нема, позначені коментарем «НОВА ПІДЗОНА» — покласти поруч у наявну або додати в ZONES/_map.md свідомим кроком.
entities:
  move:
  - wrap-edges: '🌱 Тор: вихід за край → протилежний бік [pac-man, snake] ✍️ — Тунель Pac-Man, Life на торі, Labyrinth; 8 ігор корпусу.'
  - wall-follower:
      title: Ворог тримається стіни
      description: Жук/парамеція Chip's Challenge, світлячки Boulder Dash; слот — якого боку.
      coin: bronze
      slots:
      - {key: side, label: Бік, type: choice, options: [left, right], required: true}
      status: draft
  - turn-when-blocked:
      title: Поворот при упорі
      description: Що робить ворог, впершись у перешкоду — сімʼя з 7 поведінок однією карткою.
      coin: tin
      slots:
      - {key: turn, label: Поворот, type: choice, options: [left, right, reverse, random, stop], required: true}
      status: draft
  - carrier-platform: '📎 Платформа везе того, хто стоїть [frogger] ✍️ — Колоди Frogger, плоти A Monster''s Expedition, конвеєри.'
  - ladder-climb: '📎 Драбини і перекладини [lode-runner] ✍️ — Вертикальний рух лише по драбині; перекладини — рух руками.'
  - party-switch: '🥉 Кілька аватарів з перемиканням ✍️ — XOR, Catrap, Kwirk: активний персонаж змінюється клавішею, решта стоять.'
  - descend-and-reverse: '📎 Строй: біля краю — вниз і розворот ✍️ — Space Invaders, Centipede: група рухається як одне ціле.'
  - roll-off-rounded: '📎 Камінь скочується з округлого [boulder-dash] ✍️ — Падаючий обʼєкт зсувається вбік, якщо під ним округлий обʼєкт і поруч вільно.'
  legality:
  - pull-object: '📎 Тягнення обʼєкта [sokoban] ✍️ — Протилежність штовханню; Pushmo, Baba (PULL), Sokoban-варіант.'
  - one-way-cell: '🌱 Одностороння клітина ✍️ — Порти Supaplex, поляризатори Deflektor, стрілки Lolo: прохід лише в одному напрямку.'
  - height-levels: '🥈 Клітини з висотою ✍️ — Final Fantasy Tactics, Lightbot, Sausage Roll: стрибок лише на ±1 рівень, падіння з висоти.'
  - polyomino-placement: '🥉 Викладання поліоміно на сітку ✍️ — Blokus, Patchwork, Rampart, Tiny Towns: фігура з кількох клітин, перевірка накладання й сусідства.'
  - piece-rotate-flip: '📎 Поворот і віддзеркалення фігури перед ходом ✍️ — Blokus, Tetris-подібні, Ubongo.'
  - pawn-promotion: '📎 Перетворення фігури на останньому ряду [chess] ✍️ — Шахи, шашки (дамка), сьоґі (зона перетворення).'
  - piece-drop: '🥈 Дроп узятої фігури на поле [chess] ✍️ — Crazyhouse, сьоґі: взяте стає своїм і ставиться з руки; рука як окрема зона.'
  - move-limit: '📎 Ліміт ходів на рівень ✍️ — XOR, Helltaker, Hitman GO: лічильник ходів, 0 = провал.'
  interact:
  - destructible-blocks:
