      status: draft
  - dig-terrain: '📎 Копання: земля → порожня клітина [boulder-dash] ✍️ — Boulder Dash, Dig Dug, Mr. Do!: аватар робить тунель; земля не падає.'
  - fill-hole: '📎 Блок засипає дірку ✍️ — Kwirk, Pokémon Strength, A Monster''s Expedition: обʼєкт у дірці стає підлогою.'
  - button-toggle:
      title: Кнопка/важіль перемикає стан цілей
      description: Зелена кнопка Chip's Challenge, плити Zelda, важелі Railbound; слот — цілі.
      coin: bronze
      slots:
      - {key: targets, label: Що перемикає, type: text, required: true}
      status: draft
  - mirror-reflect: '📎 Дзеркало відбиває промінь/снаряд ✍️ — Deflektor, LaserTank, Khet: кут дзеркала визначає новий напрямок.'
  - thief: '📎 Злодій забирає предмети ✍️ — Chip''s Challenge (черевики), Gauntlet, NetHack: контакт = втрата інвентаря.'
  - freeze-into-block: '🥉 Ворог → блок ✍️ — Kickle Cubicle, Toki Tori: заморожений ворог стає обʼєктом, який можна штовхати/ставати.'
  - crush-by-slide: '📎 Розчавити ковзним обʼєктом ✍️ — Pengo, Kickle: блок, що ковзає, вбиває ворога на шляху.'
  - swap-on-contact: '📎 Обмін місцями при вході ✍️ — Baba (SWAP), Khet (скарабей): сутності міняються клітинами замість блокування.'
  - line-match-clear: '📎 Лінія з N однакових зникає ✍️ — Lines 98, Dr. Mario, match-3: перевірка ліній після кожного ходу.'
  combat:
  - explode-area:
      title: Вибух площею
      description: "Сімʼя з blast-wave (хрест): тут — квадрат 3×3 / радіус; слот — форма; продукт вибуху — окремий слот."
