# усе на максимум і перевірено викладачем: ✓ зараховано, ↩ повернуто зі словом, скриншоти, великий граф вікон
student: {last_name: Бойко, first_name: Максим, group: ПЗПІ-25-0}
game:
  title: Сталевий рій
  base_game: battle-city
  description: |
    Танчики з кампанією на 12 рівнів: **бос** наприкінці кожного світу, магазин між хвилями і кооператив на двох.

    Відмінності від основи:
    - поле 26×26 з туманом і мінікартою;
    - лід, вода, ліс, міни, ворота з кнопкою;
    - монети → магазин → покращення танка;
    - збереження у три слоти.
  phases: [ввід, гравець, союзник, вороги, снаряди, середовище, спавн, перевірка перемоги]
etalon: true
field:
  size: "26×26"
  topology: square
  view: top-down
  time: [realtime]
  control: [direct]
  layers: [підлога, стіни, танки й кулі, ліс, туман]
  description: "Рівні з текстових файлів; камера їде за танком, туман відкривається в радіусі 6 клітин"
  claims:
    - {slug: gui-render, note: "pygame, спрайти 16×16", link: "https://github.com/demo-pzpi-25-0/steel-swarm/blob/main/ui/render.py", status: accepted}
    - field-scaling
    - {slug: player-camera, status: accepted, verdict: "Плавно, без ривків на краях — добре"}
    - floor-types
    - fog-of-war
  shots:
    - |
      ####################
      #..E.....E.....E...#
      #.==.==..~~..==.==.#
      #.==.==..~~..==.==.#
      #........ii........#
      #.==.##..ii..##.==.#
      #....*.....o.......#
      #.==.==.ffff.==.==.#
      #.==.==.ffff.==.==.#
      #.....P....A.......#
      #.......=B=........#
      ####################
entities:
  - title: Другий гравець
    role: ally
    description: "Кооператив на одній клавіатурі: WASD + пробіл; життя спільні"
    stats: [{key: lives, value: "спільні"}, {key: speed, value: "1"}]
    states: [звичайний, зі щитом]
  - title: Маус
    role: boss
    icon: "🐭"
    description: "Танк 2×2 наприкінці світу: спить, доки гравець далеко; на половині HP лютує і стріляє чергами"
    stats:
      - {key: hp, value: "20"}
      - {key: armor, value: "3"}
      - {key: speed, value: "0.5"}
      - {key: damage, value: "2"}
      - {key: range, value: "8"}
      - {key: cooldown, value: "25"}
      - {key: value, value: "5000"}
      - {key: size, value: "2×2"}
      - {key: фази бою, value: "3"}
    states: [спить, атакує, розлючений, оглушений]
    claims:
      - {slug: multi-cell-size, link: "https://github.com/demo-pzpi-25-0/steel-swarm/blob/main/entities/boss.py", status: returned, verdict: "Бос проїжджає крізь цеглу лівим нижнім кутом — колізія рахується по одній клітині"}
      - telegraphed-intents
    shots:
      - |
        ........
        .MMMM...
        .MMMM==>
        .MMMM...
        .MMMM...
        ........
  - title: Портал ворогів
    role: spawner
    description: "Три портали вгорі поля; новий ворог виходить з випадкового"
    stats: [{key: count, value: "3"}, {key: cooldown, value: "40"}]
    states: [активний, заглушений]
  - title: Лід
    role: terrain
    icon: "🧊"
    description: "Танк ковзає далі, доки лід не скінчиться"
  - title: Вода
    role: hazard
    icon: "🌊"
    description: "Танк тоне, куля пролітає"
  - title: Ліс
    role: terrain
    icon: "🌲"
    description: "Ховає танки й кулі — окремий шар над ними"
  - title: Міна
    role: hazard
    icon: "💣"
    description: "Вороги її не бачать; вибухає під будь-ким"
    stats: [{key: damage, value: "2"}, {key: range, value: "2"}, {key: count, value: "до 5"}]
    states: [зведена, вибухнула]
  - title: Ворота
    role: gate
    states: [зачинені, відчинені]
  - title: Кнопка воріт
    role: switch
    description: "Наїхав — ворота відчинені на 100 тіків"
  - title: Ящик зі зброєю
    role: container
    icon: "📦"
    description: "Розбий кулею — з половини випадає ремкомплект"
    stats: [{key: hp, value: "2"}]
  - title: Монета
    role: resource
    stats: [{key: value, value: "10"}, {key: duration, value: "150"}]
  - title: Ремкомплект
    role: pickup
    icon: "🔧"
    stats: [{key: лікує, value: "+1 життя"}]
  - title: Ракета
    role: projectile
    icon: "🚀"
    description: "Самонавідна, купується в магазині; повертає не частіше ніж раз на 3 тіки"
    stats: [{key: speed, value: "2"}, {key: damage, value: "4"}, {key: ammo, value: "3"}]
  - title: Вантажівка
    role: neutral
    icon: "🚚"
    description: "Цивільна, їде своїм маршрутом; підбив — штраф"
    stats: [{key: value, value: "−300"}]
rules:
  # еталонні правила слово в слово: зливаються з еталонними, а вердикти лягають на їхні картки
  - when: {kind: input, action: "↑", a: Танк гравця}
    then: [{kind: face, a: "@a", dir: up}, {kind: move, a: "@a", dir: up}]
    claims: [{slug: move-4dir, status: accepted}]
  - when: {kind: input, action: постріл, a: Танк гравця}
    then: [{kind: spawn, entity: Куля, cell: ahead}]
    claims: [{slug: projectile-shot, status: accepted, verdict: "Куля летить окремою сутністю — як треба"}]
  - when: {kind: contact, a: Танк гравця, b: Шолом}
    then: [{kind: disappear, a: "@b"}, {kind: set_state, a: "@a", s: зі щитом, dur: 200}, {kind: score, n: 500}]
    claims: [{slug: temporary-modes, status: returned, verdict: "Щит не знімається, коли таймер вийшов"}]
  - when: {kind: contact, a: Куля, b: База}
    then: [{kind: disappear, a: "@a"}, {kind: set_state, a: "@b", s: зруйнована}, {kind: lose}, {kind: window, window: Підсумок}]
    claims: [{slug: enemy-reached-base, status: accepted, verdict: "Поразка і від кулі, і від тарану — добре"}]
  - when: {kind: all_gone, a: Ворожий танк}
    cond: [{kind: counter, name: ворогів у запасі, op: "==", n: 0}]
    then: [{kind: window, window: Підсумок}, {kind: next_level}]
    claims: [{slug: destroy-all-enemies, status: accepted}]
  - when: {kind: counter, name: життя, op: "==", n: 0}
    then: [{kind: lose}, {kind: window, window: Підсумок}]
    claims: [{slug: player-death, status: accepted}]
  # свої
  - when: {kind: contact, a: Ворожий танк, b: База}
    then: [{kind: set_state, a: "@b", s: зруйнована}, {kind: lose}, {kind: window, window: Підсумок}]
    note: "таран — так само, як куля в базу"
  - when: {kind: enter, a: Танк гравця, b: Лід}
    then: [{kind: slide, a: "@a", dir: forward}]
    note: "до кінця льоду або до перешкоди; стріляти під час ковзання можна"
    claims: [inertia-slide]
  - when: {kind: enter, a: "*", b: Ліс}
    then: [{kind: hide, cell: target}]
    note: "ліс малюється поверх танка — окремий шар"
  - when: {kind: contact, a: Танк гравця, b: Вода}
    then: [{kind: lives, n: -1}, {kind: respawn, a: "@a", where: "біля бази"}]
    claims: [environment-death]
  - when: {kind: contact, a: "*", b: Міна}
    cond: [{kind: state, a: "@b", s: зведена}]
    then: [{kind: set_state, a: "@b", s: вибухнула}, {kind: explode, shape: radius, n: 2}, {kind: damage, a: "@a", n: 2}, {kind: sound, text: бабах}]
    claims: [{slug: blast-wave, params: {shape: radius}}]
  - when: {kind: in_range, a: Міна, b: Міна, n: 2}
    cond: [{kind: state, a: "@a", s: вибухнула}, {kind: state, a: "@b", s: зведена}]
    then: [{kind: set_state, a: "@b", s: вибухнула}, {kind: explode, shape: radius, n: 2}]
    note: "сусідня міна в радіусі вибуху детонує через 3 тіки — ланцюгом"
    claims: [{slug: chain-detonation, params: {delay: 3}}]
  - when: {kind: enter, a: "*", b: Кнопка воріт}
    then: [{kind: set_state, a: Ворота, s: відчинені, dur: 100}, {kind: sound, text: клац}]
    claims: [cell-transform]
  - when: {kind: state_off, a: Ворота, s: відчинені}
    then: [{kind: set_state, a: Ворота, s: зачинені}]
  - when: {kind: contact, a: "*", b: Ворота}
    cond: [{kind: state, a: "@b", s: відчинені, not: true}]
    then: [{kind: block}]
    claims: [key-and-door]
  - when: {kind: destroyed, a: Ящик зі зброєю}
    cond: [{kind: prob, p: 50}]
    then: [{kind: spawn, entity: Ремкомплект, cell: target}]
    note: "інакше — монета"
  - when: {kind: picked, a: Танк гравця, b: Монета}
    then: [{kind: currency, n: 10}, {kind: disappear, a: "@b"}]
    claims: [{slug: round-currency, status: accepted}]
  - when: {kind: picked, a: "*", b: Ремкомплект}
    cond: [{kind: counter, name: життя, op: "<", n: 5}]
    then: [{kind: lives, n: 1}, {kind: disappear, a: "@b"}]
    claims: [item-pickup]
  - when: {kind: input, action: Купити}
    cond: [{kind: counter, name: валюта, op: ">=", n: 100}]
    then: [{kind: currency, n: -100}, {kind: counter, name: рівень покращення, n: 1}]
    note: "пункт «Купити» в Магазині; ціна росте з рівнем покращення"
    claims: [{slug: in-round-upgrades, note: "швидкість, броня, скорострільність — по 3 рівні"}]
  - when: {kind: level_start}
    then: [{kind: spawn_at, entity: Портал ворогів, where: "три точки вгорі поля"}]
    note: "новий ворог виходить з випадкового активного порталу"
    claims: [spawn-points]
  - when: {kind: in_range, a: Маус, b: Танк гравця, n: 6}
    cond: [{kind: state, a: "@a", s: спить}]
    then: [{kind: set_state, a: "@a", s: атакує}, {kind: sound, text: рев двигуна}, {kind: message, text: "Маус прокинувся!"}]
    claims: [sound-effects]
  - when: {kind: tick}
    cond: [{kind: state, a: Маус, s: атакує}]
    then: [{kind: move, a: Маус, dir: toward}]
    note: "до танка гравця найкоротшим шляхом; розлючений — так само, лише на 150 %"
    claims:
      - {slug: chase-bfs, params: {algo: bfs}, note: "BFS по сітці з урахуванням розміру 2×2", link: "https://github.com/demo-pzpi-25-0/steel-swarm/blob/main/ai/bfs.py#L10-L64", status: accepted, verdict: "Чистий BFS, шлях перераховується раз на 5 тіків — ок"}
  - when: {kind: line_of_sight, a: Маус, b: Танк гравця}
    cond: [{kind: state, a: "@a", s: розлючений}]
    then: [{kind: face, a: "@a", dir: toward}, {kind: spawn, entity: Куля, cell: ahead}]
    note: "черга з 3 куль, далі перезарядка 25 тіків"
    claims: [{slug: shoot-burst, params: {shots: 3}}]
  - when: {kind: counter, name: HP Мауса, op: "<=", n: 10}
    cond: [{kind: first_time}]
    then: [{kind: set_state, a: Маус, s: розлючений}, {kind: speed, a: Маус, n: 150}]
  - when: {kind: hp_zero, a: Маус}
    then: [{kind: disappear, a: "@a"}, {kind: score, n: 5000}, {kind: spawn, entity: Монета, cell: neighbors}, {kind: window, window: Магазин}]
  - when: {kind: reach, a: Танк гравця, where: "прапорець перед ареною Мауса"}
    then: [{kind: message, text: "Чекпойнт!"}, {kind: custom, text: "після загибелі танк зʼявляється тут, а не біля бази"}]
    claims: [checkpoint]
  - when: {kind: wave_cleared}
    cond: [{kind: level, op: "<", n: 12}]
    then: [{kind: window, window: Магазин}]
  - when: {kind: wave_cleared}
    cond: [{kind: level, op: "==", n: 12}]
    then: [{kind: win}, {kind: window, window: Підсумок}]
  - when: {kind: wave_start}
    then: [{kind: message, text: "Хвиля!"}, {kind: timer, clock: start}]
    claims: [{slug: enemy-waves, params: {waves: 12, final_wave: true}, status: accepted}]
  - when: {kind: destroyed, a: Ворожий танк}
    cond: [{kind: counter, name: серія, op: ">=", n: 3}]
    then: [{kind: multiplier, k: 2}, {kind: message, text: "Серія ×2!"}]
    note: "серія — вороги, знищені з перервою до 3 с; перерва скидає множник"
    claims: [combo-multiplier]
  - when: {kind: level_end}
    cond: [{kind: timer, op: ">", n: 60}]
    then: [{kind: score, n: 1000}]
    note: "рівень пройдено, а таймер хвилі ще не вичерпав останню хвилину"
    claims: [time-bonus]
  - when: {kind: rng, p: 1}
    cond: [{kind: count, what: Вантажівка, op: "==", n: 0}]
    then: [{kind: spawn_at, entity: Вантажівка, where: "лівий край"}]
  - when: {kind: tick}
    then: [{kind: move, a: Вантажівка, dir: forward}]
    note: "напрям щокроку — наступний у циклі маршруту"
    claims: [{slug: pattern-automaton, params: {pattern: "→→↓↓←←↑↑"}}]
  - when: {kind: destroyed, a: Вантажівка}
    then: [{kind: score, n: -300}, {kind: message, text: "Штраф: цивільний транспорт"}]
  - when: {kind: line_of_sight, a: Ракета, b: Ворожий танк}
    then: [{kind: face, a: "@a", dir: toward}]
    note: "повертає не частіше ніж раз на 3 тіки"
    claims: [chase-greedy]
  - when: {kind: contact, a: Ракета, b: Куля}
    then: [{kind: disappear, a: "@b"}]
    note: "ракета збиває зустрічну кулю й летить далі — кулі ж гасять одна одну"
    claims: [projectile-collision]
  - when: {kind: input, action: Esc}
    then: [{kind: window, window: Пауза}]
  - when: {kind: input, action: пробіл, a: Другий гравець}
    then: [{kind: spawn, entity: Куля, cell: ahead}]
  - when: {kind: idle, n: 300}
    then: [{kind: custom, text: "камера показує базу — нагадування, що її треба боронити"}]
  - when: {kind: died, a: Другий гравець}
    cond: [{kind: counter, name: життя, op: ">", n: 0}]
    then: [{kind: lives, n: -1}, {kind: respawn, a: "@a", where: "праворуч від бази"}]
    claims: [{slug: respawn, params: {delay: 30}}]
