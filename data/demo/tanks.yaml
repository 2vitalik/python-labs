# усе на максимум і перевірено викладачем: ✓ зараховано, ↩ повернуто зі словом, скриншоти, великий граф вікон
student: {last_name: Бойко, first_name: Максим, group: ПЗПІ-25-0}
game:
  title: Сталевий рій
  base_game: battle-city
  description: |
    Танчики з кампанією на 12 рівнів: **бос** наприкінці кожного світу, магазин між хвилями і кооператив на двох.

    Відмінності від основи:
    - поле 26×26 з туманом і мінікартою;
    - лід, вода, ліс, міни, ворота з кнопкою;
    - монети → магазин → покращення танка;
    - збереження у три слоти.
  phases: [ввід, гравець, союзник, вороги, снаряди, середовище, спавн, перевірка перемоги]
etalon: true
field:
  size: "26×26"
  topology: square
  view: top-down
  gravity: none
  time: realtime
  control: direct
  layers: [підлога, стіни, танки й кулі, ліс, туман]
  description: "Рівні з текстових файлів; камера їде за танком, туман відкривається в радіусі 6 клітин"
  claims:
    - {slug: gui-render, note: "pygame, спрайти 16×16", link: "https://github.com/demo-pzpi-25-0/steel-swarm/blob/main/ui/render.py", status: accepted}
    - field-scaling
    - {slug: player-camera, status: accepted, verdict: "Плавно, без ривків на краях — добре"}
    - {slug: minimap-radar, status: returned, verdict: "На мінікарті нема порталів — без них не видно, звідки чекати ворогів"}
  shots:
    - |
      ####################
      #..E.....E.....E...#
      #.==.==..~~..==.==.#
      #.==.==..~~..==.==.#
      #........ii........#
      #.==.##..ii..##.==.#
      #....*.....o.......#
      #.==.==.ffff.==.==.#
      #.==.==.ffff.==.==.#
      #.....P....A.......#
      #.......=B=........#
      ####################
entities:
  - title: Танк гравця   # еталонна сутність: тут лише вердикти на її картках
    claims:
      - {slug: move-4dir, status: accepted}
      - {slug: projectile-shot, status: accepted, verdict: "Куля летить окремою сутністю — як треба"}
      - {slug: temporary-modes, status: returned, verdict: "Щит не знімається, коли таймер вийшов"}
  - title: Другий гравець
    role: ally
    description: "Кооператив на одній клавіатурі: WASD + пробіл; життя спільні"
    stats: [{key: lives, value: "спільні"}, {key: speed, value: "1", unit: "кл/тік"}]
    states: [звичайний, зі щитом]
    claims: [move-4dir, projectile-shot, {slug: respawn, params: {delay: 30}}]
  - title: Маус
    role: boss
    description: "Танк 2×2 наприкінці світу: спить, доки гравець далеко; на половині HP лютує і стріляє чергами"
    stats:
      - {key: hp, value: "20"}
      - {key: armor, value: "3"}
      - {key: speed, value: "0.5", unit: "кл/тік"}
      - {key: damage, value: "2"}
      - {key: range, value: "8", unit: "кл"}
      - {key: cooldown, value: "25", unit: "тіків"}
      - {key: value, value: "5000"}
      - {key: size, value: "2×2", unit: "кл"}
      - {key: фази бою, value: "3"}
    states: [спить, атакує, розлючений, оглушений]
    claims:
      - {slug: chase-bfs, note: "BFS по сітці з урахуванням розміру 2×2", link: "https://github.com/demo-pzpi-25-0/steel-swarm/blob/main/ai/bfs.py#L10-L64", status: accepted, verdict: "Чистий BFS, шлях перераховується раз на 5 тіків — ок"}
      - {slug: multi-cell-size, link: "https://github.com/demo-pzpi-25-0/steel-swarm/blob/main/entities/boss.py", status: returned, verdict: "Бос проїжджає крізь цеглу лівим нижнім кутом — колізія рахується по одній клітині"}
      - {slug: shoot-burst, params: {shots: 3}}
      - {slug: hp-damage, params: {hp: 20, who: бос}, status: accepted}
      - {slug: death-animation, note: "вибух у 6 кадрів"}
    shots:
      - |
        ........
        .MMMM...
        .MMMM==>
        .MMMM...
        .MMMM...
        ........
  - title: Портал ворогів
    role: spawner
    description: "Три портали вгорі поля; новий ворог виходить з випадкового"
    stats: [{key: count, value: "3"}, {key: cooldown, value: "40", unit: "тіків"}]
    states: [активний, заглушений]
    claims: [spawn-points, spawn-animation, spawn-schedule]   # spawn-schedule без параметрів — ⚙️?
  - title: Лід
    role: terrain
    description: "Танк ковзає далі, доки лід не скінчиться"
    claims: [inertia-slide, floor-types]
  - title: Вода
    role: hazard
    description: "Танк тоне, куля пролітає"
    claims: [environment-death]
  - title: Ліс
    role: terrain
    description: "Ховає танки й кулі — окремий шар над ними"
  - title: Міна
    role: hazard
    description: "Вороги її не бачать; вибухає під будь-ким"
    stats: [{key: damage, value: "2"}, {key: range, value: "2", unit: "кл"}, {key: count, value: "до 5"}]
    states: [зведена, вибухнула]
    claims: [{slug: blast-wave, params: {radius: 2}}, {slug: chain-detonation, params: {delay: 3}}]
  - title: Ворота
    role: gate
    states: [зачинені, відчинені]
    claims: [key-and-door]
  - title: Кнопка воріт
    role: switch
    description: "Наїхав — ворота відчинені на 100 тіків"
    claims: [cell-transform]
  - title: Ящик зі зброєю
    role: container
    description: "Розбий кулею — з половини випадає ремкомплект"
    stats: [{key: hp, value: "2"}]
    claims: [{slug: hp-damage, params: {hp: 2, who: ящик}}]
  - title: Монета
    role: resource
    stats: [{key: value, value: "10"}, {key: duration, value: "150", unit: "тіків"}]
    claims: [item-pickup, {slug: timed-despawn, params: {lifetime: 150}}]
  - title: Ремкомплект
    role: pickup
    stats: [{key: лікує, value: "+1 життя"}]
    claims: [item-pickup]
  - title: Ракета
    role: projectile
    description: "Самонавідна, купується в магазині; повертає не частіше ніж раз на 3 тіки"
    stats: [{key: speed, value: "2", unit: "кл/тік"}, {key: damage, value: "4"}, {key: ammo, value: "3"}]
    claims: [chase-greedy, projectile-collision]
  - title: Вантажівка
    role: neutral
    description: "Цивільна, їде своїм маршрутом; підбив — штраф"
    stats: [{key: value, value: "−300"}]
    claims: [{slug: pattern-automaton, params: {pattern: "→→↓↓←←↑↑"}}]
rules:
  - when: {kind: enter, a: Танк гравця, b: Лід}
    then: [{kind: slide, a: "@a", dir: forward}]
    note: "до кінця льоду або до перешкоди; стріляти під час ковзання можна"
  - when: {kind: enter, a: "*", b: Ліс}
    then: [{kind: hide, cell: target}]
    note: "ліс малюється поверх танка — окремий шар"
  - when: {kind: contact, a: Танк гравця, b: Вода}
    then: [{kind: lives, n: -1}, {kind: respawn, a: "@a", where: "біля бази"}]
  - when: {kind: contact, a: "*", b: Міна}
    cond: [{kind: state, a: "@b", s: зведена}]
    then: [{kind: set_state, a: "@b", s: вибухнула}, {kind: explode, shape: radius, n: 2}, {kind: damage, a: "@a", n: 2}, {kind: sound, text: бабах}]
  - when: {kind: enter, a: "*", b: Кнопка воріт}
    then: [{kind: set_state, a: Ворота, s: відчинені, dur: 100}, {kind: sound, text: клац}]
  - when: {kind: state_off, a: Ворота, s: відчинені}
    then: [{kind: set_state, a: Ворота, s: зачинені}]
  - when: {kind: contact, a: "*", b: Ворота}
    cond: [{kind: state, a: "@b", s: відчинені, not: true}]
    then: [{kind: block}]
  - when: {kind: destroyed, a: Ящик зі зброєю}
    cond: [{kind: prob, p: 50}]
    then: [{kind: spawn, entity: Ремкомплект, cell: target}]
    note: "інакше — монета"
  - when: {kind: picked, a: Танк гравця, b: Монета}
    then: [{kind: currency, n: 10}, {kind: disappear, a: "@b"}]
  - when: {kind: picked, a: "*", b: Ремкомплект}
    cond: [{kind: counter, name: життя, op: "<", n: 5}]
    then: [{kind: lives, n: 1}, {kind: disappear, a: "@b"}]
  - when: {kind: in_range, a: Маус, b: Танк гравця, n: 6}
    cond: [{kind: state, a: "@a", s: спить}]
    then: [{kind: set_state, a: "@a", s: атакує}, {kind: sound, text: рев двигуна}, {kind: message, text: "Маус прокинувся!"}]
  - when: {kind: counter, name: HP Мауса, op: "<=", n: 10}
    cond: [{kind: first_time}]
    then: [{kind: set_state, a: Маус, s: розлючений}, {kind: speed, a: Маус, n: 150}]
  - when: {kind: hp_zero, a: Маус}
    then: [{kind: disappear, a: "@a"}, {kind: score, n: 5000}, {kind: spawn, entity: Монета, cell: neighbors}, {kind: window, window: Магазин}]
  - when: {kind: wave_cleared}
    cond: [{kind: level, op: "<", n: 12}]
    then: [{kind: window, window: Магазин}]
  - when: {kind: wave_cleared}
    cond: [{kind: level, op: "==", n: 12}]
    then: [{kind: win}]
  - when: {kind: wave_start}
    then: [{kind: message, text: "Хвиля!"}, {kind: timer, clock: start}]
  - when: {kind: rng, p: 1}
    cond: [{kind: count, what: Вантажівка, op: "==", n: 0}]
    then: [{kind: spawn_at, entity: Вантажівка, where: "лівий край"}]
  - when: {kind: destroyed, a: Вантажівка}
    then: [{kind: score, n: -300}, {kind: message, text: "Штраф: цивільний транспорт"}]
  - when: {kind: line_of_sight, a: Ракета, b: Ворожий танк}
    then: [{kind: face, a: "@a", dir: toward}]
  - when: {kind: input, action: Esc}
    then: [{kind: window, window: Пауза}]
  - when: {kind: input, action: пробіл, a: Другий гравець}
    then: [{kind: spawn, entity: Куля, cell: ahead}]
  - when: {kind: idle, n: 300}
    then: [{kind: custom, text: "камера показує базу — нагадування, що її треба боронити"}]
  - when: {kind: died, a: Другий гравець}
    cond: [{kind: counter, name: життя, op: ">", n: 0}]
    then: [{kind: lives, n: -1}, {kind: respawn, a: "@a", where: "праворуч від бази"}]
