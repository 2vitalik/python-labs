    task: leaderboard
    items: [{title: Назад, window: Головне меню}]
  - title: Досягнення
    task: achievements-window
    description: "24 ачівки: «Без жодної подряпини», «Пацифіст», «Ковзаняр»…"
  - title: Про гру
    task: about-window
levels:
  - title: Кампанія
    mode: file
    count: "9"
    size: "26×26"
    stats:
      - {key: світів, value: "3"}
      - {key: ворогів на рівні, value: "20 → 30"}
      - {key: порталів, value: "3"}
    description: "Місто (рівні 1–3) — цегла й ліс · Крига (5–7) — лід і ворота з кнопкою · Болота (9–11) — вода й міни. Кожен рівень — свій файл; пройдений відкриває наступний, за час — до трьох зірок; четвертий рівень світу — бій з Маусом"
