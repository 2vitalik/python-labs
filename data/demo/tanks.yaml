  - title: Головне меню   # еталонне вікно, меню своє
    items:
      - {title: Кампанія, window: Мапа кампанії}
      - {title: Удвох, window: Вибір танка, note: "кооператив"}
      - {title: Конструктор, window: Конструктор}
      - {title: Рекорди, window: Рекорди}
      - {title: Досягнення, window: Досягнення}
      - {title: Налаштування, window: Налаштування}
