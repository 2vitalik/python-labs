    items: [{title: У бій, window: Гра}]
  - title: Гра   # еталонне вікно: вердикти на його елементах і свої елементи
    claims:
      - {slug: status-panel, status: accepted}
      - {slug: goal-counter, status: accepted}
      - threat-range
      - {slug: mode-indicator, note: "іконка щита й зірки над танком, доки діє бонус"}
