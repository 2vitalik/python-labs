      - {title: Налаштування, window: Налаштування}
      - {title: Здатися, window: "Точно вийти?"}
  - title: Точно вийти?
    task: confirm-dialog
    items: [{title: Так, window: Головне меню, note: "прогрес рівня губиться"}, {title: Ні, window: Пауза}]
  - title: Магазин
    task: shop-window
    description: "Між хвилями: три випадкові товари зі знижкою і постійний асортимент"
    claims: [shop-preview]
    items: [{title: Купити}, {title: Продати, note: "за півціни"}, {title: Далі, window: Гра}]
    shots:
      - |
        ....................
        ..$$$$$$$$$$$$$$$$..
        ....................
