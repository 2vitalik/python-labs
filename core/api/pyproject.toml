[project]
name = "labs-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "beanie",
    "authlib",
    "pydantic-settings",
    "itsdangerous",
    "aiogram>=3.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
