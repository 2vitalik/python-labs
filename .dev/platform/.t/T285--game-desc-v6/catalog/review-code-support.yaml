  # ── code / architecture ─────────────────────────────────────────────
  logic-render-split:
    action: edit
    certainty: sure
    description: "Обовʼязкове в лабі 3. Клас гри нічого не друкує й не читає клавіш: print, input, pygame — лише в модулі виводу, а двіжок віддає стан і приймає команди. Показати: модуль двіжка без print та input і де вивід бере з нього стан; два виводи на одному двіжку — «Два фронтенди»."
    proof: code
    hours: 2.5
    why: "це обовʼязковий п.4 лаби 3, але картка живе в «Архітектурі» й про це не каже — студент на 69 її пропускає; ціна 🥉 = 2–3 год переробки, за шкалою чесна (T277 Q5 лишив)"
  dual-frontends:
    action: edit
    certainty: sure
    description: "Гра запускається і в консолі, і у вікні (ключ запуску чи пункт меню), а обидва виводи працюють з тим самим класом гри без його копії чи правок під кожен. Показати: перемикання і два модулі виводу над одним двіжком; сам вивід — «Консольний рендер» і «GUI-рендер», відокремлення двіжка — «Двіжок окремо від виводу»."
    proof: gif
    hours: 2
    why: "«Консоль + GUI перемикаються» не каже, що показати, і не розводить з трьома картками, які платять той самий код; ціну 🥈 лишив (T273 Q5), але вона подвійна — див. questions"
  interaction-table:
    action: edit
    certainty: sure
    coin: bronze
    description: "Що стається, коли одна сутність наступає на іншу, записано даними — словник пар (гравець, стіна) → дія, — а рух лише шукає пару в ньому замість ланцюжка if. Показати: таблицю і місце, де рух її питає; символ клітинки → її властивості — «Словник клітинок» (лаба 2)."
    proof: code
    hours: 2.5
    why: "словник пар і кілька функцій-обробників на наявних сутностях — 2–3 год, це 🥉, не підсистема 🥈 (збереження, редактор); опис був одним реченням без того, що показати"
  state-as-data:
    action: edit
    certainty: sure
    description: "Увесь стан партії — один обʼєкт, що перетворюється на словник чи JSON і назад (to_dict / from_dict) без втрат; ним користуються збереження, повтор чи тести. Показати: обидва методи і хто їх викликає; збереження для гравця — «Збереження гри», стан рядком-кодом — «Стан гри як рядок-код»."
    proof: code
    hours: 2
    why: "«Серіалізований стан» не каже, що зробити; текст узято з T275 code.yaml (у polish його перекрили коротким) і додано межі з save-game і state-string, які платять сусідню роботу"
