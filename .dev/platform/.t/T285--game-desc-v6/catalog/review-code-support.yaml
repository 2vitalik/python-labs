# T285 · ревізія каталогу v6 — група code-support («Код» 83 + «Супровід» 10)
# 2026-11-13 · рецензент-агент; каталог не змінено, лише вердикти
#
# Переглянуто 93 картки (активних 87 · чернеток 6 · архівних 0).
# keep 56 · edit 30 · price 6 (з них 5 в edit, 1 в activate) · merge 0 · archive 1 (unsure) · activate 6 · keep-draft 0
# Нових карток 3 (усі — пропущені пункти сторінок лаб). Питань 11.
#
# Звірка лаб: усі 42 дитини сімей lab1…lab5 відповідають текстам data/guide/lab1…5.md; вигаданих вимог нема, крім двох дрібних
# (операції множин у lab2-sets, «finally / raise from — плюсом» у custom-exceptions — обидві в questions). Пропущені пункти:
# лаба 2 обов. п.4 (рівень із файлу — лише 🥉 «Рівні з файлів» у «Рівнях»), лаба 4 дод. п.1 (зрізи сховано в картці лаби 3),
# лаба 5 дод. п.2 (профіль — привʼязано до локальної «Статистики профілю»). Обовʼязкові поза сімʼями: лаба 3 п.4, лаба 4 п.2 і п.4.
#
# Найспірніше:
#  1. property-tests 🥇 → 🥈 і для всіх ігор: hypothesis-тести на 2–3 інваріанти — 4–5 год, розвʼязувач платить «Розвʼязувач».
#  2. interaction-table 🥈 → 🥉: словник пар → дія замість if — 2–3 год, не підсистема.
#  3. match-case-commands, std-collections, abc-protocol 📎 → 🌱: один синтаксичний прийом у наявному коді, до пів години.
#  4. feature-demo → архів (unsure): після T284 §7 гіфка чи відео — безкоштовний доказ заявки, а ця платить за нього 📎 без ліміту.
#  5. lab3-mixins активовано за 📎, не 🥉: сусіди-додаткові лаби 3 по 📎, робота — 1–1,5 год.
#  6. json-files 🌱, random-seed 📎, cross-platform-run 📎 активовано, межі з фічами названо; cross-platform — лише для консольних ігор.
#  7. lab5-level-api і lab5-deploy активовано за 🥉: це пункти сторінки лаби 5, чернетка ховала їх від студентів.
#  8. dual-frontends 🥈 не чіпав (T273 Q5), але це подвійна плата з «GUI-рендер» — питання.
#  9. Обовʼязкові пункти лаб поза сімʼями отримали «Обовʼязкове в лабі N.» в описі, а батьки lab2–lab4 — їхні назви.
# 10. Назви без « — » і «[ ]»: lab2-grid-matrix, lab2-direction-tuples, lab4-package, lab3-container-methods.

