  рятують, але студент на 69 бачить сімʼю, а не пошук: тому позначка «Обовʼязкове в лабі N.» у тих картках і назви в описах батьків.
  Сторінки /labs/N карток каталогу не показують — блок «Картки цієї лаби» з T275 так і не зроблено.

  Ціни проти шкали T284 §8. Лаба 1 — чесна: обовʼязкове 15–30 хв за 🌱. Обовʼязкове лаб 3–4 (переробка на класи, пакет)
  займає 1–1,5 год і за шкалою було б 📎 — це свідоме рішення T277 Q4, лишив, питання 9. Лаба 5 — обовʼязкові на верхньому краю 📎.
