questions:
  - "«Бали» кажуть «📎 — обовʼязкове з тем лаб», а в каталозі 16 обовʼязкових у сімʼях лаб 1–4 — 🌱, поза сімʼями — 📎 («Власні винятки») і 🥉 («Двіжок окремо від виводу», «Юніт-тести логіки», «Рівні з файлів»). Рекомендую поправити рядок у «Балах» (напр. «🌱 — база й обовʼязкове з тем лаб; 📎 — додаткове з тем лаб»), картки не чіпати: ціна = час (T284 §8), обовʼязковість тримає поріг 69."
  - "Обовʼязкові пункти лаб поза сімʼями (logic-render-split — лаба 3; custom-exceptions, unit-tests — лаба 4; ще generators-iterators — додаткове лаби 4) перенести в сімʼї lab3 / lab4 у «Завданнях лаб», щоб чек-лист лаби був в одному місці? Рекомендую перенести, ціни лишити; до того їх називають описи батьків (мої правки lab2–lab4) і позначка «Обовʼязкове в лабі N.»."
  - "«Власні винятки»: сторінка лаби 4 вимагає try / except / finally і raise … from … як частину обовʼязкового пункту, а картка каже «finally і raise … from … — плюсом». Рекомендую як на сторінці — прибрати «плюсом» з картки; або написати «плюсом» на сторінці лаби."
  - "«Множини: відвідане і зібране» (лаба 2): картка вимагає ще операцій |, & чи -, а сторінка лаби — лише відвідані клітинки, зібрані призи й перевірку «чи вже було». Рекомендую звести до сторінки: або прибрати операції з картки (тоді вона 🌱), або дописати їх на сторінку."
  - "«Тести з parametrize і фікстурою» (лаба 4): сторінка просить ще «покриття ключових модулів». Якщо це pytest-cov — дописати в картку «pytest --cov показує покриття двіжка»; якщо «тести є на кожен ключовий модуль» — так і написати. Рекомендую друге, без нової бібліотеки."
  - "Лаба 5, додаткове «Профіль гравця і статистика ігор»: тег lab5 зараз на «Статистика профілю» — локальний файл без вебу. Прийняти нову lab5-player-profile 📎 і зняти тег lab5 з profile-stats? Рекомендую так."
  - "«Два фронтенди на одному двіжку» 🥈 (лишено в T273 Q5): сам GUI вже платить «GUI-рендер» 🥈, консоль — «Консольний рендер» 🥉, розділення — «Двіжок окремо від виводу» 🥉; ця картка додає 1,5–2 год (спільний двіжок і перемикання). Рекомендую 🥉; новий опис уже розводить межі."
  - "«Демка фічі» 📎 без ліміту: після T284 §7 гіфка чи відео — безкоштовний доказ заявки конкретної картки, а ця платить за той самий запис ще раз, скільки завгодно разів. Рекомендую в архів (демо rogue перепривʼязати); відео по золотому таску (90+) — доказ video його заявки."
  - "Обовʼязкові «Класи гри, поля і гравця», «Базовий клас клітинки і нащадки» (лаба 3) і «Гра як пакет модулів» (лаба 4) — це 1–1,5 год переробки кожна, за шкалою T284 — 📎, а стоять 🌱, як решта обовʼязкових (T277 Q4). Рекомендую лишити 🌱 — обовʼязкове оплачує поріг, не монетки; якщо «ціна = час» без винятків — ці три в 📎."
  - "Лаба 5: обовʼязкові «Сервер рекордів» і «Рекорди в SQLite» — по 1,5–2 год, верхній край 📎. Рекомендую лишити 📎: лаба бонусна, а її додаткові за 🥉 і так щедрі."
  - "«Dataclass для сутностей» і «Порівняння: __eq__, __hash__, __lt__» (лаба 3): @dataclass(frozen=True, order=True) генерує ці методи сам. Чи зараховується лабі 3 згенероване? Рекомендую ні — сторінка просить системні методи; дописати це реченням у «Порівняння…»."

