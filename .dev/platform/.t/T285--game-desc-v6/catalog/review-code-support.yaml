  й докстрінгами за 🌱 — опустив три найочевидніші; argparse, logging, enum, dataclass (45–60 хв) — на межі, лишив 📎.

  Пари «код ↔ що в грі» (T277 Q6 — дрібна картка як крок до великої) у цій групі: logic-render-split / dual-frontends / console-render /
  gui-render; state-as-data / save-game; lab2-binary-save / save-game; json-files / save-progress; custom-exceptions / map-validation;
  lab2-level-file (нова) / level-from-txt. Межі названо в описах. Справжня подвійна плата лишилась одна — dual-frontends (питання 7).

  Доказ: для «Коду» майже скрізь `code` (тест, тип, структура видно лише в коді); `shot` — де показують вивід команди (mypy, ruff,
  --help) чи сторінку (Jinja); `gif` — поведінка (ввід, що не падає, перемикання фронтендів, запуск exe — викладач на macOS
  exe не запустить). Для «Відео-демок» — `video`. Для сайтів (game-page, itchio-publish, lab5-deploy) доказ — посилання на сторінку,
  а жоден із чотирьох видів доказу цього не описує (`code` — «файл або коміт»); лишив порожнім. Можна додати вид `link`.

  «Супровід» проти «Балів»: відео-демка для 69 — є (🌱, тепер каже про 69). Відео з поясненням коду (асинхронний захист 70–79) —
  не картка, і правильно: це спосіб захисту вже заявленого, монеток не дає; але місця для посилання на нього на сайті нема,
