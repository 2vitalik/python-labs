# T285 · ревізія каталогу v6 · група entities-a: «Сутності» — типи (roles), параметри (params), поява (spawn), рух (move),
#   зникнення і смерть (death) · 2026-11-13
#
# Переглянуто 85 карток: активних 81 (з них 4 заголовки сімей типів без монетки), в архіві 4, чернеток 0.
# Дії: keep 43 (з них 4 архівні — архів доречний; 14 — лише з доказом proof) · edit 42 · merge 0 · archive 0 · activate 0 ·
#   keep-draft 0. Ціна змінена в 34 картках, усі вниз: типи 14 · параметри 9 · рух 8 · поява 2 · смерть 1.
#   proof ставлю незалежно від action: keep + proof = зміст і ціна без змін, лише підказка доказу. Нових карток — 1.
#
# Найспірніше:
#   1. Типи сутностей — усі 🌱, крім «Боса» 📎 (було 🌱/📎/🥉): тип лише називає сутність, поведінку платять правила й механіки.
#   2. Параметри — 📎 лише пʼять із власним станом чи таймером (HP, швидкість, перезарядка, тривалість, енергія), решта 🌱.
#   3. Сімʼя «Рух за вводом» 🥉 → 📎 (усі три діти й батько) — найчастіша картка каталогу, за ті самі стрілки платить і лаба 1.
#   4. «Патрулювання» й «Патерн-автомат» 🥉 → 📎 і розведені описами; «Патерн-автомат» → «Рух за шаблоном кроків».
#   5. «Інерція» → «Ковзання до упору» 📎, без «лише inertia» (демо tanks ковзає на льоду).
#   6. «Смерть від середовища» 📎 → 🌱 (рівня «Смерті від дотику»); межа між ними — за тригером: зіткнувся / став чи накрило.
#   7. «Розклад режимів ворогів» 🥉 → 📎, «Знищений ворог лишає предмет» 📎 → 🌱 — рівняю з сусідами.
#   8. «Лише ігри» знято там, де картку вже заявляє інша гра: inertia-slide, body-queue, spawn-points, drop-on-death, facing-icon, row-conveyor.
#   9. Лишив 🥉 на межі шкали: «Жадібна» погоня і «Тіло-черга» (~1,5–2 год) — питання нижче.
#  10. Нова картка «Ворог помічає гравця» 📎 — демо rogue і tanks пишуть це правило без картки.
group: entities-a
cards:

  # ═══ entities/death ═══

  touch-death:
    action: edit
    certainty: sure
    description: "Гравець зіткнувся з тим, що вбиває від дотику, — ворогом, а в Snake і стіною: мінус життя, а в грі без життів — одразу поразка; поки діє щит чи енерджайзер — ні (умова «не у стані»). Клітина, що вбиває, коли на неї став чи вона тебе накрила (вода, лава, міна, вогонь), — «Смерть від середовища»; повернення на старт — «Респавн»."
    hours: 0.5
    why: "Опис обіцяв і «повернення на старт», яке оплачує «Респавн» (pac-man, frogger заявляють обидві на одне правило), і суперечив «Зіткненню з власним тілом» та еталону snake, де стіна — дотик; межу провів за тригером: зіткнувся — дотик, став чи накрило — середовище."

  environment-death:
    action: edit
    certainty: sure
    coin: wood
    hours: 0.5
    why: "Та сама робота, що й «Смерть від дотику» 🌱: одна умова «став на клітину чи вона накрила» → мінус життя; сусіди рівняються."

  respawn:
    action: keep
    certainty: sure
    hours: 1

  timed-despawn:
    action: keep
    certainty: sure
    why: "Архів доречний: «живе N тіків» — параметр «Тривалість»; тимчасовий бонус — «Бонус зʼявляється на час»."

  # ═══ entities/move ═══

  chase-greedy:
    action: keep
    certainty: sure
    proof: gif
    hours: 1.5
    why: "Ціну лишаю (дві сутності, пара до «Жадібного» AI-суперника 🥉), хоча за годинами це межа 📎 — питання нижче. Доказ — гіфка: поведінку видно лише в русі."

  move-4dir:
    action: edit
    certainty: sure
    coin: tin
    title: "Рух у 4 напрямках"
    description: "Стрілки чи WASD зсувають сутність на одну клітину вгору, вниз, ліворуч чи праворуч, якщо там вільно (Sokoban, Maze, Bomberman). Рух сам, коли ввід лише повертає, — «Автоматичний рух…»; ковзання до упору — «Ковзання до упору»."
    hours: 1
    why: "Опису не було, «4 напрямки» без батька незрозуміле. 🥉 (2–3 год) завищено: клавіша → (dx, dy) → перевірка клітини — близько години; ту саму роботу вже платять «Рух гравця клавішами» лаби 1 🌱 і «Клавіші = рух аватара» поля 🌱."

  move-by-input:
    action: edit
    certainty: sure
    coin: tin
    description: "Ввід рухає твою сутність по клітинах: у 4 чи 8 напрямках або вона йде сама, а ввід лише повертає, — обери дитину, а свій спосіб заявляй цією карткою. Клікаєш ціль, а дорогу шукає гра, — «Пошук шляху BFS / A*»."
    hours: 1
    why: "Батька заявляють напряму (демо rogue), тож його монетка справжня — рівняю з дітьми 📎. Опис «Сімʼя: …» не казав, що робити й коли брати саму сімʼю."

  chase-bfs:
    action: edit
    certainty: sure
    description: "Сутність іде до цілі найкоротшим шляхом в обхід стін — пошуком у ширину (BFS), A* чи Дейкстрою: ворог женеться за гравцем, аватар іде до клікнутої клітини; видно, що за стіною вона не застрягає. Сама схема «клікнув ціль — іде» — властивість поля «Вказую ціль, іде сама»."
    proof: video
    hours: 10
    why: "Опис не казав, що видно, і не називав межу з властивістю поля control-indirect (вона платить схему керування, а не алгоритм). Доказ — відео з поясненням алгоритму, як для всіх ⭐."

  inertia-slide:
    action: edit
    certainty: sure
    coin: tin
    title: "Ковзання до упору"
    description: "Після кроку сутність не зупиняється, а ковзає в той самий бік, доки не впреться в стіну, край чи іншу сутність (кулька в Inertia, лід у Chip's Challenge, танк на льоду). Клітина, що обриває ковзання, — «Клітина-гальмо»; кілька видів підлоги з різними ефектами — «Типи підлоги»."
    games: []
    proof: gif
    hours: 1
    why: "Демо tanks заявляє її на льоду, а картка була «лише inertia»; назва — назва гри, опис «Ковзання до упору» без змісту. 🥉 завищено: «поки вільно — крок» — одне правило (~1 год), сусіди «Клітина-гальмо» й «Діагональний прохід» — 🌱."

  move-8dir:
    action: edit
    certainty: sure
    coin: tin
    title: "Рух у 8 напрямках"
    description: "Як рух у 4 напрямках, плюс 4 діагоналі — цифровий блок чи пари клавіш (роглайки на кшталт NetHack); видно крок навскіс. Прохід навскіс між двома стінами, що торкаються кутами, — «Діагональний прохід між кутами стін»."
    hours: 1
    why: "Опису не було; 🥉 завищено так само, як у «Рух у 4 напрямках», — додаються лише чотири клавіші."

  chase-double-move:
    action: keep
    certainty: sure
    why: "Архів доречний: два ходи на один хід гравця — «Швидкість» 2, сам крок — та сама погоня."

  gravity-fall:
    action: keep
    certainty: sure
    why: "Архів доречний: падіння без опори — властивість поля «Вниз» (field/physics)."

  move-auto:
    action: edit
    certainty: sure
    coin: tin
    description: "Сутність щотіку сама йде вперед, а ввід лише змінює напрям (змійка, Pac-Man); без вводу вона не зупиняється. Тіки за годинником — властивість поля «Реальний час», заборона розвернутись назад — «Заборона розвороту на 180°»."
    hours: 1
    why: "Опису не було. 🥉 завищено: напрям як стан і крок щотіку — одне правило (~1 год), ігровий цикл з таймером уже платить «Реальний час» 📎."

  enemy-patrol:
    action: edit
    certainty: sure
    coin: tin
    description: "Ворог ходить заданим маршрутом між точками на мапі й, дійшовши до кінця, повертає назад або йде на початок (вартовий уздовж коридору, Розкидач мін у Mined-Out). Розворот лише тоді, коли вперся, — «Поворот при упорі»; цикл кроків, не привʼязаний до мапи, — «Рух за шаблоном кроків»."
    proof: gif
    hours: 1
    why: "Опис «туди-сюди / по маршруту» збігався з «Патерн-автоматом» і «Поворотом при упорі» — розвів за тим, чим задано рух. 🥉 завищено: список точок та індекс у ньому — одне правило зі станом (~1 год), як «Випадкове блукання» 📎."

  random-walk:
    action: keep
    certainty: sure
    proof: gif
    hours: 0.75
    why: "Доказ — гіфка: блукання видно лише в русі."

  chase-player:
    action: edit
    certainty: sure
    description: "Сутність щотіку наближається до цілі — ворог до гравця, пес до господаря. Крок у бік цілі без пошуку шляху — «Жадібна», найкоротший шлях в обхід стін — «Пошук шляху BFS / A*»; свою евристику (вартові Lode Runner) заявляй цією карткою."
    proof: gif
    hours: 1.5
    why: "Батька заявляють напряму (еталон lode-runner, демо rogue), а опис «Сімʼя за якістю: …» не казав, що робити й коли брати саму сімʼю; 🥉 лишаю — як у «Жадібної»."

  realtime-ai:
    action: keep
    certainty: sure
    proof: video
    hours: 10
    why: "Доказ — відео: оцінку вільного простору (flood fill) і вибір повороту треба пояснити голосом."

  pattern-automaton:
    action: edit
    certainty: sure
    coin: tin
    title: "Рух за шаблоном кроків"
    description: "Сутність повторює жорсткий цикл кроків зі слота — «→→↓↓←←↑↑» чи «крок, стоїть» — не дивлячись на гравця (слайм ходить квадратом, скелет — через такт, вантажівка в демо Tanks). Маршрут між точками на мапі — «Патрулювання»."
    proof: gif
    hours: 1
    why: "«Патерн-автомат» — незрозумілий термін, опис не казав, що видно. 🥉 завищено: рядок кроків і лічильник по ньому — одне правило (~1 год), рівня «Патрулювання» 📎. Злиття з ним (T271) лишилось окремим (T273 Q5) — розвів описами."

  row-conveyor:
    action: edit
    certainty: sure
    coin: tin
    description: "Ціла смуга поля щотіку зсувається на клітину в свій бік разом з усім, що на ній, а те, що виїхало за край, заїжджає з протилежного (машини й колоди у Frogger, стрічка конвеєра). Хто стоїть на рухомій смузі й їде з нею — «Платформа везе того, хто стоїть»."
    games: []
    proof: gif
    hours: 1
    why: "Опис «Вся смуга зсувається разом» не казав, що видно; pvz-lite у «лише ігри» хибна — еталон її не заявляє, а смуги буває не лише у Frogger. 🥉 завищено: зсув списку на таймері — одне правило (~1 год)."

  body-queue:
    action: edit
    certainty: sure
    games: []
    hours: 2
    why: "Еталон mined-out заявляє її на Жука, що повзе слідом Сапера, а картка була «лише snake»; черга позицій — не лише змійка (Centipede, супутник, що йде твоїм слідом). 🥉 лишаю — питання нижче."

  wall-follower:
    action: keep
    certainty: sure
    proof: gif
    hours: 2
    why: "Доказ — гіфка; 🥉 лишаю: відносні повороти «праворуч — прямо — ліворуч» для першокурсника помітно важчі за патрулювання."

  turn-when-blocked:
    action: edit
    certainty: sure
    description: "Що робить сутність, упершись у перешкоду: повертає ліворуч чи праворуч, розвертається назад, обирає випадковий вільний бік або зупиняється; слот — який варіант. Їде прямо до упору й лише там обирає новий бік (ворожі танки Battle City) — ця картка; новий випадковий бік на кожному кроці — «Випадкове блукання»."
    proof: gif
    hours: 1
    why: "Еталон battle-city ставить на «вперся → випадковий бік» картку «Випадкове блукання» — назвав межу між ними."

  carrier-platform:
    action: keep
    certainty: sure
    proof: gif
    hours: 1
    why: "Доказ — гіфка: видно, що гравець їде разом з платформою."

