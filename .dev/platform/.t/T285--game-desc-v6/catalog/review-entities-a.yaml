new:
  - slug: notice-and-chase
    title: "Ворог помічає гравця"
    zone: entities
    subzone: move
    coin: tin
    kind: rule
    description: "Ворог спить, блукає чи патрулює, доки гравець далі за N клітин чи за стіною; щойно помітив — переходить у погоню, загубив — вертається до свого (вовк у демо Rogue, Маус у демо Tanks). Як далеко бачить — параметр «Огляд», як женеться — «Погоня за гравцем»."
    proof: gif
    aliases: {uk: [агро, помітив гравця, тривога, прокинувся], en: [aggro, alert, detection], ru: [агро, заметил игрока, тревога]}
    hours: 1
    why: "Демо rogue (вовк: лінія зору й радіус 8 → «переслідує») і tanks (Маус прокидається, коли танк ближче 6) пишуть це правило без картки; у каталозі є лише число «Огляд» і атака по лінії бачення, а перемикання поведінки, коли гравець поруч, нема — роглайки й «танки» студентів його точно робитимуть."

questions:
  - "Типи сутностей: усі 🌱, крім «Боса» 📎 (застосовано) — тип лише називає сутність, поведінку платять правила й механіки, і зникає спокуса назвати ворога босом заради монетки. Якщо лишаєш два щаблі T273 Q4 — відхили 13 вердиктів 📎→🌱, а «Бос» і «Спавнер» тоді 📎. Рекомендую 🌱."
  - "Параметри: 📎 лише пʼять із власним станом чи таймером (HP зі шкодою, швидкість, перезарядка, тривалість, енергія), решта 13 — 🌱 як число, яке читають інші картки. Рекомендую так."
  - "«Рух за вводом» з дітьми 🥉 → 📎: це найчастіша картка каталогу (10 еталонів), а за ті самі стрілки вже платять «Рух гравця клавішами» лаби 1 🌱 і «Клавіші = рух аватара» поля 🌱 (T277 Q6). Рекомендую 📎; 🌱 — якщо вважаєш базовий рух оплаченим лабою."
  - "«Жадібна» погоня й «Тіло-черга» лишив 🥉, хоча за годинами (~1,5–2 год) вони на межі 📎: дві сутності / головна механіка Snake. Строго за шкалою — 📎; рекомендую лишити 🥉."
  - "«Патрулювання» й «Рух за шаблоном кроків» розвів описами (точки на мапі проти циклу кроків), обидві 📎; злити в одну, як радив T271? Рекомендую лишити двома — студенти шукають обома словами."
  - "«Розклад режимів ворогів» лежить у «Поява», хоча він про поведінку, — перенести в «Рух» до «Погоні за гравцем»? Рекомендую так."

notes: |
  Ціни. Підзона «Рух» успадкувала 🥉 як типову ціну з сиду v1 (стара шкала «ігрові фічі — 🥉»); за годинами T284 §8 «одне правило
  зі станом» — це 📎, тож «Рух» пішов униз найбільше. Після правок сімʼї рівні: погоня — «Погоня»/«Жадібна» 🥉, BFS 🥇, AI в реальному
  часі 🥇; маршрутні — «Патрулювання», «Рух за шаблоном кроків», «Поворот при упорі», «Випадкове блукання» 📎, «Ворог тримається стіни»
  🥉 (відносні повороти); ковзання — «Ковзання до упору» 📎, «Діагональний прохід» 🌱 (+ «Клітина-гальмо» 🌱, «Розчавити ковзним» 📎
  в інших групах); рух за вводом — усе 📎.
  Авто-картки (типи, параметри) заявляються самі, тож їхня ціна — монетки за сам опис; тепер правило одне: тип 🌱 (бос 📎),
  параметр 🌱, а 📎 — лише якщо за числом стоїть свій стан чи таймер.
  Батьки сімей — не лише довідка: «Погоню за гравцем» заявляє еталон lode-runner, «Рух за вводом» — демо rogue, і passport.py
  платить їхню монетку. Тому монетку батька тримаю рівною типовій дитині, а в описі кажу, коли брати саму сімʼю.
  Поле (index, категорія field) з карток руху повністю не дублює ніщо; перетини названо в описах: «Клавіші = рух аватара» ↔
  «Рух у 4/8 напрямках» (схема керування проти правила; плюс лаба 1 — утретє за ті самі стрілки), «Вказую ціль, іде сама» ↔
  «Пошук шляху BFS / A*» (схема проти алгоритму), «Реальний час» ↔ «Автоматичний рух» (цикл проти правила), «Типи підлоги» (лід) ↔
  «Ковзання до упору»; «Гравітація» з «Руху» вже влита в «Вниз», а «Камінь скочується» й «Драбини» лише доповнюють гравітацію.
  «Лише ігри» в цій групі часто вужчі за справжнє вживання: зняв там, де картку вже заявляє інша гра (6 карток); решту
  одноігрових (pac-man-привиди, snake, lode-runner, boulder-dash, inertia, 2048) лишив.
  Еталони й демо, що розходяться з описами (не правив — пересів демо стирає наклацане): inertia ставить «Смерть від дотику» на міну
  (enter — це «Смерть від середовища»); battle-city ставить «Випадкове блукання» на «вперся → випадковий бік» (це «Поворот при упорі»);
  demo rogue ставить «Рух за вводом» на клік з A* (це «Вказую ціль» + «Пошук шляху»); battle-city пише щит на появі без картки,
  а «Тимчасові режими» (інша група) мають «лише pac-man» — battle-city і tanks їх уже заявляють.
  Розміщення: «Розклад режимів ворогів» — поведінка, не поява (питання); «Іконка за напрямом руху» за змістом — графіка, але як
  механіка сутності доречна в «Русі». «Зникнення і смерть» тонка (3 активні) — і добре: поразка живе в «Логіці → Поразка».
  «Хвіст / сегмент» сидить у сімʼї «Живі», хоча сам не діє, — терпимо, бо це частина живої сутності.
