questions:
  - "T277 Q5 досі без відповіді, тому два вердикти тут unsure: «Вікно редактора рівнів» 🥈 → 📎 (за один редактор два срібла — вікно й «Редактор у грі») і «Налаштування гри» → «Налаштування зберігаються» 📎 (складність, розмір поля, звук мають свої картки). Рекомендую застосувати обидва — це вже третя ревізія, що каже те саме."
  - "Якість меню (T280 Q4): пропоную три картки — «Меню клавішами» 🌱, «Меню мишкою» 🌱, «Анімація переходу між вікнами» 📎. «Підсвітку пункту» окремо не роблю (без неї клавіші не працюють), «Вкладені підменю» не треба (підменю — ще одне вікно свого типу, воно й так платить). Рекомендую активувати всі три."
  - "«Підсвітка клітини під курсором» живе у «Вводі» з типом «картка поля», а решта підсвіток — сімʼя «Підсвітки на полі» в HUD (елементи ігрового вікна). Перенести її в сімʼю? Рекомендую так: один перелік підсвіток, межа з «Виділеною клітиною» буде видно поруч (радив ще T271)."
  - "«Hot-seat на двох» (група «Логіка») каже «на екрані видно, чий хід», а «Індикатор режиму» показує те саме — еталон chess заявляє обидві. Прибрати фразу з hot-seat? Рекомендую так: показ — елемент HUD, hot-seat — передача ходу."
  - "Еталони й демо досі закривають «Нестандартним вікном» те, для чого вже є типи: bomberman «Етап» і boulder-dash «Картка печери» → «Заставка рівня», pac-man «Інтермісія» → «Інтермісія / сценка», minesweeper «Новий рекорд» → «Введення імені для рекорду», демо sudoku «Календар» → «Календар пазлів дня». Перепривʼязати окремою правкою даних? Рекомендую так."
notes: |
  Типи вікон (36 активних + «Нестандартне»): ціни тепер тримаються одного правила — один вибір чи статичний зміст — 🌱
  (підтвердження, заставки, «Про гру», вибір режиму чи героя, пароль, імʼя, «Продовжити?», завіса, діалог, статистика й досягнення
  як показ чужих даних, ігровий екран); кілька різних дій, свій стан чи справжній зміст — 📎 (меню, пауза, вибір рівня зі статусами,
  кінець гри з підсумком, налаштування, магазин, довідка, карта, лобі, навчання, повтор, бестіарій, налаштування партії, демо-режим,
  розстановка, сценка, інвентар, слоти, календар, рекорди). З правила випадали лише «Заставка/лого» 📎 і два редактори 🥈 — поправлено.
  Типи вікон рахуються раз на гру (max_count 1), тож два вікна «Екран перемоги/поразки» не платять двічі — так і треба.

  Підсвітки (сімʼя highlights): показ того, що вже порахувала інша картка, — 🌱 (виділена, останній хід, конфлікти, намір ворога);
  підсвітка, що рахує свій набір клітин, — 📎 (легальні ходи, зона ураження, превʼю шляху); з BFS в обхід перешкод — 🥉 (досяжні).

  Пари «елемент ↔ функція»: правило T284 §8 «відсутність бага — не картка» ловить «Застосування гучності» (повзунок, що нічого не міняє,
  не зарахують) — злито в «Гучність». «Перемикач музики» ↔ «Фонова музика» лишаються: музика без вимикача можлива, вимикач — справжній крок.

  «Лише ігри» дрейфує: з 8 карток обмеження знято, бо їх уже заявляють інші еталони чи демо (movement-animation — sokoban і tanks,
  move-counter — inertia, sound-warnings — pvz) або опис сам називає інші ігри (mode-indicator — судоку, match-setup — арена й раунди).

  Доказ (proof): типи вікон — shot (це й скриншот самого вікна; авто-заявка окремої панелі не має); усе, що рухається
  (анімації, демо-режим, сценка, відлік, перемотування, жести), — gif; звук — video (гіфка без звуку нічого не доводить);
  HUD і налаштування — shot. Порожньо лише батьки сімей і функції, які видно через своє вікно (статистика профілю, налаштування між запусками).

  Архів «Ввід» (keyboard-controls, cell-click, drag-drop-piece, path-drawing, flag-cycle): зміст не загубився — усе є в «Полі → Керування»,
  «Перепризначенні клавіш» і «Позначках-нагадуваннях». Загубилось дрібне, для групи «Поле»:
    - «Перетягую фігуру» 🥉 не каже «відпустив на недозволеній клітині — фігура повертається», а саме це відрізняє її від кліку (T271 мав це формулювання);
    - «Розмічаю клітини» наводить приклад «прапорці в сапері», а прапорці-нагадування — це «Позначки-нагадування» (перевірка їх не враховує).
  Синоніми архівних карток, яких нема в картках-наступницях (пошук архіву не бачить): control-direct ← «гарячі клавіші», «hotkeys»,
  «горячие клавиши»; dot-mark ← «пкм», «права кнопка миші», «right click»; goal-counter ← «лічильник мін», «скільки ще», «mines left»;
  mode-select ← «складність», «легко», «важко», «easy», «hard»; level-select ← «вибір пазла», «puzzle list»; profile-stats ← «стрік»,
  «дні поспіль», «win streak»; role-supply ← «взяті фігури», «captured pieces»; volume-control ← «мікшер», «без звуку», «mixer».

  Демо вживають типи вікон не за призначенням: pvz «Вибір насіння» (вибір рослин на рівень) стоїть як «Розстановка перед партією»,
  а це «Вибір персонажа / загону»; chess «Лобі» («двоє за одним компʼютером: імена, кольори») — це «Налаштування партії» (T280 вже помітив).

  Підкатегорії: «Вікна і меню» найбільша (38), але однорідна — ділити не треба; «Таблиця рекордів» — єдиний тип вікна поза нею
  (живе в «Результатах»), варто перенести до решти вікон. «Звук» після злиття — 3 картки, цього досить.
  Чого не додавав, хоч думав: підсвітка однакових цифр і рядка/стовпця в судоку (одна основна гра, близько до «Виділеної клітини»),
  «Підказка ходу» (це «Чіти і складність» або «Розвʼязувач»), підписи рядків і стовпців (дрібниця всередині «Консольного рендеру»).
