# T285 · ревізія v6 · група «Інтерфейс» (interface: render · input · hud · menus · settings · results · graphics · sound)
# Переглянуто 107 карток: 94 активні, 2 чернетки, 11 в архіві.
# keep 53 (з них 11 архівних — архів доречний) · edit 51 (з них price 12, двоє unsure) · merge 1 · archive 0 · activate 2 · keep-draft 0 · new 3
#
# Найспірніше:
#   1. editor-window 🥈 → 📎 (unsure: T277 Q5 досі без відповіді) — за один редактор платять два срібла: вікно і «Редактор у грі».
#   2. game-settings → «Налаштування зберігаються» 📎 (unsure: T277 Q5) — складність, розмір поля, звук мають свої картки.
#   3. code-editor-window 🥈 → 🥉 — виконання програми платить «Пишу програму команд», покроковий запуск — «Покрокове виконання».
#   4. sound-volume → volume-control — «повзунок справді діє» = відсутність бага (T284 §8), не окрема картка.
#   5. Підсвітки: показ того, що порахувала інша картка, — 🌱 (conflict-highlight, telegraph-marker 📎 → 🌱); з власним BFS — 🥉 (reachable-highlight 📎 → 🥉).
#   6. Типи вікон: «один вибір чи статичний зміст — 🌱, кілька дій, свій стан чи власний зміст — 📎»; з нього випали лише splash-screen 📎 → 🌱 і редактори.
#   7. Дешевшають: hover-highlight 📎 → 🌱, swipe-gestures 🥉 → 📎, minimap-radar 🥉 → 📎, avatar-picker 📎 → 🌱, background-music 📎 → 🌱.
#   8. rating-system: чернетка → активна 🥉 (не 🥈), з тим, з ким рахується рейтинг і де видно.
#   9. Знято «лише ігри» з 8 карток, які вже заявляють інші еталони й демо (анімація руху, лічильник ходів, легальні ходи, …).
#  10. Якість меню (T280 Q4): нові «Меню клавішами» 🌱 і «Меню мишкою» 🌱 + «Анімація переходу між вікнами» 📎; «підсвітка пункту» окремо не йде, «підменю» не треба.
group: interface
cards:

  # ── interface / graphics ──────────────────────────────────────────────
  movement-animation:
    action: edit
    certainty: sure
    games: []
    description: "Сутності не перескакують з клітини в клітину, а плавно їдуть за кілька кадрів (плитки 2048, ящик у Sokoban, танк); логіка гри лишається покроковою по клітинах."
    proof: gif
    hours: 2.5
    why: "«Лише 2048» хибне: картку заявляють еталон sokoban і демо tanks, анімація руху потрібна будь-якій GUI-грі; опис «(GUI)» не казав, що видно."
  event-effects:
    action: keep
    certainty: sure
    proof: gif
    hours: 1
    why: "Опис добрий, межі з частинками й анімаціями смерті/появи названі; ефект видно лише в русі."
  idle-animation:
    action: edit
    certainty: sure
    description: "Сутності, що стоять на місці, «живуть»: спрайт по таймеру перемикає 2–4 кадри чи злегка пульсує — моргання, покачування, дихання (рослини PvZ)."
    proof: gif
    hours: 1
    why: "«Дихання спрайтів» — без того, що саме зробити; дописав кадри за таймером і приклади."
  particles:
    action: edit
    certainty: sure
    description: "На подію вилітає купка дрібних часток — іскри, дим, конфеті: кожна летить своїм напрямом, сповільнюється й гасне, і гра при цьому не гальмує. Одноразовий спалах чи вибух кадрами — «Ефекти подій»."
    proof: gif
    hours: 2
    why: "«Прості системи часток» нічого не каже студенту; 🥉 за список часток із рухом і згасанням справедливо, межу з «Ефектами подій» названо."
  spawn-animation:
    action: edit
    certainty: sure
    description: "Нова сутність не виникає миттєво: кілька кадрів мерехтить чи проступає (зірочка появи танка в Battle City), і лише потім рушає. Де й коли вона зʼявляється — картки «Поява» в «Сутностях»."
    proof: gif
    hours: 1
    why: "Опис з одного речення без прикладу й межі з «Появою»."
  death-animation:
    action: edit
    certainty: sure
    description: "Загиблий не зникає миттєво: кілька кадрів вибуху, падіння чи згасання (Pac-Man згортається), і лише потім прибирається з поля. Сама загибель — картки «Зникнення і смерть» у «Сутностях»."
    proof: gif
    hours: 1
    why: "«Ефект перед зникненням» — без того, що видно; дописав і межу зі смертю як правилом."

  # ── interface / hud ───────────────────────────────────────────────────
  selection-highlight:
    action: keep
    certainty: sure
    proof: shot
    hours: 0.3
    why: "Опис ясний, 🌱 — обвести клітину; видно на одному кадрі."
  status-panel:
    action: edit
    certainty: sure
    description: "Смуга чи бічна панель на ігровому екрані показує кілька показників гри разом — життя, очки, час, рівень, запас бомб — і оновлюється щоходу. Лічильник цілей і лічильник ходів — окремі картки."
    proof: shot
    hours: 1
    why: "Перелік без дієслова; 15 еталонів заявляють її поруч із «Лічильником цілей» — межу з ним і з «Лічильником ходів» треба назвати, щоб одне число не платилось двічі."
  conflict-highlight:
    action: edit
    certainty: sure
    coin: wood
    proof: shot
    hours: 0.4
    why: "Які клітини хибні, рахує «Валідність розмітки» 🥉; лишається пофарбувати їх — та сама робота, що «Виділена клітина» 🌱."
  goal-counter:
    action: keep
    certainty: sure
    proof: shot
    hours: 0.3
    why: "Опис добрий, поглинув архівний «Лишилось: мін/точок/ворогів» без втрат."
  last-move-highlight:
    action: edit
    certainty: sure
    games: []
    description: "Звідки й куди щойно сходив суперник — обидві клітини підсвічені, щоб його хід було видно (шахи, шашки, реверсі)."
    proof: shot
    hours: 0.3
    why: "Не лише шахи: будь-яка покрокова гра на двох чи проти AI; знято «лише ігри», приклади в дужках."
  mode-indicator:
    action: edit
    certainty: sure
    games: []
    description: "Помітний на екрані знак режиму, що діє зараз: чий хід (шахи, гра вдвох), енерджайзер — привиди сині (Pac-Man), бонус-щит над танком. Перемикач ручки й олівця в судоку — частина «Олівцевих нотаток»."
    proof: gif
    hours: 0.5
    why: "Обмеження pac-man/chess суперечило опису (судоку) і демо tanks; приклад «олівець чи ручка» платився двічі — він уже в «Олівцевих нотатках» («перемикач режиму видно на екрані»)."
  highlights:
    action: keep
    certainty: sure
    hours: 1
    why: "Батько сімʼї, перелік дітей актуальний; ціна довідкова."
  legal-move-highlight:
    action: edit
    certainty: sure
    games: []
    description: "Обрав фігуру — підсвічуються всі клітини, куди вона може піти за правилами (шахи, шашки; у реверсі — куди можна поставити фішку). Чи хід дозволений, вирішують правила ходу; тут — перебрати клітини й показати їх."
    proof: shot
    hours: 1
    why: "Опис «Показати дозволені клітини» без межі з «Патернами ходів»; картка годиться будь-якій фігурній грі — знято «лише шахи». 📎 лишаю: на відміну від конфліктів, клітини ще треба перебрати."
  move-counter:
    action: edit
    certainty: sure
    games: []
    proof: shot
    hours: 0.3
    why: "«Лише sokoban» хибне: еталон inertia вже заявляє, лічильник ходів мають майже всі пазли."
  reachable-highlight:
    action: edit
    certainty: sure
    coin: bronze
    proof: shot
    hours: 2
    why: "Досяжне за хід в обхід перешкод — це заливка BFS з межею кроків, та сама робота, що «Каскадне відкриття нулів» і «Перевірка звʼязності» 🥉."
  remaining-counter:
    action: keep
    certainty: sure
    why: "Архів доречний: влито в «Лічильник цілей», «міни − прапорці» там у описі."
  threat-range:
    action: keep
    certainty: sure
    proof: shot
    hours: 1
    why: "Опис добрий; 📎 — клітини, які бʼє кожен ворог, треба порахувати самому (промінь до стіни, ходи фігур)."
  next-queue:
    action: keep
    certainty: sure
    proof: shot
    hours: 0.5
    why: "Опис ясний, універсальний (Tetris, Lines)."
  telegraph-marker:
    action: edit
    certainty: sure
    coin: wood
    description: "Перед ходом ворога на полі позначено, куди він вдарить чи піде наступного ходу, — гравець встигає відійти (Into the Breach). Що ворог обирає дію наперед — «Ворог оголошує хід наперед»; усі клітини, які ворог може бити взагалі, — «Зона ураження ворога»."
    proof: gif
    hours: 0.5
    why: "Опису не було — лише «Into the Breach». Намір вибирає «Ворог оголошує хід наперед» 🥉, тут лише намалювати відому клітину — 🌱, як «Останній хід суперника»."
  path-preview:
    action: keep
    certainty: sure
    proof: gif
    hours: 1
    why: "Опис добрий; перемальовування при зміні цілі видно лише в русі."
  pocket:
    action: keep
    certainty: sure
    why: "Архів доречний: тип «Запас поза полем» прямо згадує взяті фігури в шогі."
  message-log:
    action: keep
    certainty: sure
    proof: shot
    hours: 1
    why: "Опис добрий, межа з ефектом «повідомлення» названа."
  objective-text:
    action: keep
    certainty: sure
    proof: shot
    hours: 0.3
    why: "Опис добрий."
  popup-text:
    action: keep
    certainty: sure
    proof: gif
    hours: 0.5
    why: "Опис добрий; 🌱 на межі з 📎 (список написів із часом життя), але сумнів дрібний — лишаю."
  push-counter:
    action: keep
    certainty: sure
    why: "Архів доречний: «Лічильник ходів» каже «за потреби окремо поштовхи»."
  face-button:
    action: edit
    certainty: sure
    description: "Кнопка-смайлик над полем показує стан гри — граю, виграв, програв — і по кліку починає заново (Minesweeper); сам рестарт рахує «Рестарт рівня з початку»."
    proof: gif
    hours: 0.5
    why: "Еталон minesweeper заявляє і цю кнопку, і «Рестарт рівня»; дописав межу, щоб рестарт не платився двічі."
  wave-progress:
    action: keep
    certainty: sure
    proof: shot
    hours: 0.5
    why: "Опис добрий, pvz-lite — справді основна гра."
  health-bars:
    action: activate
    certainty: sure
    coin: wood
    description: "Над сутністю (у боса — вгорі екрана) смужка, що коротшає з кожним ударом: видно, скільки HP лишилось. Саме здоровʼя — параметр «HP»; життя гравця числом — «Панель стану»."
    proof: gif
    hours: 0.5
    why: "Ясно й дешево: прямокутник пропорційно HP. Потрібна іграм з HP (танки Battle City, PvZ, роглайки, демо tanks/rogue); межі з «HP» і «Панеллю стану» названо."

  # ── interface / input ─────────────────────────────────────────────────
  keyboard-controls:
    action: keep
    certainty: sure
    why: "Архів доречний: рух — «Клавіші = рух аватара», перепризначення — «Перепризначення клавіш», клавіші дій — правила з тригером «ввід»; загубились лише синоніми (див. notes)."
  cell-click:
    action: keep
    certainty: sure
    why: "Архів доречний: «Клік по клітині» в «Полі → Керування» описує те саме ширше."
  hover-highlight:
    action: edit
    certainty: sure
    coin: wood
    proof: gif
    hours: 0.4
    why: "Перевести координати миші в клітину й обвести — та сама робота, що «Виділена клітина» 🌱."
  drag-drop-piece:
    action: keep
    certainty: sure
    why: "Архів доречний: «Перетягую фігуру» 🥉; у її описі загубилось «відпустив на недозволеній — повертається» (див. notes)."
  pencil-marks:
    action: keep
    certainty: sure
    proof: shot
    hours: 2.5
    why: "Опис добрий, 🥉 справедливо (кандидати в клітині + режим); перемикач режиму тепер платиться лише тут, не в «Індикаторі режиму»."
  chord-click:
    action: edit
    certainty: sure
    description: "Клік (обома кнопками чи середньою) по відкритому числу, біля якого вже стоїть стільки ж прапорців, відкриває решту його сусідів; прапорців менше — нічого не стається (Minesweeper)."
    proof: gif
    hours: 0.75
    why: "«Комбінована дія на числі» не пояснює, що саме відбувається."
  swipe-gestures:
    action: edit
    certainty: sure
    coin: tin
    games: []
    proof: gif
    hours: 0.75
    why: "Запамʼятати, де натиснув, і порівняти dx/dy з порогом — пів години-година, не 2–3; свайп годиться будь-якій грі з 4 напрямками (Snake, Sokoban), не лише 2048."
  path-drawing:
    action: keep
    certainty: sure
    why: "Архів доречний: «Малюю шлях» у «Полі → Керування» — те саме з прикладами."
  path-cut:
    action: keep
    certainty: sure
    proof: gif
    hours: 1
    why: "Опис добрий; стирання хвоста видно лише в русі."
  multi-select:
    action: keep
    certainty: sure
    proof: gif
    hours: 1.5
    why: "Опис добрий."
  edge-marking:
    action: keep
    certainty: sure
    proof: shot
    hours: 1.5
    why: "Опис добрий."
  dot-mark:
    action: keep
    certainty: sure
    proof: shot
    hours: 0.5
    why: "Опис добрий, поглинув «Правий клік по колу» без втрат."
  flag-cycle:
    action: keep
    certainty: sure
    why: "Архів доречний: «Позначки-нагадування» — «перебираються по колу однією кнопкою»."
  flood-reveal:
    action: keep
    certainty: sure
    proof: gif
    hours: 2
    why: "Опис добрий; 🥉 ухвалено в T275 (заливка BFS) — не чіпаю."

  # ── interface / menus ─────────────────────────────────────────────────
  main-menu:
    action: edit
    certainty: sure
    description: "Перший екран гри з пунктами — грати, інші вікна (рівні, налаштування, рекорди), вихід; кожен пункт веде туди, куди написано. У консолі досить вибору номером."
    proof: shot
    hours: 1
    why: "«Нова гра, продовжити, вихід» обіцяло «продовжити» — це «Збереження гри» 🥈, а не меню; переписав на те, що справді є в усіх 17 еталонах."
  pause-menu:
    action: edit
    certainty: sure
    description: "Поверх зупиненої гри — пункти «Продовжити», «Почати рівень заново», «Головне меню»; продовжив — усе рушає з того самого місця. Саму зупинку гри рахує «Пауза»."
    proof: shot
    hours: 1
    why: "«З продовженням і рестартом» — без того, що видно, і без межі з «Паузою» 🌱 (T273 Q5 лишив обидві)."
  confirm-dialog:
    action: edit
    certainty: sure
    description: "Перед незворотною дією — вийти без збереження, почати заново, стерти збереження — питання «Ви впевнені?» з «Так» і «Ні»; «Ні» повертає все як було."
    proof: shot
    hours: 0.3
    why: "«Вихід без збереження» — один випадок замість самого вікна."
  level-select:
    action: edit
    certainty: sure
    description: "Список чи сітка рівнів, біля кожного — статус: пройдено, закрито, зірки чи найкращий результат; обраний рівень запускається. Сам облік статусів — «Розблокування» чи «Банк рівнів із прогресом»."
    proof: shot
    hours: 1
    why: "Статус — те, що робить це вікно 📎, а не 🌱-списком; опис з трьох слів цього не казав, межу з картками обліку названо."
  end-screen:
    action: edit
    certainty: sure
    description: "Після перемоги чи поразки — що сталось, підсумок партії (очки, час, ходи) і куди далі: «Ще раз», «Наступний рівень», «Меню». Перемога й поразка можуть бути двома вікнами цього типу; аркадне «Продовжити?» з відліком — свій тип."
    proof: shot
    hours: 0.75
    why: "Опис без того, що видно; межа з «Продовжити?» не названа."
  game-screen:
    action: keep
    certainty: sure
    proof: shot
    hours: 0.3
    why: "Опис добрий; саме вікно дешеве, рендер платять картки поля."
  splash-screen:
    action: edit
    certainty: sure
    coin: wood
    description: "При запуску — екран з назвою гри й логотипом (картинка чи ASCII-арт), що зникає сам за кілька секунд чи з клавіші. Екран перед кожним рівнем — «Заставка рівня»."
    proof: shot
    hours: 0.3
    why: "Статичний екран, що зникає за таймером, — та сама робота, що «Заставка рівня» 🌱, де ще й номер рівня й життя."
  settings-window:
    action: edit
    certainty: sure
    description: "Вікно, де зібрані налаштування гри, з поверненням туди, звідки його відкрили; кожен перемикач у ньому — окрема картка сімʼї «Елементи налаштувань»."
    proof: shot
    hours: 0.75
    why: "Межа з елементами — суть цієї ціни (вікно платить за себе, контроли — окремо); сказав прямо."
  shop-window:
    action: edit
    certainty: sure
    description: "Вітрина: товари з ціною й описом, на що не вистачає — сіре, після покупки видно новий баланс. Що купівля дає і звідки гроші — «Магазин між рівнями», «Валюта в раунді»."
    proof: shot
    hours: 1
