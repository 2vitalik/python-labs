    hours: 4
    why: "Сумнів 🥉/🥈 (свій напрям на тип + зустрічні потоки; у прикладах ще й вода, що розтікається) — лишаю."
  gravity-toward-center:
    action: keep
    certainty: sure
    proof: gif
    hours: 5
    why: "Без змін; гіфка — бо це рух."
  wrap-edges:
    action: edit
    certainty: sure
    games: []
    proof: gif
    hours: 0.5
    why: "Обмеження pac-man/snake суперечить опису (Asteroids, Game of Life) і демо chess (циліндричні шахи з wrap), а еталон snake його не має: властивість поля універсальна."

  # ── field / time ─────────────────────────────────────────────────────────
