    hours: 0.5
    why: "Обидві властивості заявляються самі, а «запустив — виконує сама» вже є в «Пишу програму команд» 🥉, кнопки «крок / пауза» — у «Покроковому виконанні» 📎; ця лишається позначкою за 🌱."
  time-wego:
