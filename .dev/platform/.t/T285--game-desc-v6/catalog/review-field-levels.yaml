questions:
  - "Редактор оплачено двома сріблами: «Редактор у грі» 🥈 (заявка) і «Вікно редактора рівнів» 🥈 (авто-заявка типу вікна) описують той самий екран «курсор + зберегти». Рекомендую: in-game-editor лишити 🥈 за саму роботу, вікну — 📎, як іншим вікнам зі змістом (рішення — у групі interface)."
  - "Програмна гра оплачується вчетверо: «Пишу програму команд» 🥉 + «Програмований» час + «Редактор програми» 🥈 (вікно) + «Покрокове виконання» 📎 ≈ 🥇 за роботу на 🥈. Час я зробив 🌱; рекомендую ще вікно «Редактор програми» → 📎 (група interface)."
  - "«Стрілка рухає гравця» — три монетки: «Клавіші = рух аватара» 🌱 (поле) + «4 напрямки» 🥉 (правило) + «Рух гравця клавішами» 🌱 (лаба 1). Поле лишаю 🌱, як ти хотів; рекомендую «4 напрямки» → 🌱 чи 📎 (група entities)."
  - "«Ізометрична» — це вид, а не сітка (логіка квадратна; демо pvz має «Сітка: ізометрична» + «Вид: згори»). Рекомендую перенести в «Вид» (opt view:iso, ціна та сама) — це міняє форму поля й демо pvz, тому питання."
  - "«Банк рівнів із прогресом» 🥉: статус і найкращий результат — година, список — вікно «Вибір рівня», збереження — «Збереження рекордів і прогресу». Рекомендую 📎, якщо «десятки рівнів» не мають бути зроблені вручну; лишив 🥉, бо не знаю, чи рахуєш ти сам вміст."
  - "«Ще один рівень» 🔁: 5 зараз чи 0 (без ліміту) одразу з формулою знижок T08? І як заявляти на рівні «Рівні 1–35» однією частиною — дозволити кілька заявок однієї картки на ній? Рекомендую 🔁5 і заявку на кожен рівень окремою частиною."
  - "«Генерація підземель»: варіант drunkard у параметрі (2–3 год, звʼязність сама собою) для 🥇 замалий. Рекомендую прибрати з options або писати «лише з кімнатами»; у «Генерації лабіринту» можна додати kruskal / wilson, але не binary tree / sidewinder (пів години)."
  - "«Розвʼязувач» + «Генерація з унікальним розвʼязком»: я зробив генератор 🥇 (разом із розвʼязувачем 👑) — корон у каталозі тоді не лишається. Якщо корону хочеш зберегти, альтернатива: генератор 👑 з приміткою «розвʼязувач входить, окремо не заявляєш». Рекомендую 🥇."
  - "Підзона «Банк пазлів» містить загальні картки рівнів (банк, пазл дня, складність, зірки) — перейменувати в «Банк рівнів» (zones.py)? Рекомендую так."

notes: |
  Поле. Базові варіанти — квадратна сітка, лінія, вид згори й збоку, покроковий і статичний час, клавіші, клік, розмітка,
  замкнене поле — усі 🌱; дорожчі лише там, де справді більше роботи: реальний час 📎, гекси / граф / ізометрія 🥉, 3D,
  поле в полі, перша особа 🥈. Пливли дві ціни, що прийшли злиттям зі старих карток (drag-drop-piece 🥉, «Клітини з
  висотою» 🥈), і подвійна авто-заявка «програмований час». Властивості поля заявляються самі й ховаються з картки поля
  (FieldCard бере лише !c.auto), тож доказ до них часто нема куди прикріпити: статичним (сітка, вид) proof не ставив —
  їх показують скриншоти самого поля; gif — лише там, де суть у русі. Короткі назви («Вниз», «Згори», «Квадратна»)
  задумані під плитки («Гравітація: ⬇️ Вниз»), але в рядку заявки й у таблиці «Картки» без підпису властивості
  незрозумілі — краще дописувати підпис властивості в UI, ніж перейменовувати картки (тоді плитка повторить слово).
  Бракувало способів керування консольних ігор лаб 1–2 (хід текстом, курсор клавішами) — дві нові 🌱.

  Рівні. «Редактор» і «Формат» досі мали описи-фрагменти з v1 («Не дає зберегти непрохідне», «.xsb, судоку-стрічки,
  формати Tatham») — переписав усі на «що зробити + що видно + межа». Золото генерації нерівне, але в межах 🥇:
  maze / dungeon — нижній край (8–10 год), no-guess і оцінка складності — верхній (свій логічний розвʼязувач, 12+);
  infinite-field опустив до 🥈 (без пошуку й розвʼязувача), корону — до 🥇 (розвʼязувач оплачує своя картка).
  Заливка / BFS по каталогу коштувала втричі по-різному (🥇 reachability, 🥉 connectivity, 🥉 flood-reveal) —
  вирівняв на 🥉. «Пошук шляху» 🥇 лишається якорем шкали для алгоритмів.

  Сімʼї подвійних оплат, що виходять за групу: редактор (in-game-editor 🥈 + editor-window 🥈), програмна гра
  (control-programmed + time-programmed + code-editor-window 🥈 + step-execution), «стрілка рухає гравця»
  (control-direct + move-4dir 🥉 + lab1-move-player) — питання вище, рішення по вікнах і правилах — у групах interface
  та entities.

  games: 9 карток групи мали «типові ігри» замість «лише для цієї гри» (T284 §8), і частину з них заявляють саме ігри
  поза списком (sokoban → level-bank, demo chess → import-open-formats і wrap, inertia → level-solver) — знято. Лишив
  обмеження там, де картка справді про одну гру: сапер (mines-after-first-click, no-guess-generation), паперові пазли
  (unique-puzzle-generation, difficulty-rating).

  Повторюваних карток у групі нема (усі max_count 1), хоч рівні — головний випадок повтору з T68/T70 і score.md —
  нова extra-level 🔁5. У шаблоні вердикту нема полів opt і max_count — для нових карток дописав їх, скрипту
  застосування треба їх брати (без opt нова властивість поля не стане плиткою).

  Підзони: «Перевірка проходимості» — 2 активні (досяжність, розвʼязувач) + архівна; «Банк пазлів» за змістом — «Банк
  рівнів»; «Фізика поля» тримає й «Замкнене поле», яке не фізика, але іншого місця в «Полі» нема — лишив.
