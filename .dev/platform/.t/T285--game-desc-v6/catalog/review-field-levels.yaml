  # ── levels / bank ────────────────────────────────────────────────────────
  level-bank:
    action: edit
    certainty: sure
    games: []
    description: "Десятки рівнів (свої чи імпортовані колекції) зібрано в набори; для кожного гра веде статус «розвʼязано / ні» і найкращий результат і оновлює їх одразу після розвʼязання. Список на екрані — вікно «Вибір рівня»; щоб прогрес пережив перезапуск, — «Збереження рекордів і прогресу»."
    proof: shot
    hours: 2
    why: "Обмеження [paper-puzzles] суперечить еталону sokoban і демо pvz, tanks, що її заявляють; межі з вікном і збереженням (T271 why) перенесено в опис. Ціна — питання."
  daily-puzzle:
    action: edit
    certainty: sure
    games: []
    proof: shot
    hours: 1
    why: "Пазл дня з seed дати — не лише паперові пазли (сапер, лабіринт, 2048 дня); опис гаразд."
  level-rating:
    action: edit
    certainty: sure
    title: "Рівні за складністю"
    description: "Кожен рівень банку має позначку складності («легкий / середній / важкий» чи 1–5), і список рівнів сортується й фільтрується за нею. Позначку можна поставити вручну в заголовку файла («Метадані рівня»), обчислити програмою — «Оцінка складності пазла»."
    proof: shot
    hours: 1
    why: "«Рейтинг рівнів» читається як оцінки гравців (і в синонімах «лайки»), а «зірки» плутались із «Зірками за рівень»; картка про сортування й фільтр за складністю. Синонім «лайки» варто прибрати."
  level-par:
    action: edit
    certainty: sure
    title: "Зірки за рівень"
    description: "У рівня є ціль — скільки ходів чи секунд досить; після перемоги гра дає 1–3 зірки залежно від того, наскільки близько до цілі, і найкращі зірки видно в списку рівнів. Рекорд усієї гри — «Рекорд»."
    proof: shot
    hours: 1
    why: "«Еталон» у цьому сайті — опис базової гри, назва плутала; «найкращий результат» перетинався з «Рекордом» 📎 і «Банком рівнів» — межу названо."

  # ── levels / editor ──────────────────────────────────────────────────────
  editor-palette:
    action: edit
    certainty: sure
    description: "Поруч із полем редактора — панель з усіма елементами рівня (стіна, ящик, ворог…): клік чи цифра обирає, що ставити, а обраний підсвічено."
    proof: shot
    hours: 0.5
    why: "«Вибір елемента для розстановки» не каже, що видно; без панелі редактор теж буває (клавішами), тож картка окрема й 🌱."
  in-game-editor:
    action: edit
    certainty: sure
    description: "Рівень можна зібрати в самій грі: курсором чи мишею ставиш елементи на клітини, відкриваєш наявний рівень для правки й зберігаєш у файл, який гра потім грає як звичайний. Екран редактора — вікно «Вікно редактора рівнів»; панель елементів, гумка, інструменти, undo, плейтест — сусідні картки «Редактора»."
    proof: gif
    hours: 5
    why: "Опис-фрагмент; ціна 🥈 чесна за сам редактор, але вікно editor-window 🥈 (авто-заявка) описує той самий екран — подвійне срібло, питання."
  editor-draw-tools:
    action: edit
    certainty: sure
    description: "Крім клітини за клітиною — прямокутник, лінія й заливка: вказав два кути чи протягнув мишею — заповнилась уся смуга чи область, а заливка міняє цілу звʼязну ділянку одного типу."
    proof: gif
    hours: 2.5
    why: "Опис-фрагмент; ціна гаразд (заливка — той самий обхід, що й «Перевірка досяжності», але тут інша робота)."
  editor-map-check:
    action: edit
    certainty: sure
    coin: tin
    description: "Редактор не зберігає рівень із помилкою й каже, що не так: нема гравця, ящиків більше, ніж цілей, вихід недосяжний — проблемні клітини підсвічено. Сам обхід «чи дійде» — «Перевірка досяжності»; повідомлення на битому файлі — «Валідація мапи»."
    proof: shot
    hours: 1
    why: "Перевірки вже оплачують «Валідація мапи» 📎 і «Перевірка досяжності»; тут — підʼєднати їх до кнопки «зберегти» й підсвітити клітини. T273 Q5 лишив картку окремо — лишаю, але 🥉 платило за BFS удруге."
  editor-erase:
    action: edit
    certainty: sure
    description: "Правий клік чи гумка з панелі прибирає елемент із клітини — лишається порожня підлога."
    hours: 0.3
    why: "Опис «Видалення елементів з мапи» не каже, як; ціна 🌱 гаразд."
  level-exchange:
    action: edit
    certainty: sure
    description: "Рівень, зібраний у редакторі, вивантажується одним файлом, а чужий файл завантажується через меню гри (вибір файла) і зʼявляється у списку рівнів. Обмін через сервер — картка лаби 5."
    proof: gif
    hours: 1
    why: "T271 радив архів («експорт = збереження, імпорт = рівні з файлів»), T273 Q5 лишив; тоді картці треба своя робота — імпорт з меню в список рівнів, — і її описано."
  editor-undo:
    action: keep
    certainty: sure
    proof: gif
    hours: 2
    why: "Без змін (стек знімків мапи + redo ≈ «Без ліміту» 🥉 у грі); гіфка — Ctrl+Z туди й назад."
  editor-playtest:
    action: edit
    certainty: sure
    coin: tin
    description: "Кнопка «Грати» в редакторі запускає рівень, який зараз на полі, без збереження у файл; вийшов із гри — повернувся в редактор із тим самим рівнем."
    proof: gif
    hours: 1
    why: "Гра вже вміє стартувати з мапи («Рівні з файлів»), тож плейтест — передати їй поточну мапу й повернутись: година, 📎; кнопку «грати» до того ж згадує вікно редактора."

  # ── levels / format ──────────────────────────────────────────────────────
  level-from-txt:
    action: edit
    certainty: sure
    coin: tin
    proof: code
    hours: 1.5
    why: "Обовʼязкове лаби 2 (п. 4, з п. 5 «кілька рівнів = кілька файлів»): прочитати символьну мапу в матрицю через словник символів — година-півтори; сусіди «Валідація мапи» 📎, «Результат партії у текстовий файл» 🌱. Опис гаразд."
  import-open-formats:
    action: edit
    certainty: sure
    games: []
    description: "Гра відкриває рівні в чужому відкритому форматі, як вони лежать в інтернеті, — колекції Sokoban у .xsb, судоку рядком із 81 цифри, шахові позиції у FEN — і грає їх без ручної переробки. Свій формат — «Рівні з файлів»."
    proof: shot
    hours: 2
    why: "Опис-фрагмент; обмеження [sokoban, paper-puzzles] суперечить демо chess, що її заявляє (FEN), та й Boulder Dash має свій відкритий формат."
  map-validation:
    action: edit
    certainty: sure
    description: "Битий файл рівня не валить гру: замість трасування Python — зрозуміле повідомлення, що не так і де («рядок 3: невідомий символ Q», «ящиків 4, цілей 3»), і гра повертається в меню. Те саме в редакторі перед збереженням — «Перевірка мапи редактором»."
    proof: shot
    hours: 1
    why: "Опис-фрагмент; текст — з T271 (там пропонувалось злиття, не взяте T273 Q5), межу з редактором названо."
  level-metadata:
    action: edit
    certainty: sure
    description: "У файлі рівня, крім мапи, є заголовок — назва, автор, складність, — і гра показує їх у списку рівнів чи перед рівнем."
    proof: shot
    hours: 0.5
    why: "Додано, що видно на екрані: заголовок, який гра не показує, перевірити нема як."
  level-objects-format:
    action: keep
    certainty: sure
    proof: code
    hours: 2.5
    why: "Без змін; доказ — файл рівня з обʼєктами й код, що з нього будує сутності."
  level-format-doc:
    action: keep
    certainty: sure
    proof: code
    hours: 0.5
    why: "Без змін; доказ — посилання на таблицю в README."

  # ── levels / generation ──────────────────────────────────────────────────
  maze-generation:
    action: edit
    certainty: sure
