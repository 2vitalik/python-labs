# T285 · ревізія каталогу v6, група field-levels: «Поле» (30) + «Рівні» (40) · 2026-11-13
# Правила — T284 §7 (proof), §8 (шкала: ціна = час першокурсника); попередні проходи — T271 review-*.yaml, T275 drafts/logic/polish,
#   T279 logic2 (їм не суперечу без причини; де розвертаю — причина в why).
#
# ── Цифри ───────────────────────────────────────────────────────────────────
# Переглянуто 70: активних 69, архівна 1 (unsolvable-states — архів доречний), чернеток нема.
# Дії: keep 36 · edit 34 (ціна — 10, назва — 4, games → [] — 9, опис — 28) · merge 0 · archive 0 · activate 0 · keep-draft 0.
# Нових карток — 3 (два способи керування, повторювана «Ще один рівень»). unsure — 0: сумніви винесено в questions.
#
# ── Найспірніше ─────────────────────────────────────────────────────────────
#  1. reachability-check 🥇→🥉: та сама заливка / BFS, що «Перевірка звʼязності» 🥉 і «Каскадне відкриття нулів» 🥉.
#  2. unique-puzzle-generation 👑→🥇: без розвʼязувача генератора нема, а розвʼязувач оплачує «Розвʼязувач» 🥇
#     (демо sudoku заявляє обидві) — разом лишається 👑, але без подвійної оплати розвʼязувача. Це єдина корона в каталозі.
#  3. infinite-field 🥇→🥈: дописати ряди попереду й стерти пройдені — правила вибору смуги, рівня «Рівень зі шматків» 🥈
#     (обидві картки наводять Crossy Road), а не алгоритм з перевіркою розвʼязувачем.
#  4. level-from-txt 🥉→📎: обовʼязкове лаби 2 — символьна мапа у матрицю за годину-півтори; поруч «Валідація мапи» 📎.
#  5. checkpoint, editor-map-check, editor-playtest 🥉→📎: кожна — тонка надбудова над сусідкою, яка вже платить за основну
#     роботу (респавн · валідація й досяжність · завантаження рівня).
#  6. time-programmed 📎→🌱: друга авто-заявка за ту саму «програму команд» (T271 і T275 це вже помічали, не застосовано).
#  7. control-drag-piece 🥉→📎 і grid-layers 🥈→🥉: рівняю із сусідами «Малюю шлях» 📎 і «Обʼємна (3D)» 🥈.
#  8. Золото генерації, що лишається: maze / dungeon — нижній край (DFS, кімнати + коридори: 8–10 год), no-guess і
#     difficulty-rating — верхній (свій логічний розвʼязувач: 12+ год). Нерівні, але обидва краї — в межах 🥇.
#  9. games знято в 9 картках: «типові ігри» замість «лише для цієї гри» суперечать T284 §8 і самим еталонам
#     (level-bank ← sokoban, import-open-formats ← demo chess, level-solver ← inertia, wrap-edges ← demo chess).
# 10. Повторюваних (max_count ≠ 1) у групі нема, хоч «додатковий рівень» — головний приклад max_count з T68/T70 і score.md
#     обіцяє «перші ~5 однакових — повна ціна» → нова extra-level 🌱 🔁5.
group: field-levels
cards:

  # ── field / control ──────────────────────────────────────────────────────
  control-direct:
    action: keep
    certainty: sure
    hours: 0.3
  control-indirect:
    action: keep
    certainty: sure
    proof: gif
    hours: 1
    why: "Ціна й опис гаразд (пошук шляху оплачує своя картка); гіфка показує, що після кліку сутність іде сама кілька тіків."
  control-click-cell:
    action: keep
    certainty: sure
    hours: 0.5
  control-drag-piece:
    action: edit
    certainty: sure
    coin: tin
    proof: gif
    hours: 1.5
    why: "Взяти фігуру, вести її під курсором і відпустити на клітину — та сама година, що «Малюю шлях» 📎; бронза лишилась від старої drag-drop-piece, коли «Клік по клітині» 🌱 ще не був окремою базою."
  control-swipe-all:
    action: keep
    certainty: sure
    hours: 1
  control-drag-path:
    action: keep
    certainty: sure
    proof: gif
    hours: 1.5
    why: "Без змін; гіфка — бо суть у лінії, що тягнеться за мишею."
  control-mark:
    action: keep
    certainty: sure
    hours: 0.5
  control-programmed:
    action: edit
    certainty: sure
    description: "Спершу складаєш список команд — вперед, поворот, повтори, — потім запускаєш, і сутність виконує їх сама, клавішами вже не втрутишся: Karel, Lightbot, Human Resource Machine. Екран, де складаєш програму, — вікно «Редактор програми»; власні процедури й умови — картки «Програми гравця»."
    proof: gif
    hours: 3
    why: "Ціна чесна (список команд + виконавець), але поруч вікно «Редактор програми» 🥈 описує те саме «список команд, запуск, крок» — названо межу; про ціну вікна — питання."

  # ── field / grid ─────────────────────────────────────────────────────────
  grid-square:
    action: keep
    certainty: sure
    hours: 0.2
  grid-hex:
    action: keep
    certainty: sure
    hours: 3
  grid-graph:
    action: keep
    certainty: sure
    hours: 2.5
  grid-iso:
    action: keep
    certainty: sure
    hours: 2
    why: "Ціна гаразд (ромби, порядок малювання, зворотний перерахунок кліку ≈ 2 год), але за змістом це вид, а не сітка: демо pvz має водночас «Сітка: ізометрична» і «Вид: згори» — питання про перенос у «Вид»."
  grid-layers:
    action: edit
    certainty: sure
    coin: bronze
    description: "Клітина має висоту чи поверх, і правила її враховують: плитку маджонгу можна взяти, лише коли згори нічого нема, а на пагорб ступаєш лише на одну висоту вгору. Поверхи-рівні, між якими ходиш сходами, — «Поверхи через сходи»; підлога й ящик в одній клітині — «шари клітини» в описі поля, не ця картка."
    hours: 3
    why: "Срібло прийшло від чернетки «Клітини з висотою» 🥈, хоча стартова пропозиція T273 Q4 давала шарам 🥉; 2.5D (висота як ще одне число в клітині) — 2–3 год, на крок нижче за повне 3D 🥈. «Сходи між поверхами лабіринту» з опису прибрав — це «Поверхи через сходи» 📎."
  grid-1d:
    action: keep
    certainty: sure
    hours: 0.5
  grid-3d:
    action: keep
    certainty: sure
    hours: 5
  grid-nested:
    action: keep
    certainty: sure
    hours: 4
    why: "Сумнів 🥉/🥈: великі хрестики-нулики — 3–4 год, Patrick's Parabox — значно більше; лишаю срібло."

  # ── field / physics ──────────────────────────────────────────────────────
  gravity-down:
    action: keep
    certainty: sure
    proof: gif
    hours: 2
    why: "🥉 — падіння з правильним порядком обходу й станом «падає» (камінь, що падає, вбиває, а той, що лежить, — ні), як «Інерція» 🥉; гіфка — бо це рух."
  gravity-up:
    action: keep
    certainty: sure
    proof: gif
    hours: 2
    why: "Дзеркало «вниз», гравітація одна на поле — ціна та сама."
  gravity-per-type:
    action: keep
    certainty: sure
