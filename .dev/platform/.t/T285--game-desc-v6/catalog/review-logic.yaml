questions:
  - "Шахи: «Мат» і «Нічия патом» (була «Шах / пат») 🥇 → 📎 я застосовую разом із пропозицією entities-b «Заборона ходу під шах» 🥇 → 🥈 — ядро «чи бʼє хтось короля після ходу» платиться раз, мат і пат поверх нього по годині. Тоді ⭐ шахів — лише «AI-суперник з minimax»: тег algo з «Мату» й «Шах / пат» прибрати, а minimax-у, що його досі не має, додати (полів для тегів у вердиктах нема). Рекомендую так; якщо хочеш ⭐ у самому шаховому ядрі — хай золото буде одне, на «Заборону ходу під шах», мат і пат усе одно 📎. Злиття мату й пату не раджу: заявки еталона й демо вже розведені."
  - "Підкріплення ↔ Спавн за розкладом (T280 Q11.1): рекомендую b — spawn-schedule перенести в «Логіка → Хвилі та спавн» поруч із reinforcements і enemy-waves: там «скільки й коли ворогів у рівні» (за годинником, на заміну, хвилями), а «Сутності → Поява» лишається «де й як зʼявляється одна сутність». Обидві картки лишаються: різні тригери, і battle-city чесно заявляє обидві на одному правилі (таймер + запас)."
  - "Гра пришвидшується ↔ Та сама мапа, інші числа (T280 Q11.2): опис я зробив про лічильник посеред гри; рекомендую b — правило еталона frogger «рівень > 1 → смуги швидшають» перенести в заявку «Та сама мапа, інші числа» на рівнях: межа тоді за способом — правило «лічильник → швидкість» проти чисел у даних рівнів."
  - "Пауза ↔ Пауза-меню (T273 Q5): рекомендую a — лишити обидві: зупинка гри 🌱 і вікно з пунктами 📎 — доповнення, а не дубль; рецензент interface уже дописав межу в «Пауза-меню». Окремо: дім «Паузи» в «Чіти і складність» випадковий, але переносити нема куди."
  - "Збереження тепер «основа + доповнення»: «Збереження в один слот» 🥈 і поверх нього «Кілька слотів збереження» 📎, «Автосейв» 📎. Еталон 2048 заявляє лише save-autosave, демо tanks — multi-slot + autosave, демо sudoku — autosave: дозаявити їм save-single-slot (рекомендую, тією ж правкою даних, що T280 Q12)."
  - "games знято з 8 карток (collect-all, reach-exit, destroy-all-enemies, time-out, difficulty-levels, hot-seat, progress-acceleration, in-round-upgrades): їх заявляють еталони інших ігор. Фільтр «гра» на /tasks показує лише картки, де ця гра вписана, тож «Дійти до фінішу» зникне з фільтра maze. Рекомендую фільтр гри навчити показувати й універсальні картки (те саме питають entities-b та interface)."
  - "«Перемога лінією з N» 📎 — нову картку в «Логіка → Перемога» запропонував рецензент entities-b; підтримую (хрестики-нулики, «4 в ряд» — часті перші ігри), свого дубля не додаю. Ціна на рівні «Пазл розвʼязано» 📎."
  - "«Реліквії забігу» влито в «Апгрейди в раунді», «Хід поштою» — в «Онлайн-партію»; синоніми обох чернеток (реліквії, артефакти; заочна партія, по листуванню) варто перенести в aliases картки-цілі — скрипт вердиктів синонімів не переносить. Рекомендую так."

notes: |
  Шкала в «Логіці» здебільшого тримається: умови перемоги й поразки — 🌱, коли це одна умова на лічильник чи подію (зібрав усе,
  дійшов до виходу, життя скінчились, час вийшов, ліміт ходів), і 📎, коли гра сканує все поле зі станом (нема ходів у 2048,
  пазл розвʼязано, помилки проти розвʼязку, домівки Frogger). З цього правила випадали лише шахові «Мат» і «Шах / пат» 🥇 —
  виправлено. Нова «Набрати N очок» 🌱 і чужа «Перемога лінією з N» 📎 у правило лягають.

  Ціна пливла вгору в доповненнях сімей: діти «Збереження гри» коштували по 🥈, хоча поверх основи кожна — година, і демо
  брали дві-три за одне збереження. Те саме видно ще в двох місцях, де я не міняв: «Безперервне перемотування» 🥈 і
  «Запис партії й повтор» 🥈 у покрокових іграх майже безкоштовні поверх стека станів «Скасування без ліміту» (дорогі лише
  в реальному часі); «Власні процедури» 🥈 — радше 🥉 (стек повернень у готовому виконавці), але програмних ігор нема ні в
  еталонах, ні в демо — калібрувати нема на чому.

  Перевірки пазлів були дорожчі за сусідів тієї ж роботи (валідність розмітки 🥉 проти підказок на лінії 📎) — вирівняно.

  Плата двічі за одне правило — у цих парах межу тепер названо в обидва боки: «Вичерпано час» + «Карателі» (bomberman),
  «Спавн за розкладом» + «Підкріплення» (battle-city), «Hot-seat» + «Індикатор режиму» (chess), «Один крок назад» ⊂
  «Скасування без ліміту». Пара «Смерть від дотику» + «Поразка: скінчились життя» на одному правилі в грі з одним життям —
  дві 🌱, свідомо (смерть і кінець гри — різні шматки).

  «Лише ігри» в цій групі вжито як «де зустрічається»: 8 універсальних карток мали одну-дві гри, хоча їх заявляють інші еталони.
  Лишив games там, де картку справді заявляє одна базова гра (шахові, 2048, paper-puzzles, pvz-lite, bomberman).

  Підкатегорія «Суперник і черга ходів» перевантажена (14 → 13): у ній три різні речі — ШІ за сторону, правила черги партії
  (черга, пас, таймер, нічия), режими на двох (hot-seat, одна клавіатура, два поля, онлайн). Якщо колись ділити — «ШІ-суперник»
  і «Гра на двох»; не пропоную зараз. «Програма гравця» — 4 активні картки, жодну не заявляє ні еталон, ні демо.

  Заготовки й дані, яких вердикт не виправить:
  - check-stalemate: заготовка `no_moves?in_check>draw` — та сама умова, що в мату, а пат — це «НЕ під шахом»; заперечення в
    синтаксисі `@rule(…)` нема (еталон chess пише `not: true`), тож редактор підказує цю картку на матовому правилі.
  - еталон minesweeper: «клік по міні → поразка» — правило без картки; найближча «Смерть від середовища» (клітина, на яку став),
    але в сапері клітину відкривають курсором — рецензентові «Сутностей» варто назвати і цей випадок.
  - демо tanks заявляє in-round-upgrades на покупці в магазині (відомо з T280 Q12) — після нового опису суперечність ще помітніша.
  - «Розвʼязувач» має синонім «підказка ходу» — після «Підказки з лімітом» його краще прибрати.
