    hours: 1
    why: "Завантажити словник у множину й перевірити слово — година разом із нормалізацією регістру й апострофа; як скласти слово з поля, платить сама гра. 🥉 дорожче за всі сусідні перевірки ряду. Гіфка — неіснуюче слово не зараховано."
  run-length-clues:
