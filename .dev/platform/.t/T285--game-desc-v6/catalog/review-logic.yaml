# T285 · ревізія каталогу v6 — група logic («Логіка»: перемога, поразка, рахунок і час, хвилі, економіка, суперник,
#   перевірка обмежень, збереження, історія ходів, чіти і складність, програма гравця) · 2026-11-13 · рецензент-агент
# Правила — T284 §7 (proof), §8 (ціна = час першокурсника). Тип і дім двічі перевірені (T275 logic.yaml, T279 logic2.yaml) — не
#   повторював; звірено з 17 еталонами, 9 демо і вердиктами сусідніх груп T285 (entities-a/b, field-levels, interface, code-support).
#
# Переглянуто 85 карток: активних 76, чернеток 5, архівних 4 (архів доречний: усі чотири влиті в живі картки).
# keep 44 (з них 15 лише з доказом proof) · edit 36 · price 9 (7 в edit, 2 в activate) · merge 2 · archive 0 · activate 3 ·
#   keep-draft 0 · unsure 0. Нових карток 2. Питань 8.
# Ціни: check-stalemate 🥇→📎 · checkmate 🥇→📎 · markup-validity 🥉→📎 · word-validation 🥉→📎 · save-multi-slot 🥈→📎 ·
#   save-autosave 🥈→📎 · save-progress 🥉→📎 · при активації garbage-attack 🥈→🥉, fsm-program 🥇→🥉.
#
# Найспірніше:
#  1. «Шах / пат» → «Нічия патом» 📎 і «Мат» 📎 (обидві були 🥇): ядро «чи бʼє хтось короля після ходу» оплачує «Заборона ходу
#     під шах» (entities-b пропонує їй 🥈), мат і пат — перебір усіх ходів поверх неї, година. Двічі відкладалось (T273/T277 Q5),
#     тепер є шкала часу; ⭐ шахів лишається minimax — питання 1.
#  2. Збереження: «Збереження в один слот» 🥈 — основа (так і в шкалі T284 §8), «Кілька слотів» і «Автосейв» 🥈 → 📎 — доповнення
#     поверх неї, бо за одну підсистему платили двічі-тричі. Еталон 2048 заявляє лише автосейв — питання 5.
#  3. «Збереження рекордів і прогресу» 🥉 → 📎: рівня «Статистики профілю» й «Досягнень» 📎, що теж живуть між запусками.
#  4. «Валідність розмітки» 🥉 → 📎 і «Перевірка слова словником» 🥉 → 📎: та сама робота, що в сусідів «Підказка на лінії» /
#     «Підказки довжин блоків» 📎 — одна перевірка ряду чи слова.
#  5. Чернетки: «Реліквії забігу» → «Апгрейди в раунді» (бонус, що вмикає правило, — той самий підібраний бонус); «Хід поштою» →
#     «Онлайн-партія» (заочно через сервер — та сама мережева гра; без сервера — «Стан гри як рядок-код»).
#  6. Активовано «Сміття на поле суперника» 🥉, «Програма як скінченний автомат» 🥉, «Набрати N очок» 🌱.
#  7. «Вичерпано час» більше не обіцяє «кару»: Bomberman заявляє на одному правилі і її, і «Карателів» — межу названо.
#  8. «Смерть стирає збереження»: прибрав Fire Emblem — загибель юніта між боями інша механіка, сейв там не стирається.
#  9. games знято з 8 універсальних карток, які заявляють еталони інших ігор (collect-all, reach-exit, time-out…) — фільтр «гра»
#     на /tasks їх тоді сховає, питання 6 (те саме питають entities-b та interface).
# 10. Назви: без « — » («Поразка: скінчились життя», «Поразка: нема ходів»), діти сімей зрозумілі без батька («Випадковий
#     AI-суперник», «Скасування ходів без ліміту», «Збереження в один слот»), «Прискорення прогресу» → «Гра пришвидшується».

