  # ═══ game-logic / constraints ═══
  markup-validity:
    action: edit
    certainty: sure
    coin: tin
    proof: gif
    hours: 1.5
    why: "Перевірка «нема повторів у рядку, стовпці, блоці» — одна функція на три області, година з перевіркою; сусіди тієї ж роботи «Підказка на лінії» й «Підказки довжин блоків» — 📎, а показ червоним окремо платить «Конфлікти розмітки» 📎. Гіфка — свідомо хибна цифра одразу ловиться."
  completion-detection:
    action: keep
    certainty: sure
  check-stalemate:
    action: edit
    certainty: sure
    title: "Нічия патом"
    coin: tin
    description: "Сторона, що ходить, не під шахом, але жодного дозволеного ходу не має — гра сама оголошує нічию (пат) і показує вікно кінця партії. Мат — «Мат»; чи бʼє хтось короля після ходу — «Заборона ходу під шах»."
    proof: shot
    hours: 1
    why: "Заготовка й еталон chess — лише пат → нічия, а «Шах / пат» обіцяв ще й оголошення шаху; «Виявлення загрози і безвиході» — не опис. Поверх легальних ходів пат — перебір усіх ходів і одна умова, година, не 10–12 (T275 радив ту саму назву, T273/T277 Q5 відклали; тепер є шкала часу). Заготовка `no_moves?in_check>draw` збігається з матовою — заперечення словник не має, див. notes."
  deadlock-detection:
    action: edit
    certainty: sure
    description: "Гра під час гри помічає ящик, який уже не дійде до жодної цілі, і одразу каже про це. Мінімум — мертві клітини (кути й стіни без цілей, пораховані заздалегідь обходом від цілей) і «замерзла» пара ящиків; слот — які ще види ловить."
    proof: video
    hours: 10
    why: "Золото справедливе лише за обхід мертвих клітин плюс «замерзлі» пари; самий кут — пів години, а старий опис дозволяв заявити й його. Відео — алгоритм треба пояснити голосом, як і всі ⭐."
  connectivity-check:
    action: keep
    certainty: sure
    proof: gif
    hours: 2.5
    why: "Без змін; доказ — гіфка: розвʼязок не зараховано, доки острови чи труби не зʼєдналися."
  single-loop-check:
    action: keep
    certainty: sure
    hours: 2.5
  neighbor-count-clue:
    action: keep
    certainty: sure
    hours: 0.5
  line-sum-clue:
    action: keep
    certainty: sure
    hours: 1
  word-validation:
