  - "Шахові 🥇: «Шах / пат» і «Мат» (Логіка) спираються на ту саму перевірку «клітина під боєм», що й «Заборона ходу під шах» (пропоную 🥈); повна легальність шахів зараз — три золоті, ≈ 30 годин монеток за 6–8 годин роботи. Рекомендую «Шах / пат» і «Мат» по 📎 — поверх легальних ходів це кілька рядків."
  - "games знято з шести універсальних карток (Постріл, Вибух заданої форми, Ланцюгова детонація, Руйновані блоки, Ключ і двері, Тимчасові режими). Фільтр «гра» на /tasks показує лише картки, де ця гра вписана, тож «Постріл» зникне з фільтра battle-city. Рекомендую так лишити, а фільтр гри навчити показувати й універсальні картки."
  - "unit-xp-skills активую; опис параметра «Рівень прокачки» («юніт набрав досвіду й став сильнішим») пропоную звузити до самого числа — інакше межа з карткою розмита (рецензент entities-a чи ти)."
  - "Нова «Перемога лінією з N» лежить у «Логіка → Перемога», поза моєю групою — додати її туди (рекомендую) чи віддати рецензенту Логіки?"
  - "Заявки еталонів і демо, що не збігаються з картками (список у notes), — поправити разом із T280 Q12? Рекомендую так: після правок описів ці місця прямо суперечать карткам."

notes: |
  Взаємодія (29) — справді найбільша й найрізнорідніша: поруч універсальні правила (портали, ключі, кнопки, збирання,
  обмін місцями) і 11 правил однієї гри (Lode Runner ×2, PvZ ×2, Frogger, Inertia, Boulder Dash, Snake, Bomberman…),
  які тримає купи лише поле games. Точних дублів нема; «те саме з іншим тригером» знайшлось тричі:
  freeze-into-block ↔ cell-transform (влито), падіння каменю ↔ crush-by-slide (розширено), предмет-перепустка ↔
  key-and-door (розширено). dig-terrain ↔ destructible-blocks ↔ item-pickup — одна дія «Y зникає», але різні тригери
  й різні ігри, лишив окремо з однаковою ціною 🌱 для двох без ефекту.

  Шкала пливе на двох кінцях: (1) у стані три 🥇 з тегом algo, з яких алгоритм не є жоден (multi-cell-size,
  orientation-state; у легальності — no-move-into-check) — тег algo треба зняти (у схемі вердикту поля тегів нема);
  (2) правила «одна умова» розкидані між 🌱 і 📎 без логіки: impassable / one-way / stop-cell / destructible 🌱, а
  swap-on-contact, crush-by-slide, piece-capture 📎 — усі 0.5–1 год. Перевів лише dig-terrain (найочевидніша); решта на межі.

  Діти сімей без опису (shoot-modes: черга, дріб; teleport: усі три) — дописав опис і назви, зрозумілі без батька.
  Батьки shoot-modes і teleport — заголовки, їхня монетка довідкова.

  Синонім «напрям погляду» / facing у orientation-state веде студента не туди (це facing-icon) — прибрати
  в aliases.yaml (поля aliases у вердикті нема).

  Заявки еталонів і демо, що не збігаються з картками (не правив — це дані, не каталог):
  - battle-city: правило «Куля × Куля» без projectile-collision, хоча її опис наводить саме Battle City.
  - boulder-dash: «камінь, що падає, × світлячок / метелик → вибух» без карток — тепер crush-by-slide + blast-wave;
    алмази, як і золото lode-runner і фрукти pac-man, без item-pickup.
  - pvz-lite: «Зомбі × рослина → гризе» без картки — тепер melee-vs-ranged.
  - демо rogue: teleport-one-way на «Сходи вниз» (це stairs-levels); projectile-collision на «Стріла × будь-що»
    (це projectile-shot); cell-transform на важіль (це button-toggle); floor-types на полі з описом генерації й камери.
  - демо tanks: cell-transform на кнопку воріт і key-and-door на ворота без ключа (обидва — button-toggle);
    telegraphed-intents на Мауса, який нічого не оголошує; floor-types + inertia-slide + environment-death за лід і воду.
  - демо pvz: telegraphed-intents на Зомбі («смужка хвиль») — уже в T280 Q12.

  Легальність: тип за замовчуванням підкатегорії — mechanic, але всі 14 активних карток і нова dice-move — rule.
  Стан: після архіву п'яти карток у параметри підкатегорія тримає механіки сутності (інвентар, статуси, розмір,
  орієнтація) — перевантаження нема. Бій: сімʼя shoot-modes з двох дітей — нормально.
