    proof: shot
    aliases: {uk: ["хрестики-нулики", "4 в ряд", "гомоку", "пʼять у ряд"], ru: ["крестики-нолики", "четыре в ряд", "гомоку"], en: ["tic-tac-toe", "connect four", "gomoku", "n in a row"]}
    hours: 1
    why: "Хрестики-нулики, «4 в ряд», гомоку — найчастіші перші ігри студентів, каталог їх згадує (AI-суперник, «Поле в полі», «Обʼємна (3D)», гравітація «Вниз»), але картки на саму перемогу нема: «Лінія з N однакових» прибирає лінію, «Пазл розвʼязано» — про пазли. Поза моєю групою — у «Логіка → Перемога»."

