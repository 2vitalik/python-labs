# T285 · ревізія каталогу v6 · група entities-b: «Сутності» — легальність ходу, взаємодія, бій і снаряди, стани й ефекти
# Правила — T284 §7 (proof), §8 (ціна = час першокурсника); попередні ревізії T271 (review-entities, merged.yaml),
#   T275 (drafts, logic, polish), T279 — не розвертав без причини; звірено з 17 еталонами й 9 демо (заявки на правилах).
#
# Переглянуто 82 картки: 64 активні, 2 чернетки, 16 в архіві.
#   keep 38 (з них 33 лише з доказом proof) · edit 25 (з них price 6) · merge 2 · archive 16 (усі вже в архіві — доречно) ·
#   activate 1 (unit-xp-skills, 🥉 як було) · keep-draft 0 · нових карток 4. Unsure — 1 (floor-types).
#   Ціни: multi-cell-size 🥇→🥉 · orientation-state 🥇→🥈 · no-move-into-check 🥇→🥈 · cursor-place 🥉→📎 ·
#         chain-detonation 🥉→📎 · dig-terrain 📎→🌱.
#
# Найспірніше:
#  1. multi-cell-size 🥇→🥉 і orientation-state 🥇→🥈: не алгоритми (тег algo хибний) — модель сутності на кількох клітинах
#     і модель граней; 2–5 годин першокурсника, а не 10–12.
#  2. no-move-into-check 🥇→🥈: пробний хід + «чи бʼє хтось короля» поверх готових патернів; ту саму перевірку ще двічі
#     оплачують «Шах / пат» 🥇 і «Мат» 🥇 (Логіка) — питання.
#  3. cursor-place 🥉→📎: плату з запасу вже оплачує «Валюта в раунді» 🥉 (pvz-lite заявляє обидві); лишається «обрав
#     клітину → перевірив → поставив». Заявляють два еталони.
#  4. floor-types → role-terrain (unsure): лід / вода / вогонь уже оплачені «Інерцією», «Смертю від середовища»,
#     «Непрохідними клітинами»; демо tanks бере 🥈 + 🥉 + 📎 за ті самі три клітини. T273 Q5 лишав окремо — питання.
#  5. freeze-into-block (чернетка) → cell-transform, яка стає «Перетворення на інший тип»: те саме правило з іншим тригером.
#  6. games знято з шести універсальних карток (Постріл, Вибух, Ланцюгова детонація, Руйновані блоки, Ключ і двері,
#     Тимчасові режими): їх заявляють 2–5 різних ігор; фільтр «гра» їх тоді не покаже — питання.
#  7. projectile-shot + line-of-sight-attack на одному правилі pvz-lite — лишаю обидві (снаряд і тригер — дві роботи),
#     межу дописав в опис «Пострілу».
#  8. melee-vs-ranged розширено на удар гравця і зомбі, що гризе рослину (правило pvz-lite зараз без картки).
#  9. Нова «Перемога лінією з N» — у «Логіка → Перемога», поза моєю групою (знайшов як сусідку «Лінії з N однакових»).
