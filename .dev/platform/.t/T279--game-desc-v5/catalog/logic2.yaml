neighbors:  # картки «Сутностей» і «Рівнів», з якими «Логіка» перетинається: межа в обидва боки
  random-walk:
    title: "Випадкове блукання"
    home: entities/move
    kind: rule
    verdict: keep
    certainty: sure
    why: "Пара до ai-random: опис «З забороною розвороту на місці» не казав, що це ворог на полі, і не відсилав до сторони-суперника. Суть (без розвороту назад) лишаю; еталон pac-man пише саме це («випадковий дозволений напрям без розвороту»)."
    change:
      description: "Ворог щотіку йде у випадковий дозволений бік, але не розвертається назад на місці (привиди Pac-Man у переляку). Компʼютер, що випадково обирає хід за цілу сторону (шахи), — «Випадковий» в «AI-суперник»."
  chase-greedy:
    title: "Жадібна (крок у бік цілі)"
    home: entities/move
    kind: rule
    verdict: keep
    certainty: sure
    why: "Пара до ai-greedy; власного опису не було (студент бачив лише заголовок сімʼї). Межа з chase-bfs — без пошуку шляху."
    change:
      description: "Ворог щотіку робить крок у той дозволений бік, звідки до цілі найближче, — без пошуку шляху, тож за стіною може застрягти (привиди Pac-Man на перехресті). Компʼютер, що обирає за сторону найвигідніший хід (шахи), — «Жадібний» в «AI-суперник»."
  spawn-random-cell:
    title: "Спавн у випадковій клітині"
    home: entities/spawn
    kind: rule
    verdict: keep
    certainty: sure
    why: "Залишок T275: шліфування (polish.yaml) дописало сюди текст картки рівня random-placement («цегла щоразу лягає інакше») під злиття, а злиття скасували (SKIP_MERGE) — і затерли опис з logic.yaml. Тепер дві картки різних типів (rule на правилі й level на рівні) мають майже той самий опис. Повертаю опис logic.yaml і межу."
    change:
      description: "Сутність зʼявляється у випадковій вільній клітині — на старті рівня, після кожного ходу (нова плитка в 2048) чи коли попередню зʼїли (їжа в Snake); гра перевіряє, що клітина порожня й не на старті гравця. Уся розкладка рівня щоразу інша (цегла в Bomberman) — картка рівня «Випадкова розстановка на готовій мапі»."
  random-placement:
    title: "Випадкова розстановка на готовій мапі"
    home: levels/generation
    kind: level
    verdict: keep
    certainty: sure
    why: "Друга половина межі зі spawn-random-cell: картка рівня (еталон bomberman — на рівні) про всю розкладку, а не про одну сутність. Зміст лишаю, дописую приклад і посилання."
    change:
      description: "Рівень щоразу інший: на готовій мапі гра розкидає цеглу, предмети й ворогів по вільних клітинах — не на старті гравця й не замурованими (цегла в Bomberman). Одна сутність, що зʼявляється у випадковій клітині за правилом (їжа в Snake, плитка в 2048), — «Спавн у випадковій клітині»."

