# T275 · ревізія активних карток: «Логіка» пильно, решта каталогу — на тип, пари, дублі, заготовки, описи · 2026-11-10
# Контракт — T270 §4, §6–§11; попередня ревізія — T271 (catalog/review-*.yaml, apply.py OVERRIDES), вибори — T273 Q5–Q7.
# Чернетки ✍️ не чіпав (їх дивиться інший агент); на них лише посилаюсь.
#
# ── Цифри ───────────────────────────────────────────────────────────────────
# Переглянуто 304 активні картки: «Логіка» (50) і всі картки типу game (61) — кожну; звірено з 17 еталонами й 9 демо:
#   187 місць, де картка-правило стоїть на правилі (сигнатура КОЛИ / ТО проти заготовки, як рахує RuleForm.fits()).
# review — 71: kind 2 · move 9 (вихід із сімʼї) · reword 60 (нова заготовка 13 · назва/опис 47, з них F — 30) · merge 0.
# pairs — 3 нові (наявні slug-и) · pairs_new — 3 (з новими картками; окремо, бо їхніх slug-ів у tasks.yaml ще нема).
# new — 11: активні 9 (є в еталоні чи демо), чернетки 2.
# Заготовки: заготовка підходить до правила, на якому картка стоїть, — було 103 / 187, стане 127 / 187.
#
# Як читати: `reword` + `rule` — тип той самий (rule), міняється заготовка. `move` з `parent: ""` — картка виходить
#   із сімʼї в межах своєї підзони; apply.py T275 поля `parent` поки не бере — треба рядок
#   `if "parent" in r: patch["parent"] = r["parent"]`. Заготовка без `when` (`@rule(>respawn)`) підходить до будь-якого
#   тригера, без `then` (`@(all_gone>)`) — до будь-яких ефектів; обидві форми валідні (tasks_clean, taskline, RuleShape).
#
# ── 10 головних знахідок ────────────────────────────────────────────────────
#  1. Підозра «логіка окремо від вікон» — правда, але причина в коді, не в типах карток. Пари PAIRS (catalog.js),
#     ключ яких — тип вікна (pause-menu → game-pause, shop-window → …, leaderboard → score-records, ще 9), не
#     спрацьовують ніколи: WindowCard.vue бере лише неавтоматичні заявки (`!c.auto`), а тип вікна — авто-заявка.
#     Живі лише 6 пар від елементів. Зворотної підказки («функція є, вікна нема») нема зовсім.
#     lobby-window → online-multiplayer веде в чернетку — студент її не бачить.
#  2. Сімʼї inventory 🥉, shop-between-levels 🥉, in-game-editor 🥈: батько — сама функція, діти — доповнення до неї.
#     Але батько сімʼї — лише заголовок: у списку вибору (items.js `!kidsOf`) і на /tasks («×N, діапазон цін») його не
#     заявиш. Пари inventory-window / shop-window / editor-window ведуть саме в ці заголовки. → 9 дітей з сімей (move).
#  3. З 20 карток типу game у «Логіці» не той тип лише в difficulty-levels → level: пресет складності — це рівень
#     зі своїми параметрами (T270 §9). Решта — справжні властивості гри (пауза, магазин, undo, ШІ, збереження, рекорди,
#     hot-seat, чіти); їхній звʼязок із вікнами — пари (див. 1), а не дублі.
#  4. «Усіх ворогів знищено → відкрився вихід» і «зібрав усе → зʼявилась драбина» (звіт T271) — не нові картки, а
#     завузькі заготовки: destroy-all-enemies і collect-all → `{when: all_gone}` (мета, наслідок будь-який). Двері —
#     тип «Двері / барʼєр», вихід — «Дійти до фінішу». destroy-all-enemies підходила 0 з 3 місць, тепер 3 з 3.
#  5. Заготовки, що не підходили жодному місцю: player-death died→lose (0/10 → 5/10 з counter→game_over), item-pickup
#     contact→disappear (0/5 → 2/5 з enter), spawn-schedule і reinforcements (еталони пишуть spawn_at, не spawn: 0/4 → 3/4),
#     time-out counter→lose (0/4 → 2/4 з counter→lives), wrong-mark-lose (0/1 → 1/1). Ще ширше — respawn, restart-level,
#     sound-effects, in-round-upgrades, all-on-targets (Frogger «усі жабки в домівках» лишався без картки).
#  6. Решті потрібні варіанти (T273 Q7c), однією заготовкою не взяти: touch-death (−життя / поразка), environment-death,
#     reach-exit (перемога / наступний рівень, enter / reach), enemy-reached-base (дійшов / базу розстріляли),
#     projectile-shot (клавіша / сам, коли бачить), time-out (−життя / поразка / кара). Перевірив і «сімʼї слів» у
#     fits() (contact≈enter≈picked, spawn≈spawn_at, lose≈game_over, win≈next_level): лише +8 влучань за +30 % зайвих
#     підказок — не раджу. Для event-points і projectile-shot ширша заготовка теж не дала влучань, лише шум — лишив.
#  7. Майже-дублі розвів описами (злиттів 0, чистих дублів серед активних нема): touch-death ↔ environment-death
#     (обидві «пастка»), markup-validity ↔ conflict-highlight, score-records ↔ save-progress ↔ profile-stats ↔
#     stats-window, game-settings ↔ елементи налаштувань і difficulty-levels, body-queue ↔ role-segment.
#  8. Подвійна ціна: editor-window 🥈 + in-game-editor 🥈 за один редактор, а опис вікна перелічує палітру 🌱 й
#     інструменти 🥉 — окремі картки → вікну 📎 (зниження ціни — на твоє «так»).
#  9. descend-and-reverse — баг рядка: ✍️ стоїть після « — », тож розбір зробив картку активною з назвою «Строй: біля краю».
# 10. 32 активні картки без опису; 6 підсвіток (selection-, last-move-, reachable-, conflict-highlight, threat-range,
#     path-preview) мають батька-чернетку highlights, тож студент бачить їх узагалі без тексту. F — 30 нових описів.
#
# ── Пари: обидва напрями ────────────────────────────────────────────────────
# Зворотна підказка («функцію заявлено, а видимого партнера нема») — ті самі пари навпаки; неминучі (партнер мусить
#   бути): shop-between-levels ↔ shop-window · in-game-editor ↔ editor-window · save-multi-slot ↔ save-load-window ·
#   difficulty-levels ↔ mode-select | field-size-picker · markup-validity ↔ conflict-highlight · telegraphed-intents ↔
#   telegraph-marker · sound-volume ↔ volume-control · achievements ↔ achievements-window (нова).
#   Лише в один бік (функція живе й без вікна): game-pause, score-records, hot-seat, inventory, replay, profile-stats,
#   background-music, enemy-waves, daily-puzzle.
# Зайвої картки в жодній парі нема: елемент — показ, функція — робота (так задумано T270 §10.1, «є слайдер гучності —
#   заяви й гучність»). Виняток — ціна editor-window (знахідка 8).
# code-editor-window пари не має: її функція тепер авто-властивість поля control-programmed (заявляється сама).
#
# ── Сумніви ─────────────────────────────────────────────────────────────────
# - undo-step / undo-unlimited / redo / rewind лишив game, як каже ТЗ; але в словнику є ефект `undo`, а сусідня
#   restart-level уже правило «ввід → рестарт». Послідовніше — rule `input>undo`. Еталони sokoban й inertia пишуть
#   undo словами (`custom`), хоча слово є.
# - difficulty-levels: тип level, а дім лишив «Чіти і складність» (там шукають «складність»); T271 переносив карти
#   типу level у зону «Рівні» — тоді levels/progression.
# - pencil-marks → rule: еталон уже має це правило без картки; але показ кількох кандидатів у клітині — ще й рендер
#   поля, ревізія T271 лишила field.
# - restart-level ширше: тепер і «рівень з початку після смерті» (6 правил еталонів) — нове значення картки 🌱.
# - time-out: чистіше — тригер «час вийшов» у vocab.TRIGGERS; лише `{when: counter}` підходив би 3 з 4, але
#   підказувався б на 27 чужих правилах з лічильником.
# - Тип + його визначальне правило = дві монетки: role-static + impassable-cells, role-pickup + item-pickup,
#   role-segment + body-queue, stat-value + event-points (те саме число двічі). Не чіпав — це T273 Q4.
# - T273 Q5 не чіпав: game-pause / pause-menu, check-stalemate / checkmate (лише переназвав «Пат — нічия»),
#   floor-types (тип field при домі в сутностях), sound-warnings, ціна game-settings 🥉.
# - time-programmed 📎 + control-programmed 🥉 — дві авто-заявки за одну ідею «програма команд» (T271 радив
#   time-programmed без монетки — не застосовано).
# - Демо chess і tanks та еталон lode-runner заявляють батьків сімей (undo-redo, ai-opponent, save-game, chase-player)
#   з окремими вердиктами, а інтерфейс показує їх заголовками: або батько — картка, або це хибні дані.
# - Для еталонів (не картки): custom-window там, де тип уже є — Bomberman «Етап» і Boulder Dash «Картка печери» →
#   level-intro, сапер «Новий рекорд» → name-entry, Pac-Man «Інтермісія» → cutscene, демо sudoku «Календар» →
#   calendar-window (нова); Lode Runner «зібрав усе» лічильником → all_gone; Frogger sequential-levels →
#   level-param-ramp (нова); Battle City reinforcements стоїть на правилі за таймером — це spawn-schedule.
# - «Сусідство 4 / 8» (звіт T271) карткою не зробити: потрібен ключ у vocab.FIELD.

review:
  # ── A · не той тип ──────────────────────────────────────────────────────────
  difficulty-levels:
    action: kind
    kind: level
    description: "Перед грою обираєш складність — Beginner / Intermediate / Expert у сапері, швидкість 1–9 у Snake — і вона справді міняє розмір поля, кількість мін чи ворогів, швидкість. У «Рівнях» кожен набір — рівень зі своїми параметрами; вибір — вікно «Вибір режиму чи складності» або елемент «Розмір поля»."
    why: "Пресет складності — це рівень з іншими числами (T270 §9: у рівня свої параметри — складність, ворогів, розмір); тип game лишав заявку без місця, хоча сапер уже описує пресети трьома рівнями. Тип level дозволяє і секцію «Рівні», і конкретний рівень; еталони (minesweeper, snake) і демо tanks пишуть її в claims гри — для level це дозволено. Ціна 📎 та сама."
  pencil-marks:
    action: kind
    kind: rule
    rule: {when: {kind: input}, cond: [{kind: mode}], then: [{kind: mark}]}
    description: "Поруч із ручкою є олівець: у режимі олівця цифра лягає в клітину дрібним кандидатом (кілька в одній клітині), у режимі ручки — відповіддю; перемикач режиму видно на екрані."
    why: "Це поведінка вводу, і еталон paper-puzzles уже має правило «ввід ЯКЩО режим «олівець» ТО позначити кандидат» — без картки, бо картка типу field стояла на рівні гри. Правило і картка не дублюються → картка-правило (сумнів у шапці)."

  # ── сімʼї, де батько — сама функція: діти виходять, батько стає заявним ──────
  inventory-items:
    action: move
    move_to: entities/state
    parent: ""
    why: "Сімʼя з однією дитиною робить «Інвентар» 🥉 заголовком: у списку вибору й на /tasks сам інвентар не заявиш, а пара inventory-window → inventory веде саме в нього. «Застосування предмета» — доповнення, не варіант; підзона й так тримає їх поруч."
  inventory:
    action: reword
    description: "Сутність носить підібрані предмети: вони зберігаються, видно, скільки чого є (панель чи вікно інвентаря), і витрачаються. Ліміт — параметр «місткість»; застосування предмета клавішею — окрема картка-правило."
    why: "Прибрано «Сімʼя: …» — після виходу дитини картка заявляється сама."
  shop-preview:
    action: move
    move_to: game-logic/economy
    parent: ""
    why: "«Магазин між рівнями» 🥉 — сама функція, а як батько сімʼї вона лише заголовок і з редактора не заявляється (демо tanks заявляє її напряму — у даних можна, в інтерфейсі ні); пара shop-window → shop-between-levels теж веде в заголовок. Превʼю, знижки, продаж назад — доповнення."
  shop-sales:
    action: move
    move_to: game-logic/economy
    parent: ""
    why: "Див. shop-preview: вихід із сімʼї, щоб сам магазин став заявним."
  shop-buyback:
    action: move
    move_to: game-logic/economy
    parent: ""
    why: "Див. shop-preview."
  shop-between-levels:
    action: reword
    description: "Між рівнями гравець витрачає зароблене на постійні покращення — швидкість, броню, нову зброю — і вони діють на наступних рівнях. Вітрина — тип вікна «Вікно магазину»; бонус лише до кінця раунду — «Апгрейди в раунді»."
    why: "«Покупка апгрейдів» не казала, що має бути видно й чим це не «Апгрейди в раунді»; разом із виходом дітей картка стає заявною."
  editor-palette:
    action: move
    move_to: levels/editor
    parent: ""
    why: "«Редактор у грі» 🥈 — основа, а як батько сімʼї вона лише заголовок і не заявляється; пара editor-window → in-game-editor веде в заголовок. Палітра, інструменти, гумка, undo, плейтест — доповнення; підзона «Редактор» і так їх групує."
  editor-draw-tools:
    action: move
    move_to: levels/editor
    parent: ""
    why: "Див. editor-palette."
  editor-erase:
    action: move
    move_to: levels/editor
    parent: ""
    why: "Див. editor-palette."
  editor-undo:
    action: move
    move_to: levels/editor
    parent: ""
    description: "Скасування й повернення дій у редакторі рівнів: поставив не те — Ctrl+Z. Скасування ходів у самій грі — «Undo/redo ходів гри»."
    why: "Див. editor-palette; поза сімʼєю назва «Undo/redo» плутається з undo ходів гри — в описі сказано, що це редактор."
  editor-playtest:
    action: move
    move_to: levels/editor
    parent: ""
    why: "Див. editor-palette."

  # ── D · заготовки: нова заготовка ───────────────────────────────────────────
  collect-all:
    action: reword
    rule: {when: {kind: all_gone}}
    description: "Зібрано все, що лежало на рівні — точки в Pac-Man, золото в Lode Runner, призи, — і далі перемога, наступний рівень або відчиняється вихід (тоді сам вихід — «Дійти до фінішу»). Зібрати лише N — «Зібрати квоту»."
    why: "all_gone→win не підходило Pac-Man (→ наступний рівень) і Lode Runner (→ зʼявляється драбина). Картка — про мету, не про наслідок: лише тригер. Закриває «зібрав усе → зʼявилась драбина» без нової картки; Lode Runner в еталоні пише це лічильником — перейти на «зникли всі Золото». Місць 2/4 → 3/4."
  destroy-all-enemies:
    action: reword
    rule: {when: {kind: all_gone}}
    description: "На полі не лишилось жодного ворога (і в запасі підкріплень теж) — перемога, наступний рівень або відчиняється вихід, як у Bomberman."
    why: "all_gone→win не підходило жодному місцю (Battle City → вікно й наступний рівень, Bomberman → вихід відчиняється). Закриває «усіх ворогів знищено → відкрився вихід» без нової картки. Місць 0/3 → 3/3."
  all-on-targets:
    action: reword
    rule: {when: {kind: all_on}}
    description: "Кожна ціль зайнята: ящики на всіх цілях у Sokoban, жабки в усіх пʼяти домівках у Frogger — і перемога чи наступний рівень."
    why: "Frogger пише «усі Жабки на Будиночках → очки, наступний рівень» — під all_on→win не підходило й лишилось без картки. Тригер all_on вживає лише ця картка — шуму нема."
  time-out:
    action: reword
    rule: {when: {kind: counter}, then: [{kind: lives}]}
    description: "Час рівня вийшов (лічильник «час» дійшов до 0) — мінус життя (Frogger, Boulder Dash), поразка чи кара: налітають сильні вороги (Bomberman). Скільки секунд — параметр заявки; час на один хід у партії — «Таймер ходу»."
    why: "counter→lose не підходило жодному з 4 місць. counter→lives — 2/4 і 2 зайві підказки; лише тригер дав би 3/4, але підказувався б на 27 чужих правилах з лічильником. Поразка й кара — варіанти (Q7c) або тригер «час вийшов» у словнику."
  respawn:
    action: reword
    rule: {then: [{kind: respawn}]}
    description: "Після смерті сутність знову зʼявляється у своїй точці — гравець на старті, привид у будиночку, вартовий угорі екрана; можна із затримкою. Продовжити з середини рівня — «Checkpoint»."
    why: "died→respawn не підходило Pac-Man і Lode Runner: вони відроджують у самому правилі дотику. Суть — ефект «відроджується», тригер будь-який; ефект вживає лише ця картка. Місць 1/3 → 3/3."
  restart-level:
    action: reword
    rule: {then: [{kind: restart}]}
    description: "Рівень починається заново з початкового стану — з клавіші чи пункту меню (Sokoban, 2048), а в Bomberman і Lode Runner — після кожної втраченої спроби: зібране й зруйноване повертається на місце."
    why: "Ефект «рестарт рівня» стоїть ще в 6 правилах смерті еталонів (Bomberman, Lode Runner, Boulder Dash) — та сама робота: повернути рівень у стан зі старту. Тригер будь-який; ціна 🌱 та сама (розширення значення — у сумнівах)."
  sound-effects:
    action: reword
    rule: {then: [{kind: sound}]}
    description: "Короткий звук на ігрову подію — постріл, зібрав, вибух, відчинився вихід; у правилі це ефект «звук». Попередження (час добігає, шах) — «Звукові попередження», фонова музика — окрема картка."
    why: "Тригер picked не вживає жоден еталон (підбирання там — дотик), тож картку не підказувало ніде. Суть — ефект «звук». Місць 1/5 → 5/5."
  in-round-upgrades:
    action: reword
    rule: {when: {kind: contact}, then: [{kind: counter}]}
    description: "Підібраний бонус до кінця раунду збільшує параметр гравця — радіус вибуху, кількість бомб, швидкість (Bomberman); щонайменше два види. Постійні покупки між рівнями — «Магазин між рівнями»."
    why: "Тригер picked еталони не вживають: Bomberman пише «Бомбермен × Бонус-вогонь → зникає, дальність вогню +1» — contact→counter."
  player-death:
    action: reword
    rule: {when: {kind: counter}, then: [{kind: game_over}]}
    description: "Життя скінчились (лічильник «життя» = 0) — кінець гри й вікно підсумку. У грі з одним життям це те саме правило, що й сама смерть («Голова × Стіна → поразка»): тоді на ньому і «Смерть від дотику», і ця."
    why: "died→lose не підходило жодному з 10 місць: 5 пишуть «життя = 0 → кінець гри», ще 2 — «життя = 0 → поразка», 3 — дотик → поразка. Нова — 5/10; решта — варіант lose (Q7c)."
  item-pickup:
    action: reword
    rule: {when: {kind: enter}, then: [{kind: disappear}]}
    description: "Гравець стає на предмет — предмет зникає з поля, а гравець одразу щось отримує: очки, життя, ключ у кишеню. Бонус, що діє на час, — «Тимчасові режими»; предмет у запас — «Інвентар»."
    why: "contact→disappear не підходило жодному з 5 місць (еталони inertia, new-ball-game, mined-out пишуть «стає на») і збігалося з 33 чужими правилами; enter→disappear — 2/5 і 2 зайві. Демо через picked / pickup — варіант."
  spawn-schedule:
    action: reword
    rule: {when: {kind: timer}, then: [{kind: spawn_at}]}
    why: "Еталони пишуть появу ворогів у названому місці (spawn_at — «у точці появи»), а не spawn з вибором клітини: battle-city і демо rogue — 0/2 → 2/2. Опис лишається."
  reinforcements:
    action: reword
    rule: {when: {kind: destroyed}, then: [{kind: spawn_at}]}
    description: "Знищив ворога — з точки появи виходить наступний, доки не скінчиться запас (лічильник «ворогів лишилось» видно на екрані). Поява за годинником — «Спавн за розкладом»."
    why: "spawn → spawn_at, як пишуть еталони (демо pvz — 0/1 → 1/1); «+1 ворог за знищеного» не казало про запас і точку появи. Battle City в еталоні ставить картку на правило за таймером — це spawn-schedule (еталон)."
  wrong-mark-lose:
    action: reword
    rule: {when: {kind: counter}, then: [{kind: lose}]}
    description: "Гра рахує хибні цифри чи позначки — ті, що не збігаються з розвʼязком: дійшов до ліміту — поразка; лічильник видно на екрані («Помилки: 2 / 3»). Скільки можна — параметр заявки."
    why: "Зі слотом «скільки помилок можна» поразку дає лічильник, а не саме порушення: paper-puzzles пише counter→lose — 0/1 → 1/1."

  # ── D · заготовку лишаю, ширшає опис; потрібні варіанти ──────────────────────
  touch-death:
    action: reword
    description: "Ворог, що рухається, торкнувся гравця — мінус життя й повернення на старт; поки діє щит чи енерджайзер — ні (умова «не у стані»). У грі без життів ефект — одразу «поразка». Клітина, на яку став сам (вода, лава, міна), — «Смерть від середовища»."
    why: "C: «Ворог/пастка вбиває» перетиналось зі «Смертю від середовища» (теж пастки) — розвів: ця — ворог, та — клітина. D: contact→lives лишаю (4/8, 6 зайвих); лише тригер — 6/8, але 78 зайвих підказок; Snake (→ поразка) — варіант."
  environment-death:
    action: reword
    description: "Клітина вбиває того, хто на неї став або кого накрила: вода без колоди (Frogger), лава, міна (Mined-Out), вогонь вибуху, камінь згори (Boulder Dash). Ворог, що наздогнав, — «Смерть від дотику»."
    why: "C — розведено з «Смертю від дотику» за тим, хто вбиває. D: enter→lives лишаю (1/5): Bomberman і демо tanks пишуть вогонь × гравець (contact), Boulder Dash — вибух; потрібні варіанти."
  reach-exit:
    action: reword
    description: "Гравець дійшов до клітини виходу — перемога чи наступний рівень. Якщо вихід спершу зачинений, у правилі умова «Вихід у стані «відчинений»», а відчиняє його інше правило («Зібрати все», «Знищити всіх ворогів», «Зібрати квоту»)."
    why: "«Клітина виходу» не казала про двоетапний вихід, який мають 4 еталони. enter→win лишаю (3/5, шуму 0); лише ефект «перемога» — 4/5, але 13 зайвих (усі правила перемоги). Lode Runner (reach) і Bomberman (→ наступний рівень) — варіанти."
  projectile-shot:
    action: reword
    description: "Стрілець породжує снаряд перед собою в бік погляду — за клавішею (танк Battle City) чи сам, коли бачить ціль (горохострел PvZ); снаряд летить по прямій і зникає на перешкоді. Пауза між пострілами — параметр «перезарядка»."
    why: "D (зі звіту T271): input→spawn не бере автоматичну стрільбу. Лише ефект — 4/4, але +12 зайвих підказок на правилах появи (спавн, підкріплення); лишаю input→spawn, автостріл — варіант line_of_sight→spawn."
  event-points:
    action: reword
    description: "Гра рахує очки: кожна подія має свою ціну, і її видно в правилі («ТО очки +10») — зʼїв точку, збив танк, дійшов до домівки; рахунок видно на екрані."
    why: "«Таблиця вартостей дій» — не каже, що зробити. Заготовку contact→score лишаю: лише ефект «очки» не дав жодного нового влучання (2048 рахує очки словами), а зайвих підказок удвічі більше."
  spawn-random-cell:
    action: reword
    description: "Сутність зʼявляється у випадковій вільній клітині — на старті рівня, після кожного ходу (нова плитка в 2048) чи коли попередню зʼїли (їжа в Snake); гра перевіряє, що клітина порожня."
    why: "Опис не казав, коли буває такий спавн, і нова плитка 2048 лишилась в еталоні без картки. level_start→spawn лишаю: без тригера збігалася б із «Пострілом»; 2048 (кінець ходу → spawn_at) — варіант."

  # ── C · майже-дублі, розведені описами ──────────────────────────────────────
  check-stalemate:
    action: reword
    title: "Пат — нічия"
    description: "Сторона, що ходить, не під шахом, але жодного легального ходу не має — партія закінчується нічиєю, і гра каже це сама. Мат — окрема картка; заборона ходу під шах — у «Легальності ходу»."
    why: "Назва «Шах / пат» обіцяла й оголошення шаху, а заготовка й еталон — лише пат → нічия. Три 🥇 на одному переборі ходів (ця, «Мат», «Заборона ходу під шах») — злиття з «Матом» чекає T273 Q5, тож лише уточнюю."
  markup-validity:
    action: reword
    description: "Після кожного ходу гра перевіряє рядок, стовпець і регіон і знаходить порушення правил пазла — свідомо хибну цифру викладача ловить одразу. Як конфлікт видно на полі — елемент «Конфлікти розмітки»."
    why: "B/C: «одразу позначає клітини-конфлікти» дублювало елемент conflict-highlight, за який платиться окремо (пара є). Ця — перевірка, елемент — показ."
  score-records:
    action: reword
    description: "Гра памʼятає найкращий результат (очки, час, ходи), показує його поруч із поточним і каже, коли побито. Щоб рекорд пережив перезапуск гри — «Збереження рекордів і прогресу»; таблиця з іменами — вікно «Таблиця рекордів»."
    why: "C: межа з save-progress (обидві «памʼятають»): ця — показ і порівняння, та — файл."
  profile-stats:
    action: reword
    description: "Гра рахує партії за весь час — зіграно, виграно, відсоток, найдовша серія, середній час — і зберігає їх між запусками; показує вікно «Статистика гравця». Найкращий результат — картка «Рекорд»."
    why: "C: «найкращий час» перетинався з «Рекорд»."
  stats-window:
    action: reword
    description: "Екран з лічильниками за всі партії: зіграно, виграно, серії, середній час. Самі дані — картка «Статистика профілю», топ результатів з іменами — «Таблиця рекордів»."
    why: "C: «найкращі результати» — це «Таблиця рекордів»."
  game-settings:
    action: reword
    title: "Налаштування зберігаються"
    description: "Обране в налаштуваннях — гучність, розмір поля, тема, мова — записується у файл і діє після перезапуску гри. Самі перемикачі — елементи вікна налаштувань, кожен окремою заявкою; складність — «Рівні складності»."
    why: "C: «Складність, розмір поля, звук» платились би вдруге — це field-size-picker, volume-control і difficulty-levels. Своє в картки — збереження між сесіями. Ціну 🥉 не чіпаю (T273 Q5)."
  editor-window:
    action: reword
    coin: tin
    description: "Окремий екран редактора: поле рівня, курсор, кнопки «зберегти» й «грати». Що вміє сам редактор — палітра, інструменти, гумка, плейтест — картки підзони «Редактор» у «Рівнях»."
    why: "B: за один редактор платились два 🥈 (вікно й «Редактор у грі»), а опис вікна перелічував палітру 🌱 й інструменти 🥉 — окремі картки. Вікну — екран і 📎, як магазину й інвентарю. Зниження ціни — на рішення викладача (T271 радив те саме)."
  body-queue:
    action: reword
    description: "Хвіст повторює шлях голови: кожен сегмент переходить туди, де щойно був попередній (черга, deque). Тип сегмента — «Хвіст / сегмент», ріст від їжі — окрема картка-правило."
    why: "C: тип role-segment описує ту саму поведінку; розвів — тип каже «що це», механіка — алгоритм черги. «Ріст від їжі» — нова картка (new)."
  descend-and-reverse:
    action: reword
    title: "Строй: біля краю — вниз і розворот"
    description: "Space Invaders, Centipede: група рухається як одне ціле; дійшла до краю — спускається на ряд і розвертається."
    why: "Баг формату: ✍️ стоїть після « — », тож taskline узяв «Строй: біля краю» за назву, решту — за опис, а картку — за активну. Судячи з ✍️, задумано чернетку: у рядку поставити ✍️ перед « — » (статус — рішення агента чернеток)."

  # ── F · описи, з яких не ясно, що зробити (30) ──────────────────────────────
  game-pause:
    action: reword
    description: "Клавіша (P, Esc) зупиняє гру: вороги, таймери й анімації стоять, ввід ігнорується, доки не продовжиш; на екрані видно, що гра на паузі. Меню паузи з пунктами — тип вікна «Пауза-меню»."
    why: "F: «Заморозка тіків» не каже, що видно гравцеві й чим це не вікно паузи."
  round-currency:
    action: reword
    description: "Під час раунду гравець заробляє валюту (сонця падають з неба й від соняшників, монети за ворогів) і тут-таки витрачає на нових юнітів; запас видно на екрані, і без нього посадити не можна."
    why: "F: «Сонця/монети: генерація і витрати» — без того, що саме має працювати."
  time-bonus:
    action: reword
    description: "Наприкінці рівня залишок часу перетворюється на очки — що швидше пройшов, то більше; бонус видно в підсумку рівня."
    why: "F: «Швидше = більше»."
  hot-seat:
    action: reword
    description: "Двоє грають по черзі за одним компʼютером: після ходу керування переходить до суперника, на екрані видно, чий хід. Завіса між ходами, щоб не підглядати, — вікно «Передай пристрій»."
    why: "F, B: пара з pass-device — у описі."
  turn-enforcement:
    action: reword
    description: "Ходити може лише та сторона, чия черга: спроба взяти чужу фігуру чи сходити двічі поспіль блокується з поясненням."
    why: "F: «Контроль сторони»."
  undo-redo:
    action: reword
    description: "Скасування ходів — варіанти: один крок, без ліміту (стек станів), повернути скасоване, безперервне перемотування. Почати рівень наново — окрема картка «Рестарт рівня з початку»."
    why: "F: «41 гра корпусу просить» — внутрішня кухня, а «рестарт» уже не в сімʼї. Батько — заголовок, його опис бачать діти без свого."
  undo-step:
    action: reword
    description: "Клавіша (Z, Backspace) скасовує останній хід — поле, рахунок і лічильник ходів повертаються на крок назад; ще раз — уже ні."
    why: "F: опису не було."
  undo-unlimited:
    action: reword
    description: "Скасувати можна скільки завгодно ходів, аж до старту рівня: гра зберігає стан після кожного ходу (стек) і відкочує по одному."
    why: "F: опису не було; ця картка стоїть у трьох еталонах."
  redo:
    action: reword
    description: "Скасований хід можна повернути (Y, Ctrl+Shift+Z), доки не зроблено новий."
    why: "F: опису не було."
  rewind:
    action: reword
    description: "Утримуєш клавішу — гра безперервно перемотується назад, як відео, і з будь-якої миті можна грати далі (Braid, Catrap)."
    why: "F: опис був лише назвами ігор."
  ai-random:
    action: reword
    description: "Суперник-компʼютер ходить випадковим дозволеним ходом — найпростіший, але чесний ШІ: правил він не порушує."
    why: "F: опису не було."
  ai-greedy:
    action: reword
    description: "Суперник-компʼютер перебирає свої ходи й обирає той, що дає найбільше одразу (взяти найдорожчу фігуру), не думаючи на хід уперед."
    why: "F: «Жадібний» студентові нічого не каже."
  ai-minimax:
    action: reword
    description: "Суперник-компʼютер дивиться на кілька ходів уперед за себе й за тебе (minimax, краще з альфа-бета) і обирає найкращий; глибина — параметр заявки."
    why: "F: опису не було."
  save-game:
    action: reword
    description: "Вийшов посеред рівня — потім продовжуєш з того самого місця. Варіанти: один слот, кілька слотів на вибір, автосейв; рекорди й пройдені рівні — «Збереження рекордів і прогресу»."
    why: "F: «Продовжити пізніше»; батько-заголовок — його опис бачать три дитини без свого."
  enemy-reached-base:
    action: reword
    description: "Ворог дійшов до краю поля чи бази, яку ти бережеш (зомбі до будинку в PvZ), — поразка і вікно кінця гри. Базу розстріляли (Battle City) — те саме, лише тригер — дотик кулі."
    why: "F: опису не було. D: reach→lose лишаю (1/3); Battle City й демо tanks (дотик → поразка) — варіант."
  checkmate:
    action: reword
    description: "Король під шахом, і жодного ходу, що рятує, нема — гра сама оголошує мат і переможця. Пат (шаху нема, ходів нема) — «Пат — нічия»."
    why: "F: «Король суперника без порятунку» — без того, що робить гра."
  projectile-collision:
    action: reword
    description: "Два снаряди зустрілись: обидва зникають (кулі Battle City гасять одна одну) або пролітають один крізь одного — що саме, видно в правилі."
    why: "F: «Анігіляція чи проліт»."
  tile-merge:
    action: reword
    description: "Дві плитки з однаковим значенням зʼїжджаються в одну з подвоєним (2 + 2 = 4 у 2048); різні — стоять поруч."
    why: "F: «обʼєднуються за правилом»."
  selection-highlight:
    action: reword
    description: "Обрана фігура чи клітина виділена рамкою або кольором, доки не зробиш хід чи не скасуєш вибір."
    why: "F: опису не було, а батько highlights — чернетка, тож студент бачив лише назву."
  last-move-highlight:
    action: reword
    description: "Звідки й куди щойно сходив суперник — обидві клітини підсвічені, щоб його хід було видно."
    why: "F: те саме, що selection-highlight."
  reachable-highlight:
    action: reword
    description: "Після вибору юніта підсвічуються всі клітини, куди він дійде за цей хід з урахуванням перешкод (тактики, Into the Breach)."
    why: "F: те саме, що selection-highlight."
  threat-range:
    action: reword
    description: "Клітини, які бʼє ворог (куди дістане постріл чи удар), позначені на полі — видно, куди ставати небезпечно."
    why: "F: те саме, що selection-highlight."
  path-preview:
    action: reword
    description: "Перед рухом на полі намальовано шлях, яким сутність піде до обраної клітини (клік у Lines, підказка в лабіринті); змінив ціль — шлях перемалювався."
    why: "F: те саме, що selection-highlight."
  conflict-highlight:
    action: reword
    description: "Клітини, що порушують правило пазла (дві однакові цифри в рядку), одразу підсвічуються червоним; саму перевірку рахує «Валідність розмітки»."
    why: "F: те саме, що selection-highlight; C — межа з markup-validity."
  lobby-window:
    action: reword
    description: "Екран перед мережевою грою: список відкритих ігор чи гравців, створити гру, приєднатися, «готовий» перед стартом."
