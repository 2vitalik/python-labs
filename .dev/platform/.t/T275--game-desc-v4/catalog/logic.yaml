pairs:  # елемент чи тип вікна → функція гри; лише нові, обидва slug-и активні
  shop-preview: shop-between-levels          # превʼю покупки буває лише там, де є магазин (працює після виходу shop-* із сімʼї)
  legal-move-highlight: piece-move-patterns  # підсвітити дозволені клітини = порахувати легальні ходи (T271 радив цю пару)
  path-preview: chase-bfs                    # намальований шлях до цілі в обхід перешкод — це пошук шляху (🥇; сумнів: пряма лінія без пошуку теж «превʼю»)

pairs_new:  # те саме, але з картками з `new` — після їх створення
  wave-progress: enemy-waves
  achievements-window: achievements     # ключ — тип вікна: запрацює лише після правки WindowCard (знахідка 1)
  calendar-window: daily-puzzle         # те саме

