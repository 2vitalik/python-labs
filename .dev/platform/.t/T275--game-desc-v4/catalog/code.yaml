# T275 · Каталог v4 — зона «Код» (і прогалина в «Супроводі»): картки з вимог лаб і дрібні Python-фічі
# 2026-11-10 · пропозиція методиста; у data/ нічого не внесено, slug-и звірено з data/catalog/tasks.yaml
#
# Навіщо: студент на «трійку» має отримувати монетки за те, що й так робить у лабі. Зона code мала
# 22 картки, з них 🌱 лише 5 і жодної, що повторює сторінку лаби.
#
# ПІДСУМОК
# - нових карток: 60 (активних 54 · чернеток ✍️ 6); переформулювань (reword): 15
# - за підзонами (поле home): architecture 16 · python 36 · tests 2 · git 2 · packaging 3 · support/video 1
# - за монетками: 🌱 29 · 📎 28 · 🥉 3 (усі 🥉 — чернетки)
# - дзеркало сторінок лаб (поле lab): лаба 1 — 11 · 2 — 10 · 3 — 9 · 4 — 7 (з first-test) · 5 — 6;
#   з них обовʼязкових (required: true) — 19; ще 17 — дрібниці понад лаби (без lab)
# - «трієчнику»: 16 обовʼязкових 🌱 лаб 1–4 = 16🌱 = 4🥉, тобто як чотири ігрові фічі;
#   плюс дешеві git/README/демка (commit-history, gitignore-clean, project-readme, game-demo-video)
#
# ЯК ЛЯГАЄ НА ЛАБИ (п. — номер пункту на сторінці лаби; «є» — наявна картка, нової не роблю)
# Лаба 1 · обовʼязкові п.1–6 → lab1-field-output · lab1-read-key · lab1-move-player · lab1-cell-check ·
#          lab1-game-loop · lab1-own-functions (усі 🌱). Порядок = порядок `required` у звіті рецензента
#          (.dev/github/review.md, T248/T254): «required: done done …» → заявки можна зараховувати пачкою.
#   додаткові 5 груп → lab1-data-types 🌱 · lab1-conditions 🌱 · lab1-loops 📎 · lab1-function-params 📎 ·
#          lab1-scope 📎 (по потоку бракує nonlocal 55/82, * 53, / 52, вкладених 49, for-else 47 — тому 📎)
# Лаба 2 · п.1–3, 6 → lab2-grid-matrix · lab2-cell-dict · lab2-direction-tuples · lab2-string-methods (🌱)
#          п.4 рівень із файлу → є: level-from-txt 🥉 (levels/format)
#          п.5 запис у файл → lab2-save-text 🌱 (мінімум); повніше — є: score-records 📎, save-progress 🥉
#   додаткові п.1–4, 6 → lab2-slices-comprehensions · lab2-unpacking · lab2-sets · lab2-dict-tricks ·
#          lab2-binary-save (📎); п.5 «кілька рівнів = кілька файлів» → є: level-from-txt
# Лаба 3 · п.1–3 → lab3-classes · lab3-base-class · lab3-init-str (🌱)
#          п.4 двіжок окремо від виводу → є: logic-render-split (reword, 🥉 → 📎)
#   додаткові → lab3-underscores · lab3-container-methods + lab3-eq-hash (п.2 розбито надвоє) ·
#          lab3-property · lab3-classmethods (📎) · lab3-mixins 🥉 ✍️
# Лаба 4 · п.1 → lab4-package 🌱 · п.3 → lab4-type-hints 🌱 (typing-mypy стає наступним кроком)
#          п.2 винятки → є: custom-exceptions 📎 (reword)
#          п.4 тести → є: unit-tests (reword, 🥉 → 📎) + крок до нього first-test 🌱
#   додаткові → п.1 послідовність — у lab3-container-methods (зрізи там же) · п.2 — є: generators-iterators
#          (reword) · п.3 lab4-closures 📎 · п.4 lab4-decorator 📎 · п.5 lab4-with-files 🌱 ·
#          п.6 lab4-parametrize 📎 (+ є: fixture-level-tests 🥉)
# Лаба 5* · обовʼязкові → lab5-score-server · lab5-database · lab5-jinja-page (📎, не 🌱 — див. сумнів 6)
#   додаткові → п.1 lab5-level-api 🥉 ✍️ · п.2 профіль — є: profile-stats 📎 (локально; серверний не роблю) ·
#          п.3 lab5-routers-tests 📎 · п.4 lab5-deploy 🥉 ✍️
# Понад лаби → python: enum-states, match-case-commands, pathlib-paths, json-files ✍️, argparse-cli,
#   logging-debug, docstrings, named-constants, abc-protocol, random-seed ✍️, input-robust, ruff-clean ·
#   tests: first-test · git: gitignore-clean, feature-branch · packaging: main-guard, cross-platform-run ✍️ ·
#   support/video: game-demo-video (відео-демка — умова «до 69» з howto, а картки не було)
#
# ПРОПОЗИЦІЯ ПІДЗОНИ: code/labs «Завдання лаб» 📚 (kind game) — home_wish у всіх lab*-картках
# - чому: підзони code — про види інженерної роботи (архітектура, Python, тести, git, пакування);
#   «вивести поле», «зчитати клавішу», «словник клітинок» у жодну не лягають — зараз вони в architecture,
#   і це вводить в оману. Студент на «трійку» хоче відкрити одне місце і побачити чек-лист своєї лаби
#   в порядку сторінки лаби, а не збирати його з пʼяти підзон.
# - одна підзона всього не закриє: частина вимог уже має картки в інших місцях (level-from-txt,
#   logic-render-split, custom-exceptions, unit-tests, generators-iterators). Тому разом із нею —
#   поле картки `lab: N` (+ `required: true`) як наскрізний тег: фільтр «Лаба N» на /tasks і блок
#   «Картки цієї лаби» на /labs/N збирають усі, з будь-якої зони. Полів lab/required у моделі Task
#   ще нема — додати перед імпортом (і проставити наявним карткам за таблицею вище).
# - не хочеш підзону — тег lab працює й без неї, картки лишаються у своїх home.
#
# СУМНІВИ
# 1. Ціна обовʼязкового. Бриф — 🌱; score.md: «📎 — обовʼязкове з тем лаб, „трійка“». Я зробив 🌱
#    (дрібних карток багато, разом відчутно). Якщо правило score.md — підняти 19 required до 📎
#    або переписати рядок у score.md.
# 2. Подвійна оплата одного коду: lab1-field-output ↔ console-render 🥉; lab1-read-key / move-player ↔
#    авто-картки опису гри (control-direct 🌱, тип «гравець» 🌱); lab2-save-text ↔ score-records;
#    lab2-binary-save ↔ save-game; json-files ↔ save-progress / game-settings; lab2-cell-dict ↔
#    interaction-table. Розвів описами («як у коді» ↔ «що в грі», мінімум ↔ повна фіча) і посиланнями.
#    Альтернатива — правило «картка лаби і картка фічі на тому самому коді — платиться дорожча».
# 3. Сторінки лаб 2–5 — чернетки («узгодити перед публікацією»): картки повторюють поточний текст;
#    зміниться лаба — правляться картки. Лаба 1 стабільна.
# 4. Додаткові — картка на групу, а не на кожну можливість: зараховується, коли використано все
#    з групи і зі змістом; частково — нуль. Пом'якшити: «≥ 2/3 групи» або окремі 🌱 на найрідші
#    (nonlocal, for-else, * і /) — ще ~6 карток. Перелік «по пунктах» дав би ~25 карток на одну лабу 1.
# 5. Ціни наявних обовʼязкових: logic-render-split і unit-tests 🥉 → 📎 (reword); typing-mypy розщеплено:
#    сигнатури — нова 🌱, mypy по всьому коду — лишається 🥉. Якщо усталені ціни не чіпаємо (як у T273 Q5) —
#    reword лише тексту, coin прибрати.
# 6. Лаба 5 бонусна, і кожен її пункт — день роботи: обовʼязкові 📎, деплой і рівні через API 🥉 ✍️.
# 7. Чернетки ✍️: lab3-mixins (🥉 чи 📎), lab5-level-api і lab5-deploy (ціна), json-files і random-seed
#    (перетин із фічами), cross-platform-run (для pygame/tkinter безкоштовно, для msvcrt — 22 з 82
#    на лабі 1 — справжня робота; перевірка — запуск на macOS).
# 8. «Зі смислом» (умова на 89) у картках не формалізоване — вирішує викладач; docstrings прямо каже
#    «по суті, а не номери пунктів лаби» (T255: такі докстрінги — ознака згенерованого коду).
# 9. Відкинуто, щоб не роздувати: свій контекстний менеджер, lru_cache, покриття тестами, CI на GitHub
#    Actions, GitHub Issues, профіль гравця на сервері, відео-пояснення коду (формат захисту, не таск),
#    тест завантаження рівня, файл-індекс рівнів, окремий itertools (злитий у std-collections).

