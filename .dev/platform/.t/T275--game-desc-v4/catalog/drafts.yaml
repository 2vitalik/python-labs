# T275 · ревізія чернеток каталогу (✍️) перед показом студентам · 2026-11-10
# Джерело: data/catalog/tasks.yaml (ec0565a) + aliases.yaml; походження — git log -S, data/ludopedia/analysis/03-cards-draft.yaml,
#   T259 report, T262 Q5, T271 report і catalog/review-*.yaml, T273 Q6, data/catalog/templates/*.yaml, data/demo/*.yaml.
#
# ── Критерій: чому вони чернетки ─────────────────────────────────────────────
# Змістовного критерію не було — він процедурний: після T213 (2026-10-13, усі 209 карток стали active) у data/catalog/README
#   записано «draft лишається для нових карток», і кожну нову картку, яку написав агент, клали ✍️ до перегляду Vitalik.
#   Хвилі: 74 з корпусу лудопедії (T253, 03-cards-draft.yaml: «усі ✍️, ціни орієнтовні»; влиті в T259), 28 — яких бракувало
#   агентам-авторам 17 еталонів (T259: bomb-fuse, castling, flood-reveal…), 7 карток рівнів з ревізії v3 (T271, T273 Q6
#   «активуєш після ревізії цін»). Одразу активними ставали лише картки, без яких неповні списки вибору (типи вікон, сутностей,
#   параметри, властивості поля) і сімʼя undo-redo. T271 перечитав чернетки на тип і заготовку, але не на активацію; T262 Q5
#   і T273 Q6 без відповіді. Тобто ✍️ = «не переглянуто», а не «погано»: 41 чернетку вже заявляють еталони, ще ~20 — демо-ігри.
#
# ── Підсумок: 109 карток ─────────────────────────────────────────────────────
#   108 зі статусом draft + descend-and-reverse: її рядок зламаний (« — » у назві), парсер узяв ✍️ в опис, і з T259 вона
#   «активна» з назвою «Строй: біля краю» та описом «вниз і розворот ✍️ — …».
#   activate 99 · keep 7 · merge 3 · archive 0 (жодна не «зайва»: усі з корпусу з ≥4 іграми або з потреб еталонів).
#   Ціни змінено 8: line-match-clear 📎→🥉 · flood-reveal 📎→🥉 · piece-drop 🥈→🥉 · facing-icon 🥉→📎 · pipe-connectors 🌱→📎
#   · stairs-levels 🌱→📎 · move-limit 📎→🌱 · diagonal-gap-pass 📎→🌱. Решті ціна з каталогу лишається (coin не вказано).
#
# ── Найспірніше ──────────────────────────────────────────────────────────────
#   1. Активувати майже все (99 зі 109): ціни авторів корпусу й еталонів здебільшого узгоджені з сусідами; ризик — саме ціни.
#   2. flood-reveal 📎→🥉: це заливка BFS/рекурсією — той самий алгоритм, що в reachability-check 🥇; 📎 замало, 🥇 забагато.
#   3. line-match-clear 📎→🥉: пошук рядів — ядро цілого класу (Lines, match-3), як tile-merge 🥉 для 2048.
#   4. pocket → role-supply: панель «Рука/взяті фігури» дублює тип сутності «Запас поза полем» (там прямо «взяті фігури в шогі»);
#      piece-drop тоді 🥉, а не 🥈 (без панелі лишається правило дропу).
#   5. merge-once-per-move → tile-merge: «зливається раз за хід» — частина правильного злиття 2048, а не фіча; платити за
#      відсутність бага дивно.
#   6. random-placement → spawn-random-cell: та сама заготовка level_start>spawn; але еталон bomberman заявляє random-placement
#      на рівні — після злиття ця заявка має стати правилом «старт рівня → цегла у випадкових вільних клітинах».
#   7. hunger-clock — активувати карткою-правилом, хоча ревізія T271 пропонувала параметр stat-hunger (T273 Q5 лишив окремо).
#   8. unit-xp-skills — keep: параметр «Рівень прокачки» вже каже «юніт набрав досвіду й став сильнішим».
#   9. online-multiplayer 🥇 — activate (вікно «Лобі мультиплеєра» вже активне без картки самої гри), async-multiplayer — keep.
#  10. highlights — activate обовʼязково: батько-чернетка ховає від студента всі 8 активних дітей, і legal-move-highlight теж.
#
# ── Як читати ────────────────────────────────────────────────────────────────
#   title / description — лише коли пропоную новий текст; coin — лише коли ціна інша; rule і kind не вказано — лишаються з
#   каталогу (заготовки T271 перевірено, словник vocab.py); aliases — повний список для мов, де було < 3 слів (наявні збережено),
#   інші мови не чіпати. Назви без « — » (однорядковий формат taskline).

# ═══ entities/combat ═══
beam-tracing:
  action: activate
  why: "Зрозуміло, що показати: промінь від випромінювача до перешкоди, дзеркала його повертають. 🥉 вище за «Дзеркало» 📎 — тут увесь шлях. Light Up з прикладів прибрав: там не промінь."
  description: "Випромінювач пускає промінь по прямій до першої перешкоди; дзеркала й призми на шляху повертають його, і промінь перемальовується щоразу, коли щось на ньому зрушило (Deflektor, LaserTank, Khet). Відбиття від одного дзеркала — картка «Дзеркало відбиває промінь/снаряд»."
line-of-sight-attack:
  action: activate
  why: "Еталони battle-city і pvz-lite її заявляють; активна «Атака впритул» посилається на неї. Перевірка лінії без перешкод — 🥉 проти 📎 впритул."
  description: "Ворог стріляє чи бʼє, щойно ціль опинилась з ним на одному ряду чи стовпці і між ними нема перешкод (лучник у Hoplite, Медуза в Lolo, горохострел у PvZ); стіна між ними рятує. Удар лише по сусідній клітині — «Атака впритул»."
bomb-fuse:
  action: activate
  why: "База Bomberman, еталон її заявляє; ціна як у «Вибуху заданої форми» і «Ланцюговій детонації»."
  description: "Ввід кладе бомбу на клітину під гравцем, і за N тіків вона вибухає (сам вибух — «Вибух заданої форми»). Одночасно на полі не більше бомб, ніж дозволяє ліміт: запал — параметр «Тривалість» бомби, ліміт — «Патрони» гравця."

# ═══ entities/interact ═══
destructible-blocks:
  action: activate
  why: "Еталони battle-city і bomberman; слот уже вбирає «схований під блоком вихід». 🌱 лишаю: саме зникнення блоку — найпростіша взаємодія."
  description: "Блок зникає від вибуху чи пострілу, а на його місці лишається те, що задано слотом: нічого, предмет, вихід (схований під блоком) чи підлога (цегла в Bomberman і Battle City)."
dig-terrain:
  action: activate
  why: "Еталон boulder-dash; ясна дія, ціна як у «Збирання»."
  description: "Аватар заходить на клітину землі — земля зникає, лишається порожній тунель, яким можуть ходити й падати інші (Boulder Dash, Dig Dug). Сама земля не падає й не штовхається."
fill-hole:
  action: activate
  why: "Видно одразу: ящик у ямі — і по ній можна йти. Варіація Sokoban, 📎 як «Трансформація»."
  description: "Обʼєкт, заштовхнутий у яму, зникає разом з нею — клітина стає звичайною підлогою, по якій можна пройти (Kwirk, A Monster's Expedition)."
  aliases:
    ru: [засыпать яму, заполнить дыру, яма, провал]
    en: [pit, kwirk, fill the hole, hole filling]
button-toggle:
  action: activate
  why: "Тип «Кнопка / важіль» є, а правила перемикання — нема; 🥉 як у «Ключ і двері» (теж звʼязок двох сутностей)."
  description: "Гравець чи обʼєкт стає на кнопку або тягне важіль — і цілі зі слота міняють стан: двері відчиняються, шипи ховаються (Chip's Challenge, Zelda). Сама кнопка — тип сутності «Кнопка / важіль»."
mirror-reflect:
  action: activate
  why: "Еталон new-ball-game (щити повертають мʼячик на 90°); ясно й дешево."
  description: "Снаряд, мʼяч чи промінь, що влетів у клітину з дзеркалом, повертає на 90° залежно від нахилу дзеркала й летить далі (щити в New Ball Game, LaserTank)."
  aliases:
    ru: [отражение, отражатель, зеркало, рикошет]
thief:
  action: activate
  why: "Ясно, що показати: контакт — предмет зник з інвентаря. Потребує «Інвентаря», ціна 📎 як у сусідніх правил."
  description: "Ворог-злодій при контакті забирає в гравця предмет з інвентаря — ключ, черевики, золото (Chip's Challenge, Gauntlet); видно, що предмета більше нема."
  aliases:
    en: [steal, robber, thief, pickpocket]
freeze-into-block:
  action: keep
  why: "По суті — «Трансформація» 📎 з іншим тригером: ворог від удару стає блоком, далі працюють звичайні «Штовхання» й ходіння по блоку. 🥉 проти 📎 у сусідки не обґрунтовано, ігри вузькі (Kickle Cubicle, Toki Tori). Бракує рішення: сімʼя «Перетворення» (клітина-перетворювач · від удару) або злиття з cell-transform."
crush-by-slide:
  action: activate
  why: "Одна умова на правилі, видно одразу; 📎 як у «Смерть від середовища»."
  description: "Блок, що ковзає, знищує ворога на своєму шляху (Pengo, Kickle Cubicle); нерухомий блок ворогові не шкодить."
  aliases:
    en: [squash, pengo, crush, crush enemy]
swap-on-contact:
  action: activate
  why: "Ясно й дешево; демо rogue її заявляє."
  description: "Сутність, що заходить на клітину іншої, не впирається, а міняється з нею місцями (SWAP у Baba Is You, скарабей у Khet)."
  aliases:
    ru: [поменяться местами, поменять местами, обмен местами, свап]
line-match-clear:
  action: activate
  coin: bronze
  why: "Ядро класу Lines / match-3; пошук рядів у кількох напрямках — більше роботи, ніж 📎, і стільки ж, скільки «Злиття однакових» 🥉 для 2048."
  description: "Після кожного ходу гра шукає ряди з N однакових — по горизонталі, вертикалі, за потреби й діагоналі — і прибирає їх (Lines — 5 кульок, Dr. Mario — 4, match-3 — 3). Що далі відбувається з полем — «Каскад і ланцюг»."
  aliases:
    ru: [три в ряд, совпадение цветов, шарики, линии]
dig-hole:
  action: activate
  why: "Еталон lode-runner; ясно, що показати."
  description: "Ввід риє яму в цеглі збоку-знизу від аватара: клітина на час стає порожньою, і ворог у неї провалюється (Lode Runner). Як яма заростає — «Яма заростає і ловить»."
  aliases:
    ru: [копать яму, вырыть яму, прокопать, дыра]
    en: [dig down, dig trap, dig hole]
hole-refill:
  action: activate
  why: "Еталон lode-runner; пара до «Копання ями»."
  description: "Викопана яма за N тіків заростає назад цеглою; хто в цю мить у ній — гине (Lode Runner)."
  aliases:
    en: [hole closes, regrowing hole, brick regrow]
periodic-sink:
  action: activate
  why: "Еталон frogger; таймер і стан — ясно."
  description: "Платформа кожні N тіків на M тіків іде під воду: хто на ній стояв — падає у воду (черепахи у Frogger)."
  aliases:
    ru: [черепахи ныряют, исчезающая платформа, тонущая платформа]
    en: [sinking turtles, disappearing platform, diving turtles]
stop-cell:
  action: activate
  why: "Еталон inertia; одна клітина, одна умова — 🌱."
  description: "Клітина, на якій ковзання зупиняється, з якого боку на неї не заїхав: аватар стоїть на ній, хоча далі вільно (Inertia)."
shovel:
  action: activate
  why: "Демо pvz заявляє; ясно й дешево."
  description: "Ввід прибирає власну сутність з обраної клітини, щоб звільнити місце під іншу (лопата в PvZ викопує рослину)."
  aliases:
    ru: [выкопать растение, убрать растение, лопата]
    en: [dig up plant, remove plant, shovel]
last-line-defense:
  action: activate
  why: "Еталон pvz-lite; разовий захисник смуги — ясно, що показати."
  description: "У кінці кожної смуги стоїть разовий захисник: перший ворог, що до нього дійшов, запускає його — він проїжджає смугою, знищує всіх на шляху й зникає (газонокосарка в PvZ)."
  aliases:
    ru: [газонокосилка, косилка, последняя линия]
    en: [lawn mower, last stand, last line]

# ═══ entities/legality ═══
pull-object:
  action: activate
  why: "Пара до «Штовхання» 🥉; дешевша, бо будується поверх нього."
  description: "Гравець, відходячи від обʼєкта, тягне його за собою на клітину, яку щойно звільнив (PULL у Baba Is You, Pushmo). Пара до «Штовхання»."
  aliases:
    ru: [тянуть, тащить, тянуть ящик]
    en: [drag, pushmo, pull]
one-way-cell:
  action: activate
  why: "Одна умова напрямку, 🌱 як «Непрохідні клітини» і «Клітина-гальмо»."
  description: "Клітину-стрілку можна пройти лише в одному напрямку, з інших боків вона — стіна (порти Supaplex, стрілки в Lolo)."
  aliases:
    ru: [стрелка, односторонний проход, клетка-стрелка]
    en: [arrow tile, one-way, one-way gate]
polyomino-placement:
  action: activate
  why: "Ясна перевірка (накладання, сусідство); 🥉 як «Патерни ходів фігур»."
  description: "Гравець ставить на сітку фігуру з кількох клітин; гра перевіряє, що вона не накладається на зайняте й торкається сусідів так, як вимагають правила (Blokus, Patchwork, Tiny Towns)."
  aliases:
    ru: [полимино, фигурки из клеток, тетрамино]
piece-rotate-flip:
  action: activate
  why: "Ясно; вбирає «Поворот плитки» (архів T271)."
  description: "Ввід повертає, а за потреби й віддзеркалює фігуру чи плитку: разом з нею повертаються її клітини чи виходи; поворот — окремий хід або підготовка перед тим, як поставити."
  aliases:
    en: [mirror, rotation, rotate piece, flip]
pawn-promotion:
  action: activate
  why: "Шахи — базова гра; ясно й дешево, як «Взяття фігури»."
  description: "Пішак, що дійшов до останнього ряду, перетворюється на сильнішу фігуру — у шахах гравець обирає яку (дамка в шашках, зона перетворення в сьоґі)."
  aliases:
    ru: [превращение пешки, пешка, ферзь, дамка]
    en: [queening, promote, promotion]
piece-drop:
  action: activate
  coin: bronze
  why: "Ясно, але 🥈 за одне правило завищено: рокіровка й взяття на проході — 📎, дроп (зміна власника + постановка з запасу) — 🥉. Панель запасу — тип сутності «Запас поза полем» (див. pocket)."
  description: "Взята фігура переходить до того, хто взяв, і замість ходу її можна поставити з запасу на вільну клітину (Crazyhouse, сьоґі). Запас біля поля — тип сутності «Запас поза полем»."
  aliases:
    ru: [шоги, сброс фигуры, фигура из запаса]
castling:
  action: activate
  why: "Еталон chess; ясно, що показати."
  description: "Король іде на дві клітини до тури, а тура перестрибує через нього — одним ходом; можна, лише якщо обидва ще не ходили, між ними пусто, а король не під шахом і не проходить через бите поле."
  aliases:
    ru: [рокировка, король и ладья, длинная рокировка]
    en: [castle, 0-0, castling]
en-passant:
  action: activate
  why: "Еталон chess; ясно, що показати."
  description: "Пішак, що щойно пройшов на дві клітини повз ворожого пішака, той може взяти так, ніби він пройшов лише одну, — але тільки наступним ходом."
  aliases:
    ru: [взятие на проходе, пешка бьёт пешку, анпассан]
    en: [en passant, e.p., capture in passing]
cursor-place:
  action: activate
  why: "Еталони new-ball-game і pvz-lite; вбирає «Розстановку веж» 🥉 (перевірка, плата, шлях) — ціна узгоджена. З «Клік по клітині» не дублюється: та — як працює ввід, ця — правило постановки."
  description: "Гравець обирає клітину — і туди ставиться обʼєкт: гра перевіряє, що клітина вільна й дозволена, і знімає плату з запасу (рослини в PvZ, щити в New Ball Game); заборона перекрити шлях — умова «існує шлях»."
merge-once-per-move:
  action: merge
  into: tile-merge
  why: "Не окрема фіча, а частина правильного злиття 2048: без неї рядок [2, 2, 4] дає 8 замість [4, 4]. Платити окремо за відсутність бага дивно. У «Злиття однакових» дописати: «плитка, що вже злилась цього ходу, вдруге не зливається» — і перевіряти на зарахуванні."

# ═══ entities/move ═══
wall-follower:
  action: activate
  why: "Еталон boulder-dash; 🥉 як «Патрулювання» й «Жадібна погоня»."
  description: "Ворог іде вздовж стіни, тримаючись її лівим чи правим боком, і так обходить лабіринт (світлячки Boulder Dash, жуки Chip's Challenge); слот — який бік."
  aliases:
    en: [right-hand rule, wall hugging, wall follower]
turn-when-blocked:
  action: activate
  why: "Еталон new-ball-game (мʼячик відбивається назад). Старий опис обіцяв «7 поведінок», а слот має 5 — виправлено."
  description: "Що робить сутність, упершись у перешкоду: повертає ліворуч чи праворуч, розвертається назад, обирає випадковий вільний бік або зупиняється; слот — який варіант."
  aliases:
    en: [bounce, rebound, turn on wall]
carrier-platform:
  action: activate
  why: "Еталон frogger; ясно."
  description: "Хто стоїть на рухомій платформі, щотіку зсувається разом з нею (колоди й черепахи у Frogger, плоти в A Monster's Expedition)."
  aliases:
    en: [moving platform, ride, log riding]
ladder-climb:
  action: activate
  why: "Еталон lode-runner; тип «Підлога з властивістю» згадує драбину, але правила руху по ній нема."
  description: "Вгору й униз можна рухатись лише по драбині, а по перекладині — переходити руками над порожнечею, не падаючи (Lode Runner)."
  aliases:
    en: [rope, ladder, climb, lode runner]
party-switch:
  action: activate
  why: "Ясно, що показати: клавіша міняє активного героя, решта стоять."
  description: "Гравець керує кількома героями по черзі: клавіша перемикає активного, решта стоять на місці (XOR, The Lost Vikings, Kwirk)."
descend-and-reverse:
  action: activate
  title: "Строй: спуск і розворот біля краю"
  why: "Зараз уже активна через зламаний рядок: « — » у назві розрізало її, ✍️ потрапив в опис. Зміст ясний, тож лишити активною, але з назвою без « — » (або записати словником) і чистим описом."
  description: "Група ворогів іде строєм убік; щойно хтось з них торкнувся краю, уся група спускається на ряд нижче й рушає назад (Space Invaders, Centipede)."
roll-off-rounded:
  action: activate
  why: "Еталон boulder-dash; ясно."
  description: "Камінь чи алмаз, що лежить на іншому круглому обʼєкті, скочується вбік і падає, якщо збоку й знизу-збоку вільно (Boulder Dash)."
  aliases:
    ru: [скатывается, круглый камень, валун]
    en: [boulder, rolling, roll off]
self-collision:
  action: activate
  why: "Еталон snake; 🌱 як «Смерть від дотику»."
  description: "Голова вʼїжджає у власне тіло — змійка гине, або хвіст обрізається, або зіткнення ігнорується, як заведено в грі. Удар об стіну чи ворога — «Смерть від дотику»."
  aliases:
    en: [bite tail, tail collision, self collision]
no-reverse-turn:
  action: activate
  why: "Еталон snake; ясно й дешево."
  description: "Сутність не може розвернутись на 180° за один тік: поворот назад ігнорується, а другий поворот, натиснутий у тому ж тіку, чекає в буфері — змійка не вʼїжджає сама в себе."
  aliases:
    ru: [разворот назад, нельзя назад, разворот на 180]
diagonal-gap-pass:
  action: activate
  coin: wood
  why: "Еталон inertia. Одна умова легальності на ковзанні — як «Клітина-гальмо» 🌱, 📎 завищено."
  description: "Ковзання по діагоналі проходить між двома стінами, що торкаються лише кутами, і не зупиняється (Inertia)."
  aliases:
    ru: [проход по диагонали, щель между стенами, срезать угол]
visited-trail:
  action: activate
  why: "Еталон mined-out; ясно й дешево."
  description: "Клітини, які гравець пройшов, лишаються позначеними слідом — видно, де він уже був (Mined-Out); на пізніх рівнях слід може зникати."
  aliases:
    ru: [пройденный путь, посещенные клетки, след]
facing-icon:
  action: activate
  coin: tin
  why: "Еталон battle-city. 🥉 за вибір спрайта за напрямком завищено: «Анімація руху» 🥉 — плавний зсув, «Анімація очікування» — 📎."
  description: "Сутність виглядає по-різному залежно від того, куди дивиться: танк, повернутий ліворуч, і танк, повернутий угору, — різні спрайти чи символи (Battle City)."
  aliases:
    en: [sprite direction, directional sprite, facing]

# ═══ entities/spawn ═══
scatter-chase-schedule:
  action: activate
  why: "Класика Pac-Man; ясно, що показати."
  description: "Вороги живуть за розкладом режимів: кілька секунд розбігаються по кутах, потім женуться, і так по колу; на кожній зміні режиму всі розвертаються (привиди Pac-Man)."
  aliases:
    ru: [режимы призраков, поведение привидений, разбег и погоня]
ghost-house-release:
  action: activate
  why: "Класика Pac-Man; ясно."
  description: "Вороги чекають у своєму домі й виходять по одному — коли гравець зʼїв достатньо точок або довго нічого не їв (привиди Pac-Man)."
  aliases:
    ru: [дом призраков, выход привидений, загон]
    en: [ghost house, ghost release, pen]
weighted-spawn:
  action: activate
  why: "Еталон 2048; ясно й дешево."
  description: "Нова сутність буває різних видів з різною ймовірністю: у 2048 двійка — 90 %, четвірка — 10 %; на довгій грі видно, що четвірки рідші."
drop-on-death:
  action: activate
  why: "Ясно; демо rogue заявляє. З «Руйнованими блоками» не дублюється: там слот для блоків, тут вороги."
  description: "Знищений ворог лишає по собі предмет — завжди чи з шансом (бонус з «червоного» танка в Battle City, лут у роглайках); що лишає зруйнований блок — слот «Руйнованих блоків»."
  aliases:
    ru: [выпадает предмет, лут с врага, дроп]

# ═══ entities/state ═══
pipe-connectors:
  action: activate
  coin: tin
  why: "Ясно, що показати; але порти плитки й перевірка «виходи дивляться один на одного» — це вже код, 🌱 замало. Звʼязність мережі — окрема «Перевірка звʼязності» 🥉."
  description: "У плитки є виходи на 1–4 боки; дві сусідні плитки зʼєднані, коли їхні виходи дивляться один на одного — так складаються труби й дроти (Pipe Mania, Net). Чи все зʼєднано в одну мережу — «Перевірка звʼязності»."
coverage-area:
  action: activate
  why: "Еталон pvz-lite; вбирає «Радіус/форма вежі». З параметром «Дальність» не дублюється: там відстань, тут форма."
  aliases:
    ru: [радиус, зона действия, аура]
status-effects:
  action: activate
  why: "Ясно: стеки видно біля сутності, щотіку діють і спадають. 🥉 як «Тимчасові режими»."
  description: "Отрута, горіння, заморозка: стан зі стеками, що щотіку діє (шкода, сповільнення) і спадає (Slay the Spire, роглайки); число стеків видно біля сутності. Простий стан на час — «Тимчасові режими»."
item-identification:
  action: activate
  why: "Ясно, що показати; демо rogue заявляє."
  description: "Предмети одного виду спершу невідомі («синє зілля», «дивний сувій»): що вони роблять, гравець дізнається, лише використавши, — далі всі такі показуються під справжньою назвою (Rogue, NetHack)."
  aliases:
    ru: [опознание, неизвестное зелье, идентификация]
    en: [unidentified, mystery item, identify]
hunger-clock:
  action: activate
  why: "Демо rogue заявляє. Ревізія T271 пропонувала параметр stat-hunger, але T273 Q5 лишив окремо; як картка-правило (лічильник → шкода) не дублює «Енергію / паливо»: там запас, тут правила, що його міняють."
  description: "Ситість щохід падає сама собою, їжа її поповнює; на нулі гравець щохід отримує шкоду (Rogue, NetHack). Видно лічильник ситості й шкоду від голоду."
unit-xp-skills:
  action: keep
  why: "Межа з параметром «Рівень прокачки» 📎 не проведена: його опис уже каже «юніт набрав досвіду й став сильнішим». Бракує: або звузити параметр до числа, а картку — до «досвід за дії → на порогах нові вміння» (зарахування — щонайменше два щаблі з різними вміннями), або злити."
blob-growth:
  action: activate
  why: "Еталон boulder-dash; ясно."
  description: "Амеба щотіку з деякою ймовірністю розростається на сусідню вільну клітину; завелика — стає камінням, замкнена так, що рости нікуди, — алмазами (Boulder Dash)."
  aliases:
    en: [amoeba, slime, blob, growth]
magic-wall-timer:
  action: activate
  why: "Boulder Dash — базова гра; три стани видно. Вузько, але для своєї гри ясно."
  description: "Чарівна стіна спить, доки крізь неї не впаде перший камінь; тоді N тіків вона перетворює камінь, що падає крізь неї, на алмаз, а потім вичерпується назавжди (Boulder Dash)."
  aliases:
    ru: [волшебная стена, магическая стена, стена-превращатель]
    en: [magic wall, enchanted wall, timed wall]

# ═══ game-logic/constraints ═══
connectivity-check:
  action: activate
  why: "Ясно (BFS чи заливка); демо sudoku заявляє. Ціна як у «Валідності розмітки»."
  description: "Гра перевіряє, що всі острови, труби чи фігури складають одну звʼязну мережу (обхід BFS чи заливка), і без цього не зараховує розвʼязок (Hashi, Net, Nurikabe)."
single-loop-check:
  action: activate
  why: "Ясно; пара до «Розмітки ребер»."
  description: "Гра перевіряє, що проведені лінії складають рівно одну замкнену петлю без розгалужень і перетинів (Slitherlink, Masyu)."
  aliases:
    ru: [замкнутая линия, слизерлинк, одна петля]
neighbor-count-clue:
  action: activate
  why: "Еталони minesweeper і mined-out; база сапера, 🌱."
  description: "Число в клітині показує, скільки сусідніх клітин певного виду — з 4 чи 8 сусідів: мін у сапері, ламп у Light Up."
  aliases:
    en: [minesweeper, adjacent, neighbor count, adjacent mines]
line-sum-clue:
  action: activate
  why: "Ясно; демо sudoku заявляє."
  description: "Підказка збоку ряду чи стовпця задає суму або кількість у ньому, і гра перевіряє її після ходу (Kakuro, Skyscrapers, Hexcells)."
word-validation:
  action: activate
  why: "Ясно: неіснуюче слово не приймається. Словесних ігор серед базових нема, але курс дозволяє свою гру; 🥉 за словник і пошук."
  description: "Гра завантажує словник і перевіряє, що складене слово в ньому є: неіснуюче слово не зараховується (Scrabble, Wordle, Boggle)."
run-length-clues:
  action: activate
  why: "Еталон paper-puzzles."
  description: "Числа біля рядка й стовпця — довжини зафарбованих блоків по порядку; гра перевіряє рядок за ними (японський кросворд)."
  aliases:
    ru: [японский кроссворд, нонограмма, числа сбоку]

# ═══ game-logic/difficulty ═══
skip-level:
  action: activate
  why: "Ясно й дешево; лічильник пропусків видно."
  description: "Застряглий рівень можна пропустити, але пропусків на гру обмежена кількість, і лічильник видно (Supaplex, Helltaker)."
  aliases:
    ru: [пропустить уровень, перескочить, скип]
    en: [next level, joker, skip level]
rule-variants:
  action: activate
  why: "Для «Шахи та варіації» це прямо по темі. Межу з «Налаштуваннями гри» 🥉 і «Рівнями складності» 📎 провів в описі: перемикач правила, а не числа."
  description: "У налаштуваннях — щонайменше два перемикачі, що вмикають інше правило, а не інше число (варіанти шахів, правила B/S у Life, параметри головоломок Tatham). Складність числами — «Рівні складності»."
  aliases:
    ru: [свои правила, кастомные правила, варианты правил]

# ═══ game-logic/economy ═══
run-relics:
  action: keep
  why: "Межа з «Апгрейдами в раунді» 📎 тонка: реліквія, що лише міняє число, — це апгрейд. Бракує: що реліквія вмикає правило, скільки їх треба для зарахування, і поняття «забіг» у курсі не визначене."

# ═══ game-logic/history ═══
move-notation:
  action: activate
  why: "Ясно (файл PGN чи рядок LURD); перегляд — окремо в «Replay»."
  aliases:
    ru: [нотация, запись партии, запись ходов]
state-string:
  action: activate
  why: "Ясно: скопіював рядок, вставив — позиція відновилась."
  aliases:
    ru: [код сохранения, код позиции, строка состояния]

# ═══ game-logic/lose ═══
permadeath:
  action: activate
  why: "Ясно (сейв зник після смерті); демо rogue заявляє. 🌱 — бо саме збереження оплачене «Збереженням гри»."
timeout-punisher:
  action: activate
  why: "Еталон bomberman; альтернатива «Вичерпано час»."
  description: "Вичерпаний час рівня не закінчує гру, а випускає сильних ворогів-карателів, від яких треба встигнути до виходу (Pontan у Bomberman)."
  aliases:
    ru: [наказание за время, враги после таймера, понтан]
move-limit:
  action: activate
  coin: wood
  slots:
  - {key: limit, label: Ходів на рівень, type: int, required: true}
  why: "Дзеркало «Вичерпано час» 🌱 (та сама заготовка counter>lose, свій слот ліміту) — 📎 тут не узгоджено."
  description: "На рівень дано N ходів, лічильник іде вниз; скінчились — рівень провалено (XOR, Helltaker). Обмеження за часом — «Вичерпано час»."
  aliases:
    ru: [лимит ходов, осталось ходов, ограничение ходов]
    en: [moves left, step limit, move limit]

# ═══ game-logic/opponent ═══
pass-turn:
  action: activate
  why: "Ясно й дешево; без нього Reversi зависає."
  description: "Сторона, якій нема куди ходити, пропускає хід — і хід переходить до суперника, гра не зависає (Reversi, Ataxx, го)."
  aliases:
    ru: [пропустить ход, пас, пропуск хода]
repetition-draw:
  action: activate
  why: "Ясно; демо chess заявляє. 📎 — за історію позицій."
  description: "Партія закінчується нічиєю, коли позиція повторилась утретє або 50 ходів ніхто нікого не брав; гра памʼятає історію позицій (шахи, ко в го)."
  aliases:
    en: [threefold repetition, 50 moves rule, draw by repetition, perpetual check]
garbage-attack:
  action: keep
  why: "Має сенс лише разом з «Двома полями одночасно» і лише для падаючих блоків (Tetris, Puyo), яких серед базових ігор нема. 🥈 за одне правило завищено: коли хтось візьметься за versus — 🥉."
simultaneous-versus:
  action: activate
  why: "Ясно, що показати; 🥈 — два незалежні стани гри й розділений ввід."
  description: "Двоє грають одночасно, кожен на своєму полі на одному екрані з однаковими умовами (той самий seed); перемагає, хто швидше впорався чи довше протримався (Puyo Puyo, Tetris versus)."
  aliases:
    ru: [разделенный экран, гонка на скорость, два поля]
async-multiplayer:
  action: keep
  why: "Неясно, що зараховувати без сервера: файл-хід, бот у Telegram, пошта? Мережеву частину покриває «Онлайн-партія»; лишити до першого охочого й тоді описати канал."
online-multiplayer:
  action: activate
  why: "Ясно (двоє з різних компʼютерів, стан однаковий), 🥇 справедливо. Вікно «Лобі мультиплеєра» вже активне — без цієї картки воно висить без самої гри."
  description: "Двоє грають одну партію з різних компʼютерів: ходи йдуть через сервер чи сокет, стан у обох однаковий. Лобі — вікно «Лобі мультиплеєра», рейтинг — окрема картка."
  aliases:
    ru: [по сети, сетевая игра, онлайн, мультиплеер]

# ═══ game-logic/program ═══
user-procedures:
  action: activate
  why: "Клас програмних ігор уже відкритий активними «Пишу програму команд», «Програмований» час і вікном «Редактор програми»; без цих карток студенту нема що заявити далі."
  description: "Гравець оголошує власну процедуру з команд і викликає її з головної програми (P1/P2 у Lightbot, F1–F5 у RoboZZle); рекурсія — коли процедура викликає сама себе."
sensor-predicates:
  action: activate
  why: "Ясно: робот поводиться по-різному на різних полях. Не дублює «Пишу програму команд» — там список команд і повтори, без умов."
  description: "У програмі гравця є умови-сенсори — «попереду стіна», «на клітині фішка», колір під ногами — і розгалуження за ними: та сама програма проходить різні поля (Karel, RoboZZle)."
step-execution:
  action: activate
  why: "Елемент вікна «Редактор програми»; ясно. Властивість часу «Програмований» лише згадує крок і паузу."
  description: "Програму можна виконувати по кроку, ставити на паузу й міняти швидкість; поточна команда підсвічена (Lightbot, Karel)."
  aliases:
    en: [debugger, step by step, step mode]
fsm-program:
  action: keep
  why: "Одна навчальна гра (Kara); 🥇 тут за форму програми, а не за алгоритм. Активувати, коли хтось справді візьметься за програмні ігри, і тоді зважити ціну проти «Сенсорів» 🥉 і «Процедур» 🥈."

# ═══ game-logic/score ═══
chain-reaction:
  action: activate
  why: "Ясно; будується на «Лінія з N однакових зникає»."
  description: "Після того як поле осіло, нові збіги зникають самі, без ходу гравця, і так доки є що прибрати; кожен крок каскаду множить очки (Puyo Puyo, match-3); слот — множник."
  aliases:
    ru: [цепочка, цепная реакция, каскад]
    en: [combo, cascade, chain, chain reaction]
extra-life-threshold:
  action: activate
  why: "Еталон frogger; аркадна класика. Опису не було — додав."
  description: "Кожні N очок гравець отримує додаткове життя, і лічильник життів помітно зростає (Pac-Man, Frogger); слот — поріг."
  aliases:
    en: [1up, extra life, bonus life]
leftover-penalty:
  action: activate
  why: "Ясно й дешево."
  description: "Наприкінці партії гравець втрачає очки за все, що не встиг викласти чи заповнити (Blokus, Scrabble, Azul)."
  aliases:
    en: [negative points, minus points, leftover penalty]

# ═══ game-logic/win ═══
home-slots:
  action: activate
  why: "Еталон frogger."
  description: "На фініші кілька домівок, і кожну треба зайняти по разу: заповнив усі — рівень пройдено, стрибок у вже зайняту — смерть (Frogger)."
  aliases:
    ru: [домики, домики лягушек, гнезда]
    en: [home bays, frog homes, home slots]
keep-playing-after-win:
  action: activate
  why: "Еталон 2048."
  description: "Після першої перемоги гра показує вікно з вибором — завершити чи грати далі на тому ж полі (2048 після плитки 2048)."
  aliases:
    ru: [продолжить после победы, играть дальше, бесконечный режим]
    en: [keep playing, continue after win, endless]

# ═══ interface/hud ═══
highlights:
  action: activate
  why: "Обовʼязково: це батько сімʼї, 8 дітей якої вже активні (і legal-move-highlight, видима з v1). /tasks показує студенту лише корені, дітей — під батьком; батько-чернетка ховає всю сімʼю. Прибрав з опису «(є)»."
  description: "Сімʼя підсвіток на полі: виділена клітина, легальні ходи, конфлікти, останній хід, досяжні клітини, зона ураження, намір ворога, шлях. Кожна підсвітка — окрема заявка."
  aliases:
    en: [overlay, markers, highlight, highlighting]
move-counter:
  action: activate
  why: "Еталони sokoban і inertia; вбирає «Лічильник поштовхів». Не дублює «Лічильник цілей»: там що лишилось, тут скільки зроблено."
next-queue:
  action: activate
  why: "Ясно й дешево."
  description: "Поруч з полем видно одну чи кілька наступних фігур або кольорів, що зʼявляться (next у Tetris, превʼю кульок у Lines)."
pocket:
  action: merge
  into: role-supply
  why: "Тип сутності «Запас поза полем» (активний з T271) прямо описує те саме: «взяті фігури в шогі… тримає їх і показує, що лишилось». Окрема панель-елемент дала б подвійну монетку за одну річ; piece-drop посилається тепер на тип."
message-log:
  action: activate
  why: "Ясно; демо rogue заявляє."
  description: "Рядок чи список під полем, куди гра пише, що сталось за хід: «Ви зʼїли яблуко», «Щур кусає» (роглайки); самі повідомлення пишуть правила ефектом «повідомлення»."
  aliases:
    ru: [сообщения, лог боя, журнал событий]
    en: [combat log, notifications, message log, event log]
objective-text:
  action: activate
  why: "Ясно й дешево; опису не було — додав."
  description: "Рядок на ігровому екрані каже, що зараз треба зробити («Збери 12 алмазів», «Дійди до виходу»), і змінюється, коли змінилась ціль."
  aliases:
    en: [quest, mission, objective, current goal]
popup-text:
  action: activate
  why: "Еталон 2048; дешево. Сусідка «Ефекти подій» — спалахи й вибухи, не текст."
  description: "Над клітиною події на мить спливає текст — «+100», «Combo ×3», шкода — і зникає."
face-button:
  action: activate
  why: "Еталон minesweeper."
  description: "Кнопка-смайлик над полем показує стан гри — граю, виграв, програв — і по кліку починає заново (Minesweeper)."
  aliases:
    ru: [рожица, кнопка рестарта, смайлик]
    en: [smiley, reset button, face button]

# ═══ interface/input ═══
path-cut:
  action: activate
  why: "Доповнює активне керування «Малюю шлях»; ясно, що показати."
  description: "Намальований шлях можна вкоротити: повернення по ньому стирає хвіст, а перетин чужої лінії обриває її (Flow Free)."
  aliases:
    ru: [стирание пути, обрыв линии, обрезать линию]
    en: [backtrack, trim path, cut path]
multi-select:
  action: activate
  why: "Ясно; для паперових пазлів помітна зручність."
  description: "Кілька клітин можна виділити разом — протягуванням чи з Ctrl — і одним натисканням ввести цифру чи зафарбувати всі (SudokuPad)."
  aliases:
    ru: [выделить несколько, групповое выделение, мультивыбор]
edge-marking:
  action: activate
  why: "Ясно; пара до «Перевірки однієї петлі»."
  description: "Клік ставить чи прибирає лінію на ребрі між клітинами, а ще один — хрестик «тут лінії нема» (Slitherlink, Masyu)."
  aliases:
    ru: [границы клеток, линии между точками, рёбра]
    en: [edges, wall drawing, edge marking]
dot-mark:
  action: activate
  why: "Еталони minesweeper і paper-puzzles; вбирає «Правий клік по колу». Не дублює «Олівцеві нотатки» (кандидати) і керування «Розмічаю клітини» (саму розмітку перевіряють)."
  aliases:
    en: [flag, question mark, flagging]
flood-reveal:
  action: activate
  coin: bronze
  why: "Еталон minesweeper. Це заливка BFS чи рекурсією — той самий алгоритм, що в «Перевірці досяжності» 🥇; 📎 замало, 🥉 — як «Перевірка звʼязності»."
  description: "Клік по клітині без сусідніх мін відкриває всіх сусідів, а від кожного нового нуля — далі, доки не впреться в числа (Minesweeper). Слот — 4 чи 8 сусідів."
  aliases:
    en: [flood fill, auto reveal, cascade reveal]

# ═══ interface/render ═══
fog-of-war:
  action: activate
  why: "Еталон maze, демо tanks і rogue. З параметром «Огляд» не дублюється: там радіус, тут показ."
  description: "Гравець бачить лише клітини в радіусі огляду своїх сутностей; решта темна, а вже побачене лишається на мапі блідим, без ворогів (Advance Wars, роглайки). Радіус — параметр «Огляд»."
  aliases:
    en: [fov, line of sight, fog of war, field of view]

# ═══ interface/results ═══
share-result:
  action: activate
  why: "Ясно й дешево."
  description: "Після гри результат копіюється в буфер обміну текстом чи сіткою емодзі, щоб вставити в чат (Wordle)."
  aliases:
    en: [clipboard, emoji grid, share result, share score]
rating-system:
  action: keep
  why: "Формула Elo — кілька рядків, 🥈 за неї завищено; сенс лише з багатьма гравцями — після «Онлайн-партії» чи з профілями на одному компʼютері. Бракує: з ким рахується рейтинг і де видно; тоді 🥉."

# ═══ levels/bank ═══
level-par:
  action: activate
  why: "Ясно; демо tanks заявляє. Не дублює «Банк рівнів» (статус) і «Рейтинг рівнів» (складність)."
  aliases:
    ru: [звёзды за уровень, пар, лучший результат]

# ═══ levels/format ═══
level-objects-format:
  action: activate
  why: "Ясно: у файлі рівня сутності з параметрами, а не лише символи; 🥉 як «Рівні з файлів»."
  aliases:
    ru: [объекты уровня, json уровня, параметры в файле]
level-format-doc:
  action: activate
  why: "Ясно й дешево; не дублює «Інструкцію гравця» — та для гравця, ця для автора рівнів."
  description: "У README є таблиця символів і полів формату рівня — інша людина робить новий рівень, не відкриваючи код."
  aliases:
    ru: [описание формата, легенда символов, формат уровня]
    en: [level format, legend, format spec]

# ═══ levels/generation ═══
seed-share:
  action: activate
  why: "Еталон inertia, демо rogue; ясно."
  description: "Згенерований рівень має seed, який видно й можна ввести, — той самий рівень зʼявиться в друга (Hexcells Infinite, роглайки)."
  aliases:
    ru: [сид, поделиться картой, номер карты]
    en: [random seed, map code, seed]
no-guess-generation:
  action: activate
  why: "Ясно (генератор перевіряє розкладку розвʼязувачем), 🥇 справедливо; подвійну монетку з «Генерацією з унікальним розвʼязком» T271 уже прибрав."
  aliases:
    ru: [без угадывания, честный сапер, только логика, без рандома]
random-placement:
  action: merge
  into: spawn-random-cell
  why: "Та сама заготовка level_start>spawn: «Спавн у випадковій клітині — з перевіркою, що клітина вільна». У «Спавн у випадковій клітині» дописати «не на старті гравця»; замурованість — «Перевірка досяжності». Увага: еталон bomberman заявляє random-placement на рівні — після злиття це правило «старт рівня → цегла у випадкових вільних клітинах» із заявкою spawn-random-cell."
chunk-generation:
  action: activate
  why: "Ясно; простіша за «Генерацію підземель» 🥇, тож 🥈 узгоджено. З «Нескінченним полем» сумісна, не дублює: там на льоту, тут з готових шматків."
  aliases:
    ru: [чанки, заготовки комнат, шаблоны комнат]

# ═══ levels/progression ═══
world-map:
  action: activate
  why: "Активне вікно «Повна карта рівня» посилається на неї; ясно."
  aliases:
    ru: [карта мира, карта уровней, глобальная карта]
    en: [overworld, map screen, world map, level map]
stairs-levels:
  action: activate
  coin: tin
  why: "Повернення на відвіданий поверх у тому ж стані — більше, ніж «Кілька рівнів по черзі» 📎; 🌱 замало."
  description: "Рівні — поверхи: сходи ведуть униз і вгору, і на відвіданий поверх можна повернутись у тому стані, як лишив (або гра генерує його знову) — роглайки, Magic Tower."
difficulty-curve:
  action: activate
  why: "Перевірити можна, якщо в заявці список «рівень → що нового»; демо pvz заявляє."
  description: "Щонайменше 5 рівнів, зроблених вручну, де кожен вводить один новий елемент чи ускладнює знайомий; у заявці — список «рівень → що нового», а перший рівень вчить без тексту."
  aliases:
    ru: [кривая сложности, нарастание сложности, обучающие уровни]
    en: [difficulty curve, progression, ramp]
secret-level:
  action: activate
  why: "Ясно й дешево."
  aliases:
    ru: [секретный уровень, бонусный уровень, скрытый уровень]
    en: [secret level, bonus level, hidden level, warp zone]
