# T275 · шліфування активних карток каталогу (поза чернетками) · 2026-11-10
# Джерело: data/catalog/tasks.yaml + aliases.yaml (ec0565a); вердикти чернеток — drafts.yaml поруч.
#
# reword — нові тексти карток:
#   (а) 11 описів, де студент бачить англійський slug: slug замінено на «назву картки», решта тексту дослівно;
#   (б) 8 активних карток без опису — 1–2 речення: що це і що видно в грі;
#   (в) описів, що посилаються на картки, які за drafts.yaml лишаються чернетками чи зливаються, не знайшлось
#       (melee-vs-ranged і map-window посилаються на line-of-sight-attack і world-map — обидві йдуть в activate);
#   (г) descend-and-reverse — правильні title і description (рядок зламаний « — » у назві);
#   (ґ) 2 цілі злиття з drafts.yaml (tile-merge, spawn-random-cell) — дописано те, що вбирають; role-supply правки не потребує.
# aliases — лише нові слова (наявних у картки нема), лише мови, де було < 2 слів: 62 картки.

reword:
  # ── (а) slug → «назва» ──
  telegraphed-intents:
    description: "Ворог обирає дію на хід раніше й виконує саме її (Into the Breach); позначка на полі — «Куди вдарить ворог наступного ходу»."
  undo-redo:
    description: "Сімʼя: один крок / без ліміту / «Повернути скасоване» / «Безперервне перемотування часу» / рестарт; 41 гра корпусу просить."
  event-effects:
    description: "Короткий кадровий ефект на подію: спалах, вибух, відкриття дверей; смерть і поява сутності — свої картки, система часток — «Частинки»."
  map-window:
    description: "Уся мапа рівня чи підземелля (досліджене) на весь екран; мінімапа — «Мінімапа/радар», мапа вибору рівнів — «Мапа світу з вузлами-рівнями»."
  field-scaling:
    description: "Клітини підлаштовуються під розмір вікна, зум; мапа, більша за екран, — «Камера за гравцем»."
  avatar-picker:
    description: "Скін чи вигляд гравця без впливу на гру; герой з різними параметрами — вікно «Вибір персонажа / загону»."
  background-music:
    description: "Музика грає фоном у циклі; вимикач у налаштуваннях — «Перемикач музики»."
  state-as-data:
    description: "Серіалізований стан (основа збережень і «Replay»)."
  project-readme:
    description: "Як встановити й запустити, вимоги, короткий опис зі скриншотом; правила гри — «Інструкція гравця»."
  player-guide:
    description: "Правила й керування для гравця окремим документом чи розділом README; довідка всередині гри — «Вікно довідки»."
  game-page:
    description: "Сторінка поза репозиторієм (GitHub Pages, свій сайт): опис, скриншоти, посилання на код; сторінка itch.io — «Itch.io-публікація»."

  # ── (б) опису не було ──
  restart-level:
    description: "Клавіша чи пункт меню повертає поточний рівень у початковий стан, без перезапуску всієї гри: гравець, обʼєкти й вороги стоять там, де на старті (R у Sokoban)."
  enemy-reached-base:
    description: "Гра закінчується поразкою, щойно ворог дістався краю поля чи бази, яку треба захищати (зомбі дійшов до будинку в PvZ, ворожий танк — до орла в Battle City)."
  destroy-all-enemies:
    description: "Рівень пройдено, коли не лишилось жодного ворога — ні на полі, ні серед тих, що мали ще зʼявитись (усі 20 танків етапу в Battle City)."
  all-on-targets:
    description: "Рівень пройдено, щойно кожен ящик стоїть на цільовій клітині (Sokoban); гра помічає це сама одразу після ходу."
  lobby-window:
    description: "Вікно перед мережевою грою: список гравців чи кімнат, хто готовий, кнопка «Почати» — партія стартує, коли всі зібрались. Сама мережева гра — «Онлайн-партія»."
  replay-window:
    description: "Вікно, де записану партію чи проходження переглядають: кроки вперед і назад, пауза, перехід до потрібного ходу. Сам запис — картка «Replay»."
  achievements-window:
    description: "Вікно зі списком досягнень гри («Пройди рівень без втрат», «Збери 100 монет»): отримані позначені, в решти видно умову."
  character-select:
    description: "Вікно перед грою, де обирають героя чи склад загону, і вибір змінює гру: у героїв різні параметри чи вміння. Інший вигляд без впливу на гру — «Вибір аватару»."

  # ── (г) зламаний рядок ──
  descend-and-reverse:
    title: "Строй: спуск і розворот біля краю"
    description: "Група ворогів іде строєм убік; щойно хтось з них торкнувся краю, уся група спускається на ряд нижче й рушає назад (Space Invaders, Centipede)."

  # ── (ґ) цілі злиття з drafts.yaml ──
  tile-merge:
    description: "Плитки обʼєднуються за правилом; плитка, що вже злилась цього ходу, вдруге не зливається."
  spawn-random-cell:
    description: "З перевіркою, що клітина вільна й не на старті гравця: предмети, вороги чи цегла щоразу лягають інакше."

