# T271 · картки, яких бракувало: знайшли ревізії зон (review-*.yaml, шапки). Типи вікон — активні (без них список
# вибору типу неповний); картки про рівні — чернетки ✍️ на ревізію цін викладачем.
level-intro:
  home: interface/menus
  title: Заставка рівня
  description: Екран перед рівнем — «STAGE 3», назва печери, скільки життів; зникає сам або з клавіші.
  coin: wood
  tags: [window]
  status: active
  aliases: {uk: [заставка рівня, екран рівня, номер рівня], ru: [заставка уровня], en: [stage intro, level intro, get ready]}
name-entry:
  home: interface/menus
  title: Введення імені для рекорду
  description: Після рекорду гравець вводить імʼя — воно потрапляє в таблицю рекордів.
  coin: wood
  tags: [window]
  status: active
  aliases: {uk: [імʼя гравця, ініціали, ввести імʼя], ru: [ввод имени], en: [name entry, initials, enter name]}
cutscene:
  home: interface/menus
  title: Інтермісія / сценка
  description: Коротка сценка між рівнями без керування — як перерви в Pac-Man; пропускається клавішею.
  coin: tin
  tags: [window]
  status: active
  aliases: {uk: [сценка, катсцена, перерва між рівнями, інтермісія], ru: [катсцена, заставка между уровнями], en: [cutscene, intermission]}
inventory-window:
  home: interface/menus
  title: Вікно інвентаря
  description: Окремий екран з предметами й кількістю — обрати й застосувати; сама логіка — картка «Інвентар» на сутності.
  coin: tin
  tags: [window]
  status: active
  aliases: {uk: [інвентар, рюкзак, сумка, предмети], ru: [инвентарь, рюкзак], en: [inventory, backpack, items]}
save-load-window:
  home: interface/menus
  title: Збереження і завантаження
  description: Слоти збережень з датою й прогресом — зберегти, завантажити, стерти; сама логіка — картки «Збереження гри».
  coin: tin
  tags: [window]
  status: active
  aliases: {uk: [слоти збережень, сейви, завантажити гру, зберегти гру], ru: [сохранения, загрузка], en: [save, load, save slots]}
dialogue-window:
  home: interface/menus
  title: Діалог / сюжетний текст
  description: Репліка персонажа чи табличка поверх поля; наступна — з клавіші.
  coin: wood
  tags: [window]
  status: active
  aliases: {uk: [діалог, репліка, табличка, сюжет], ru: [диалог, реплика], en: [dialogue, dialog, text box]}

