  why: "функція за вікном stats-window (пара); поглинає streak-stats"
replay:
  kind: game
  action: keep
  why: "запис і відтворення гри — гра загалом; вікно — replay-window (пара); доказ — відео"
share-result:
  kind: game
  action: keep
  why: "результат текстом у буфер — гра загалом"
streak-stats:
  kind: game
  action: merge
  into: profile-stats
  coin: tin
  why: "серії й розподіл спроб — ще рядки тієї самої статистики профілю; 📎 лишається"
rating-system:
  kind: game
  action: keep
