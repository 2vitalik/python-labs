character-select:
  kind: window
  action: keep
  why: "герой чи загін з різними параметрами перед грою; косметичний скін — avatar-picker"
game-over-continue:
  kind: window
  action: keep
  why: "аркадне «Продовжити?» з відліком — не те саме, що end-screen"
