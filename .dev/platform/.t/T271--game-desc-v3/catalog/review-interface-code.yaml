# ── interface / render ─────────────────────────────────────────────────
console-render:
  kind: field
  action: keep
  why: "як малюється поле; не властивість поля — це реалізація, буває разом з GUI і не перекривається на рівні"
gui-render:
  kind: field
  action: reword
  description: "Поле спрайтами чи фігурами у вікні (pygame, tkinter, arcade), перемальовка кадру."
  why: "«спільний двіжок із консоллю» — це logic-render-split, тут лише сам GUI-рендер поля"
field-scaling:
  kind: field
  action: reword
  description: "Клітини підлаштовуються під розмір вікна, зум; мапа, більша за екран, — player-camera."
  why: "«скрол великих мап» дублював player-camera"
player-camera:
  kind: field
  action: keep
  why: "вʼюпорт над мапою — про поле загалом"
minimap-radar:
  kind: element
  action: keep
  why: "мінімапа стоїть на ігровому екрані (так і каже map-window) — елемент"
fog-of-war:
  kind: field
  action: keep
  why: "що з поля видно гравцеві — про поле загалом"

