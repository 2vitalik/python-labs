# T271 · ревізія карток: зони interface · code · support (T270 §6, §8, §10, §11)
# Пропозиція, нічого не змінено. Ключі запису: kind · action · into/coin/wording (merge) ·
# title/description (reword) · rule (заготовка, слова vocab.py) · slots · where (живе деінде) · why.
#
# ПІДСУМОК
# Карток: 121 (interface 94 · code 18 · support 9), кожен slug — рівно раз, у порядку каталогу.
# kind:   window 31 · element 28 · game 39 · field 11 · rule 7 · fieldopt 4 · mechanic 1
# action: keep 87 · reword 21 · merge 13 · archive 0 · split 0
#
# Злиття (into · монетка, що лишається):
#   keyboard-controls → control-direct      🌱 (була 🥉, але бронза була й за перепризначення — воно в controls-remap)
#   cell-click        → control-click-cell  🌱
#   drag-drop-piece   → control-drag-piece  🥉
#   path-drawing      → control-drag-path   📎
#   remaining-counter → goal-counter        🌱
#   push-counter      → move-counter        🌱
#   flag-cycle        → dot-mark            🌱
#   difficulty-select → mode-select         🌱
#   puzzle-select     → level-select        📎
#   streak-stats      → profile-stats       📎
#   game-settings     → save-progress       🥉
#   sound-warnings    → sound-effects       📎
#   dual-frontends    → logic-render-split  🥉
# Не злито, хоч ТЗ пропонувало: swipe-gestures ≠ control-swipe-all (жест — пристрій вводу,
#   «хід рухає все поле» працює й зі стрілками); справжній дубль control-swipe-all — entities/swipe-all-shift.
# Консоль чи GUI — НЕ властивість поля, а картки kind field: це реалізація, а не правило світу гри;
#   буває обидва одразу; на рівні не перекривається; монетки різні (🥉 / 🥈).
# В архів: нічого — кожен дубль має куди злитись без втрати змісту.
#
# Типи вікон — майже-дублі:
#   level-select ↔ puzzle-select — один тип (злито); difficulty-select ↔ mode-select — один тип (злито);
#   match-setup лишається: кілька налаштувань партії разом, а не вибір зі списку;
#   leaderboard (чужі імена, топ-N) · stats-window (мої підсумки) · achievements-window (відкриті цілі) — різні, усі лишаються;
#   map-window ↔ levels/world-map — різні (мапа рівня vs мапа вибору рівнів), map-window перейменовано.
# Типи вікон, яких бракує (у еталонах їх зараз закривають custom-window):
#   level-intro      🌱 Заставка рівня — «STAGE 3», печера, життя перед стартом рівня (Bomberman, Boulder Dash, Battle City)
#   name-entry       🌱 Введення імені для рекорду — після рекорду поле імені, запис у таблицю (Сапер, аркади)
#   cutscene         📎 Інтермісія / сценка — коротка сцена між рівнями без керування, пропуск клавішею (Pac-Man)
#   inventory-window 📎 Інвентар — предмети з кількістю, вибір і використання; функція — inventory (роглайки)
#   save-load-window 📎 Збереження і завантаження — слоти з датою й прогресом; функція — save-multi-slot
#   dialogue-window  🌱 Діалог / сюжетний текст — репліка чи табличка поверх поля, далі клавішею (роглайки, Zelda-подібні)
#
# pairs (елемент → функція; «є елемент — заяви й функцію»):
#   volume-control → sound-volume · music-toggle → background-music · field-size-picker → difficulty-levels
#   conflict-highlight → markup-validity · telegraph-marker → telegraphed-intents · face-button → restart-level
# pairs (вікно → функція, та сама підказка):
#   pause-menu → game-pause · shop-window → shop-between-levels · editor-window → in-game-editor
#   leaderboard → score-records · stats-window → profile-stats · mode-select → difficulty-levels
#   replay-window → replay · lobby-window → online-multiplayer · pass-device → hot-seat · code-editor-window → command-program
#   (нові) inventory-window → inventory · save-load-window → save-multi-slot · name-entry → score-records
#   achievements-window → функції нема: бракує картки game «Досягнення» (умови, відкриття, збереження)
#
# Відео:
#   відео — доказ конкретної заявки: посилання з таймкодом (YouTube ?t=83) у `link` тієї картки, яку показує; сайт може впізнати таймкод і показати «▶ 1:23» — нових полів не треба;
#   gif замість скриншота — так, у тому ж слоті скриншота з лімітом розміру: рух, анімація, малювання шляху, каскади на gif доводяться, на кадрі — ні;
#   монетки за саме відео — лише в support/video (feature-demo зі слотом «що показує», трейлер, ефекти); «історію відео» не будувати до Q-тікета.
# code/support описом гри не доводяться взагалі: доказ — `link` (файл, коміт, тег, лог, відео), варто зробити його для цих зон обовʼязковим.
#
# Найменш певні (вибір → альтернатива):
#   1. swipe-gestures — field (пристрій вводу) → злити в control-swipe-all, як у ТЗ
#   2. console-render / gui-render — field → fieldopt «Рендер: консоль · GUI» (кілька одразу)
#   3. dual-frontends → logic-render-split 🥉 → лишити 🥈 як вимогу курсу, з gui-render лише прибрати «спільний двіжок»
#   4. game-settings → save-progress → лишити game «Налаштування зберігаються між сесіями» з 📎
#   5. sound-effects — rule → game («звук загалом»), тоді правила з ефектом «звук» без монетки
#   6. popup-text — rule → element ігрового екрана (рендерер спливних написів)
#   7. chord-click, flood-reveal — rule (в еталоні сапера вже правила) → field, як у ТЗ
#   8. flag-cycle → dot-mark → лишити обидві (тоді «?» у сапері платиться двічі)
#   9. telegraphed-intents — mechanic у парі з telegraph-marker → злити telegraph-marker у неї одним element 🥉
#  10. hover-highlight — field (реакція поля на курсор) → element-дитина highlights поруч із selection-highlight
#
# Поза моїми зонами (для інших ревізій):
#   entities/swipe-all-shift дублює control-swipe-all · entities/legal-move-highlight → kind element, дитина highlights,
#   пара → piece-move-patterns · game-logic/shop-catalog дублює вікно shop-window · levels/world-map — це тип вікна
#   (#window) або злиття в level-select · game-logic/save-progress — дописати «і налаштування» · levels/level-bank —
#   лишити за ним збереження прогресу, список зі статусом — це вікно level-select.
# Еталони перепривʼязати: remaining-counter (4), cell-click (5), keyboard-controls і swipe-gestures (2048), difficulty-select (snake),
#   puzzle-select (paper-puzzles); movement-animation (2048, на сутності), replay (mined-out, на вікні), std-collections (snake, на сутності)
#   стали game — на рівень гри.

# ── interface / graphics ───────────────────────────────────────────────
movement-animation:
  kind: game
  action: keep
  why: "анімація загалом — секція «Інтерфейс, графіка, звук»; в еталоні 2048 висить на сутності — перенести на рівень гри"
event-effects:
  kind: game
  action: reword
  description: "Короткий кадровий ефект на подію: спалах, вибух, відкриття дверей; смерть і поява сутності — свої картки, система часток — particles."
  why: "графіка загалом: слова «візуальний ефект» у словнику нема, правилом не скажеш; опис розводить з particles і анімаціями смерті/появи"
idle-animation:
  kind: game
  action: keep
  why: "анімація спрайтів на місці — графіка загалом"
particles:
  kind: game
  action: keep
  why: "техніка рендера (багато часток з рухом і згасанням) — графіка загалом"

# ── interface / hud ────────────────────────────────────────────────────
status-panel:
  kind: element
  action: keep
  why: "панель стоїть на ігровому екрані — елемент вікна"
goal-counter:
  kind: element
  action: reword
  description: "Скільки лишилось зібрати, знищити чи знайти: точок, ворогів, мін (міни − прапорці)."
  why: "лічильник на ігровому екрані; поглинає remaining-counter — той самий «скільки лишилось»"
mode-indicator:
  kind: element
  action: keep
  why: "показ режиму чи черги на екрані — елемент вікна"
telegraphed-intents:
  kind: mechanic
  action: reword
  where: "entities/combat — механіка на сутності-ворогові"
  title: "Ворог оголошує хід наперед"
  description: "Ворог обирає дію на хід раніше й виконує саме її (Into the Breach); позначка на полі — telegraph-marker."
  why: "суть — поведінка ворога, а не малюнок; показ на полі лишається елементом telegraph-marker (пара), тож дубля нема"
highlights:
  kind: element
  action: keep
  why: "заголовок сімʼї підсвіток на ігровому екрані; legal-move-highlight з legality варто зробити її дитиною"
selection-highlight:
  kind: element
  action: keep
  why: "підсвітка обраної клітини чи фігури на ігровому екрані"
conflict-highlight:
  kind: element
  action: keep
  why: "показ конфліктів на полі; саму перевірку дає markup-validity (пара)"
last-move-highlight:
  kind: element
  action: keep
  why: "мітка останнього ходу на ігровому екрані"
reachable-highlight:
  kind: element
  action: keep
  why: "показ досяжних за хід клітин — малюнок на ігровому екрані"
threat-range:
  kind: element
  action: keep
  why: "показ зони ураження на ігровому екрані; дальність ворога — його параметр"
telegraph-marker:
  kind: element
  action: keep
  why: "позначка «куди вдарить» на полі; поведінку ворога дає telegraphed-intents (пара)"
path-preview:
  kind: element
  action: keep
  why: "превʼю шляху, намальоване на ігровому екрані"
move-counter:
  kind: element
  action: reword
  title: "Лічильник ходів"
  description: "Ходи (за потреби окремо поштовхи) на ігровому екрані; рахуються лише ходи, що відбулись."
  why: "лічбу пише правило ефектом «± лічильник», картка — показ на екрані; поглинає push-counter"
remaining-counter:
  kind: element
  action: merge
  into: goal-counter
  coin: wood
  why: "те саме «скільки лишилось»: точок, мін, ворогів; 🌱 лишається; 4 еталони перепривʼязати"
next-queue:
  kind: element
  action: keep
  why: "черга наступних фігур — панель на ігровому екрані"
pocket:
  kind: element
  action: keep
  why: "панель узятих фігур поза полем — елемент ігрового екрана; сам дроп — piece-drop"
message-log:
  kind: element
  action: keep
  why: "журнал — панель на екрані; самі повідомлення пишуть правила ефектом «повідомлення»"
objective-text:
  kind: element
  action: keep
  why: "рядок поточної цілі на ігровому екрані"
popup-text:
  kind: rule
  action: keep
  rule: {when: {kind: contact}, then: [{kind: score}, {kind: message}]}
  why: "«+100» над клітиною — наслідок події: правило з очками й ефектом «повідомлення», картка сідає на нього"
push-counter:
  kind: element
  action: merge
  into: move-counter
  coin: wood
  why: "move-counter уже «ходів/поштовхів»; другий рядок того самого лічильника монетки не вартий; 🌱 лишається"
face-button:
  kind: element
  action: keep
  why: "кнопка-смайлик на ігровому екрані; рестарт — restart-level (пара)"

# ── interface / input ──────────────────────────────────────────────────
keyboard-controls:
  kind: fieldopt
  action: merge
  into: control-direct
  coin: wood
  wording: "Клавіші = рух аватара — стрілки чи WASD рухають аватар, окремі клавіші дій"
  why: "це і є «клавіші = рух аватара»; бронза була й за перепризначення, а воно окремо в controls-remap, тож 🌱"
cell-click:
  kind: fieldopt
  action: merge
  into: control-click-cell
  coin: wood
  wording: "Клік по клітині — базова курсорна дія: клік обирає чи відкриває клітину"
  why: "це і є спосіб керування «клік по клітині»; 🌱 лишається"
hover-highlight:
  kind: field
  action: reword
  title: "Підсвітка клітини під курсором"
  description: "Клітина під мишкою чи курсором клавіатури підсвічується ще до дії."
  why: "реакція поля на курсор — картка поля; «виділення» прибрано з назви, бо це selection-highlight"
drag-drop-piece:
  kind: fieldopt
  action: merge
  into: control-drag-piece
  coin: bronze
  wording: "Перетягую фігуру — фігура йде за мишею; відпустив на легальній клітині — хід, ні — повертається"
  why: "це і є «перетягую фігуру»; 🥉 лишається — тягнути спрайт і повертати на місце помітно складніше за клік"
pencil-marks:
  kind: field
  action: keep
  why: "кандидати дрібно всередині клітини й режим «олівець» — як поле приймає ввід і малює клітину"
chord-click:
  kind: rule
  action: keep
  rule: {when: {kind: input}, cond: [{kind: adjacent_count}], then: [{kind: reveal}]}
  why: "акорд — ввід на числі з умовою «прапорців навколо стільки ж» і наслідком «відкрити сусідів»; в еталоні сапера це вже правило"
swipe-gestures:
  kind: field
  action: reword
  title: "Жести мишею чи пальцем"
  description: "Хід жестом: тягнеш у бік — гра визначає напрям за порогом; клавіші не потрібні."
  why: "це пристрій вводу, а не спосіб керування: control-swipe-all працює й зі стрілками; тому не злито"
path-drawing:
  kind: fieldopt
  action: merge
  into: control-drag-path
  coin: tin
  wording: "Малюю шлях — тягнеш по сусідніх клітинах, шлях лишається на полі (Flow Free, Cosmic Express, LYNE)"
  why: "це і є спосіб керування «малюю шлях»; 📎 лишається"
path-cut:
  kind: field
  action: keep
  why: "як редагується намальований шлях — доповнення до керування «малюю шлях», картка поля"
multi-select:
  kind: field
  action: keep
  why: "групове виділення клітин — як поле приймає ввід"
edge-marking:
  kind: field
  action: keep
  why: "ввід по ребрах, а не клітинах — особливість поля"
dot-mark:
  kind: rule
  action: reword
  title: "Позначки-нагадування на клітині"
  description: "Прапорець, «?», крапка: ставляться й перебираються по колу однією кнопкою; перевірка розвʼязку їх не враховує."
  rule: {when: {kind: input}, then: [{kind: mark}]}
  why: "поставити позначку — подія вводу з ефектом «розмітка»; поглинає flag-cycle: «?» у сапері — крок того самого кола"
flag-cycle:
  kind: rule
  action: merge
  into: dot-mark
  coin: wood
  why: "прапорець → «?» → порожньо — це ті самі позначки-нагадування, перебрані однією кнопкою; 🌱 лишається"
flood-reveal:
  kind: rule
  action: keep
  rule: {when: {kind: input}, cond: [{kind: adjacent_count}], then: [{kind: fill}]}
  why: "клік по нулю → «заливка області» — одне правило, в еталоні сапера воно вже є; слот сусідства лишається"

# ── interface / menus ──────────────────────────────────────────────────
main-menu:
  kind: window
  action: keep
  why: "тип вікна; заявка сама з типу"
pause-menu:
  kind: window
  action: keep
  why: "окремий тип; заморожує гру game-pause (пара)"
confirm-dialog:
  kind: window
  action: keep
  why: "модальне «Так / Ні» — окремий тип"
end-screen:
  kind: window
  action: keep
  why: "перемога й поразка — один тип, назви вікон різні"
game-screen:
  kind: window
  action: reword
  description: "Головне вікно з полем гри; рендер, камера, туман — картки поля, HUD і кнопки — елементи цього вікна."
  why: "посилання на підзону «Поле і рендер» застаріє з новою зоною «Поле» — кажемо через типи карток"
splash-screen:
  kind: window
  action: keep
  why: "назва й лого при запуску; гра, що грає сама, — attract-demo"
settings-window:
  kind: window
  action: keep
  why: "вікно, куди ставляться елементи налаштувань"
shop-window:
  kind: window
  action: keep
  why: "тип вікна; купівля — shop-between-levels (пара); вітрина shop-catalog в economy дублює це вікно"
help-window:
  kind: window
  action: keep
  why: "довідка всередині гри; документ поза грою — player-guide"
about-window:
  kind: window
  action: keep
  why: "автор і версія — окремий простий тип"
custom-window:
  kind: window
  action: keep
