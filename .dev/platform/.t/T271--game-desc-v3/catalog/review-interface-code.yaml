mode-select:
  kind: window
  action: reword
  title: "Вибір режиму чи складності"
  description: "Список варіантів перед грою: класика / на час / нескінченний / versus, легко–важко."
  why: "поглинає difficulty-select — те саме вікно-список; кілька налаштувань разом — match-setup"
map-window:
  kind: window
  action: reword
  title: "Повна карта рівня"
  description: "Уся мапа рівня чи підземелля (досліджене) на весь екран; мінімапа — minimap-radar, мапа вибору рівнів — world-map."
  why: "«Карта світу» плутається з world-map (вибір рівнів на мапі) — уточнити назву"
difficulty-select:
  kind: window
  action: merge
  into: mode-select
  coin: wood
