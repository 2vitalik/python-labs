logic-render-split:
  kind: game
  action: reword
  description: "Двіжок не імпортує рендер: консоль і GUI (чи тести) працюють з тим самим станом."
  why: "поглинає dual-frontends; доказ — посилання на модуль двіжка без імпортів рендера й на обидва фронтенди"
dual-frontends:
  kind: game
  action: merge
  into: logic-render-split
  coin: bronze
  why: "консоль + GUI = console-render + gui-render + розділення; окрема 🥈 повторює три картки; 🥉 лишається"
state-as-data:
  kind: game
  action: keep
  why: "доказ — посилання на клас стану і (де)серіалізацію; не плутати з state-string (код для гравця)"
game-loop:
