  kind: rule
  action: reword
  description: "Звук на подію: кроки, постріл, збирання, попередження (час добігає, шах)."
  rule: {when: {kind: picked}, then: [{kind: sound}]}
  why: "звук на подію — ефект «звук» у правилі, картка сідає на таке правило; поглинає sound-warnings"
background-music:
  kind: game
  action: reword
  description: "Музика грає фоном у циклі; вимикач у налаштуваннях — music-toggle."
  why: "звук загалом; вимикач уже окремий елемент (пара)"
sound-volume:
  kind: game
  action: keep
  why: "функція за слайдером volume-control (пара)"
sound-warnings:
