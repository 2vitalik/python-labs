# T271 · тексти карток role / stat / fieldopt (T270 §6–§8, §13)
#
# Скільки: 67 обовʼязкових = 4 сімʼї ролей + 20 ролей + 13 параметрів + 8 сіток + 3 види + 6 часів
#          + 8 керувань + 4 гравітації + 1 замкнене поле; ще 9 нових (new: true) → 76 карток.
#
# Ціни (кожна картка — раз на гру):
#   🌱 wood   — є майже в кожній грі свого класу: гравець · фігура · плитка · розмітка · стіна · підлога · предмет · зона; HP · життя · швидкість · очки · кількість · сторона; квадратна сітка · лінія · 4/8 сусідів · вид згори/збоку · покроковий і статичний час · клавіші · клік · розмітка · замкнене поле.
#   📎 tin    — окремий тип зі своєю поведінкою чи станом (ворог, союзник, нейтральний, обʼєкт, снаряд, контейнер, ресурс, пастка, двері, кнопка, запас, хвіст) і решта параметрів; реальний і програмований час; «вказую ціль», «хід рухає все поле», «малюю шлях».
#   🥉 bronze — помітна окрема робота: бос, спавнер, гекси · ізо · шари · граф, одночасні ходи, ритм, перетягування фігур, програма команд, гравітація вниз/вгору; 🥈 silver — 3D, поле в полі, від першої особи, гравітація за типом і до центру. Вище срібла нічого: алгоритми (BFS, ШІ, генерація) платять свої картки.
#
# Нові (new: true): role-supply «Запас поза полем» · role-segment «Хвіст / сегмент» · stat-cost «Ціна» ·
#   stat-vision «Огляд» · stat-side «Сторона / колір» · stat-energy «Енергія / паливо» · stat-rank «Рівень прокачки» ·
#   neighbors-4 / neighbors-8 — нова властивість поля «Сусіди клітини».
#
# Сумніви:
# 1. Дублі з наявними картками каталогу (злити за §13): cell-click 🌱 = control-click-cell; drag-drop-piece 🥉 = control-drag-piece;
#    path-drawing 📎 = control-drag-path; gravity-fall 🥉 = gravity-down; wrap-edges (entities/legality, 🌱) — той самий slug, стає fieldopt.
#    Частково: keyboard-controls 🥉 ~ control-direct (лишити за перепризначенням клавіш), command-program 🥉 ~ control-programmed,
#    step-execution 📎 ~ time-programmed. Де дубль повний — ціну взяв із наявної картки.
# 2. time-programmed і control-programmed майже завжди парою — може, платити лише за одну з них.
# 3. «Одиниця — з картки» не покриває еталони: швидкість Pac-Man у %, PvZ — 0.02; тривалість Frogger у «с»; ціна PvZ у «сонцях»;
#    місткість Lode Runner — «злиток». Пропоную: одиниця картки — за замовчуванням, своя — дозволена.
# 4. grid-iso за змістом — вид, а не сітка (логіка квадратна); лишив у сітці, як у словнику.
# 5. Описи узгоджені з еталонами: бомба Bomberman — обʼєкт, її вогонь — пастка; колоди Frogger — підлога з властивістю; вихід — двері
#    (відчиняється за умовою) або зона (просто фініш); база Battle City — обʼєкт. Цегла Bomberman в еталоні — object, хоча ховає бонуси
#    (за описом — контейнер). Тіло змійки в еталоні — object; якщо role-segment приймеш — перевести.
# 6. Перейменування: «обʼєкт» → «Обʼєкт / ящик», «нейтрал» → «Нейтральний персонаж», «генератор» → «Спавнер / генератор»,
#    «контейнер» → «Контейнер / скриня», «очки за…» → «Очки / цінність», «дальність» → «Дальність дії»,
#    «граф (нестандартна суміжність)» → «Граф (точки й лінії)», «усі планують, потім виконання» → «Одночасні ходи»,
#    «вказую ціль, сутність іде сама» → «Вказую ціль, іде сама», «тор» → «Замкнене поле» (§8).
#    Синоніми: «ящик» перейшов від контейнера до обʼєкта (це ящик Sokoban); «ціна», «вартість» — від value до нового stat-cost;
#    «tile» прибрав із terrain (плутається з роллю «плитка»). Одиниці: шкода й броня — «HP», кількість і патрони — «шт.».
# 7. Відкинуті кандидати: рухома платформа (= підлога з властивістю + carrier-platform, так і в еталоні Frogger), портал (підлога +
#    teleport), торговець (нейтральний), чекпоінт (зона + checkpoint), бомба (обʼєкт), туман (fog-of-war уже картка поля),
#    платформер (вид збоку + гравітація вниз), нескінченне поле (режим рівня «нескінченний», §9), вага й точність (рідко),
#    reload (= перезарядка), труби source/sink/conduit (плитка + pipe-connectors), вежа (союзник), ефект-анімація (обʼєкт або графіка).
# 8. stat-energy і stat-rank — найслабші з нових: у 17 базових іграх їх нема, підстава — лише корпус.
# 9. «Ворог» — лише 📎: платиться сам тип (раз на гру, хоч ворогів пʼять), а поведінку (переслідування, BFS) оплачують картки руху й ШІ.

