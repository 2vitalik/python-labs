  aliases: {uk: [цифра, хрестик, прапорець, позначка], ru: [пометка, флажок], en: [mark, flag]}

# ───────────────────────── Параметри сутностей ─────────────────────────

stat-hp:
  title: "HP (здоровʼя)"
  icon: "❤️"
  unit: ""
  description: "Скільки шкоди сутність витримує, перш ніж загинути: кожен удар знімає HP, на нулі — смерть. Ворожий танк з HP 4 падає від четвертої кулі; хто гине від першого дотику, тому HP не потрібен."
  coin: wood
  aliases: {uk: [хп, здоровʼя, хіти, міцність], ru: [здоровье], en: [hp, health, hit points]}

stat-lives:
  title: "Життя"
  icon: "💗"
  unit: ""
  description: "Скільки разів можна загинути й почати знову, перш ніж гра скінчиться: у Pac-Man і Frogger — по 3. HP — запас на одне життя, життя — скільки таких спроб."
  coin: wood
  aliases: {uk: [лайфи, спроби, жити], ru: [жизни], en: [lives, life, extra life]}

stat-speed:
  title: "Швидкість"
  icon: "⚡"
  unit: "кл/тік"
  description: "Скільки клітин сутність проходить за тік: 1 — клітина щотіку, 0.5 — раз на два тіки, 2 — дві клітини за тік. Привид у тунелі Pac-Man повільніший за Пакмана — це різна швидкість."
  coin: wood
  note: "Еталони пишуть швидкість і в % (Pac-Man 80 %), і дробом (PvZ 0.02): у кл/тік переводиться, але, може, дозволити свою одиницю."
  aliases: {uk: [темп, швидко, повільно], ru: [скорость], en: [speed, velocity]}

stat-damage:
  title: "Шкода"
  icon: "⚔️"
  unit: "HP"
  description: "Скільки HP знімає один удар чи снаряд цієї сутності: горошина в PvZ — 1, а в зомбі 10 HP, тобто десять влучань. Пишеться на того, хто бʼє, а не на того, кого бʼють."
  coin: tin
  note: "Одиниці не було; поставив HP — шкода міряється в HP цілі."
  aliases: {uk: [урон, атака, сила удару, дамаг], ru: [], en: [damage, attack, dmg]}

stat-armor:
  title: "Броня"
  icon: "🛡️"
  unit: "HP"
  description: "На скільки HP слабшає кожен удар, що влучив: броня 1 проти шкоди 3 — мінус 2 HP. Якщо сутність просто витримує більше влучань — це HP, а не броня."
  coin: tin
  note: "Одиниці не було; HP — як у шкоди. Буває й «броня поглинає N ударів» — тоді це радше другий запас HP."
  aliases: {uk: [захист, щит, бронь], ru: [броня, защита], en: [armor, defense, shield]}

stat-range:
  title: "Дальність дії"
  icon: "🎯"
  unit: "кл"
  description: "На скільки клітин дістає дія сутності: постріл, удар, вибух, вежа. Вогонь бомби з дальністю 2 — хрест по 2 клітини в кожен бік; як далеко сутність бачить — це інше."
  coin: tin
  aliases: {uk: [радіус, дистанція, дальність], ru: [дальность, радиус], en: [range, radius, reach]}

stat-capacity:
  title: "Місткість"
  icon: "🎒"
  unit: "предм."
  description: "Скільки речей сутність може нести чи вмістити одночасно: інвентар на 5 слотів, бігун Lode Runner несе 1 злиток, скриня на 3 предмети. Скільки пострілів у запасі — це патрони."
  coin: tin
  aliases: {uk: [інвентар на, слотів, вміщує, вантаж], ru: [вместимость], en: [capacity, slots]}

stat-cooldown:
  title: "Перезарядка"
  icon: "⏱️"
  unit: "тіків"
  description: "Скільки тіків чекати між двома однаковими діями: між пострілами, посадками рослини, появами ворогів — горохострел у PvZ стріляє раз на 14 тіків. Перезарядка — пауза перед наступним разом, тривалість — скільки діє один раз."
  coin: tin
  aliases: {uk: [кулдаун, пауза між, затримка], ru: [перезарядка, кулдаун], en: [cooldown, reload, delay]}

stat-value:
  title: "Очки / цінність"
  icon: "⭐"
  unit: ""
  description: "Скільки очок дає сутність, коли її зібрали чи знищили: точка в Pac-Man — 10, привид — 200–1600. Сюди ж цінність фігури в шахах і число на плитці 2048 — але не ціна, яку ти платиш."
  coin: wood
  note: "Було «очки за…» — обірвана назва. «ціна», «вартість» із синонімів пішли в новий stat-cost."
  aliases: {uk: [очки за, бали, поінти, номінал], ru: [баллы], en: [score, points]}

stat-count:
  title: "Кількість на полі"
  icon: "#️⃣"
  unit: "шт."
  description: "Скільки таких сутностей на полі чи на рівні: 4 привиди, 240 точок, 10 мін у сапері. Змінюється від рівня — пиши діапазон («10 / 40 / 99») або «за рівнем»."
  coin: wood
  note: "Одиниці не було — «шт.»; іконка «#» → #️⃣."
  aliases: {uk: [кількість, штук, скільки на полі], ru: [количество, штук], en: [count, amount, number]}

stat-duration:
  title: "Тривалість"
  icon: "⏳"
  unit: "тіків"
  description: "Скільки тіків щось живе чи діє один раз: запал бомби, дія бонусу, фрукт у Pac-Man зникає за 95 тіків. Для «раз на скільки тіків» є перезарядка."
  coin: tin
  note: "Еталон Frogger пише час спроби в секундах — секунди теж варто дозволити або перевести в тіки."
  aliases: {uk: [час дії, скільки триває, таймер, запал], ru: [длительность], en: [duration, lifetime]}

stat-size:
  title: "Розмір"
  icon: "📐"
  unit: "кл"
  description: "Скільки клітин займає сутність: 1 — звичайна, 2×2 — великий бос, 2 чи 3 — машина в Rush Hour. Тут лише число; рух сутності, більшої за клітину, — окрема механіка."
  coin: tin
  note: "Саму роботу (рух 2×2) оплачує multi-cell-size 🥇; картка параметра дешева, щоб не платити двічі."
