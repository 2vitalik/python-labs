  kind: stat
  key: energy
  title: "Енергія / паливо"
  icon: "🔋"
  unit: ""
  description: "Запас, що витрачається на дії й поповнюється з часом чи бонусом: паливо, мана, витривалість. Патрони рахують лише постріли, енергія — будь-які дії: крок, удар, вміння."
  coin: tin
