  icon: "🔫"
  unit: "шт."
  description: "Скільки пострілів чи бомб є в запасі, доки не поповниш: скінчились — стріляти нема чим. Патрони — запас, перезарядка — пауза між пострілами."
  coin: tin
  note: "Одиниці не було — «шт.»."
  aliases: {uk: [заряди, боєзапас, набої, бомби], ru: [патроны], en: [ammo, charges]}

stat-cost:
  new: true
  kind: stat
  key: cost
  title: "Ціна"
  icon: "🏷️"
  unit: ""
  description: "Скільки ресурсу коштує поставити чи купити сутність: соняшник у PvZ — 50 сонць, вежа в tower defense — 100 золота. Очки ти отримуєш, ціну платиш."
